          <h1>Lakshmi Sahasranamam</h1>
          <p class="lead" style="margin-top:8px">“The thousand names of Lakṣmī.” It begins with her picture — seated at the Lord's right side, smiling, golden, dressed in white — and then calls her by name after name: <i>śrīr vāsudeva-mahiṣī</i>, the queen of Vāsudeva, the power behind all creation, the goddess of every river, every lunar day, every kind of wealth.</p>

  "पञ्चकृत्यकरी|doer of the five acts|pañca · kṛtya = creation, sustenance, dissolution, concealment, grace; पञ्चशक्तिमय्यात्मवल्लभा|made of five powers, the Self's beloved|pañca · śakti · mayī · ātma · vallabhā",
  "Mistress of the world's household; support of all; unfolding all desires; doer of the five divine acts; made of the five powers; beloved of the Self.",
  "உலகக் குடும்பத்தின் தலைவி; எல்லாவற்றுக்கும் ஆதாரம்; விருப்பங்களை மலரச் செய்பவள்; ஐந்து தொழில்களைச் செய்பவள்; ஐந்து சக்திகளானவள்; பரமாத்மாவின் பிரியை.",
  {tip:"<b>pañca-kṛtya</b>: creation, preservation, dissolution, concealment and grace."}),
 v("v6", "6", "The supreme Śakti", "Embracing the Lord, never walking apart from him — gentle in form.",
  "भावाभावानुगा|following being and non-being|bhāva · abhāva · anugā; सर्वसम्मताऽऽत्मोपगूहिनी|honoured by all, embracing the Self|sarva · sammatā · ātma · upagūhinī = embracing",
  "अपृथक्चारिणी|never moving apart|apṛthak · cāriṇī; सौम्या|gentle|saumyā; सौम्यरूपाऽव्यवस्थिता|gentle in form, not bound to one place|saumya · rūpā · avyavasthitā",
  "Following both being and non-being; honoured by all; embracing the Supreme Self; never moving apart from him; gentle; gentle in form; not bound to any one place.",
  "இருப்பையும் இன்மையையும் பின்தொடர்பவள்; எல்லோராலும் ஏற்கப்பட்டவள்; பரமாத்மாவைத் தழுவுபவள்; அவனைப் பிரியாமல் சஞ்சரிப்பவள்; சாந்தமானவள்; சாந்த வடிவினள்; ஓரிடத்தில் கட்டுப்படாதவள்.",
  {tip:"<b>apṛthak-cāriṇī</b> — “never walking separately” — the same idea as <i>nityānapāyinī</i>."}),
 v("v7", "7", "The supreme Śakti", "Without beginning or end; great glory; queen of the hosts of light.",
  "आद्यन्तरहिता|without beginning or end|ādi · anta · rahitā; देवी|the Goddess|devī; भवभाव्यस्वरूपिणी|whose form is what is and what will be|bhava · bhāvya · svarūpiṇī",
  "महाविभूतिस्|great glory|mahā · vibhūti; समतां|equality (with the Lord)|samatā; गता|who has reached|gatā; ज्योतिर्गणेश्वरी|queen of the hosts of light|jyotiḥ · gaṇa · īśvarī",
  "Without beginning or end; the Goddess; whose form is the present and the future; great glory; equal to the Lord; queen of the hosts of light.",
  "ஆதியும் அந்தமும் அற்றவள்; தேவி; இருப்பதும் இருக்கப்போவதுமானவள்; மாபெரும் மகிமை; பகவானுக்குச் சமமானவள்; ஒளிக்கூட்டங்களின் ஈஸ்வரி."),
 v("v8", "8", "The supreme Śakti", "Doer of all works, nature of dharma, made of knowledge, bliss and action.",
  "सर्वकार्यकरी|doer of all works|sarva · kārya · karī; धर्मस्वभावात्माऽग्रतःस्थिता|whose nature is dharma, who stands in front|dharma · svabhāva · ātmā · agrataḥ · sthitā",
  "आज्ञासमविभक्ताङ्गी|whose limbs share (the Lord's) command equally|ājñā · sama · vibhakta · aṅgī; ज्ञानानन्दक्रियामयी|made of knowledge, bliss and action|jñāna · ānanda · kriyā · mayī",
  "Doer of all works; whose very nature is dharma; standing in front (to help); sharing the Lord's command equally; made of knowledge, bliss and action.",
  "எல்லாச் செயல்களையும் செய்பவள்; தர்மமே இயல்பானவள்; முன்னின்று காப்பவள்; பகவானின் ஆணையைச் சமமாகப் பகிர்ந்தவள்; ஞானம், ஆனந்தம், கிரியை மயமானவள்."),
 v("v9", "9", "The supreme Śakti", "Freedom itself, seated on the Lord's chest — mother and ruler of all beings.",
  "स्वातन्त्र्यरूपा|whose form is freedom|svātantrya · rūpā; देवोरःस्थिता|seated on the Lord's chest|deva · uras · sthitā; तद्धर्मधर्मिणी|sharing his qualities|tat · dharma · dharmiṇī",
  "सर्वभूतेश्वरी|ruler of all beings|sarva · bhūta · īśvarī; सर्वभूतमाताऽऽत्ममोहिनी|mother of all beings, enchanting the Lord|sarva · bhūta · mātā · ātma · mohinī",
  "Freedom itself; seated on the Lord's chest; sharing his qualities; ruler of all beings; mother of all beings; enchantress of the Supreme Self.",
  "சுதந்திரமே வடிவானவள்; பகவானின் மார்பில் வீற்றிருப்பவள்; அவனுடைய குணங்களைக் கொண்டவள்; எல்லா உயிர்களின் ஈஸ்வரி; எல்லா உயிர்களின் தாய்; பரமாத்மாவை மயக்குபவள்."),
 v("v10", "10", "The supreme Śakti", "Lovely in every limb, everywhere, reached by devotees — she carries us across saṃsāra.",
  "सर्वाङ्गसुन्दरी|beautiful in every limb|sarva · aṅga · sundarī; सर्वव्यापिनी|all-pervading|sarva · vyāpinī; प्राप्तयोगिनी|reached by yogis|prāpta · yoginī",
  "विमुक्तिदायिनी|giver of liberation|vimukti · dāyinī; भक्तगम्या|reached by devotees|bhakta · gamyā; संसारतारिणी|who carries across saṃsāra|saṃsāra · tāriṇī",
  "Beautiful in every limb; all-pervading; reached by yogis; giver of liberation; reached by devotees; who carries us across the ocean of saṃsāra.",
  "எல்லா அங்கங்களிலும் அழகியவள்; எங்கும் நிறைந்தவள்; யோகிகளால் அடையப்படுபவள்; முக்தி அருள்பவள்; பக்தர்களால் அடையத்தக்கவள்; சம்சாரக் கடலைக் கடத்துபவள்."),
 v("v11", "11", "The supreme Śakti", "Dwelling in the sky of consciousness, she fulfils what is to be reached.",
  "धर्मार्थवादिनी|who teaches dharma and wealth|dharma · artha · vādinī; व्योमनिलया|dwelling in the (supreme) sky|vyoma · nilayā; व्योमविग्रहा|whose body is space|vyoma · vigrahā",
  "पञ्चव्योमपदी|whose steps are the five skies|pañca · vyoma · padī; रक्षव्यावृत्तिः|busy with protection|rakṣa · vyāvṛtti; प्राप्यपूरिणी|who fulfils the goal|prāpya · pūriṇī",
  "Teacher of dharma and wealth; dwelling in the supreme sky; whose body is space; whose steps are the five skies; ever busy protecting; fulfiller of the goal.",
  "தர்மத்தையும் பொருளையும் உபதேசிப்பவள்; பரமாகாசத்தில் வசிப்பவள்; ஆகாசமே உடலானவள்; ஐந்து ஆகாசங்களைப் பதமாக உடையவள்; காப்பதில் ஈடுபட்டவள்; அடைய வேண்டியதை நிறைவேற்றுபவள்."),
 v("v12", "12", "Golden and boundless", "Bliss itself, leader of the Śaktis — golden, in golden walls, with a golden garland.",
  "आनन्दरूपा|whose form is bliss|ānanda · rūpā; सर्वाप्तिशालिनी|possessing every attainment|sarva · āpti · śālinī; शक्तिनायिका|leader of the powers|śakti · nāyikā",
  "हिरण्यवर्णा|golden in colour|hiraṇya · varṇā; हैरण्यप्राकारा|within golden walls|hairaṇya · prākārā; हेममालिनी|wearing a golden garland|hema · mālinī",
  "Bliss itself; possessing every attainment; leader of the Śaktis; golden in colour; within golden walls; wearing a golden garland.",
  "ஆனந்த வடிவினள்; எல்லாப் பேறுகளும் உடையவள்; சக்திகளின் தலைவி; பொன்னிறத்தவள்; பொன் மதில்களுக்குள் இருப்பவள்; பொன் மாலை அணிந்தவள்.",
  {tip:"Three <b>gold</b> names, from Śrī Sūkta: <b>hiraṇya-varṇā · hairaṇya-prākārā · hema-mālinī</b>."}),
 v("v13", "13", "Golden and boundless", "Shining, honoured with sacred offerings, garlanded with silver, ever fragrant, moving in the sky.",
  "प्रस्फुरत्ता|shining forth|prasphurattā; भद्रहोमा|honoured with auspicious offerings|bhadra · homā; वेशिनी|who enters (all)|veśinī; रजतस्रजा|with a silver garland|rajata · srajā",
  "स्वाज्ञाकार्यमरा|whose command the gods carry out|sva · ājñā · kārya · amarā; नित्यसुरभिर्|ever fragrant|nitya · surabhi; व्योमचारिणी|moving in the sky|vyoma · cāriṇī",
  "Shining forth; honoured with auspicious offerings; entering all; with a silver garland; whose command the gods obey; ever fragrant; moving in the sky.",
  "ஒளிர்பவள்; மங்கள ஹோமங்களால் போற்றப்படுபவள்; எல்லாவற்றிலும் புகுபவள்; வெள்ளி மாலை அணிந்தவள்; தேவர்கள் அவள் ஆணையை நிறைவேற்றுகிறார்கள்; என்றும் மணமுடையவள்; வானில் சஞ்சரிப்பவள்.",
  {tip:"<b>rajata-srajā</b> — Śrī Sūkta's <i>suvarṇa-rajata-srajām</i>, “with gold and silver garlands”."}),
 v("v14", "14", "Golden and boundless", "She brings yoga and kṣema, easy for all; the great gathering from which all grows.",
  "योगक्षेमावहा|bringing gain and safety|yoga-kṣema · āvahā; सर्वसुलभेच्छाक्रियात्मिका|easy for all, whose nature is will and action|sarva · sulabhā · icchā · kriyā · ātmikā",
  "महासमूहा|the great gathering|mahā · samūhā; निखिलप्ररोहा|from whom all grows|nikhila · prarohā; वेदगोचरा|known through the Vedas|veda · gocarā",
  "Bringer of yoga-kṣema (gain and safety); easily reached by all; whose nature is will and action; the great gathering of all; source from which everything grows; known through the Vedas.",
  "யோக க்ஷேமத்தைத் தருபவள்; எல்லோருக்கும் எளியவள்; இச்சையும் கிரியையும் வடிவானவள்; பெரும் தொகுப்பானவள்; எல்லாம் முளைக்கும் மூலம்; வேதங்களால் அறியப்படுபவள்."),
 v("v15", "15", "Golden and boundless", "Bringer of wonder, gathered in Brahman, highest in virtue, reached by the true means.",
  "विस्मयाधायिनी|who causes wonder|vismaya · ādhāyinī; ब्रह्मसंहिता|one with Brahman|brahma · saṃhitā; सुगुणोत्तरा|highest in good qualities|su · guṇa · uttarā",
  "प्रज्ञापरिमिताऽऽत्मानुरूपा|measured (only) by wisdom, matching the Self|prajñā · parimitā · ātma · anurūpā; सत्योपयार्जिता|won by the true means|satya · upaya · arjitā",
  "Causing wonder; one with Brahman; highest in virtue; measured only by wisdom; matching the Supreme Self; won by the true means.",
  "வியப்பை உண்டாக்குபவள்; பிரம்மத்துடன் இணைந்தவள்; நற்குணங்களில் உயர்ந்தவள்; ஞானத்தால் மட்டுமே அளக்கப்படுபவள்; பரமாத்மாவுக்கு ஏற்றவள்; உண்மையான வழியால் அடையப்படுபவள்."),
 v("v16", "16", "Golden and boundless", "Known by the mind and by knowledge; ever free; the power to act and the power to enjoy.",
  "मनोज्ञेया|to be known by the mind|manas · jñeyā; ज्ञानगम्या|reached by knowledge|jñāna · gamyā; नित्यमुक्ताऽऽत्मसेविनी|ever free, serving the Self|nitya · muktā · ātma · sevinī",
  "कर्तृशक्तिः|the power of the doer|kartṛ · śakti; सुगहना|very deep|su · gahanā; भोक्तृशक्तिर्|the power of the enjoyer|bhoktṛ · śakti; गुणप्रिया|fond of virtues|guṇa · priyā",
  "Known by the mind; reached through knowledge; ever free; serving the Lord; the power of the doer; very deep; the power of the enjoyer; lover of virtues.",
  "மனத்தால் அறியத்தக்கவள்; ஞானத்தால் அடையப்படுபவள்; நித்யமுக்தர்களால் சேவிக்கப்படுபவள்; கர்த்தாவின் சக்தி; மிக ஆழமானவள்; போக்தாவின் சக்தி; குணங்களை விரும்புபவள்.",
  {tip:"Verses 16–17: a row of <b>-śakti</b> names — kartṛ, bhoktṛ, jñāna, para, mahā."}),
 v("v17", "17", "Golden and boundless", "The power of knowing, beyond compare — the supreme power, flawless, without support, ever blossoming.",
  "ज्ञानशक्तिरनौपम्या|the power of knowledge, beyond compare|jñāna-śakti · anaupamyā; परशक्तिर्|the supreme power|para · śakti; निरामया|free of all ill|nirāmayā",
  "अकलङ्का|stainless|akalaṅkā; महाशक्तिर्|the great power|mahā · śakti; निराधारा|needing no support|nirādhārā; विकासिनी|blossoming|vikāsinī",
  "The power of knowledge; beyond compare; the supreme power; free of all ill; stainless; the great power; needing no support; ever blossoming.",
  "ஞான சக்தி; உவமையற்றவள்; பரசக்தி; நோயற்றவள்; களங்கமற்றவள்; மகாசக்தி; ஆதாரம் தேவையற்றவள்; மலர்பவள்."),
 v("v18", "18", "Golden and boundless", "Great Māyā, great bliss — one in form, yet threefold, beyond all number.",
  "महामाया|great Māyā|mahā · māyā; महानन्दा|great bliss|mahā · ānandā; ब्रह्मनीतिर्|the way of Brahman|brahma · nīti; निराश्रया|resting on nothing|nirāśrayā",
  "एकस्वरूपा|one in form|eka · svarūpā; त्रिविधा|threefold|tri · vidhā; सङ्ख्यातीता|beyond number|saṅkhyā · atītā; निरञ्जना|spotless|nirañjanā",
  "Great Māyā; great bliss; the way of Brahman; resting on nothing; one in form; threefold; beyond all number; spotless.",
  "மகாமாயை; மகா ஆனந்தம்; பிரம்ம நீதி; ஆதாரமற்றவள்; ஒரே வடிவினள்; மூன்றாக விளங்குபவள்; எண்ணிக்கைக்கு அப்பாற்பட்டவள்; மாசற்றவள்.",
  {tip:"<b>eka-svarūpā · trividhā</b> — one, yet three (as Śrī, Bhū and Nīlā; or as the three guṇas)."}),
 v("v19", "19", "Golden and boundless", "Ever pure, beyond doubt, ever calm, without a ripple — undivided, yet dividing all.",
  "आत्मसक्ता|devoted to the Self|ātma · saktā; नित्यशुचिर्|ever pure|nitya · śuci; निर्विकल्पा|beyond doubt|nirvikalpā; सुखोचिता|fit for joy|sukha · ucitā",
  "नित्यशान्ता|ever calm|nitya · śāntā; निस्तरङ्गा|without a ripple|nis · taraṅgā; निर्भिन्ना|undivided|nirbhinnā; सर्वभेदिनी|who divides all|sarva · bhedinī",
  "Devoted to the Lord; ever pure; beyond doubt; fit for joy; ever calm; without a ripple; undivided; yet the one who differentiates all.",
  "பரமாத்மாவிடம் பற்றுடையவள்; என்றும் தூயவள்; ஐயமற்றவள்; இன்பத்திற்கு உரியவள்; என்றும் அமைதியானவள்; அலையற்றவள்; பிளவற்றவள்; எல்லாவற்றையும் வேறுபடுத்துபவள்."),
 v("v20", "20", "Golden and boundless", "Unmixed, ruled by none, purifier of all, without desire, yet holding every flavour.",
  "असङ्कीर्णाऽविधेयात्मा|unmixed, ruled by none|asaṅkīrṇā · avidheya · ātmā; निषेध्या|(known by) negation (“not this”)|niṣedhyā; सर्वपावनी|purifier of all|sarva · pāvanī",
  "निष्कामना|without desire|niṣkāmanā; सर्वरसाऽभेद्या|holding every flavour, unbreakable|sarva · rasā · abhedyā; सर्वार्थसाधिनी|accomplisher of every aim|sarva · artha · sādhinī",
  "Unmixed; ruled by none; known by “not this, not this”; purifier of all; without desire; holding every flavour; unbreakable; accomplisher of every aim.",
  "கலப்பற்றவள்; எவருக்கும் கட்டுப்படாதவள்; ‘இதுவல்ல’ என்று அறியப்படுபவள்; எல்லாவற்றையும் தூய்மையாக்குபவள்; ஆசையற்றவள்; எல்லாச் சுவையுமானவள்; பிளக்க முடியாதவள்; எல்லா நோக்கங்களையும் நிறைவேற்றுபவள்.",
  {tip:"Her copy reads <i>niṣeddhyā</i>; written here <i>niṣedhyā</i> (same sound count)."}),
 v("v21", "21", "Golden and boundless", "Beyond description and measure, changeless, giver of fearlessness, both being and non-being.",
  "अनिर्देश्याऽपरिमिता|indescribable, immeasurable|anirdeśyā · aparimitā; निर्विकारा|changeless|nirvikārā; त्रिलक्षणा|with three marks|tri · lakṣaṇā",
  "अभयङ्करी|giver of fearlessness|abhayaṅ-karī; स्त्रीस्वरूपाऽव्यक्ता|in woman's form, the unmanifest|strī · svarūpā · avyaktā; सदसदाकृतिः|whose form is being and non-being|sat · asat · ākṛti",
  "Indescribable; immeasurable; changeless; with three marks; giver of fearlessness; in the form of a woman; the unmanifest; whose form is both being and non-being.",
  "விவரிக்க முடியாதவள்; அளவற்றவள்; மாறுபாடற்றவள்; மூன்று இலக்கணங்கள் உடையவள்; அபயம் அளிப்பவள்; பெண் வடிவினள்; வெளிப்படாதவள்; சத்தும் அசத்துமான வடிவினள்.",
  {irreg:true, tip:"Line 2 has 17 syllables in her text (<i>abhayaṅkarī</i> is one syllable long) — chant it a little quicker."}),
 v("v22", "22", "Golden and boundless", "Beyond argument, unstoppable; ruler and mover of the machine of the world; dwelling in the heart.",
  "अप्रतर्क्याऽप्रतिहता|beyond argument, unstoppable|apratarkyā · apratihatā; नियन्त्री|the ruler|niyantrī; यन्त्रवाहिनी|who drives the machine (of the world)|yantra · vāhinī",
  "हार्दमूर्तिर्|whose form is in the heart|hārda · mūrti; महामूर्तिरव्यक्ता|of great form, unmanifest|mahā-mūrti · avyaktā; विश्वगोपिनी|protector of the universe|viśva · gopinī",
  "Beyond argument; unstoppable; the inner ruler; driver of the world-machine; dwelling in the heart; of great form; unmanifest; protector of the universe.",
  "தர்க்கத்துக்கு அப்பாற்பட்டவள்; தடுக்க முடியாதவள்; நியமிப்பவள்; உலக இயந்திரத்தை இயக்குபவள்; இதயத்தில் உள்ள வடிவினள்; பெரும் வடிவினள்; வெளிப்படாதவள்; உலகைக் காப்பவள்."),
 v("v23", "23", "Golden and boundless", "Ever growing, flawless, giver of the three aims, immeasurable, a cow of nectar.",
  "वर्धमानाऽनवद्याङ्गी|ever growing, flawless of limb|vardhamānā · anavadya · aṅgī; निरवद्या|faultless|niravadyā; त्रिवर्गदा|giver of the three aims|tri-varga = dharma, artha, kāma · dā",
  "अप्रमेयाऽमृतदुघा|immeasurable, yielding nectar|aprameyā · amṛta · dughā; कूटस्था|unchanging|kūṭa · sthā; कुलनन्दिनी|joy of the family|kula · nandinī",
  "Ever growing; flawless of limb; faultless; giver of dharma, wealth and love; immeasurable; yielding nectar; unchanging; the joy of the family.",
  "வளர்பவள்; குறையற்ற அங்கமுடையவள்; களங்கமற்றவள்; அறம், பொருள், இன்பம் தருபவள்; அளவிட முடியாதவள்; அமுதம் சுரப்பவள்; மாறாதவள்; குலத்தை மகிழ்விப்பவள்."),
 v("v24", "24", "Golden and boundless", "Perfected through tantra and yoga, queen of the gods, mother of the world, the great medicine.",
  "अविगीता|beyond reproach|avigītā; तन्त्रसिद्धा|perfected through tantra|tantra · siddhā; योगसिद्धाऽमरेश्वरी|perfected through yoga, queen of the gods|yoga · siddhā · amara · īśvarī",
  "विश्वसूतिस्|mother of the universe|viśva · sūti; तर्पयन्ती|satisfying (all)|tarpayantī; नित्यतृप्ता|ever content|nitya · tṛptā; महौषधिः|the great medicine|mahā · auṣadhi",
  "Beyond reproach; perfected through tantra; perfected through yoga; queen of the gods; mother of the universe; satisfier of all; ever content; the great medicine.",
  "பழிக்கப்படாதவள்; தந்திரத்தால் சித்தியானவள்; யோகத்தால் சித்தியானவள்; தேவர்களின் ஈஸ்வரி; உலகின் தாய்; எல்லோரையும் திருப்தி செய்பவள்; என்றும் திருப்தியானவள்; மகா ஔஷதம்."),
 v("v25", "25", "Golden and boundless", "Beyond words yet bearing words; grateful; present in the three worlds; born of bhūr, bhuvaḥ, svaḥ.",
  "शब्दात्यया|beyond words|śabda · atyayā; शब्दसहा|bearing words|śabda · sahā; कृतज्ञा|grateful|kṛta · jñā; कृतलक्षणा|with the marks (of the Lord)|kṛta · lakṣaṇā",
  "त्रिवर्तिनी|moving in three ways|tri · vartinī; त्रिलोकस्था|present in the three worlds|tri · loka · sthā; भूर्भुवस्स्वरयोनिजा|born of no womb — of bhūḥ, bhuvaḥ, svaḥ|bhūḥ · bhuvaḥ · svaḥ · ayoni-jā = not womb-born",
  "Beyond words; bearer of words; grateful; bearing the Lord's marks; moving in three ways; present in the three worlds; the vyāhṛtis bhūḥ, bhuvaḥ, svaḥ; not born of any womb.",
  "சொல்லுக்கு அப்பாற்பட்டவள்; சொல்லைத் தாங்குபவள்; செய்நன்றி அறிபவள்; பகவானின் லக்ஷணங்கள் உடையவள்; மூன்று விதமாக இயங்குபவள்; மூவுலகிலும் இருப்பவள்; பூர், புவ:, ஸுவ: ஆனவள்; கருவில் பிறவாதவள்."),
 v("v26", "26", "Golden and boundless", "Beyond grasping, of endless names, surpassing all; the lotus of the sky; great queen.",
  "अग्राह्याऽग्राहिकाऽनन्ताह्वया|ungraspable, grasping nothing, of endless names|agrāhyā · agrāhikā · ananta · āhvayā; सर्वातिशायिनी|surpassing all|sarva · atiśāyinī",
  "व्योमपद्मा|the lotus of the sky|vyoma · padmā; कृतधुरा|who carries the burden|kṛta · dhurā; पूर्णकामा|whose wishes are fulfilled|pūrṇa · kāmā; महेश्वरी|great queen|mahā · īśvarī",
  "Beyond grasping; grasping nothing; of endless names; surpassing all; the lotus of the sky; bearer of the world's burden; all her wishes fulfilled; the great queen.",
  "பற்ற முடியாதவள்; எதையும் பற்றாதவள்; அளவற்ற பெயர்கள் உடையவள்; எல்லாவற்றையும் விஞ்சியவள்; ஆகாசத் தாமரை; பாரத்தைச் சுமப்பவள்; நிறைந்த விருப்பமுடையவள்; மகேஸ்வரி."),
 v("v27", "27", "Golden and boundless", "Well spoken of, the speaker, telling truth, purifying; the eldest of the world, bringer of good.",
  "सुवाच्या|well spoken of|su · vācyā; वाचिका|the speaker|vācikā; सत्यकथना|whose words are true|satya · kathanā; सर्वपावनी|purifier of all|sarva · pāvanī",
  "लक्ष्यमाणा|being seen|lakṣyamāṇā; लक्षयन्ती|who sees|lakṣayantī; जगज्ज्येष्ठा|eldest of the world|jagat · jyeṣṭhā; शुभावहा|bringer of good|śubha · āvahā",
  "Well spoken of; the speaker; of true words; purifier of all; the seen and the seer; the eldest of the world; bringer of good.",
  "நன்கு புகழப்படுபவள்; பேசுபவள்; உண்மையே பேசுபவள்; எல்லாவற்றையும் தூய்மையாக்குபவள்; காணப்படுபவளும் காண்பவளும்; உலகில் மூத்தவள்; நன்மை தருபவள்."),
 v("v28", "28", "Golden and boundless", "Foundation of the world, bearer of the worlds; dwelling in the lotus of the heart.",
  "जगत्प्रतिष्ठा|foundation of the world|jagat · pratiṣṭhā; भुवनभर्त्री|bearer of the worlds|bhuvana · bhartrī; गूढप्रभाविनी|of hidden power|gūḍha · prabhāvinī",
  "क्रियायोगात्मिका|whose nature is the yoga of action|kriyā · yoga · ātmikā; मूर्ता|embodied|mūrtā; हृदब्जस्था|dwelling in the heart-lotus|hṛt · abja · sthā; महाक्रमा|of great steps|mahā · kramā",
  "Foundation of the world; bearer of the worlds; of hidden power; the yoga of action; embodied; dwelling in the lotus of the heart; of great strides.",
  "உலகின் அடித்தளம்; உலகங்களைத் தாங்குபவள்; மறைந்த ஆற்றலுடையவள்; கிரியா யோக வடிவினள்; உருவமுடையவள்; இதயத் தாமரையில் இருப்பவள்; பெரும் அடியெடுப்பவள்."),
 v("v29", "29", "Golden and boundless", "The highest heaven, the first-born, the treasure of the world — equal to the Lord in form.",
  "परमद्यौः|the highest heaven|parama · dyaus; प्रथमजा|the first-born|prathama · jā; परमाप्ता|the most trusted|parama · āptā; जगन्निधिः|treasure of the world|jagat · nidhi",
  "आत्मानपायिनी|never apart from the Self|ātma · anapāyinī; तुल्यस्वरूपा|equal in form (to him)|tulya · svarūpā; समलक्षणा|with the same marks|sama · lakṣaṇā",
  "The highest heaven; the first-born; most trusted; the treasure of the world; never apart from the Lord; equal to him in form; bearing the same marks.",
  "பரம ஆகாசம்; முதலில் தோன்றியவள்; மிக நம்பத்தக்கவள்; உலகின் நிதி; பரமாத்மாவைப் பிரியாதவள்; அவனுக்குச் சமமான வடிவினள்; அதே லக்ஷணங்கள் உடையவள்.",
  {tip:"Verses 29–31: a <b>tulya / sama</b> chain — equal to the Lord in form, conduct, age, actions, nature and glory."}),
 v("v30", "30", "Golden and boundless", "Equal in conduct and age, joyful, Garuḍa-bannered — equal in deeds and nature, boon-giver.",
  "तुल्यवृत्ता|equal in conduct|tulya · vṛttā; समवया|equal in age|sama · vayā; मोदमाना|rejoicing|modamānā; खगध्वजा|Garuḍa-bannered|khaga = bird · dhvajā",
  "तुल्यचेष्टा|equal in deeds|tulya · ceṣṭā; तुल्यशीला|equal in nature|tulya · śīlā; वरदा|boon-giver|vara · dā; कामरूपिणी|taking any form at will|kāma · rūpiṇī",
  "Equal in conduct; equal in age; rejoicing; with Garuḍa on her banner; equal in deeds; equal in nature; giver of boons; taking any form at will.",
  "நடத்தையில் சமமானவள்; வயதில் சமமானவள்; மகிழ்பவள்; கருடக் கொடியுடையவள்; செயலில் சமமானவள்; இயல்பில் சமமானவள்; வரம் தருபவள்; விரும்பிய வடிவம் எடுப்பவள்."),
 v("v31", "31", "Golden and boundless", "Complete in every mark, endless, eternal, of true resolve — born of the earth, supreme queen.",
  "समग्रलक्षणाऽनन्ता|complete in marks, endless|samagra · lakṣaṇā · anantā; तुल्यभूतिः|equal in glory|tulya · bhūti; सनातना|eternal|sanātanā",
  "महर्द्धिः|of great prosperity|mahā · ṛddhi; सत्यसङ्कल्पा|of true resolve|satya · saṅkalpā; भूमिजा|born of the earth (Sītā)|bhūmi · jā; परमेश्वरी|supreme queen|parama · īśvarī",
  "Complete in every mark; endless; equal in glory; eternal; of great prosperity; whose resolve comes true; born of the earth (as Sītā); the supreme queen.",
  "எல்லா லக்ஷணங்களும் நிறைந்தவள்; முடிவற்றவள்; மகிமையில் சமமானவள்; என்றுமுள்ளவள்; பெரும் செல்வமுடையவள்; சத்ய சங்கல்பம் உடையவள்; பூமியில் தோன்றியவள் (சீதை); பரமேஸ்வரி."),
 v("v32", "32", "Mother and beauty", "Mother of the world, holder of the thread, nurse of beings, glorious — Sāvitrī, shining on all.",
  "जगन्माता|mother of the world|jagat · mātā; सूत्रवती|holding the thread (of the world)|sūtra · vatī; भूतधात्री|nurse of beings|bhūta · dhātrī; यशस्विनी|glorious|yaśasvinī",
  "महाभिलाषा|of great longing (for devotees)|mahā · abhilāṣā; सावित्री|Sāvitrī|sāvitrī; प्रधाना|the chief|pradhānā; सर्वभासिनी|lighting up all|sarva · bhāsinī",
  "Mother of the world; holder of the thread of the world; nurse of all beings; glorious; of great longing; Sāvitrī; the chief one; she who lights up all.",
  "உலகத் தாய்; உலக நூலைப் பிடித்திருப்பவள்; உயிர்களைப் போஷிப்பவள்; புகழுடையவள்; பெரும் விருப்பமுடையவள்; சாவித்திரி; முதன்மையானவள்; எல்லாவற்றையும் ஒளிரச் செய்பவள்."),
 v("v33", "33", "Mother and beauty", "Of many bodies and kinds, all-knowing, of holy fame, refuge of beings, free of sorrow.",
  "नानावपुर्|of many bodies|nānā · vapus; बहुविधा|of many kinds|bahu · vidhā; सर्वज्ञा|all-knowing|sarva · jñā; पुण्यकीर्तना|whose praise is holy|puṇya · kīrtanā",
  "भूताश्रया|refuge of beings|bhūta · āśrayā; हृषीकेशा|ruler of the senses|hṛṣīka · īśā; अशोका|free of sorrow|aśokā; स्वाङ्गिवाहिका|carrying (all) as her own limbs (?)|sva · aṅgi · vāhikā — meaning uncertain",
  "Of many bodies; of many kinds; all-knowing; whose praise is holy; refuge of beings; ruler of the senses; free of sorrow; carrying all as her own.",
  "பல உடல்கள் உடையவள்; பலவிதமானவள்; எல்லாம் அறிந்தவள்; புனிதமான புகழுடையவள்; உயிர்களின் புகலிடம்; புலன்களின் ஈஸ்வரி; துயரமற்றவள்; எல்லாவற்றையும் தன் அங்கமாகத் தாங்குபவள்.",
  {tip:"<b>hṛṣīkeśā</b> — the feminine of Hṛṣīkeśa. The last name's meaning is uncertain — ask her teacher."}),
 v("v34", "34", "Mother and beauty", "Brahman's own, mother of the holy, true in desire; Hiraṇyagarbhā, deep, seated on a lotus.",
  "ब्रह्मात्मिका|of the nature of Brahman|brahma · ātmikā; पुण्यजनी|mother of the holy|puṇya · janī; सत्यकामा|whose desires come true|satya · kāmā; समाधिभूः|ground of meditation|samādhi · bhū",
  "हिरण्यगर्भा|golden womb|hiraṇya · garbhā; गम्भीरा|deep|gambhīrā; गोधूली|the dusk dust (of returning cows)|go-dhūlī = twilight; कमलासना|seated on a lotus|kamala · āsanā",
  "Of the nature of Brahman; mother of the holy; whose desires come true; ground of meditation; the golden womb; deep; the twilight hour; seated on a lotus.",
  "பிரம்ம வடிவினள்; புண்ணியர்களைத் தோற்றுவிப்பவள்; சத்ய காமம் உடையவள்; சமாதியின் இருப்பிடம்; ஹிரண்யகர்ப்பா; ஆழமானவள்; கோதூளி (அந்திப் பொழுது); தாமரையில் அமர்ந்தவள்."),
 v("v35", "35", "Mother and beauty", "Free of anger, Vaijayantī, swift as mind — Dhanalakṣmī, Rājyalakṣmī, the great faithful wife.",
  "जितक्रोधा|who has conquered anger|jita · krodhā; कुमुदिनी|lily pond|kumudinī; वैजयन्ती|Vaijayantī (the victory garland)|vaijayantī; मनोजवा|swift as the mind|manas · javā",
  "धनलक्ष्मीः|Lakṣmī of wealth|dhana · lakṣmī; स्वस्तिकरी|bringer of well-being|svasti · karī; राज्यलक्ष्मीर्|Lakṣmī of kingdoms|rājya · lakṣmī; महासती|the great faithful wife|mahā · satī",
  "Conqueror of anger; a lily pond; the victory garland; swift as the mind; Dhanalakṣmī; bringer of well-being; Rājyalakṣmī; the great faithful wife.",
  "கோபத்தை வென்றவள்; அல்லிக் குளம்; வைஜயந்தி மாலை; மனத்தைப் போல் வேகமானவள்; தனலக்ஷ்மி; நலம் தருபவள்; ராஜ்யலக்ஷ்மி; மகா பதிவிரதை.",
  {tip:"The <b>Lakṣmīs</b> begin: dhana-lakṣmī, rājya-lakṣmī (35), jaya-lakṣmī (36) — later mokṣa- and vyoma-lakṣmī (92)."}),
 v("v36", "36", "Mother and beauty", "Jayalakṣmī, Indra's queen, Mādhava's beloved — lotus-wombed, full of the Vedas.",
  "जयलक्ष्मीर्|Lakṣmī of victory|jaya · lakṣmī; महागोष्ठी|the great assembly|mahā · goṣṭhī; मघोनी|Indra's queen (Śacī)|maghonī; माधवप्रिया|Mādhava's beloved|mādhava · priyā",
  "पद्मगर्भा|lotus-wombed|padma · garbhā; वेदवती|full of the Vedas|veda · vatī; विविक्ता|solitary, pure|viviktā; परमेष्ठिनी|standing highest|parameṣṭhinī",
  "Jayalakṣmī; the great assembly; Indra's queen; Mādhava's beloved; lotus-wombed; full of the Vedas; pure and apart; standing highest.",
  "ஜயலக்ஷ்மி; பெரும் சபை; இந்திராணி; மாதவனின் பிரியை; தாமரையைக் கருவில் கொண்டவள்; வேதங்கள் நிறைந்தவள்; தனித்த தூயவள்; உச்சத்தில் நிற்பவள்."),
 v("v37", "37", "Mother and beauty", "A golden drop, great, dear to great yogis, sinless — seated on a lotus, made of the Vedas.",
  "सुवर्णबिन्दुर्|a golden drop|suvarṇa · bindu; महती|great|mahatī; महायोगिप्रियाऽनघा|dear to great yogis, sinless|mahā · yogi · priyā · anaghā",
  "पद्मेस्थिता|seated on a lotus|padme · sthitā; वेदमयी|made of the Vedas|veda · mayī; कुमुदा|giver of joy on earth|ku · mudā; जयवाहिनी|bringer of victory|jaya · vāhinī",
  "A golden drop; great; dear to great yogis; sinless; seated on a lotus; made of the Vedas; joy of the earth; bringer of victory.",
  "பொன் துளி; பெரியவள்; மகா யோகிகளுக்குப் பிரியமானவள்; பாவமற்றவள்; தாமரையில் இருப்பவள்; வேதமயமானவள்; பூமிக்கு மகிழ்ச்சி தருபவள்; வெற்றியைக் கொண்டுவருபவள்."),
 v("v38", "38", "Mother and beauty", "Union, light, order, many festivals — honoured by Rudra, mother of the Vedas, like a bee to honey.",
  "संहतिर्|union|saṃhati; निर्मिता|well-formed|nirmitā; ज्योतिर्|light|jyotis; नियतिर्|order, destiny|niyati; विविधोत्सवा|of many festivals|vividha · utsavā",
  "रुद्रवन्द्या|honoured by Rudra|rudra · vandyā; सिन्धुमती|having the ocean|sindhu · matī; वेदमाता|mother of the Vedas|veda · mātā; मधुव्रता|a honey-bee (devoted to sweetness)|madhu · vratā",
  "Union; well-formed; light; order and destiny; of many festivals; honoured by Rudra; possessing the ocean; mother of the Vedas; devoted to sweetness like a bee.",
  "இணைப்பு; நன்கு அமைந்தவள்; ஒளி; நியதி; பல விழாக்கள் உடையவள்; ருத்ரனால் வணங்கப்படுபவள்; கடலை உடையவள்; வேதமாதா; தேனீ போல் இனிமையை நாடுபவள்."),
 v("v39", "39", "Mother and beauty", "Bearer of all, daughter of the snow-mountain, who plays in the ocean at will; kind, full of sacrifice.",
  "विश्वम्भरा|bearer of all|viśvam · bharā; हैमवती|daughter of the Himālaya|haimavatī; समुद्रेच्छाविहारिणी|who sports in the ocean at will|samudra · icchā · vihāriṇī",
  "अनुकूला|kind, favourable|anukūlā; यज्ञवती|full of sacrifice|yajña · vatī; शतकोटिः|a hundred crores|śata · koṭi; सुपेशला|very gentle|su · peśalā",
  "Bearer of all; daughter of the Himālaya; playing in the ocean at will; favourable; full of sacrifice; a hundred crores (countless); very gentle.",
  "எல்லாவற்றையும் தாங்குபவள்; இமயமலை மகள்; விரும்பியபடி கடலில் விளையாடுபவள்; அனுகூலமானவள்; யாகம் நிறைந்தவள்; நூறு கோடி (எண்ணற்றவள்); மிக மென்மையானவள்."),
 v("v40", "40", "Mother and beauty", "Rise of dharma, service of dharma, tender, in the assembly — praised by Brahmā and the sages.",
  "धर्मोदया|the rise of dharma|dharma · udayā; धर्मसेवा|service of dharma|dharma · sevā; सुकुमारी|very tender|su · kumārī; सभावती|of the assembly|sabhā · vatī",
  "भीमा|awesome|bhīmā; ब्रह्मस्तुता|praised by Brahmā|brahma · stutā; मध्यप्रभा|light at the centre|madhya · prabhā; देवर्षिवन्दिता|honoured by the divine sages|deva-ṛṣi · vanditā",
  "Rise of dharma; service of dharma; very tender; present in the assembly; awesome; praised by Brahmā; the light at the centre; honoured by the divine sages.",
  "தர்மத்தின் உதயம்; தர்ம சேவை; மிக மென்மையானவள்; சபையில் இருப்பவள்; பயங்கரமானவள்; பிரம்மனால் துதிக்கப்படுபவள்; நடுவில் ஒளிர்பவள்; தேவரிஷிகளால் வணங்கப்படுபவள்."),
 v("v41", "41", "Mother and beauty", "Enjoyed by the gods, most fortunate, the promise, a full treasure — golden, bright, giver of enjoyments.",
  "देवभोग्या|enjoyed by the gods|deva · bhogyā; महाभागा|most fortunate|mahā · bhāgā; प्रतिज्ञा|the promise|pratijñā; पूर्णशेवधिः|a full treasure|pūrṇa · śevadhi",
  "सुवर्णा|golden|su · varṇā; रुचिरप्रख्या|of lovely appearance|rucira · prakhyā; भोगिनी|enjoyer|bhoginī; भोगदायिनी|giver of enjoyments|bhoga · dāyinī",
  "Enjoyed by the gods; most fortunate; the promise (of protection); a full treasure; golden; of lovely appearance; the enjoyer; giver of enjoyments.",
  "தேவர்கள் அனுபவிப்பவள்; பெரும் பாக்கியவதி; வாக்குறுதி; நிறைந்த நிதி; பொன்னிறத்தவள்; அழகிய தோற்றமுடையவள்; அனுபவிப்பவள்; போகங்களைத் தருபவள்."),
 v("v42", "42", "Mother and beauty", "The finest bride, Gāyatrī, lotus-born — dear to the learned, lotus-marked, lotus-eyed.",
  "वसुप्रणोत्तमवधूर्|giver of riches, the finest bride|vasu = wealth · uttama · vadhū = bride; गायत्री|Gāyatrī|gāyatrī; कमलोद्भवा|born of the lotus|kamala · udbhavā",
  "विद्वत्प्रिया|dear to the learned|vidvat · priyā; पद्मचिह्ना|marked with lotuses|padma · cihnā; वरिष्ठा|the best|variṣṭhā; कमलेक्षणा|lotus-eyed|kamala · īkṣaṇā",
  "Bringer of riches, the finest bride; Gāyatrī; lotus-born; dear to the learned; marked with lotuses; the best; lotus-eyed.",
  "செல்வம் தரும் உத்தம மணமகள்; காயத்ரி; தாமரையில் தோன்றியவள்; அறிஞர்களுக்குப் பிரியமானவள்; தாமரைச் சின்னமுடையவள்; சிறந்தவள்; தாமரைக் கண்ணாள்.",
  {tip:"Verses 42–51: a run of <b>padma</b> (lotus) names: kamalodbhavā, padmacihnā, kamalekṣaṇā, padmapriyā, padmanilayā, padmagandhinī, padmavarṇā, padmadharā…"}),
 v("v43", "43", "Mother and beauty", "Lover of lotuses, ever gracious, joyful, at her beloved's side; ornament of the world.",
  "पद्मप्रिया|lover of lotuses|padma · priyā; सुप्रसन्ना|ever gracious|su · prasannā; प्रमोदा|joy|pramodā; प्रियपार्श्वगा|at her beloved's side|priya · pārśva · gā",
  "विश्वभूषा|ornament of the world|viśva · bhūṣā; कान्तिमती|radiant|kānti · matī; कृष्णा|dark one|kṛṣṇā; वीणारवोत्सुका|eager for the sound of the vīṇā|vīṇā · rava · utsukā",
  "Lover of lotuses; ever gracious; joy; at her beloved's side; ornament of the world; radiant; dark-hued; eager for the sound of the vīṇā.",
  "தாமரையை விரும்புபவள்; மிகவும் அருள் நிறைந்தவள்; மகிழ்ச்சி; பிரியனின் அருகில் இருப்பவள்; உலகின் அணிகலன்; ஒளியுடையவள்; கருநிறத்தவள்; வீணை ஒலியில் ஆர்வமுடையவள்."),
 v("v44", "44", "Mother and beauty", "Giver of light, self-luminous, shining, flying like a bird — on the Lord's lap, wise.",
  "रोचिष्करी|giver of light|rociṣ · karī; स्वप्रकाशा|self-luminous|sva · prakāśā; शोभमाना|shining|śobhamānā; विहङ्गमा|moving like a bird|vihaṅgamā",
  "देवाङ्गस्था|in the Lord's body|deva · aṅga · sthā; परिणतिः|the ripening|pariṇati; कामवत्सा|tender to all wishes|kāma · vatsā; महामतिः|of great mind|mahā · mati",
  "Giver of light; self-luminous; shining; moving like a bird; dwelling in the Lord's body; the ripening (of all); tender to every wish; of great mind.",
  "ஒளி தருபவள்; தானே ஒளிர்பவள்; பிரகாசிப்பவள்; பறவை போல் சஞ்சரிப்பவள்; பகவானின் அங்கத்தில் இருப்பவள்; பக்குவமானவள்; விருப்பங்களிடம் வாஞ்சையுடையவள்; பேரறிவுடையவள்."),
 v("v45", "45", "Mother and beauty", "Navel like a blue lotus, calmer of sorrow, fairest — dwelling in the lotus, lotus-fragrant.",
  "इल्वलोत्पलनाभाऽधिशमनी|navel like a blue lily, calmer of sorrow|ilvala · utpala · nābhā · ādhi = anxiety · śamanī; वरवर्णिनी|the fairest|vara · varṇinī",
  "स्वनिष्ठा|steady in herself|sva · niṣṭhā; पद्मनिलया|dwelling in the lotus|padma · nilayā; सद्गतिः|the good goal|sat · gati; पद्मगन्धिनी|with the fragrance of lotuses|padma · gandhinī",
  "With a navel like a blue lily; calmer of anxiety; the fairest; steady in herself; dwelling in the lotus; the good goal; lotus-fragrant.",
  "நீலோத்பலம் போன்ற நாபி உடையவள்; கவலையைத் தணிப்பவள்; சிறந்த நிறத்தவள்; தன்னில் நிலைத்தவள்; தாமரையில் வசிப்பவள்; நற்கதி; தாமரை மணமுடையவள்."),
 v("v46", "46", "Mother and beauty", "Lotus-coloured, source of desire, Caṇḍikā with a lovely anger — enchanter of the three worlds.",
  "पद्मवर्णा|lotus-coloured|padma · varṇā; कामयोनिश्|source of desire|kāma · yoni; चण्डिका|Caṇḍikā, the fierce|caṇḍikā; चारुकोपना|lovely even in anger|cāru · kopanā",
  "रतिस्नुषा|Rati's mother-in-law (Kāma's mother)|rati · snuṣā; पद्मधरा|holding a lotus|padma · dharā; पूज्या|to be worshipped|pūjyā; त्रैलोक्यमोहिनी|enchanter of the three worlds|trailokya · mohinī",
  "Lotus-coloured; source of desire; Caṇḍikā; lovely even in anger; Kāma's mother (Rati is her daughter-in-law); holding a lotus; to be worshipped; enchanter of the three worlds.",
  "தாமரை நிறத்தவள்; காமத்தின் மூலம்; சண்டிகை; கோபத்திலும் அழகியவள்; ரதியை மருமகளாக உடையவள் (மன்மதனின் தாய்); தாமரை ஏந்தியவள்; பூஜிக்கத்தக்கவள்; மூவுலகையும் மயக்குபவள்.",
  {tip:"<b>rati-snuṣā</b>: Kāma (Pradyumna) is Lakṣmī–Kṛṣṇa's son, so Rati is her daughter-in-law."}),
 v("v47", "47", "Mother and beauty", "Ever a maiden, garlanded with drops, unfading, all-fragrant — slender-waisted, radiant.",
  "नित्यकन्या|ever a maiden|nitya · kanyā; बिन्दुमालिन्यक्षया|garlanded with drops, unfading|bindu · mālinī · akṣayā; सर्वगन्धिनी|of all fragrances|sarva · gandhinī",
  "गन्धात्मिका|fragrance itself|gandha · ātmikā; सुरसिका|full of fine taste|su · rasikā; दीप्तमूर्तिः|of radiant form|dīpta · mūrti; सुमध्यमा|slender-waisted|su · madhyamā",
  "Ever a maiden; garlanded with drops; unfading; with every fragrance; fragrance itself; full of fine taste; radiant in form; slender-waisted.",
  "என்றும் கன்னி; துளிகளை மாலையாக அணிந்தவள்; அழியாதவள்; எல்லா மணமும் உடையவள்; மணமே வடிவானவள்; சுவையறிந்தவள்; ஒளிரும் வடிவினள்; மெல்லிடையாள்.",
  {tip:"<b>gandha</b> names come from Śrī Sūkta (<i>gandha-dvārām</i>, v57). Lakṣmī is linked with fragrance."}),
 v("v48", "48", "Mother and beauty", "Full hips, gentle face, graceful, with ears like lotus seats — smiling, lovely in gait.",
  "पृथुश्रोणी|with full hips|pṛthu · śroṇī; सौम्यमुखी|gentle-faced|saumya · mukhī; सुभगा|graceful|su · bhagā; विष्टरश्रुतिः|whose ears are lotus seats|viṣṭara · śruti",
  "स्मितानना|smiling-faced|smita · ānanā; चारुगतिर्|lovely in gait|cāru · gati; निम्ननाभिर्|with a deep navel|nimna · nābhi; महास्तनी|full-bosomed|mahā · stanī",
  "Full-hipped; gentle-faced; graceful; with ears like lotus seats; smiling; lovely in gait; with a deep navel; full-bosomed.",
  "அகன்ற இடையுடையவள்; இனிய முகமுடையவள்; அழகியவள்; தாமரை ஆசனம் போன்ற காதுகள் உடையவள்; புன்னகை முகத்தவள்; அழகிய நடையுடையவள்; ஆழ்ந்த நாபியுடையவள்; பெரும் ஸ்தனமுடையவள்."),
 v("v49", "49", "Mother and beauty", "Glossy braid, Bhagavatī, beautiful-eyed — feet like sprouts, lotus-minded, the great apsaras.",
  "स्निग्धवेणी|with a glossy braid|snigdha · veṇī; भगवती|the blessed Goddess|bhagavatī; सुकान्ता|very lovely|su · kāntā; वामलोचना|beautiful-eyed|vāma · locanā",
  "पल्लवाङ्घ्रिः|with feet soft as sprouts|pallava · aṅghri; पद्ममनाः|lotus-minded|padma · manas; पद्मबोधा|awake like a lotus|padma · bodhā; महाप्सराः|the great apsaras|mahā · apsaras",
  "With a glossy braid; Bhagavatī; very lovely; beautiful-eyed; feet soft as sprouts; lotus-minded; awake like a blooming lotus; the great celestial nymph.",
  "பளபளக்கும் சடையுடையவள்; பகவதி; மிக அழகியவள்; அழகிய கண்ணாள்; தளிர் போன்ற பாதமுடையவள்; தாமரை மனமுடையவள்; தாமரை போல் மலர்ந்தவள்; மகா அப்சரஸ்."),
 v("v50", "50", "Mother and beauty", "Sarasvatī, sweet-smiling, auspicious-eyed — conch-necked, red-handed, delightful.",
  "सरस्वती|Sarasvatī|sarasvatī; चारुहासा|sweet-smiling|cāru · hāsā; शुभदृष्टिः|of auspicious glance|śubha · dṛṣṭi; ककुद्मिनी|eminent|kakudminī",
  "कम्बुग्रीवा|with a conch-like neck|kambu · grīvā; सुजघना|with fine hips|su · jaghanā; रक्तपाणि|red-palmed|rakta · pāṇi; मनोरमा|delighting the mind|manas · ramā",
  "Sarasvatī; sweet-smiling; of auspicious glance; eminent; conch-necked; with fine hips; with reddish palms; delighting the mind.",
  "சரஸ்வதி; இனிய புன்னகையுடையவள்; மங்களப் பார்வையுடையவள்; மேன்மையானவள்; சங்கு போன்ற கழுத்துடையவள்; அழகிய இடையுடையவள்; சிவந்த கைகள் உடையவள்; மனத்தை மகிழ்விப்பவள்."),
 v("v51", "51", "Mother and beauty", "Lotus-like, slow-walking, four-armed — with lucky lines, playful brows, a parrot's voice, skilled in the arts.",
  "पद्मिनी|lotus-like|padminī; मन्दगमना|slow-walking|manda · gamanā; चतुर्दंष्ट्रा|four-tusked (as Vārāhī)|catur · daṃṣṭrā; चतुर्भुजा|four-armed|catur · bhujā",
  "शुभरेखा|with lucky lines (on palms)|śubha · rekhā; विलासभ्रूः|with playful brows|vilāsa · bhrū; शुकवाणी|with a parrot's voice|śuka · vāṇī; कलावती|skilled in the arts|kalā · vatī",
  "Lotus-like; slow and graceful in walk; four-tusked; four-armed; with lucky lines; with playful brows; with a parrot's sweet voice; skilled in the arts.",
  "தாமரை போன்றவள்; மெதுவாக நடப்பவள்; நான்கு கோரைப்பற்கள் உடையவள்; நான்கு கைகள் உடையவள்; மங்கள ரேகைகள் உடையவள்; விளையாடும் புருவமுடையவள்; கிளி போன்ற குரலுடையவள்; கலைகள் அறிந்தவள்."),
 v("v52", "52", "Mother and beauty", "Straight nose, sweet voice, fine hips, slim waist — twilight, lips like bimba, called Śrī.",
  "ऋजुनासा|with a straight nose|ṛju · nāsā; कलरवा|with a sweet murmur|kala · ravā; वरारोहा|with fine hips|vara · ārohā; तलोदरी|slim-waisted|tala · udarī",
  "सन्ध्या|twilight|sandhyā; बिम्बाधरा|with lips like the bimba fruit|bimba · adharā; पूर्वभाषिणी|who speaks first (kindly)|pūrva · bhāṣiṇī; श्रीसमाह्वया|called Śrī|śrī · samāhvayā",
  "With a straight nose; a sweet murmuring voice; fine hips; slim waist; the twilight; lips like the bimba fruit; who speaks first (to put others at ease); called Śrī.",
  "நேரான மூக்குடையவள்; இனிய குரலுடையவள்; அழகிய இடையுடையவள்; மெல்லிய வயிறுடையவள்; சந்தியா; கோவைப்பழ உதடுடையவள்; முதலில் பேசுபவள் (அன்புடன்); ஸ்ரீ என்று அழைக்கப்படுபவள்.",
  {tip:"<b>pūrva-bhāṣiṇī</b> — “she who speaks first” — a quality Vālmīki gives Rāma: kind, putting others at ease."}),
 v("v53", "53", "Mother and beauty", "With a sugarcane bow and flower arrows, divinely adorned — Indra's own, under a white umbrella, Tilottamā.",
  "इक्षुचापा|with a sugarcane bow|ikṣu · cāpā; सुमशरा|with flower arrows|suma · śarā; दिव्यभूषा|divinely adorned|divya · bhūṣā; मनोहरा|captivating|manas · harā",
  "वासवी|Indra's power|vāsavī; पाण्डरच्छत्रा|with a white umbrella|pāṇḍara · chatrā; करभोरुस्|with thighs like an elephant's trunk|karabha · ūru; तिलोत्तमा|Tilottamā, finest of beauties|tila · uttamā",
  "With a sugarcane bow; with flower arrows; divinely adorned; captivating; Indra's power; with a white royal umbrella; with graceful thighs; Tilottamā, the finest of beauties.",
  "கரும்பு வில்லுடையவள்; மலர் அம்புகள் உடையவள்; திவ்ய ஆபரணம் அணிந்தவள்; மனம் கவர்பவள்; வாசவி; வெண்கொற்றக் குடையுடையவள்; அழகிய தொடையுடையவள்; திலோத்தமை.",
  {tip:"<b>ikṣu-cāpā · suma-śarā</b> — the sugarcane bow and flower arrows, as of Kāma and Lalitā."}),
 v("v54", "54", "Her many forms", "Parting her hair, the power of breath, fearsome yet nectar-bearing — moon-faced, with curling locks.",
  "सीमन्तिनी|a woman with parted hair (married)|sīmantinī; प्राणशक्तिर्|the power of breath|prāṇa · śakti; विभीषिण्यसुधारिणी|fearsome, bearer of life|vibhīṣiṇī · asu = life · dhāriṇī",
  "भद्रा|auspicious|bhadrā; जयावहा|bringing victory|jaya · āvahā; चन्द्रवदना|moon-faced|candra · vadanā; कुटिलालका|with curling locks|kuṭila · alakā",
  "The married lady; the power of breath; fearsome (to the wicked); bearer of life; auspicious; bringer of victory; moon-faced; with curling locks.",
  "சுமங்கலி; பிராண சக்தி; தீயோருக்கு அச்சம் தருபவள்; உயிரைத் தாங்குபவள்; மங்களமானவள்; வெற்றி தருபவள்; சந்திர முகமுடையவள்; சுருண்ட கூந்தலுடையவள்."),
 v("v55", "55", "Her many forms", "In bright clothes and perfumes, shining with a jewelled crown, divine weapons and garlands.",
  "चित्राम्बरा|in bright clothes|citra · ambarā; चित्रगन्धा|with varied perfumes|citra · gandhā; रत्नमौलिसमुज्ज्वला|shining with a jewelled crown|ratna · mauli · samujjvalā",
  "दिव्यायुधा|with divine weapons|divya · āyudhā; दिव्यमाल्या|with divine garlands|divya · mālyā; विशाखा|Viśākhā (a star)|viśākhā; चित्रवाहना|with a wondrous mount|citra · vāhanā",
  "In bright clothes; with varied perfumes; shining with a jewelled crown; with divine weapons; with divine garlands; Viśākhā; with a wondrous mount.",
  "பல வண்ண ஆடையுடையவள்; பல மணங்கள் உடையவள்; ரத்ன மகுடத்தால் ஒளிர்பவள்; திவ்ய ஆயுதங்கள் உடையவள்; திவ்ய மாலைகள் உடையவள்; விசாகா; அதிசய வாகனமுடையவள்."),
 v("v56", "56", "Her many forms", "Ambikā, daughter of the ocean, the ladder (to heaven), smiling, fond of Sāman songs.",
  "अम्बिका|mother|ambikā; सिन्धुतनया|daughter of the ocean|sindhu · tanayā; निश्रेणी|the ladder (to liberation)|niśreṇī; सुमहासिनी|beautifully smiling|su · mahāsinī",
  "सामप्रिया|fond of Sāma songs|sāma · priyā; नवमृगी|like a young doe|nava · mṛgī; सर्वसेव्या|served by all|sarva · sevyā; वराङ्गना|the finest lady|vara · aṅganā",
  "Ambikā; daughter of the ocean; the ladder to liberation; beautifully smiling; fond of Sāma songs; like a young doe; served by all; the finest of women.",
  "அம்பிகை; கடலின் மகள்; முக்திக்கு ஏணி; அழகாகப் புன்னகைப்பவள்; சாம கானத்தை விரும்புபவள்; இளம் மான் போன்றவள்; எல்லோராலும் சேவிக்கப்படுபவள்; சிறந்த பெண்."),
 v("v57", "57", "Her many forms", "From Śrī Sūkta: known by fragrance, unconquerable, ever nourished, rich in harvest, sun-coloured.",
  "गन्धद्वारा|reached through fragrance|gandha · dvārā; दुराधर्षा|unassailable|durādharṣā; नित्यपुष्टा|ever nourished|nitya · puṣṭā; करीषिणी|rich in cattle and harvest|karīṣiṇī",
  "देवजुष्टाऽऽदित्यवर्णा|loved by the gods, sun-coloured|deva · juṣṭā · āditya · varṇā; दिव्यगन्धा|of divine fragrance|divya · gandhā; स्वकर्दमा|whose own son is Kardama|sva · kardamā",
  "Reached through fragrance; unassailable; ever nourished; rich in cattle and harvest; loved by the gods; the colour of the sun; of divine fragrance; mother of Kardama.",
  "மணத்தால் அடையப்படுபவள்; வெல்ல முடியாதவள்; என்றும் செழித்தவள்; பசுக்களும் விளைச்சலும் நிறைந்தவள்; தேவர்களால் விரும்பப்படுபவள்; சூரிய நிறத்தவள்; திவ்ய மணமுடையவள்; கர்தமரைத் தன் மகனாக உடையவள்.",
  {tip:"Straight from <b>Sri Suktam</b>: gandhadvārāṃ durādharṣāṃ nityapuṣṭāṃ karīṣiṇīm; ādityavarṇe; kardamena prajābhūtā. Her copy reads <i>…'divyavarṇā</i>; the Śrī Sūkta word <i>ādityavarṇā</i> is used here."}),
 v("v58", "58", "Her many forms", "Endless in form, abiding in the Endless; eater of sacrifice, great rain, the cry “vaṣaṭ”.",
  "अनन्तरूपाऽनन्तस्था|of endless forms, dwelling in Ananta|ananta · rūpā · ananta · sthā; सर्वदाऽनन्तसङ्गमा|giver of all, ever joined with the Endless|sarva · dā · ananta · saṅgamā",
  "यज्ञाशिनी|eater of the sacrifice|yajña · aśinī; महावृष्टिः|great rain|mahā · vṛṣṭi; सर्वपूज्या|worshipped by all|sarva · pūjyā; वषट्क्रिया|the act of “vaṣaṭ” (offering)|vaṣaṭ · kriyā",
  "Of endless forms; dwelling in the Endless; giver of all; ever joined with the Endless; receiver of sacrifices; the great rain; worshipped by all; the sacred cry “vaṣaṭ”.",
  "அளவற்ற வடிவினள்; அனந்தனில் இருப்பவள்; எல்லாம் தருபவள்; அனந்தனுடன் இணைந்தவள்; யாகத்தை ஏற்பவள்; பெருமழை; எல்லோராலும் பூஜிக்கப்படுபவள்; ‘வஷட்’ எனும் ஹோமச் செயல்."),
 v("v59", "59", "Her many forms", "Dear to yoga, sky-navelled, endless prosperity, beyond the senses — Yogamāyā, the ancient.",
  "योगप्रिया|dear to yoga|yoga · priyā; वियन्नाभिर्|whose navel is the sky|viyat · nābhi; अनन्तश्रीर्|endless prosperity|ananta · śrī; अतीन्द्रिया|beyond the senses|ati · indriyā",
  "योगिसेव्या|served by yogis|yogi · sevyā; सत्यरता|devoted to truth|satya · ratā; योगमाया|Yogamāyā|yoga · māyā; पुरातनी|the ancient|purātanī",
  "Dear to yoga; whose navel is the sky; endless prosperity; beyond the senses; served by yogis; devoted to truth; Yogamāyā; the ancient one.",
  "யோகத்தை விரும்புபவள்; ஆகாசமே நாபியானவள்; அளவற்ற செல்வம்; புலன்களுக்கு அப்பாற்பட்டவள்; யோகிகளால் சேவிக்கப்படுபவள்; சத்தியத்தில் ஈடுபட்டவள்; யோகமாயை; பழமையானவள்."),
 v("v60", "60", "Her many forms", "Queen of all, ever young, the refuge, goddess of dharma — veiled light, giver of yogic success.",
  "सर्वेश्वरी|queen of all|sarva · īśvarī; सुतरुणी|ever young|su · taruṇī; शरण्या|the refuge|śaraṇyā; धर्मदेवता|goddess of dharma|dharma · devatā",
  "सुतरा|easy to cross with|su · tarā; संवृतज्योतिर्|veiled light|saṃvṛta · jyotis; योगिनी|the yoginī|yoginī; योगसिद्धिदा|giver of yogic success|yoga · siddhi · dā",
  "Queen of all; ever young; the refuge; goddess of dharma; easy to cross (saṃsāra) with; veiled light; the yoginī; giver of success in yoga.",
  "எல்லோருக்கும் ஈஸ்வரி; என்றும் இளமையானவள்; சரணடையத் தக்கவள்; தர்ம தேவதை; எளிதில் கரையேற்றுபவள்; மறைந்த ஒளி; யோகினி; யோக சித்தி தருபவள்."),
 v("v61", "61", "Her many forms", "The power of creation and of dissolution, shining, the goddess of blessings, beyond all limits.",
  "सृष्टिशक्तिर्|the power of creation|sṛṣṭi · śakti; द्योतमाना|shining|dyotamānā; भूता|she who is|bhūtā; मङ्गलदेवता|goddess of blessings|maṅgala · devatā",
  "संहारशक्तिः|the power of dissolution|saṃhāra · śakti; प्रबला|mighty|prabalā; निरुपाधिः|without limiting conditions|nir · upādhi; परावरा|the high and the low|para · avarā",
  "The power of creation; shining; she who truly is; the goddess of blessings; the power of dissolution; mighty; beyond all limits; both the highest and the lowest.",
  "படைப்பின் சக்தி; ஒளிர்பவள்; உள்ளவள்; மங்கள தேவதை; அழிவின் சக்தி; வலிமையானவள்; உபாதியற்றவள்; உயர்வும் தாழ்வுமானவள்."),
 v("v62", "62", "Her many forms", "She who lifts and carries across, eternal, victorious in battle — the great Śrī, the Śrī of yoga.",
  "उत्तारिणी|who lifts out|uttāriṇī; तारयन्ती|who carries across|tārayantī; शाश्वती|eternal|śāśvatī; समितिञ्जया|victorious in battle|samitiṃ · jayā",
  "महाश्रीर्|the great Śrī|mahā · śrī; अजहत्कीर्तिर्|of unfading fame|ajahat · kīrti; योगश्रीः|the Śrī of yoga|yoga · śrī; सिद्धिसाधनी|means to success|siddhi · sādhanī",
  "She who lifts out; who carries across; eternal; victorious in battle; the great Śrī; of fame that never leaves; the Śrī of yoga; the means to success.",
  "கரையேற்றுபவள்; கடத்துபவள்; நிலையானவள்; போரில் வெல்பவள்; மகாஸ்ரீ; நீங்காத புகழுடையவள்; யோகஸ்ரீ; சித்தியின் சாதனம்.",
  {tip:"The <b>-śrī</b> chain starts: mahāśrī · yogaśrī (62), puṇyaśrī · brahmaśrī · rājaśrī · phalaśrī (63), devaśrī · vedaśrī (64)."}),
 v("v63", "63", "Her many forms", "Śrī of merit, of Brahman, of kings, of fruits — giver of heaven.",
  "पुण्यश्रीः|Śrī of merit|puṇya · śrī; पुण्यनिलया|home of merit|puṇya · nilayā; ब्रह्मश्रीर्|Śrī of Brahman (Vedic learning)|brahma · śrī; ब्राह्मणप्रिया|dear to brāhmaṇas|brāhmaṇa · priyā",
  "राजश्री|Śrī of kings|rāja · śrī; राजकलिता|held by kings|rāja · kalitā; फलश्रीः|Śrī of fruits (results)|phala · śrī; स्वर्गदायिनी|giver of heaven|svarga · dāyinī",
  "The Śrī of merit; home of merit; the Śrī of sacred learning; dear to brāhmaṇas; the Śrī of kings; embraced by kings; the Śrī of results; giver of heaven.",
  "புண்ணிய ஸ்ரீ; புண்ணியத்தின் இருப்பிடம்; பிரம்ம ஸ்ரீ; அந்தணர்களுக்குப் பிரியமானவள்; ராஜஸ்ரீ; அரசர்களால் பற்றப்படுபவள்; பலஸ்ரீ; சுவர்க்கம் தருபவள்."),
 v("v64", "64", "Her many forms", "Śrī of the gods, of wondrous stories, Śrī of the Vedas — dispeller of darkness, Lakṣmaṇā, dear to the heart.",
  "देवश्रीरद्भुतकथा|Śrī of the gods, of wondrous stories|deva · śrī · adbhuta · kathā; वेदश्रीः|Śrī of the Vedas|veda · śrī; श्रुतिमार्गिणी|who walks the Vedic path|śruti · mārgiṇī",
  "तमोपहाऽव्ययनिधिर्|dispeller of darkness, an unfailing treasure|tamas · apahā · avyaya · nidhi; लक्ष्मणा|Lakṣmaṇā (Kṛṣṇa's queen)|lakṣmaṇā; हृदयङ्गमा|dear to the heart|hṛdayaṃ · gamā",
  "The Śrī of the gods; of wondrous stories; the Śrī of the Vedas; who walks the Vedic path; dispeller of darkness; an unfailing treasure; Lakṣmaṇā; dear to the heart.",
  "தேவஸ்ரீ; அற்புதக் கதைகள் உடையவள்; வேதஸ்ரீ; வேத வழியில் நடப்பவள்; இருளைப் போக்குபவள்; அழியாத நிதி; லக்ஷ்மணா; இதயத்தைக் கவர்பவள்.",
  {tip:"<b>Lakṣmaṇā</b> begins the list of Kṛṣṇa's queens who are forms of Lakṣmī: Mitravindā (65), Satyabhāmā (66), Rukmiṇī (67)."}),
 v("v65", "65", "Her many forms", "She revives the dead, bright as moonlight, facing all ways — Mitravindā, Maithilī, lovely to see.",
  "मृतसञ्जीविनी|reviver of the dead|mṛta · sañjīvinī; शुभ्रा|bright white|śubhrā; चन्द्रिका|moonlight|candrikā; सर्वतोमुखी|facing all ways|sarvataḥ · mukhī",
  "सर्वोत्तमा|highest of all|sarva · uttamā; मित्रविन्दा|Mitravindā (Kṛṣṇa's queen)|mitravindā; मैथिली|Maithilī (Sītā)|maithilī; प्रियदर्शना|lovely to see|priya · darśanā",
  "Reviver of the dead; bright white; moonlight; facing every direction; highest of all; Mitravindā; Maithilī (Sītā); lovely to behold.",
  "இறந்தவரை உயிர்ப்பிப்பவள்; வெண்மையானவள்; நிலவொளி; எல்லாத் திசையும் நோக்குபவள்; எல்லாவற்றிலும் உயர்ந்தவள்; மித்ரவிந்தா; மைதிலி; காண இனியவள்."),
 v("v66", "66", "Her many forms", "Satyabhāmā, known by the Vedas, Sītā who nourishes those who bow — root of nature, the bright lamp.",
  "सत्यभामा|Satyabhāmā|satyabhāmā; वेदवेद्या|known through the Vedas|veda · vedyā; सीता|Sītā|sītā; प्रणतपोषिणी|who nourishes those who bow|praṇata · poṣiṇī",
  "मूलप्रकृतिरीशाना|primal nature, the ruler|mūla · prakṛti · īśānā; शिवदा|giver of good|śiva · dā; दीप्रदीपिनी|a blazing lamp|dīpra · dīpinī",
  "Satyabhāmā; known through the Vedas; Sītā; who nourishes those who bow to her; primal nature; the ruler; giver of good; a blazing lamp.",
  "சத்யபாமா; வேதங்களால் அறியப்படுபவள்; சீதை; வணங்குபவர்களைப் போஷிப்பவள்; மூலப் பிரகிருதி; ஈஸானா; நன்மை தருபவள்; ஒளிரும் விளக்கு."),
 v("v67", "67", "Her many forms", "Dear to all, free in action, Rukmiṇī, witness of all — womb of all truths.",
  "अभिप्रिया|dear to all|abhi · priyā; स्वैरवृत्ती|free in action|svaira · vṛttī; रुक्मिणी|Rukmiṇī|rukmiṇī; सर्वसाक्षिणी|witness of all|sarva · sākṣiṇī",
  "गान्धारिणी|Gāndhāriṇī|gāndhāriṇī; परगतिस्|the highest goal|para · gati; तत्त्वगर्भा|womb of the truths|tattva · garbhā; भवाभवा|birth and its ending|bhava · abhavā",
  "Dear to all; free in action; Rukmiṇī; witness of all; Gāndhāriṇī; the highest goal; womb of all truths; both birth and freedom from birth.",
  "எல்லோருக்கும் பிரியமானவள்; சுதந்திரமாகச் செயல்படுபவள்; ருக்மிணி; எல்லாவற்றுக்கும் சாட்சி; காந்தாரிணி; பரமகதி; தத்துவங்களின் கருப்பை; பிறப்பும் பிறப்பின் முடிவுமானவள்."),
 v("v68", "68", "Her many forms", "The inner dweller, the great seal, Viṣṇu-Durgā, mighty — bearer of the world, the remedy for all.",
  "अन्तर्वर्तिर्|the inner dweller|antar · varti; महामुद्रा|the great seal|mahā · mudrā; विष्णुदुर्गा|Viṣṇu's Durgā|viṣṇu · durgā; महाबला|of great strength|mahā · balā",
  "मदयन्ती|who gladdens|madayantī; लोकधारिण्यदृश्या|bearer of the world, unseen|loka · dhāriṇī · adṛśyā; सर्वनिष्कृतिः|atonement for all|sarva · niṣkṛti",
  "The inner dweller; the great seal; Viṣṇu-Durgā; of great strength; who gladdens; bearer of the world; unseen; the atonement for all.",
  "உள்ளுறைபவள்; மகாமுத்திரை; விஷ்ணு துர்க்கை; பெரும் வலிமையுடையவள்; மகிழ்விப்பவள்; உலகைத் தாங்குபவள்; காணப்படாதவள்; எல்லாவற்றுக்கும் பிராயச்சித்தம்.",
  {tip:"From here to verse 75: forms of <b>Durgā</b> — viṣṇu-durgā, mahā-durgā, kātyāyanī, kālarātri, bhadrakālī, vārāhī, nārasiṃhī."}),
 v("v69", "69", "Her many forms", "Devasenā, giver of the soul's fruit, the earth — streams of milk and ghee, the offering and its fee.",
  "देवसेनाऽऽत्मफलदा|Devasenā, giver of the soul's fruit|deva · senā · ātma · phala · dā; वसुधा|the earth|vasudhā; मुख्यमातृका|the chief mother|mukhya · mātṛkā",
  "क्षीरधारा|stream of milk|kṣīra · dhārā; घृतमयी|made of ghee|ghṛta · mayī; जुह्वती|who offers|juhvatī; यज्ञदक्षिणा|the sacrificial fee|yajña · dakṣiṇā",
  "Devasenā (army of the gods); giver of the soul's fruit; the earth; the chief mother; a stream of milk; made of ghee; the one who offers; the fee of the sacrifice.",
  "தேவசேனா; ஆத்ம பலன் தருபவள்; வசுதா (பூமி); முதன்மையான மாதா; பால் தாரை; நெய்மயமானவள்; ஹோமம் செய்பவள்; யாக தக்ஷிணை."),
 v("v70", "70", "Her many forms", "Yoga-sleep, delighting in yoga, hard to pass — lion-plumed Mahādurgā, Jayantī, rider of Garuḍa.",
  "योगनिद्रा|Yoganidrā, the Lord's yogic sleep|yoga · nidrā; योगरता|delighting in yoga|yoga · ratā; ब्रह्मचर्या|in celibate discipline|brahma · caryā; दुरत्यया|hard to pass beyond|duratyayā",
  "सिंहपिञ्छा|with a lion's crest|siṃha · piñchā; महादुर्गा|great Durgā|mahā · durgā; जयन्ती|victorious|jayantī; खगवाहिनी|riding Garuḍa|khaga · vāhinī",
  "Yoganidrā; delighting in yoga; in celibate discipline; hard to pass beyond; with a lion's crest; Mahādurgā; Jayantī the victorious; riding Garuḍa.",
  "யோகநித்ரா; யோகத்தில் ஈடுபட்டவள்; பிரம்மசரியம் உடையவள்; கடக்க முடியாதவள்; சிங்கக் கொண்டையுடையவள்; மகாதுர்க்கா; ஜயந்தி; கருட வாகனமுடையவள்."),
 v("v71", "71", "Her many forms", "Dear to the world, wide-eyed, golden, tormentor of the cruel — Kātyāyanī, Kālarātri, fearsome.",
  "जगत्प्रिया|dear to the world|jagat · priyā; विरूपाक्षी|with unusual eyes|virūpa · akṣī; सुवर्णा|golden|su · varṇā; क्रूरतापिनी|who torments the cruel|krūra · tāpinī",
  "कात्यायनी|Kātyāyanī|kātyāyanī; कालरात्रिर्|Kālarātri, the night of time|kāla · rātri; निशिदृष्टा|seen at night|niśi · dṛṣṭā; करालिका|terrifying|karālikā",
  "Dear to the world; with wondrous eyes; golden; tormentor of the cruel; Kātyāyanī; Kālarātri; seen at night; terrifying (to the wicked).",
  "உலகுக்குப் பிரியமானவள்; விரூபாக்ஷி; பொன்னிறத்தவள்; கொடியவர்களை வாட்டுபவள்; காத்யாயனி; காளராத்திரி; இரவில் காணப்படுபவள்; பயங்கரமானவள்."),
 v("v72", "72", "Her many forms", "Trident and sword in hand, Mahākālī — the lone heroine, Bhadrakālī, with a gleaming mace.",
  "त्रिशूलिनी|bearing a trident|tri · śūlinī; खड्गधरा|holding a sword|khaḍga · dharā; महाकालीन्द्रमालिनी|Mahākālī, garlanded by Indra|mahā · kālī · indra · mālinī",
  "एकवीरा|the lone heroine|eka · vīrā; भद्रकाली|Bhadrakālī|bhadra · kālī; सौनन्दी|bearer of the Saunanda club|saunandī; उल्लसद्गदा|with a gleaming mace|ullasat · gadā",
  "Bearing a trident; holding a sword; Mahākālī; garlanded by Indra; the lone heroine; Bhadrakālī; bearer of the Saunanda club; with a gleaming mace.",
  "சூலம் ஏந்தியவள்; வாள் பிடித்தவள்; மகாகாளி; இந்திரனால் மாலையிடப்பட்டவள்; தனி வீராங்கனை; பத்ரகாளி; சௌனந்த தண்டம் உடையவள்; ஒளிரும் கதையுடையவள்."),
 v("v73", "73", "Her many forms", "Nārāyaṇī, who fills the world, the fertile earth, mother of Brahmā — of fierce valour.",
  "नारायणी|Nārāyaṇī|nārāyaṇī; जगत्पूरिण्युर्वरा|who fills the world, the fertile land|jagat · pūriṇī · urvarā; द्रुहिणप्रसूः|mother of Brahmā|druhiṇa = Brahmā · prasū",
  "यज्ञकामा|lover of sacrifice|yajña · kāmā; लेलिहाना|licking (with flames)|lelihānā; तीर्थकर्युग्रविक्रमा|maker of holy places, of fierce valour|tīrtha · karī · ugra · vikramā",
  "Nārāyaṇī; who fills the world; the fertile land; mother of Brahmā; lover of sacrifice; licking (like fire); maker of holy places; of fierce valour.",
  "நாராயணி; உலகை நிரப்புபவள்; வளமான பூமி; பிரம்மனின் தாய்; யாகத்தை விரும்புபவள்; தீ நாக்குகளால் நக்குபவள்; தீர்த்தங்களை உண்டாக்குபவள்; உக்ர பராக்கிரமமுடையவள்."),
 v("v74", "74", "Her many forms", "Rising on Garuḍa, very fierce, Vārāhī — trodden by horses, chariots, and by Viṣṇu's stride.",
  "गरुत्मदुदयाऽत्युग्रा|rising on Garuḍa, very fierce|garutmat · udayā · ati · ugrā; वाराही|Vārāhī|vārāhī; मातृभीषिणी|frightening even to the Mothers|mātṛ · bhīṣiṇī",
  "अश्वक्रान्ता|trodden by horses|aśva · krāntā; रथक्रान्ता|trodden by chariots|ratha · krāntā; विष्णुक्रान्तोरुचारिणी|trodden by Viṣṇu, roaming widely|viṣṇu · krāntā · uru · cāriṇī",
  "Rising on Garuḍa; very fierce; Vārāhī; frightening even to the Mothers; trodden by horses; trodden by chariots; trodden by Viṣṇu's stride; roaming far and wide.",
  "கருடன் மீது எழுபவள்; மிக உக்ரமானவள்; வாராஹி; மாதர்களுக்கும் அச்சம் தருபவள்; குதிரைகள் மிதிக்கும் (பூமி); தேர்கள் மிதிக்கும் (பூமி); விஷ்ணு அளந்த (பூமி); பரந்து சஞ்சரிப்பவள்.",
  {tip:"The <b>earth</b> mantra: <i>aśvakrānte rathakrānte viṣṇukrānte vasundhare</i> — said when touching the ground."}),
 v("v75", "75", "Her many forms", "Vairocanī, Nārasiṃhī, the rain cloud, of auspicious glance — power of the world, her own power, Sudarśanī.",
  "वैरोचनी|Vairocanī (radiant)|vairocanī; नारसिंही|Nārasiṃhī|nārasiṃhī; जीमूता|the rain cloud|jīmūtā; शुभदेक्षणा|whose glance gives good|śubha · dā · īkṣaṇā",
  "दीक्षाविधा|the rite of initiation|dīkṣā · vidhā; विश्वशक्तिर्|power of the universe|viśva · śakti; निजशक्तिः|her own power|nija · śakti; सुदर्शिनी|of fine appearance (Sudarśana's power)|su · darśinī",
  "Vairocanī; Nārasiṃhī; the rain cloud; whose glance gives good; the rite of initiation; the power of the universe; her own power; Sudarśanī.",
  "வைரோசனி; நாரசிம்ஹி; மழைமேகம்; மங்களப் பார்வையுடையவள்; தீக்ஷை விதி; உலக சக்தி; சுய சக்தி; சுதர்சினி."),
 v("v76", "76", "Wisdom and wealth", "Faith, the world, keeper of forests, destroyer of Kali — Ayodhyā, of unbroken line, great jewel.",
  "प्रतीतिर्|faith, certainty|pratīti; जगती|the world|jagatī; वन्यधारिणी|bearer of forests|vanya · dhāriṇī; कलिनाशिनी|destroyer of Kali|kali · nāśinī",
  "अयोध्याऽच्छिन्नसन्ताना|unconquerable (Ayodhyā), of unbroken line|ayodhyā · acchinna · santānā; महारत्ना|the great jewel|mahā · ratnā; सुखावहा|bringer of happiness|sukha · āvahā",
  "Faith; the world; bearer of forests; destroyer of Kali; Ayodhyā the unconquerable; of unbroken lineage; the great jewel; bringer of happiness.",
  "நம்பிக்கை; உலகம்; காடுகளைத் தாங்குபவள்; கலியை அழிப்பவள்; அயோத்யா (வெல்ல முடியாதவள்); அறுபடாத வம்சமுடையவள்; மகா ரத்னம்; சுகம் தருபவள்."),
 v("v77", "77", "Wisdom and wealth", "Royal, bright as the sun, teacher of conduct — pouring nectar, the boundary, womb of sacrifice.",
  "राजवर्त्यर्कप्रतिभा|on the royal road, bright as the sun|rāja · vartī · arka · pratibhā; विनयत्री|teacher of conduct|vinayatrī; महाशना|great eater (of offerings)|mahā · aśanā",
  "अमृतस्यन्दिनी|pouring nectar|amṛta · syandinī; सीमा|the boundary|sīmā; यज्ञगर्भा|womb of sacrifice|yajña · garbhā; समीक्षणा|who looks on all|samīkṣaṇā",
  "On the royal road; bright as the sun; teacher of good conduct; great receiver of offerings; pouring nectar; the boundary; womb of sacrifice; who looks on all equally.",
  "அரச வழியில் இருப்பவள்; சூரியன் போல் ஒளிர்பவள்; ஒழுக்கம் கற்பிப்பவள்; பெரும் ஹவிஸ் உண்பவள்; அமுதம் சுரப்பவள்; எல்லை; யாகத்தின் கருப்பை; சமமாக நோக்குபவள்."),
 v("v78", "78", "Wisdom and wealth", "Intention, the sound of Ṛk, Yajus and Sāman — drinker of Soma, Mādhavī, ever auspicious, worshipped on lotuses.",
  "आकूतिरृग्यजुस्सामघोषाऽऽरामवधूत्सुका|intention, the sound of Ṛk, Yajus, Sāman, eager (to roam) gardens|ākūti · ṛk · yajus · sāma · ghoṣā · ārāma · vadhū · utsukā",
  "सोमपा|drinker of Soma|soma · pā; माधवी|Mādhavī|mādhavī; नित्यकल्याणी|ever auspicious|nitya · kalyāṇī; कमलार्चिता|worshipped with lotuses|kamala · arcitā",
  "Intention; the chanting of Ṛk, Yajus and Sāman; eager to roam the gardens; drinker of Soma; Mādhavī; ever auspicious; worshipped with lotuses.",
  "சங்கல்பம்; ரிக், யஜுஸ், சாம கோஷம்; நந்தவனங்களில் ஆர்வமுடையவள்; சோமம் அருந்துபவள்; மாதவி; என்றும் மங்களமானவள்; தாமரைகளால் அர்ச்சிக்கப்படுபவள்."),
 v("v79", "79", "Wisdom and wealth", "Firm in yoga, fire-coloured, conqueror of demons — the knowledge of sacrifice, the secret knowledge, the knowledge of the Self.",
  "योगरूढिः|firm in yoga|yoga · rūḍhi; स्वार्थजुष्टा|loving her own (devotees)|sva · artha · juṣṭā; वह्निवर्णा|fire-coloured|vahni · varṇā; जितासुरा|conqueror of demons|jita · asurā",
  "यज्ञविद्या|knowledge of sacrifice|yajña · vidyā; गुह्यविद्याऽध्यात्मविद्या|the secret knowledge, the knowledge of the Self|guhya · vidyā · adhyātma · vidyā; कृतागमा|maker of the scriptures|kṛta · āgamā",
  "Firm in yoga; loving her own; fire-coloured; conqueror of demons; the knowledge of sacrifice; the secret knowledge; the knowledge of the Self; maker of the scriptures.",
  "யோகத்தில் நிலைத்தவள்; தன்னடியாரை விரும்புபவள்; அக்னி நிறத்தவள்; அசுரரை வென்றவள்; யக்ஞ வித்யை; குஹ்ய வித்யை; ஆத்ம வித்யை; ஆகமங்களை இயற்றியவள்.",
  {tip:"Three <b>vidyā</b> names: yajña-vidyā · guhya-vidyā · adhyātma-vidyā — the same list as in Śrī Sūkta's commentary."}),
 v("v80", "80", "Wisdom and wealth", "Who nourishes, beyond the arts, the good friend, giver of supreme devotion — the great Māyā, Amarāvatī.",
  "आप्यायिनी|who nourishes|āpyāyinī; कलातीता|beyond the parts|kalā · atītā; सुमित्रा|the good friend (Sumitrā)|su · mitrā; परभक्तिदा|giver of supreme devotion|para · bhakti · dā",
  "काङ्क्षमाणा|longing (for devotees)|kāṅkṣamāṇā; महामाया|the great Māyā|mahā · māyā; कोलकामाऽमरावती|beloved of the Boar, Amarāvatī|kola = boar · kāmā · amarāvatī = Indra's city",
  "Who nourishes; beyond all parts; the good friend; giver of supreme devotion; longing (for her devotees); the great Māyā; beloved of the Boar; Amarāvatī, city of the gods.",
  "போஷிப்பவள்; கலைகளுக்கு அப்பாற்பட்டவள்; சுமித்ரா; பரபக்தி தருபவள்; (பக்தரை) விரும்புபவள்; மகாமாயை; வராகனின் பிரியை; அமராவதி."),
 v("v81", "81", "Wisdom and wealth", "Of great strength, remover of bad dreams — Devakī, goddess of the Vasus, lightning, slayer of demons.",
  "सुवीर्या|of great strength|su · vīryā; दुःस्वप्नहरा|remover of bad dreams|duḥsvapna · harā; देवकी|Devakī|devakī; वसुदेवता|goddess of the Vasus (of wealth)|vasu · devatā",
  "सौदामिनी|lightning|saudāminī; मेघरथा|riding the clouds|megha · rathā; ऋद्धिदा|giver of prosperity|ṛddhi · dā; दैत्यमर्दिनी|crusher of demons|daitya · mardinī",
  "Of great strength; remover of bad dreams; Devakī; goddess of wealth; lightning; riding the clouds; giver of prosperity; crusher of demons.",
  "பெரும் வீரியமுடையவள்; தீய கனவுகளைப் போக்குபவள்; தேவகி; வசு தேவதை; மின்னல்; மேகத்தைத் தேராக உடையவள்; செழிப்பு தருபவள்; அசுரர்களை அழிப்பவள்."),
 v("v82", "82", "Wisdom and wealth", "Bringer of the good, of wonderful play, alone — with jewelled sandals, Tulasī, healer of disease.",
  "श्रेयस्करी|bringer of the good|śreyas · karī; चित्रलीलैकायिनी|of wondrous play, the one goal|citra · līlā · ekāyinī; रत्नपादुका|with jewelled sandals|ratna · pādukā",
  "मनस्यमाना|thought of with love|manasyamānā; तुलसी|Tulasī|tulasī; रोगनाशिन्युरुप्रथा|destroyer of disease, of wide fame|roga · nāśinī · uru · prathā",
  "Bringer of the good; of wondrous play; the one goal; with jewelled sandals; held lovingly in the mind; Tulasī; destroyer of disease; of wide fame.",
  "நன்மை செய்பவள்; அதிசய லீலைகள் உடையவள்; ஒரே இலக்கு; ரத்னப் பாதுகை உடையவள்; மனத்தில் நினைக்கப்படுபவள்; துளசி; நோயை அழிப்பவள்; பெரும் புகழுடையவள்.",
  {tip:"<b>tulasī</b> — the holy basil, a form of Lakṣmī dear to Viṣṇu."}),
 v("v83", "83", "Wisdom and wealth", "Radiant, a gentle flame, a faint line, nectar-eating — devoted to Brahman, calmer of fire, beyond the guṇas.",
  "तेजस्विनी|radiant|tejasvinī; सुखोज्ज्वाला|a pleasant flame|sukha · ujjvālā; मन्दरेखाऽमृताशिनी|a faint line (crescent), eating nectar|manda · rekhā · amṛta · aśinī",
  "ब्रह्मिष्ठा|devoted to Brahman|brahmiṣṭhā; वह्निशमनी|calmer of fire|vahni · śamanī; जुषमाणा|loving|juṣamāṇā; गुणात्यया|beyond the guṇas|guṇa · atyayā",
  "Radiant; a pleasant flame; a faint crescent line; eater of nectar; established in Brahman; calmer of fire; loving; beyond the three guṇas.",
  "ஒளிமிக்கவள்; இனிய சுடர்; மெல்லிய (பிறை) ரேகை; அமுதம் உண்பவள்; பிரம்மத்தில் நிலைத்தவள்; தீயைத் தணிப்பவள்; அன்பு கொள்பவள்; முக்குணங்களுக்கு அப்பாற்பட்டவள்."),
 v("v84", "84", "Wisdom and wealth", "Kādambarī, devoted to Brahman, the creatress with shining hands — unshakeable, good everywhere, a friend.",
  "कादम्बरी|Kādambarī|kādambarī; ब्रह्मरता|devoted to Brahman|brahma · ratā; विधात्र्युज्ज्वलहस्तिका|the creatress, with shining hands|vidhātrī · ujjvala · hastikā",
  "अक्षोभ्या|unshakeable|akṣobhyā; सर्वतोभद्रा|good in every direction|sarvataḥ · bhadrā; वयस्या|a companion|vayasyā; स्वस्तिदक्षिणा|whose gift is well-being|svasti · dakṣiṇā",
  "Kādambarī; devoted to Brahman; the creatress; with shining hands; unshakeable; auspicious on every side; a dear companion; whose gift is well-being.",
  "காதம்பரி; பிரம்மத்தில் ஈடுபட்டவள்; படைப்பவள்; ஒளிரும் கைகள் உடையவள்; கலங்காதவள்; எல்லாப் பக்கமும் மங்களமானவள்; தோழி; நலத்தைத் தக்ஷிணையாகத் தருபவள்."),
 v("v85", "85", "Wisdom and wealth", "Thousand-faced, mother of knowledge, Vaiśvānarī — best in the inner path, free of envy, hard to approach.",
  "सहस्रास्या|thousand-faced|sahasra · āsyā; ज्ञानमाता|mother of knowledge|jñāna · mātā; वैश्वानर्यक्षवर्तिनी|Vaiśvānarī (fire), moving in the senses|vaiśvānarī · akṣa · vartinī",
  "प्रत्यग्वरा|best in the inward self|pratyak · varā; वारणवत्यनसूया|rich in elephants, free of envy|vāraṇa · vatī · anasūyā; दुरासदा|hard to approach|durāsadā",
  "Thousand-faced; mother of knowledge; Vaiśvānarī, the universal fire; moving in the senses; the best within; rich in elephants; free of envy (Anasūyā); hard to approach (for the wicked).",
  "ஆயிரம் முகமுடையவள்; ஞானத்தின் தாய்; வைஸ்வாநரி; புலன்களில் இயங்குபவள்; உள்ளே சிறந்தவள்; யானைகள் நிறைந்தவள்; பொறாமையற்றவள் (அனசூயா); அணுக முடியாதவள்."),
 v("v86", "86", "Wisdom and wealth", "Arundhatī, Kuṇḍalinī, destroyer of misfortune — conqueror of death, remover of fear, slayer of enemies.",
  "अरुन्धती|Arundhatī|arundhatī; कुण्डलिनी|Kuṇḍalinī|kuṇḍalinī; भव्या|noble|bhavyā; दुर्गतिनाशिनी|destroyer of misfortune|durgati · nāśinī",
  "मृत्युञ्जया|conqueror of death|mṛtyum · jayā; त्रासहरा|remover of fear|trāsa · harā; निर्भया|fearless|nirbhayā; शत्रुसूदिनी|slayer of enemies|śatru · sūdinī",
  "Arundhatī; Kuṇḍalinī; noble; destroyer of misfortune; conqueror of death; remover of terror; fearless; slayer of enemies.",
  "அருந்ததி; குண்டலினி; மேன்மையானவள்; துர்க்கதியை அழிப்பவள்; மரணத்தை வென்றவள்; அச்சத்தைப் போக்குபவள்; பயமற்றவள்; பகைவரை அழிப்பவள்."),
 v("v87", "87", "Wisdom and wealth", "The one syllable, the good wife, on the side of the gods — shining forth at once, Pradyumnā, burden-bearer.",
  "एकाक्षरा|the single syllable|eka · akṣarā; सुपुरन्ध्री|the good housewife|su · purandhrī; सुरपक्षा|on the side of the gods|sura · pakṣā; वरातुला|incomparably excellent|varā · atulā",
  "सकृद्विभासा|shining forth at once|sakṛt · vibhāsā; प्रद्युम्ना|Pradyumnā (of great splendour)|pradyumnā; हरिभद्रा|Hari's blessing|hari · bhadrā; धुरन्धरा|bearer of the burden|dhuraṃ · dharā",
  "The one syllable (śrīṃ); the good wife; on the side of the gods; excellent beyond compare; shining forth at once; Pradyumnā; Hari's blessing; bearer of the world's burden.",
  "ஏகாக்ஷரம்; நல்ல இல்லத்தரசி; தேவர்கள் பக்கம் இருப்பவள்; ஒப்பற்ற சிறப்புடையவள்; ஒரே நொடியில் ஒளிர்பவள்; பிரத்யும்னா; ஹரியின் மங்களம்; பாரம் சுமப்பவள்."),
 v("v88", "88", "Wisdom and wealth", "Fond of bilva, the earth, heart of the discus — soul of every mantra, lightning, Yaśodā, delighter of all.",
  "बिल्वप्रियाऽवनी|fond of bilva leaves, the earth|bilva · priyā · avanī; चक्रहृदया|heart of the discus|cakra · hṛdayā; कम्बुतीर्थगा|at the conch's holy ford|kambu · tīrtha · gā",
  "सर्वमन्त्रात्मिका|soul of every mantra|sarva · mantra · ātmikā; विद्युद्|lightning|vidyut; यशोदा|Yaśodā, giver of fame|yaśas · dā; सर्वरञ्जिनी|delighter of all|sarva · rañjinī",
  "Fond of bilva; the earth; heart of the discus; at the holy ford of the conch; soul of every mantra; lightning; Yaśodā, giver of fame; delighter of all.",
  "வில்வத்தை விரும்புபவள்; பூமி; சக்கரத்தின் இதயம்; சங்கு தீர்த்தத்தில் இருப்பவள்; எல்லா மந்திரங்களின் ஆத்மா; மின்னல்; யசோதா (புகழ் தருபவள்); எல்லோரையும் மகிழ்விப்பவள்.",
  {tip:"<b>bilva-priyā</b> — Śrī Sūkta: “tava vṛkṣo'tha bilvaḥ”, the bilva tree was born of her penance."}),
 v("v89", "89", "Wisdom and wealth", "Resting on banner and umbrella, Bhūmi, Vaiṣṇavī, bright with virtue — known to the world, mother of desire.",
  "ध्वजच्छत्राश्रया|resting on banner and umbrella|dhvaja · chatra · āśrayā; भूमिर्|Bhūmi, the earth|bhūmi; वैष्णवी|Vaiṣṇavī|vaiṣṇavī; सद्गुणोज्ज्वला|bright with good qualities|sat · guṇa · ujjvalā",
  "सुषेणा|with a fine army|su · ṣeṇā; लोकविदिता|known to the world|loka · viditā; कामसूर्|mother of Kāma|kāma · sū; जगदादिभूः|first source of the world|jagat · ādi · bhū",
  "Resting on royal banner and umbrella; Bhūmi; Vaiṣṇavī; bright with good qualities; with a fine army; known to the world; mother of Kāma; the first source of the world.",
  "கொடி, குடைகளில் இருப்பவள்; பூமி; வைஷ்ணவி; நற்குணங்களால் ஒளிர்பவள்; சிறந்த சேனையுடையவள்; உலகம் அறிந்தவள்; காமனின் தாய்; உலகின் ஆதி மூலம்."),
 v("v90", "90", "Wisdom and wealth", "Source of Vedānta, the wish to know, wisdom, seeing all alike — of a thousand powers, firm, treasure of good.",
  "वेदान्तयोनिर्|source of Vedānta|vedānta · yoni; जिज्ञासा|the wish to know|jijñāsā; मनीषा|wisdom|manīṣā; समदर्शिनी|seeing all alike|sama · darśinī",
  "सहस्रशक्तिरावृत्तिः|of a thousand powers, the returning cycle|sahasra · śakti · āvṛtti; सुस्थिरा|very firm|su · sthirā; श्रेयसां|of all goods|śreyas; निधिः|the treasure|nidhi",
  "Source of Vedānta; the wish to know (Brahman); wisdom; seeing all alike; of a thousand powers; the returning cycle; very firm; the treasure of all goods.",
  "வேதாந்தத்தின் மூலம்; அறியும் ஆவல்; ஞானம்; எல்லோரையும் சமமாக நோக்குபவள்; ஆயிரம் சக்திகள் உடையவள்; சுழற்சி; மிக நிலையானவள்; நன்மைகளின் நிதி."),
 v("v91", "91", "Wisdom and wealth", "Rohiṇī, Revatī, the moon's sister, delighting in good — the noble one, fond of milk, sustainer of the universe.",
  "रोहिणी|Rohiṇī (a star)|rohiṇī; रेवती|Revatī (a star)|revatī; चन्द्रसोदरी|sister of the moon|candra · sodarī; भद्रमोदिनी|delighting in good|bhadra · modinī",
  "आर्या|the noble one|āryā; गव्यप्रिया|fond of cow's milk|gavya · priyā; विश्वभाविनी|sustainer of the universe|viśva · bhāvinī; सुविभाविनी|who makes all flourish|su · vibhāvinī",
  "Rohiṇī; Revatī; sister of the moon; delighting in good; the noble one; fond of milk and ghee; sustainer of the universe; who makes all flourish.",
  "ரோஹிணி; ரேவதி; சந்திரனின் சகோதரி; நன்மையில் மகிழ்பவள்; ஆர்யா; பசுப் பொருட்களை விரும்புபவள்; உலகைப் பேணுபவள்; நன்கு செழிக்கச் செய்பவள்."),
 v("v92", "92", "Wisdom and wealth", "Lovely to see, moving at will, ever alert — Mokṣalakṣmī, womb of the world, Vyomalakṣmī, very rare.",
  "सुप्रदृश्या|lovely to see|su · pradṛśyā; कामचारिण्यप्रमत्ता|moving at will, ever alert|kāma · cāriṇī · apramattā; ललन्तिका|playful|lalantikā",
  "मोक्षलक्ष्मीर्|Lakṣmī of liberation|mokṣa · lakṣmī; जगद्योनिर्|womb of the world|jagat · yoni; व्योमलक्ष्मीः|Lakṣmī of the sky|vyoma · lakṣmī; सुदुर्लभा|very rare to reach|su · durlabhā",
  "Lovely to see; moving at will; ever alert; playful; Mokṣalakṣmī; womb of the world; Vyomalakṣmī (of the supreme sky); very rare to attain.",
  "காண இனியவள்; விரும்பியபடி சஞ்சரிப்பவள்; கவனமுடையவள்; விளையாட்டு மிக்கவள்; மோக்ஷலக்ஷ்மி; உலகின் கருப்பை; வ்யோமலக்ஷ்மி; அடைதற்கரியவள்."),
 v("v93", "93", "Wisdom and wealth", "Sun-like, in holy homes, charming, giver of glory — mistress of the world, Acyuta's own, abundant, the world's form.",
  "भास्करी|sun-like|bhāskarī; पुण्यगेहस्था|dwelling in holy homes|puṇya · geha · sthā; मनोज्ञा|charming|manojñā; विभवप्रदा|giver of glory|vibhava · pradā",
  "लोकस्वामिन्यच्युतार्था|mistress of the world, whose wealth is Acyuta|loka · svāminī · acyuta · arthā; पुष्कला|abundant|puṣkalā; जगदाकृतिः|whose form is the world|jagat · ākṛti",
  "Sun-like; dwelling in holy homes; charming; giver of glory; mistress of the world; whose only wealth is Acyuta; abundant; whose form is the world.",
  "சூரியன் போன்றவள்; புண்ணிய இல்லங்களில் வசிப்பவள்; மனம் கவர்பவள்; செல்வம் தருபவள்; உலகின் தலைவி; அச்யுதனையே செல்வமாகக் கொண்டவள்; நிறைவானவள்; உலகமே வடிவானவள்."),
 v("v94", "94", "Wisdom and wealth", "Wearing wondrous garlands, beloved, purifying, sustaining beings — life itself, giver of life, dwelling in the whole cosmos.",
  "विचित्रहारिणी|wearing wondrous necklaces|vicitra · hāriṇī; कान्ता|the beloved|kāntā; पाविनी|purifying|pāvinī; भूतभाविनी|sustainer of beings|bhūta · bhāvinī",
  "प्राणिनी|life itself|prāṇinī; प्राणदा|giver of life|prāṇa · dā; विद्वद्विश्वब्रह्माण्डवासिनी|dwelling in the wise and in the whole cosmic egg|vidvat · viśva · brahmāṇḍa · vāsinī",
  "Wearing wondrous necklaces; the beloved; purifying; sustainer of beings; life itself; giver of life; dwelling in the wise and in the whole cosmos.",
  "அதிசய மாலைகள் அணிந்தவள்; பிரியமானவள்; தூய்மையாக்குபவள்; உயிர்களைப் பேணுபவள்; உயிரானவள்; உயிர் தருபவள்; அறிஞர்களிடமும் முழு பிரபஞ்சத்திலும் வசிப்பவள்."),
 v("v95", "95", "Wisdom and wealth", "Complete, full of zeal, Śrī's own mistress, the Veda — resorting and resorted to, patient earth, of every form.",
  "सम्पूर्णा|complete|sampūrṇā; परमोत्साहा|of supreme zeal|parama · utsāhā; श्रीपतिः|mistress of Śrī|śrī · pati; श्रीमतिः|glorious|śrī · mati; श्रुतिः|the Veda|śruti",
  "श्रयन्ती|who resorts (to the Lord)|śrayantī; श्रयमाणा|resorted to (by all)|śrayamāṇā; क्ष्मा|the patient earth|kṣmā; विश्वरूपा|of every form|viśva · rūpā; प्रसादिनी|gracious|prasādinī",
  "Complete; of supreme zeal; mistress of Śrī; glorious; the Veda; she who resorts to the Lord; she to whom all resort; the patient earth; of every form; gracious.",
  "நிறைவானவள்; பெரும் உற்சாகமுடையவள்; ஸ்ரீபதி; ஸ்ரீமதி; சுருதி; பகவானைச் சார்பவள்; எல்லோரும் சார்பவள்; பொறுமையான பூமி; எல்லா வடிவமும் உடையவள்; அருள்பவள்.",
  {tip:"<b>śrayantī · śrayamāṇā</b> — the meaning of the name Śrī: she who goes to the Lord, and to whom all go."}),
 v("v96", "96", "Wisdom and wealth", "Joy-giver, the first, all, vast, raining wishes — of lovely form, many-hued, the cessation, the supreme.",
  "हर्षणी|giver of joy|harṣaṇī; प्रथमा|the first|prathamā; सर्वा|all|sarvā; विशाला|vast|viśālā; कामवर्षिणी|raining wishes|kāma · varṣiṇī",
  "सुप्रतीका|of lovely form|su · pratīkā; पृश्निमतीर्|many-hued (like Pṛśni)|pṛśni · matī; निवृत्तिर्|cessation (rest)|nivṛtti; विविधा|manifold|vividhā; परा|the supreme|parā",
  "Giver of joy; the first; all; vast; raining down wishes; of lovely form; many-hued; cessation and rest; manifold; the supreme.",
  "மகிழ்ச்சி தருபவள்; முதல்வள்; எல்லாமானவள்; பரந்தவள்; விருப்பங்களைப் பொழிபவள்; அழகிய வடிவினள்; பல நிறத்தவள்; ஓய்வு; பலவிதமானவள்; பரா."),
 v("v97", "97", "Wisdom and wealth", "Of good sacrifice, sweet, giver of Śrī, gift of the gods, great-minded — gross, all-shaped, subtle, dispelling darkness.",
  "सुयज्ञा|of good sacrifice|su · yajñā; मधुरा|sweet|madhurā; श्रीदा|giver of Śrī|śrī · dā; देवरातिर्|gift of the gods|deva · rāti; महामनाः|great-minded|mahā · manas",
  "स्थूला|gross (visible)|sthūlā; सर्वाकृतिः|of all shapes|sarva · ākṛti; सूक्ष्मा|subtle|sūkṣmā; निम्नगव्या|(meaning uncertain)|nimna · gavyā; तमोनुदा|dispeller of darkness|tamas · nudā",
  "Of good sacrifice; sweet; giver of Śrī; gift of the gods; great-minded; gross; of every shape; subtle; (nimnagavyā); dispeller of darkness.",
  "நல்ல யாகமுடையவள்; இனியவள்; ஸ்ரீ தருபவள்; தேவர்களின் கொடை; பெரும் மனமுடையவள்; ஸ்தூலமானவள்; எல்லா வடிவமும் உடையவள்; சூக்ஷ்மமானவள்; (நிம்னகவ்யா); இருளைப் போக்குபவள்."),
 v("v98", "98", "Wisdom and wealth", "Contentment, queen of speech, nourishment, first of all — the power of sound, the excellent, Umā.",
  "तुष्टिर्|contentment|tuṣṭi; वागीश्वरी|queen of speech|vāk · īśvarī; पुष्टिः|nourishment|puṣṭi; सर्वाद्या|first of all|sarva · ādyā; स्वरुशोषिणी|(meaning uncertain)|svaru · śoṣiṇī",
  "शक्त्यात्मिका|of the nature of power|śakti · ātmikā; शब्दशक्तिर्|the power of sound|śabda · śakti; विशिष्टा|excellent|viśiṣṭā; वायुमत्युमा|with the wind (as breath), Umā|vāyu · matī · umā",
  "Contentment; queen of speech; nourishment; first of all; (svaruśoṣiṇī); of the nature of power; the power of sound; excellent; full of breath; Umā.",
  "திருப்தி; வாகீஸ்வரி; புஷ்டி; எல்லாவற்றுக்கும் முதல்வள்; (ஸ்வருசோஷிணி); சக்தி வடிவினள்; சப்த சக்தி; சிறந்தவள்; வாயுமதி; உமா.",
  {tip:"Her copy reads <i>sarvādyās varuśoṣiṇī</i> — the second name's meaning is uncertain."}),
 v("v99", "99", "Wisdom and wealth", "The four sciences — logic, the Vedas, economics, polity — the ruler, Saṅkarṣaṇī, unconquered great Goddess.",
  "आन्वीक्षिकी|logic and philosophy|ānvīkṣikī; त्रयी|the three Vedas|trayī; वार्ता|economics, livelihood|vārtā; दण्डनीतिर्|the science of governance|daṇḍa · nīti; नियामिका|the ruler|niyāmikā",
  "व्याली|serpent-like|vyālī; सङ्कर्षणी|Saṅkarṣaṇī|saṅkarṣaṇī; द्योता|shining|dyotā; महादेव्यपराजिता|the great Goddess, unconquered|mahā · devī · aparājitā",
  "Ānvīkṣikī (logic); Trayī (the Vedas); Vārtā (livelihood); Daṇḍanīti (polity); the ruler; serpent-like; Saṅkarṣaṇī; shining; the great Goddess; unconquered.",
  "ஆன்வீக்ஷிகி (தர்க்கம்); த்ரயீ (வேதம்); வார்த்தா (பொருளியல்); தண்டநீதி (அரசியல்); நியமிப்பவள்; நாகம் போன்றவள்; சங்கர்ஷணி; ஒளிர்பவள்; மகாதேவி; வெல்லப்படாதவள்.",
  {tip:"The <b>four sciences</b> of the ancient world, in order: <b>ānvīkṣikī · trayī · vārtā · daṇḍanīti</b>."}),
 v("v100", "100", "Wisdom and wealth", "Tawny, golden-brown, at ease, the crane — Ghoṣa's daughter, unconquered, patience itself, seated on Garuḍa.",
  "कपिला|tawny|kapilā; पिङ्गला|golden-brown|piṅgalā; स्वस्था|at ease in herself|svasthā; बलाकी|like a crane|balākī; घोषनन्दिनी|joy of the cowherd village|ghoṣa · nandinī",
  "अजिता|unconquered|ajitā; कर्षणी|who draws (all)|karṣaṇī; क्षान्तिर्|patience|kṣānti; गरुडा|Garuḍā|garuḍā; गरुडासना|seated on Garuḍa|garuḍa · āsanā",
  "Tawny; golden-brown; at ease in herself; like a white crane; the joy of the cowherd village; unconquered; who draws all to her; patience; Garuḍā; seated on Garuḍa.",
  "கபில நிறத்தவள்; பொன்-பழுப்பு நிறத்தவள்; தன்னில் நிலைத்தவள்; கொக்கு போன்றவள்; ஆயர்பாடியின் மகிழ்ச்சி; வெல்லப்படாதவள்; ஈர்ப்பவள்; பொறுமை; கருடா; கருடன் மீது அமர்ந்தவள்."),
 v("v101", "101", "All of nature", "Joy-giver, grace, eternal, Brahma-vidyā, golden — the earth, knower of purity, a garland of rays.",
  "ह्लादिन्यनुग्रहा|giver of joy, grace itself|hlādinī · anugrahā; नित्या|eternal|nityā; ब्रह्मविद्या|knowledge of Brahman|brahma · vidyā; हिरण्मयी|golden|hiraṇmayī",
  "मही|the earth|mahī; शुद्धविदा|knower of purity|śuddha · vidā; पृथ्वी|Pṛthvī|pṛthvī; शतानन्दांशुमालिनी|of a hundred joys, garlanded with rays|śata · ānandā · aṃśu · mālinī",
  "Giver of joy; grace itself; eternal; the knowledge of Brahman; golden; the earth (Mahī); knower of the pure; Pṛthvī; of a hundred joys; garlanded with rays.",
  "ஆனந்தம் தருபவள்; அனுக்ரஹம்; நித்யமானவள்; பிரம்ம வித்யை; பொன்மயமானவள்; மஹீ (பூமி); தூய்மை அறிந்தவள்; பிருத்வி; நூறு ஆனந்தங்கள் உடையவள்; கதிர் மாலை அணிந்தவள்."),
 v("v102", "102", "All of nature", "Refuge of sacrifice, beyond fame, praised, in all three times — awakener, full of sound, victory, rays, the digit of the moon.",
  "यज्ञाश्रया|refuge of sacrifice|yajña · āśrayā; ख्यातिपरा|beyond fame|khyāti · parā; स्तव्या|to be praised|stavyā; घृष्टिस्|the Boar's power (ghṛṣṭi = boar)|ghṛṣṭi; त्रिकालगा|present in all three times|tri · kāla · gā",
  "सम्बोधिनी|the awakener|sambodhinī; शब्दपूर्णा|full of sound|śabda · pūrṇā; विजयांशुमती|victory, full of rays|vijayā · aṃśumatī; कला|the digit (of the moon)|kalā",
