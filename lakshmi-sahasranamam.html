  "Refuge of sacrifice; beyond fame; to be praised; the Boar's power; present in past, present and future; the awakener; full of sound; victory; full of rays; the digit of the moon.",
  "யாகத்தின் ஆதாரம்; புகழுக்கு அப்பாற்பட்டவள்; துதிக்கத்தக்கவள்; வராக சக்தி; முக்காலமும் உள்ளவள்; எழுப்புபவள்; ஒலி நிறைந்தவள்; விஜயா; கதிர்கள் உடையவள்; கலை."),
 v("v103", "103", "All of nature", "Śivā, fond of praise, fame, life-giving, Punarvasu — initiation, remover of devotees' pain, protection, the test.",
  "शिवा|the auspicious|śivā; स्तुतिप्रिया|fond of praise|stuti · priyā; ख्यातिर्|fame|khyāti; जीवयन्ती|giving life|jīvayantī; पुनर्वसुः|Punarvasu (a star)|punar · vasu",
  "दीक्षा|initiation|dīkṣā; भक्तार्तिहा|remover of devotees' pain|bhakta · ārti · hā; रक्षा|protection|rakṣā; परीक्षा|the test|parīkṣā; यज्ञसम्भवा|born of sacrifice|yajña · sambhavā",
  "Śivā; fond of praise; fame; giving life; Punarvasu; initiation; remover of devotees' pain; protection; the test; born of sacrifice.",
  "சிவா; துதியை விரும்புபவள்; புகழ்; உயிர் தருபவள்; புனர்வசு; தீக்ஷை; பக்தர் துயர் தீர்ப்பவள்; ரக்ஷை; பரீக்ஷை; யாகத்தில் தோன்றியவள்."),
 v("v104", "104", "All of nature", "Moist, a lotus pond, holy, breaker of poverty — blessed, honoured, lotus-rimmed Bhārgavī, who grows the family.",
  "आर्द्रा|moist (with compassion)|ārdrā; पुष्करिणी|a lotus pond|puṣkariṇī; पुण्या|holy|puṇyā; गण्या|to be counted (honoured)|gaṇyā; दारिद्र्यभञ्जिनी|breaker of poverty|dāridrya · bhañjinī",
  "धन्या|blessed|dhanyā; मान्या|honoured|mānyā; पद्मनेमी|with a rim of lotuses|padma · nemī; भार्गवी|Bhārgavī|bhārgavī; वंशवर्धिनी|who makes the family grow|vaṃśa · vardhinī",
  "Moist with compassion; a lotus pond; holy; honoured; breaker of poverty; blessed; respected; rimmed with lotuses; Bhārgavī; who makes the family grow.",
  "கருணையால் நனைந்தவள்; தாமரைக் குளம்; புனிதமானவள்; மதிக்கத்தக்கவள்; வறுமையை உடைப்பவள்; பாக்கியவதி; போற்றத்தக்கவள்; தாமரை விளிம்புடையவள்; பார்கவி; வம்சத்தை வளர்ப்பவள்.",
  {tip:"<b>ārdrā · puṣkariṇī</b> — Śrī Sūkta again: <i>ārdrāṃ puṣkariṇīṃ puṣṭim</i>."}),
 v("v105", "105", "All of nature", "Swift in action, of good fame, served by treasures, destroyer of sin — the sure one, Vanamālā, Vasundharā.",
  "तीक्ष्णप्रवृत्तिः|swift in action|tīkṣṇa · pravṛtti; सत्कीर्तिर्|of good fame|sat · kīrti; निधिसेव्याऽघनाशिनी|served by the treasures, destroyer of sin|nidhi · sevyā · agha · nāśinī",
  "सञ्ज्ञा|awareness (Saṃjñā)|sañjñā; निस्संशया|beyond doubt|nis · saṃśayā; पूर्वा|the first|pūrvā; वनमाला|the forest garland|vana · mālā; वसुन्धरा|bearer of wealth (earth)|vasu · dharā",
  "Swift in action; of good fame; served by the treasures; destroyer of sin; awareness; beyond doubt; the first; the forest garland (Vanamālā); Vasundharā.",
  "விரைந்து செயல்படுபவள்; நற்புகழுடையவள்; நிதிகளால் சேவிக்கப்படுபவள்; பாவத்தை அழிப்பவள்; சம்ஜ்ஞா; ஐயமற்றவள்; முதல்வள்; வனமாலை; வசுந்தரா."),
 v("v106", "106", "All of nature", "Pṛthvī, mighty, Ahalyā, giver of honour — all, ever risen, generous, unfolding, great in rising.",
  "पृथ्वी|the earth|pṛthvī; महोत्कटाऽहल्या|mighty, Ahalyā (unploughed)|mahā · utkaṭā · ahalyā; मण्डलाश्रितमानदा|giver of honour to the realm|maṇḍala · āśrita · māna · dā",
  "सर्वा|all|sarvā; नित्योदितोदारा|ever risen, generous|nitya · uditā · udārā; जृम्भमाणा|unfolding|jṛmbhamāṇā; महोदया|of great rising|mahā · udayā",
  "Pṛthvī; mighty; Ahalyā; giver of honour to those in her realm; all; ever risen; generous; unfolding; of great rising.",
  "பிருத்வி; பெரும் வலிமையுடையவள்; அகல்யா; தன்னைச் சார்ந்த மண்டலத்துக்கு மதிப்பு தருபவள்; எல்லாமானவள்; என்றும் உதித்தவள்; வள்ளல்; மலர்பவள்; மகா உதயம்."),
 v("v107", "107", "All of nature", "Rising like the moonstone, the sun, four-cornered, swift as mind — child, maiden, young woman, compassion, loving her devotees.",
  "चन्द्रकान्तोदिता|risen like the moonstone|candra · kānta · uditā; सूर्या|the sun|sūryā; चतुरश्रा|four-cornered (perfect)|catur · aśrā; मनोजवा|swift as mind|manas · javā",
  "बाला|the child|bālā; कुमारी|the maiden|kumārī; युवती|the young woman|yuvatī; करुणा|compassion|karuṇā; भक्तवत्सला|loving her devotees|bhakta · vatsalā",
  "Risen like the moonstone; the sun; perfect in shape; swift as mind; the child; the maiden; the young woman; compassion; loving to her devotees.",
  "சந்திரகாந்தக் கல் போல் உதித்தவள்; சூரியா; நான்கு மூலை (முழுமையானவள்); மனோவேகமுடையவள்; பாலா; குமாரி; யுவதி; கருணை; பக்தவத்ஸலை.",
  {tip:"Three ages in a row: <b>bālā · kumārī · yuvatī</b> — child, maiden, young woman."}),
 v("v108", "108", "All of nature", "Medinī, joined with the Upaniṣads, queen of flowers and plants — hard to bear, of good conduct, wisdom, beauty, Suvarcalā.",
  "मेदिन्युपनिषन्मिश्रा|the earth, joined with the Upaniṣads|medinī · upaniṣat · miśrā; सुमवीरुद्धनेश्वरी|queen of the wealth of flowers and plants|suma · vīrudh · dhana · īśvarī",
  "दुर्मर्षणी|unbearable (to enemies)|durmarṣaṇī; सुचरिता|of good conduct|su · caritā; बोधा|awakening|bodhā; शोभा|beauty|śobhā; सुवर्चला|Suvarcalā, of great lustre|su · varcalā",
  "Medinī, the earth; joined with the Upaniṣads; queen of the wealth of flowers and plants; unbearable to enemies; of good conduct; awakening; beauty; Suvarcalā.",
  "மேதினி (பூமி); உபநிஷத்துகளுடன் இணைந்தவள்; மலர், கொடிகள் எனும் செல்வத்தின் ஈஸ்வரி; பகைவரால் தாங்க முடியாதவள்; நல்லொழுக்கமுடையவள்; போதம்; அழகு; சுவர்ச்சலா.",
  {tip:"Her copy reads <i>sumavīrurdhaneśvarī</i>; written here <i>sumavīruddhaneśvarī</i> (vīrudh = plant)."}),
 v("v109", "109", "All of nature", "Yamunā, the great army, Gaṅgā, Mandākinī — Godā, Godāvarī, Candrabhāgā, Kāverī, the ocean.",
  "यमुनाऽक्षौहिणी|Yamunā, the great army|yamunā · akṣauhiṇī; गङ्गा|Gaṅgā|gaṅgā; मन्दाकिन्यमलाशया|Mandākinī, pure-hearted|mandākinī · amala · āśayā",
  "गोदा|Godā (Āṇḍāl)|godā; गोदावरी|Godāvarī|godāvarī; चन्द्रभागा|Candrabhāgā|candrabhāgā; कावेर्युदन्वती|Kāverī, the ocean|kāverī · udanvatī",
  "Yamunā; the great army; Gaṅgā; Mandākinī; pure-hearted; Godā; Godāvarī; Candrabhāgā; Kāverī; the ocean.",
  "யமுனா; அக்ஷௌஹிணி; கங்கா; மந்தாகினி; தூய உள்ளமுடையவள்; கோதா; கோதாவரி; சந்திரபாகா; காவேரி; கடல்.",
  {tip:"The <b>rivers</b> verse: yamunā · gaṅgā · mandākinī · godāvarī · candrabhāgā · kāverī — and <b>Godā</b>, Āṇḍāl herself!"}),
 v("v110", "110", "All of nature", "Sinīvālī, Kuhū, Rākā — the moon's days — Vāraṇā, Sindhumatī, Amā; fulfilment, Māyā, inspiration.",

 v("v111", "111", "All of nature", "Growth, stability, firmness, intellect, the three guṇas — unfailing, giver of peace, truth, wisdom, Śivā.",

  "Prakṛti; the passionate lady; the ever-moving (fickle) one; Kamalā; the wish-cow; destiny; wisdom; delight; supreme; twilight; Subhadrā; all-auspicious.",

 v("v113", "113", "All of nature", "Nandā, Bhadrā, Jayā, Riktā, Pūrṇā — the five lunar days; Ṛtambharā, direction, Kāmeśvarī, memory.",

  "काष्ठा|direction, the goal|kāṣṭhā; कामेश्वरी|queen of desire|kāma · īśvarī; निष्ठा|steadfastness|niṣṭhā; काम्या|desirable|kāmyā; रम्या|lovely|ramyā; धरा|the earth|dharā; स्मृतिः|memory|smṛti",
  "Nandā; Bhadrā; Jayā; Riktā; Pūrṇā — the five kinds of lunar day; bearer of truth; the goal; queen of desire; steadfastness; desirable; lovely; the earth; memory.",

  {tip:"The <b>five tithi groups</b> in order: <b>nandā · bhadrā · jayā · riktā · pūrṇā</b> — the same order used in a pañcāṅgam."}),
 v("v114", "114", "All of nature", "Conch-bearer, discus-bearer, dark, even, the family, Ramā, light — peace, praise, success, stainless, radiant, unchanging.",

  "शान्तिदा|giver of peace|śānti · dā; स्तुतिः|praise|stuti; सिद्धिश्च|and success|siddhi · ca; विरजाऽत्युज्ज्वलाऽव्यया|stainless, very bright, unchanging|virajā · ati · ujjvalā · avyayā",
  "Conch-bearer; discus-bearer; dark; even-minded; the earth; Ramā; light; giver of peace; praise; success; stainless (Virajā); very bright; unchanging.",

 v("v115", "115", "All of nature", "Vāṇī, Gaurī, Indirā, Lakṣmī, Medhā, Śraddhā, light — Svadhā, Svāhā, Rati, Uṣā, Vasu, Vidyā, Dhṛti, Sabhā.",

 v("v116", "116", "All of nature", "Cultured, beloved, pure, the nurse — a stream of nectar, the earth, unborn, immortal; Śāradā, the mother, first, of sacred letters.",

  "रमण्येका|the one beloved|ramaṇī · ekā; शारदाम्बा|Śāradā, the mother|śāradā · ambā; समेधाऽऽद्या|wise, the first|sa · medhā · ādyā; शुभाक्षरा|of auspicious letters|śubha · akṣarā",
  "Cultured; beloved; pure; the nurse; a stream of nectar; the earth; unborn; immortal; the one beloved; Śāradā the mother; wise; the first; of auspicious syllables.",

 v("v117", "117", "All of nature", "A string of jewels, Bhāratī, Iḍā, steady-minded, the only one, giver of the Self — purity, smiling, Rādhā, born of nectar.",

  "या|she who|yā; सा|is|sā; शुद्धिः|purity|śuddhi; सस्मिता|smiling|sa · smitā (her copy: sosmitā); कानीला|the blissful, dark one|kā · nīlā; राधाऽमृतोद्भवा|Rādhā, born of nectar|rādhā · amṛta · udbhavā",
  "A string of jewels; Bhāratī; Iḍā; steady-minded; the only one; giver of the Self; she who is purity; smiling; dark and blissful; Rādhā; born of the nectar ocean.",

 v("v118", "118", "All of nature", "Glory, without parts, lovely, protection, spotless, patience — attainment, of spring, the line, of many seeds, with great armlets.",
  "विभूतिर्|glory|vibhūti; निष्कला|without parts|niṣkalā; रम्या|lovely|ramyā; रक्षा|protection|rakṣā; सुविमला|spotless|su · vimalā; क्षमा|patience|kṣamā",

 v("v119", "119", "All of nature", "Best of boon-givers, Svadhā, modesty, the earth, beloved, destroyer of sorrow — Māyā, love, unyielding, Narmadā, refuge of Gokula.",

  "माया|Māyā|māyā; प्रीतिर्|love|prīti; असहना|unyielding (to the wicked)|asahanā; नर्मदा|Narmadā, giver of delight|narma · dā; गोकुलाश्रया|refuge of Gokula|gokula · āśrayā",

 v("v120", "120", "All of nature", "Bright as the sun, as the moon, wondrous; Śrī, bright as fire, holding the thunderbolt, giver of every land.",
  "अर्कप्रभा|bright as the sun|arka · prabhā; रसेभा|(meaning uncertain)|rasebhā; श्रीनिलयेन्दुप्रभाऽद्भुता|home of Śrī, bright as the moon, wondrous|śrī · nilayā · indu · prabhā · adbhutā",
  "श्रीः|Śrī|śrī; कृशानुप्रभा|bright as fire|kṛśānu · prabhā; वज्रलम्भना|holding the thunderbolt|vajra · lambhanā; सर्वभूमिदा|giver of every land|sarva · bhūmi · dā",
  "Bright as the sun; (rasebhā); home of Śrī; bright as the moon; wondrous; Śrī; bright as fire; holding the thunderbolt; giver of every land.",
  "சூரியன் போல் ஒளிர்பவள்; (ரசேபா); ஸ்ரீயின் இருப்பிடம்; சந்திரன் போல் ஒளிர்பவள்; அற்புதமானவள்; ஸ்ரீ; அக்னி போல் ஒளிர்பவள்; வஜ்ரம் ஏந்தியவள்; எல்லா நிலங்களையும் தருபவள்.",
  {tip:"Three lights: <b>arka</b> (sun) · <b>indu</b> (moon) · <b>kṛśānu</b> (fire)."}),
 v("v121", "121", "All of nature", "Fond of enjoyment, rich in it, resting on the serpent-king — preceded by horses, in the midst of chariots, woken by elephants' trumpeting.",
  "भोगप्रिया|fond of enjoyment|bhoga · priyā; भोगवती|rich in enjoyment|bhoga · vatī; भोगीन्द्रशयनासना|resting on the serpent-king's couch|bhogi · indra · śayana · āsanā",
  "अश्वपूर्वा|preceded by horses|aśva · pūrvā; रथमध्या|in the midst of chariots|ratha · madhyā; हस्तिनादप्रबोधिनी|woken by the trumpeting of elephants|hasti · nāda · prabodhinī",
  "Fond of enjoyment; rich in enjoyment; resting on the couch of the serpent-king; preceded by horses; in the midst of chariots; woken by the trumpeting of elephants.",
  "போகத்தை விரும்புபவள்; போகம் நிறைந்தவள்; ஆதிசேஷன் படுக்கையில் இருப்பவள்; முன்னே குதிரைகள் உடையவள்; தேர்களின் நடுவில் இருப்பவள்; யானைகளின் பிளிறலால் எழுப்பப்படுபவள்.",
  {tip:"Straight from <b>Sri Suktam</b> verse 3: <i>aśvapūrvāṃ rathamadhyāṃ hastināda-prabodhinīm</i>."}),
 v("v122", "122", "All of nature", "Marked with every auspicious mark, dear to all the worlds — the blessing of all blessings, giver of seen and unseen fruit.",
  "सर्वलक्षणलक्षण्या|marked with every auspicious mark|sarva · lakṣaṇa · lakṣaṇyā; सर्वलोकप्रियङ्करी|who pleases all the worlds|sarva · loka · priyaṅkarī",
  "सर्वमङ्गलमाङ्गल्या|the auspiciousness of all that is auspicious|sarva · maṅgala · māṅgalyā; दृष्टादृष्टफलप्रदा|giver of seen and unseen fruit|dṛṣṭa · adṛṣṭa · phala · pradā",
  "Marked with every auspicious mark; who pleases all the worlds; the auspiciousness of all that is auspicious; giver of fruit both seen (in this life) and unseen (hereafter).",
  "எல்லா மங்கள லக்ஷணங்களும் உடையவள்; எல்லா உலகங்களுக்கும் இனியவள்; எல்லா மங்களங்களுக்கும் மங்களம்; இம்மை மறுமைப் பலன்களைத் தருபவள்.",
  {tip:"The closing name is the fruit of the hymn: <b>dṛṣṭādṛṣṭa-phala-pradā</b> — “giver of the seen and the unseen fruit”."})
];
