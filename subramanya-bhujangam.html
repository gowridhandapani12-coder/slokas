          <h1>Subramanya Bhujangam</h1>
          <p class="lead" style="margin-top:8px">Śaṅkara, ill and in pain, came to Tiruchendūr on the sea-shore; seeing Murugan, words poured out of him in the “serpent's gait” metre — <i>bhujaṅga-prayāta</i>. “I know no words, no meanings, no verse — yet the six-faced Light shines in my heart and wonderful words flow from my mouth.” The hymn is chanted for healing and for courage at the last hour.</p>

   "कटिं|waist; भावये|I meditate on; स्कन्द|O Skanda; ते|your; दीप्यमानाम्|radiant"],
  "O Skanda, I meditate on your radiant waist — shining in divine garments of golden hue, lovely with a girdle of tinkling bells, gleaming with a band of gold.",
  "ஸ்கந்தா, பொன்னிற திவ்ய ஆடைகளால் ஒளிர்வதும், ஒலிக்கும் கிண்கிணி ஒட்டியாணத்தால் அழகியதும், ஒளிரும் பொன் பட்டையால் மின்னுவதுமான உன் இடையைத் தியானிக்கிறேன்."),
 v(11, "His form", "I bow to your chest, foe of Tāraka, red with saffron from embracing Vallī — ever loving to protect your devotees.",
  ["पुलिन्देशकन्याघनाभोगतुङ्ग|of the hunter-chief's daughter (Vallī), full and high",
   "स्तनालिङ्गनासक्तकाश्मीररागम्|red with saffron from the embrace of her breasts",
   "नमस्याम्यहं|I bow; तारकारे|O foe of Tāraka; तवोरः|your chest|tava · uraḥ",
   "स्वभक्तावने|in protecting your devotees; सर्वदा|always; सानुरागम्|full of love"],
  "O foe of Tāraka, I bow to your chest — red with saffron from the embrace of Vallī, the hunter-chief's daughter — always full of love in protecting your devotees.",
  "தாரகனின் பகைவனே, வேடர் தலைவன் மகளான வள்ளியின் தழுவலால் குங்குமம் படிந்து சிவந்த, தன் பக்தர்களைக் காப்பதில் எப்போதும் அன்பு நிறைந்த உன் மார்பை வணங்குகிறேன்.",
  {tip:"<b>Pulinda-kanyā</b> — Vallī, daughter of the hunter chief, Murugan's bride."}),
 v(12, "His form", "I take refuge in your mighty arms — rods of justice to Brahmā, holding universes in play, death to enemies, saviours of the world.",
  ["विधौ|on Brahmā; क्लृप्तदण्डान्|who gave punishment; स्वलीलाधृताण्डान्|holding the universes in play",
   "निरस्तेभशुण्डान्|that pushed aside elephants' trunks; द्विषत्कालदण्डान्|rods of death for enemies",
   "हतेन्द्रारिषण्डाञ्जगत्त्राणशौण्डान्|slayers of Indra's foes, skilled in saving the world",
   "सदा|always; ते|your; प्रचण्डान्|mighty; श्रये|I take refuge in; बाहुदण्डान्|rod-like arms"],
  "I always take refuge in your mighty rod-like arms — which punished Brahmā, which hold the universes in play, which pushed aside elephants' trunks, which are rods of death to enemies, which slew Indra's foes and are skilled in saving the world.",
  "பிரம்மனைத் தண்டித்தவையும், விளையாட்டாக அண்டங்களைத் தாங்குபவையும், யானைத் தும்பிக்கைகளை விலக்கியவையும், பகைவர்களுக்குக் காலதண்டமும், இந்திரனின் பகைவர்களைக் கொன்றவையும், உலகைக் காக்க வல்லவையுமான உன் வலிய தோள்களைச் சரணடைகிறேன்.",
  {tip:"Every quarter rhymes in <b>-daṇḍān / -ṇḍān</b>. Murugan punished Brahmā for not knowing the meaning of Om."}),
 v(13, "His form", "If six autumn moons rose together, always full, without spots — then, Skanda, I'd compare them to your faces.",
  ["सदा|always; शारदाः|autumnal; षण्मृगाङ्का|six moons; यदि|if; स्युः|there were",
   "समुद्यन्त|rising; एव|indeed; स्थिताश्चेत्|if they stood|sthitāḥ · cet; समन्तात्|all around",
   "सदा|always; पूर्णबिम्बाः|full-orbed; कलङ्कैश्च|and of spots|kalaṅkaiḥ · ca; हीनास्|free",
   "तदा|then; त्वन्मुखानां|of your faces; ब्रुवे|I would speak; स्कन्द|O Skanda; साम्यम्|likeness"],
  "If there were six autumn moons, all rising together, always full and free of spots — then, O Skanda, I would speak of their likeness to your faces.",
  "எப்போதும் உதிக்கும், எப்போதும் பூரணமான, களங்கமற்ற ஆறு சரத்காலச் சந்திரர்கள் சுற்றிலும் இருந்தால் — அப்போதுதான், ஸ்கந்தா, உன் முகங்களுக்கு ஒப்புமை சொல்வேன்."),
 v(14, "His form", "I behold your six lotus faces — swans of smiles, bees of glances, lips flowing with nectar.",
  ["स्फुरन्मन्दहासैः|with shining gentle smiles; सहंसानि|with swans; चञ्चत्|darting",
   "कटाक्षावलीभृङ्गसङ्घोज्ज्वलानि|bright with swarms of bees — the rows of glances",
   "सुधास्यन्दिबिम्बाधराणीशसूनो|with bimba lips flowing with nectar, O son of Īśa",
   "तवालोकये|I behold your|tava · ālokaye; षण्मुखाम्भोरुहाणि|six lotus faces"],
  "O son of Īśa, I behold your six lotus faces — with swans of shining gentle smiles, bright with swarms of bees, the rows of your darting glances, and bimba-red lips flowing with nectar.",
  "ஈசனின் மைந்தா, மந்தஹாசமே அன்னங்களாகவும், அசையும் கடைக்கண் வரிசைகளே வண்டுக்கூட்டங்களாகவும், அமுதம் சுரக்கும் கோவை உதடுகளும் உடைய உன் ஆறு முகத் தாமரைகளைக் காண்கிறேன்."),
 v(15, "His form", "Among your twelve long, merciful eyes, if just one side-glance falls on me once — what loss is that to you?",
  ["विशालेषु|wide; कर्णान्तदीर्घेष्वजस्रं|long to the ears, always|karṇa · anta · dīrgheṣu · ajasram",
   "दयास्यन्दिषु|flowing with mercy; द्वादशस्वीक्षणेषु|among the twelve eyes|dvādaśasu · īkṣaṇeṣu",
   "मयीषत्कटाक्षः|on me, a slight side-glance|mayi · īṣat · kaṭākṣaḥ; सकृत्पातितश्चेद्|if cast once",
   "भवेत्ते|would be to you|bhavet · te; दयाशील|O merciful one; का|what; नाम|indeed; हानिः|loss"],
  "Among your twelve eyes — wide, long to the ears, ever flowing with mercy — if even one slight side-glance were cast on me just once, O merciful one, what loss would it be to you?",
  "விசாலமான, காதுவரை நீண்ட, எப்போதும் கருணை சுரக்கும் உன் பன்னிரண்டு கண்களில், ஒரு சிறு கடைக்கண் ஒருமுறை என்மீது விழுந்தால், கருணையாளனே, உனக்கு என்ன இழப்பு?",
  {tip:"Like Soundarya Laharī 57 — “what loss to you?”. Twelve eyes, and Śaṅkara asks for <b>one</b> glance."}),
 v(16, "His form", "Śiva smelled your six heads with joy, chanting “live, son born of my body” — I bow to those crowned heads, lord of the world.",
  ["सुताङ्गोद्भवो|son born of my limbs; मेऽसि|you are mine|me · asi; जीवेति|“live!” — thus|jīva · iti; षड्धा|six times",
   "जपन्मन्त्रमीशो|Īśa, chanting the mantra|japan · mantram · īśaḥ; मुदा|with joy; जिघ्रते|smells; यान्|which",
   "जगद्भारभृद्भ्यो|to those bearing the world's burden; जगन्नाथ|O lord of the world; तेभ्यः|to those",
   "किरीटोज्ज्वलेभ्यो|shining with crowns; नमो|salutations; मस्तकेभ्यः|to the heads"],
  "“You are my son, born of my limbs — live!”: chanting this mantra six times, Īśa smells your heads with joy. O lord of the world, salutations to those heads, shining with crowns, bearing the burden of the world.",
  "‘என் அங்கத்தில் பிறந்த மகன் நீ, வாழ்வாயாக’ என்ற மந்திரத்தை ஆறுமுறை ஜபித்து ஈசன் மகிழ்வுடன் முகர்ந்த, உலக பாரத்தைத் தாங்கும், கிரீடங்களால் ஒளிரும் உன் சிரங்களுக்கு, ஜகந்நாதா, நமஸ்காரம்."),
 v(17, "His form", "With jewelled armlets and necklaces, swinging earrings, yellow silk and the śakti in hand — may Śiva's son stand before me.",
  ["स्फुरद्रत्नकेयूरहाराभिरामश्|lovely with shining jewelled armlets and necklaces",
   "चलत्कुण्डलश्रीलसद्गण्डभागः|his cheeks shining with swinging earrings",
   "कटौ|at the waist; पीतवासाः|yellow-robed; करे|in hand; चारुशक्तिः|the lovely lance",
   "पुरस्तान्ममास्तां|may he stand before me|purastāt · mama · āstām; पुरारेस्तनूजः|son of the foe of the cities"],
  "Lovely with shining jewelled armlets and necklaces, his cheeks bright with swinging earrings, yellow silk at his waist and the lovely lance in his hand — may the son of Śiva stand before me.",
  "ஒளிரும் ரத்தினத் தோள்வளைகளும் மாலைகளும் அழகுபடுத்த, அசையும் குண்டலங்களால் கன்னங்கள் ஒளிர, இடையில் பீதாம்பரமும் கையில் அழகிய வேலும் கொண்ட திரிபுராரியின் மைந்தன் என் முன் நிற்கட்டும்.",
  {tip:"<b>cāru-śakti</b> — the <b>vel</b>, his lance, given by Pārvatī."}),
 v(18, "His form", "When Śiva calls “come here, child”, stretching his arms, he leaps from his mother's lap into his father's embrace — I worship that child.",
  ["इहायाहि|come here|iha · āyāhi; वत्सेति|“child!” — thus|vatsa · iti; हस्तान्प्रसार्या|stretching out his hands",
   "ह्वयत्यादराच्छङ्करे|when Śaṅkara lovingly calls|hvayati · ādarāt · śaṅkare; मातुरङ्कात्|from his mother's lap",
   "समुत्पत्य|leaping up; तातं|his father; श्रयन्तं|going to; कुमारं|the boy",
   "हराश्लिष्टगात्रं|his body embraced by Hara; भजे|I worship; बालमूर्तिम्|the child-form"],
  "When Śaṅkara, stretching out his hands, lovingly calls “Come here, child!”, the boy leaps from his mother's lap and runs to his father — I worship that child-form, his body embraced by Hara.",
  "‘இங்கே வா, குழந்தாய்’ என்று கைகளை நீட்டிச் சங்கரன் அன்புடன் அழைக்கும்போது, தாயின் மடியிலிருந்து பாய்ந்து தந்தையிடம் செல்லும், ஹரனால் தழுவப்பட்ட அந்தக் குழந்தை வடிவக் குமாரனை வணங்குகிறேன்.",
  {tip:"A tender family picture — the best-loved child verse."}),
 v(19, "At the last hour", "O Kumāra, Guha, Skanda, general, lance-bearer on the peacock, Vallī's beloved — protect me always.",
  ["कुमारेशसूनो|O Kumāra, son of Īśa; गुह|O Guha; स्कन्द|O Skanda; सेना|of the army",
   "पते|O lord; शक्तिपाणे|O lance-bearer; मयूराधिरूढ|O rider of the peacock",
   "पुलिन्दात्मजाकान्त|O beloved of the hunter's daughter; भक्तार्तिहारिन्|O remover of devotees' pain",
   "प्रभो|O Lord; तारकारे|O foe of Tāraka; सदा|always; रक्ष|protect; मां|me; त्वम्|you"],
  "O Kumāra, son of Īśa; O Guha; O Skanda; O lord of the army; O lance-bearer; O rider of the peacock; O beloved of the hunter's daughter; O remover of devotees' pain; O Lord, foe of Tāraka — always protect me.",
  "குமாரா, ஈசன் மைந்தா, குகா, ஸ்கந்தா, சேனாபதி, வேலாயுதா, மயில்வாகனா, வள்ளி மணாளா, பக்தர் துயர் தீர்ப்பவனே, பிரபோ, தாரகாரியே — என்னை எப்போதும் காப்பாயாக.",
  {tip:"A string of his names — easy to chant: <b>kumāra · guha · skanda · senāpati · śaktipāṇi</b>."}),
 v(20, "At the last hour", "When my senses fail and I am helpless, about to leave — come quickly before me, merciful Guha.",
  ["प्रशान्तेन्द्रिये|when the senses are stilled; नष्टसंज्ञे|consciousness lost; विचेष्टे|motionless",
   "कफोद्गारिवक्त्रे|phlegm in the mouth; भयोत्कम्पिगात्रे|body trembling with fear",
   "प्रयाणोन्मुखे|about to depart; मय्यनाथे|when I am helpless|mayi · anāthe; तदानीं|then",
   "द्रुतं|quickly; मे|before me; दयालो|O merciful one; भवाग्रे|be in front|bhava · agre; गुह|O Guha; त्वम्|you"],
  "When my senses are stilled, my awareness gone, my body motionless, phlegm rising in my mouth, my limbs trembling with fear, and I am helpless, about to depart — then, O merciful Guha, come quickly and stand before me.",
  "புலன்கள் அடங்கி, நினைவிழந்து, அசைவற்று, வாயில் கபம் பொங்கி, பயத்தால் உடல் நடுங்கி, புறப்படத் தயாராக ஆதரவற்று நான் இருக்கும் அந்த நேரத்தில், கருணையாளனே, குகனே, விரைவில் என் முன் தோன்றுவாயாக.",
  {tip:"Verses 20–22: the prayer for the <b>last hour</b> — the heart of the hymn."}),
 v(21, "At the last hour", "When Yama's fierce messengers shout “burn, cut, break!”, say “fear not” — come quickly on your peacock, lance in hand.",
  ["कृतान्तस्य|of Yama; दूतेषु|when the messengers; चण्डेषु|fierce; कोपाद्|in anger",
   "दहच्छिन्धि|“burn! cut!”|daha · chindhi; भिन्धीति|“break!” — thus|bhindhi · iti; मां|me; तर्जयत्सु|threaten",
   "मयूरं|the peacock; समारुह्य|mounting; मा|do not; भैरिति|“fear” — thus|bhaiḥ · iti; त्वं|you",
   "पुरः|before me; शक्तिपाणिर्ममायाहि|lance in hand, come to me|śaktipāṇiḥ · mama · āyāhi; शीघ्रम्|quickly"],
  "When Yama's fierce messengers angrily threaten me, “Burn him! Cut him! Break him!”, mount your peacock and, lance in hand, saying “Fear not!”, come quickly before me.",
  "யமனின் கொடிய தூதர்கள் கோபத்துடன் ‘எரி, வெட்டு, உடை’ என்று என்னை மிரட்டும்போது, மயில் மீதேறி, ‘அஞ்சாதே’ என்று சொல்லி, வேலேந்தி விரைவில் என் முன் வருவாயாக.",
  {tip:"<b>mā bhaiḥ</b> — “fear not!” — Murugan's promise."}),
 v(22, "At the last hour", "Bowing at your feet again and again, I pray now — I won't be able to speak then; at the end, don't neglect me even a little.",
  ["प्रणम्यासकृत्पादयोस्ते|bowing again and again at your feet; पतित्वा|falling",
   "प्रसाद्य|pleasing you; प्रभो|O Lord; प्रार्थयेऽनेकवारम्|I pray many times|prārthaye · anekavāram",
   "न|not; वक्तुं|to speak; क्षमोऽहं|I am able|kṣamaḥ · aham; तदानीं|then; कृपाब्धे|O ocean of mercy",
   "न|not; कार्यान्तकाले|at the final hour; मनागप्युपेक्षा|even slight neglect|manāk · api · upekṣā"],
  "Falling at your feet again and again, seeking your grace, O Lord, I pray many times now: I will not be able to speak then, O ocean of mercy — so at the final hour, do not neglect me even slightly.",
  "உன் திருவடிகளில் மீண்டும் மீண்டும் விழுந்து வணங்கி, உன்னை மகிழ்வித்து, பிரபோ, பலமுறை வேண்டுகிறேன் — அப்போது பேச என்னால் முடியாது, கருணைக் கடலே; இறுதி நேரத்தில் சிறிதும் என்னைப் புறக்கணிக்காதே."),
 v(23, "At the last hour", "You slew Śūra, Tāraka and Siṃhavaktra — why not slay this one sorrow in my heart? What shall I do, where shall I go?",
  ["सहस्राण्डभोक्ता|ruler of a thousand worlds; त्वया|by you; शूरनामा|named Śūra",
   "हतस्तारकः|slain, Tāraka|hataḥ · tārakaḥ; सिंहवक्त्रश्च|and Siṃhavaktra; दैत्यः|the demon",
   "ममान्तर्हृदिस्थं|dwelling in my heart; मनःक्लेशमेकं|one sorrow of the mind",
   "न|not; हंसि|you slay; प्रभो|O Lord; किं|what; करोमि|shall I do; क्व|where; यामि|shall I go"],
  "By you were slain Śūra, ruler of a thousand worlds, Tāraka and the demon Siṃhavaktra. Yet the one sorrow dwelling in my heart you do not slay, O Lord — what shall I do? Where shall I go?",
  "ஆயிரம் அண்டங்களை ஆண்ட சூரனையும், தாரகனையும், சிம்மமுகனையும் நீ கொன்றாய். என் இதயத்தில் உள்ள ஒரு மனத்துயரை மட்டும் கொல்லவில்லையே, பிரபோ — நான் என்ன செய்வேன், எங்கே போவேன்?",
  {tip:"<b>kiṃ karomi kva yāmi</b> — “what shall I do, where shall I go?” — a cry from the heart."}),
 v(24, "At the last hour", "I sink under sorrow; you are friend of the poor — I ask no one else. Quickly destroy my anguish, son of Umā.",

  "I always sink under the weight of sorrow; you are the friend of the poor — I ask no one other than you. O son of Umā, quickly destroy my anguish, which always blocks my devotion to you and causes harm.",
  "நான் எப்போதும் துயர பாரத்தால் சோர்ந்திருக்கிறேன்; நீ தீனபந்து — உன்னைத் தவிர யாரிடமும் கேட்க மாட்டேன். உமாசுதா, உன் பக்திக்குத் தடையாகித் துன்புறுத்தும் என் மனவேதனையை விரைவில் அழிப்பாயாக."),
 v(25, "At the last hour", "Epilepsy, leprosy, consumption, fever, madness and ghosts flee the moment they see your sacred leaf-ash.",

   "विलोक्य|seeing; क्षणात्तारकारे|instantly, O foe of Tāraka|kṣaṇāt · tārakāre; द्रवन्ते|run away"],
  "Epilepsy, leprosy, consumption, piles, diabetes, fever, madness, tumours and other great diseases, and all ghosts, O foe of Tāraka, run away the moment they see your sacred leaf-ash.",
  "காக்காய் வலிப்பு, தொழுநோய், க்ஷயம், மூலம், நீரிழிவு, காய்ச்சல், பைத்தியம், குன்மம் முதலிய பெரும் நோய்களும் எல்லாப் பிசாசுகளும், தாரகாரியே, உன் பன்னீர் இலை விபூதியைக் கண்ட கணமே ஓடிவிடுகின்றன.",

 v(26, "Surrender", "Skanda's form in my eyes, his fame in my ears, his story on my lips, his service in my hands — may all of me be lost in Guha.",

  "In my eyes, Skanda's form; in my ears, Skanda's fame; on my lips always his holy story; in my hands his work; my body his servant — may all my feelings be absorbed in Guha.",
  "என் கண்களில் ஸ்கந்த மூர்த்தி, காதுகளில் ஸ்கந்த கீர்த்தி, வாயில் எப்போதும் அவன் புனிதச் சரித்திரம், கைகளில் அவன் பணி, உடல் அவன் அடிமை — என் எல்லா உணர்வுகளும் குகனில் கரையட்டும்.",

 v(27, "Surrender", "Other gods grant wishes to sages and devotees — but one who gives even to the lowest, other than Guha I know none.",

 v(28, "Surrender", "Wife, children, relatives, cattle — all in my home — may they worship, bow to, praise and remember you, Kumāra.",

 v(30, "Surrender", "Don't a mother and father forgive their child's faults? I am a little child, you the world's father — forgive all my faults.",

 v(32, "Surrender", "Jaya, abode of bliss; jaya, boundless light; jaya, unfailing fame — victory to you always, son of the Lord who gives liberation.",
