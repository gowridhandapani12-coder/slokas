        <div>
          <p class="eyebrow">Adi Shankaracharya · Sanskrit · 5 verses + dhyānam + phala-śruti</p>
          <div class="ttl" id="heroTitle"></div>
          <h1>Ganesha Pancharatnam</h1>
          <p class="lead" style="margin-top:8px">“Five gems for Lord Ganesha.” Each verse is one gem: a string of names that paint his picture — the sweet in his hand, the moon on his head, the single tusk — and ends with a different way of reaching him.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Composed by</span><b>Adi Shankaracharya</b><span>c. 8th century CE</span></div>
        <div class="fact"><span>Deity</span><b>Mahā Gaṇapati</b><span>Vināyaka, remover of obstacles</span></div>
        <div class="fact"><span>Metre</span><b>Pañcacāmara</b><span>16 syllables a line, short–long × 8</span></div>
        <div class="fact"><span>Title</span><b>Pañca + ratna</b><span>five + gems</span></div>
        <div class="fact"><span>Best time</span><b>At dawn</b><span>“prabhātake” — verse 6</span></div>
        <div class="fact"><span>Learning from</span><b>Arthaanubhavam</b><span>workshop notebook (GP)</span></div>
      </div>

      <div class="card">

      </div>

      <div class="grid2">
        <div class="card">

          <p class="muted" style="margin:6px 0 14px">Every gem ends with a different verb. Learn this order and you will never mix up the verse endings.</p>
          <div class="ladder" id="ladder"></div>
        </div>
        <div class="card">
          <h2>Remember the openings</h2>
          <p class="muted" style="margin:6px 0 14px">The first sound of each gem, in order. Say it like a little chant.</p>
          <div class="mn" id="openings"></div>
          <div class="tip" style="margin-top:14px"><b>Two more patterns.</b> Verse 2, line 3 is four “-īśvaram” titles in a row (lord of gods, treasures, elephants, gaṇas). Verse 3, line 3 is four “-karam” words (maker of compassion, patience, joy, fame).</div>
        </div>
      </div>

      <div class="card">
