<template id="overview">
      <div class="hero">
        <div>
          <p class="eyebrow">Indra · Padma Purāṇa · Sanskrit · 8 verses + 3 verses of phala-śruti</p>
          <div class="ttl" id="heroTitle"></div>
          <h1>Mahalakshmi Ashtakam</h1>
          <p class="lead" style="margin-top:8px">“Eight verses to the Great Lakṣmī.” Indra, king of the gods, calls her by name after name — rider of Garuḍa, giver of every boon, the one seated on the lotus — and ends every verse the same way: <i>Mahālakṣmi, namo'stu te</i>.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Sung by</span><b>Indra</b><span>king of the gods</span></div>
        <div class="fact"><span>Goddess</span><b>Mahālakṣmī</b><span>consort of Viṣṇu, giver of all good</span></div>
        <div class="fact"><span>Metre</span><b>Anuṣṭubh</b><span>4 quarters of 8 syllables</span></div>
        <div class="fact"><span>Title</span><b>Aṣṭaka</b><span>a group of eight verses</span></div>
        <div class="fact"><span>Source</span><b>Padma Purāṇa</b><span>as given in her PDF</span></div>
        <div class="fact"><span>Best time</span><b>1, 2 or 3 times a day</b><span>verses 10–11</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The shape of the hymn</h2><span class="muted" style="font-size:.85rem">Tap a block to open it</span></div>
        <div class="gems" id="gems" style="margin-top:14px"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>One refrain, eight times</h2>
          <p class="muted" style="margin:6px 0 12px">Every verse ends with the same quarter. Once you know it, you only need to learn the first three quarters of each verse.</p>
          <div class="refrain" id="refrain"></div>
          <p style="margin-top:6px">“O Mahālakṣmī, salutations to you.”</p>
          <div class="tip" style="margin-top:14px"><b>Almost every word is a way of calling her.</b> Names ending in <b>-e</b> or <b>-i</b> (garuḍārūḍhe, sarvajñe, bhayaṅkari) mean “O you who…”. Read each verse as a list of “O …” and it becomes easy to follow.</div>
        </div>
        <div class="card">
          <h2>Remember the openings</h2>
          <p class="muted" style="margin:6px 0 14px">The first sound of each verse, in order. Say it like a little chant.</p>
          <div class="mn" id="openings"></div>
          <div class="tip" style="margin-top:14px"><b>Verse pairs.</b> Verses 1 and 2 both begin with <i>namaste</i>. Verse 3 is the <i>sarva</i> verse (sarva = all, five times). Verses 7 and 8 both end with <i>jaganmātar</i>, “O Mother of the world”.</div>
        </div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>Lakṣmī, as the hymn describes her</h2><span class="muted" style="font-size:.85rem">Tap one to see the word in its verse</span></div>
        <div class="icons" id="icons" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <h2>How often, and what it brings</h2>
        <p class="muted" style="margin:6px 0 14px">The last three verses say: whoever reads this hymn with devotion gains every success and lasting prosperity. Then they count the times a day.</p>
        <div class="times">
          <div class="time"><div class="suns"><i></i></div><b>Once a day</b><span>destroys even great sins — <i>mahāpāpa-vināśanam</i></span></div>
          <div class="time"><div class="suns"><i></i><i></i></div><b>Twice a day</b><span>blessed with wealth and grain — <i>dhana-dhānya-samanvitaḥ</i></span></div>
          <div class="time"><div class="suns"><i></i><i></i><i></i></div><b>Three times a day</b><span>great enemies are destroyed, and Mahālakṣmī is always pleased, boon-giving and auspicious</span></div>
        </div>
        <div class="benefits" id="benefits" style="margin-top:14px"></div>
      </div>
