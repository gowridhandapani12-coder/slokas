          <h1>Gopala Vimshati</h1>
          <p class="lead" style="margin-top:8px">“Twenty verses on Gopāla.” Deśika paints the child Kṛṣṇa of Vṛndāvana — dancing for butter in Nanda's house, caught stealing, tied to the mortar, playing the flute, sporting with the gopīs — and asks that this form be before him at his last journey.</p>

  "இமைக்காத கண்களால் அனுபவிக்கத் தக்கதும், இளமை நீங்காததும், மயில் தோகைகளுடன் போட்டியிடும் கூந்தலுடையதும், புலன்களை மயக்கும் விளையாட்டுடையதுமான அந்த ஒளி என் மனத்தில் தோன்றட்டும்."),
 v(11, "au", "Meditation", "May he protect me with his flute, enchanting the gopīs, and with glances cool with a sinless smile — lotuses on the river of mercy.",
  ["अनुयायिमनोज्ञवंशनालैः|with lovely flutes that follow (him); अवतु|may (he) protect; स्पर्शितवल्लवीविमोहैः|that bring bliss to the gopīs",

  "May he protect me with his lovely flute that follows him and enchants the cowherd women, and with his side-glances — cool with a sinless smile, lotuses on the river of compassion.",
  "இடைச்சியரை மயக்கும் இனிய புல்லாங்குழலாலும், களங்கமற்ற புன்னகையால் குளிர்ந்த, கருணை நதியின் தாமரைகளான கடைக்கண்களாலும் அவன் என்னைக் காக்கட்டும்."),
 v(12, "au", "Meditation", "Flute at his lips, peacock feathers on his crown, dark as sapphire — may such forms be before me on my last journey.",

   "हरिनीलशिलाविभङ्गनीलाः|dark as pieces of sapphire; प्रतिभाः|visions; सन्तु|may there be; ममान्तिमप्रयाणे|at my last journey"],
  "May there be visions of him at my last journey — the lovely flute at his lips, strings of peacock feathers hanging from his crown, dark as pieces of sapphire.",
  "உதட்டில் அழகிய புல்லாங்குழல், மகுடத்தில் தொங்கும் மயில்பீலி மாலை, இந்திர நீலக்கல் துண்டு போன்ற கருநிறம் — இத்தகைய காட்சிகள் என் இறுதிப் பயணத்தில் தோன்றட்டும்.",
  {tip:"A prayer for the <b>last hour</b> (antima-prayāṇa) — like Subrahmaṇya Bhujaṅgam 20."}),
 v(13, "au", "Meditation", "I spend all my time gazing at that youth's beauty — longed for by the gopīs, beyond the reach of words.",
  ["अखिलानवलोकयामि|all — I watch|akhilān · avalokayāmi; कालान्|times; महिलाधीनभुजान्तरस्य|whose chest belongs to the Lady; यूनः|of the youth",

  "All my days I gaze at the beauty of that youth, whose chest belongs to the Lady (Lakṣmī) — the object of the Vraja women's longing, far beyond the reach of words.",
  "திருமகளுக்கு உரிய மார்புடைய அந்த இளைஞனின், விரஜப் பெண்களின் ஏக்கத்துக்குரிய, சொல்லுக்கு எட்டாத அழகை எல்லாக் காலங்களிலும் காண்கிறேன்."),
 v(14, "vl", "The youth", "What artist painted this youth in my heart — peacock-feathered, the sun to the lotus faces of the gopīs?",

   "मदनातुरवल्लवाङ्गनावदनाम्भोजदिवाकरो|the sun to the lotus faces of the love-sick gopīs; युवा|the youth"],
  "What artist painted in my heart this youth — adorned with a lovely peacock feather, the sun that opens the lotus faces of the love-sick cowherd women?",
  "அழகிய மயில்பீலி அணிந்தவனும், காதலால் வாடும் இடைச்சியரின் முகத்தாமரைகளுக்குச் சூரியனுமான இந்த இளைஞனை என் இதயத்தில் எந்தச் சிற்பி வரைந்தான்?"),
 v(15, "vl", "The youth", "With bowed head and folded hands I honour that Light, dark as collyrium, whose flute is answered by the gopīs' bangles.",

  "With bowed head I offer folded hands to that honoured Light, dark as collyrium — whose sweet flute is answered by the jingling bangles of the charmed cowherd women.",
  "மயங்கிய இடைச்சியரின் வளையல் ஒலி பதில் சொல்லும் இனிய புல்லாங்குழலுடைய, மை போல் கருத்த, போற்றத்தக்க அந்த ஒளிக்குத் தலை வணங்கி அஞ்சலி செய்கிறேன்."),
 v(16, "ml", "The youth", "Victorious is Viṣṇu's flute — taught by the gopīs' hand-claps, sharing the nectar of his jewel lips.",
  ["जयति|triumphs; ललितवृत्तिं|graceful play; शिक्षितो|taught; वल्लवीनां|of the cowherd women",
   "शिथिलवलयशिञ्जाशीतलैर्हस्ततालैः|by hand-claps cool with the jingle of loose bangles",
   "अखिलभुवनरक्षागोपवेषस्य|of him in cowherd's dress to protect all the worlds; विष्णोः|of Viṣṇu",
   "अधरमणिसुधायामंशवान्|sharing in the nectar of his jewel lips; वंशनालः|the flute"],
  "Triumphant is the flute of Viṣṇu — who wears a cowherd's dress to protect all the worlds — taught its graceful music by the cowherd women's hand-claps, cool with the jingle of their loose bangles, and sharing in the nectar of his jewel lips.",
  "எல்லா உலகங்களையும் காக்க இடையன் வேடம் பூண்ட விஷ்ணுவின் புல்லாங்குழல் வெல்கிறது — இடைச்சியரின் வளையல் ஒலியுடன் கூடிய கைத்தாளங்களால் இனிய நடை கற்று, அவன் மணி உதட்டின் அமுதத்தில் பங்கு பெற்றது."),
 v(17, "mk", "The youth", "With flowers at his ear, peacock feather in his hair, a gunja necklace — the rogue who steals the gopīs' hearts triumphs.",

  "Wonderfully adorned, wearing a lāṅgalī flower at his ear, his hair shining with a peacock-feather crest, holding a bandhujīva flower, wearing on his chest a lovely necklace strung with gunja berries — a certain rogue, stealer of the cowherd maidens' hearts, triumphs.",

 v(18, "mk", "The youth", "Play-stick in his right hand, his other arm on his beloved's shoulder, flute at his waist — the cloud-dark lover of the gopīs triumphs.",
  ["लीलायष्टिं|a play-stick; करकिसलये|in his sprout-like hand; दक्षिणे|right; न्यस्य|placing; धन्याम्|blessed",

  "A blessed play-stick in his right hand, his other arm resting on his beloved's shoulder thrilled with joy, his flute tucked in his girdle, his hair bright with a crest of gunja berries — the graceful, cloud-dark lover of the cowherd maidens triumphs.",
