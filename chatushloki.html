          <h1>Chatushloki</h1>
          <p class="lead" style="margin-top:8px">“Four verses” to Śrī by Āḷavandār, the great ācārya before Rāmānuja. Short, but dense: who Lakṣmī is, why even Viṣṇu cannot measure her glory, how all good comes only by her grace, and how she embraces every form of the Lord.</p>

  "Hari's supreme form — the peaceful, endless Brahman of great glory; his embodied form, dearer to him and most wonderful; and all the other forms he takes as he pleases in play — all of them, the sages say, are closely embraced by you with glorious matching forms of your own.",
