          <h1>Soundarya Lahari</h1>
          <p class="lead" style="margin-top:8px">“The wave of beauty.” The first 41 verses, the <i>Ānanda Laharī</i> (wave of bliss), praise the Goddess as Śakti — without whom Śiva cannot even stir — and tell of the Śrīcakra, the mantra and the cakras of the body. The remaining 59 describe her beauty from crown to feet. Śaṅkara ends: “I praise you, Mother, with your own words.”</p>

   "स्थितं|placed; स्वाधिष्ठाने|in the Svādhiṣṭhāna; हृदि|in the heart; मरुतमाकाशमुपरि|air, and space above|marutam · ākāśam · upari",
   "मनोऽपि|mind also; भ्रूमध्ये|between the brows; सकलमपि|all of it; भित्त्वा|piercing; कुलपथं|the Kula path",
   "सहस्रारे|in the thousand-petalled; पद्मे|lotus; सह|with; रहसि|in secret; पत्या|your Lord; विहरसे|you sport"],
  "Piercing earth in the Mūlādhāra, water in the Maṇipūra, fire in the Svādhiṣṭhāna, air in the heart, space above, and mind between the brows — the whole Kula path — you sport in secret with your Lord in the thousand-petalled lotus.",
  "மூலாதாரத்தில் பூமியையும், மணிபூரகத்தில் நீரையும், சுவாதிஷ்டானத்தில் தீயையும், இதயத்தில் காற்றையும், அதற்கு மேல் ஆகாசத்தையும், புருவ மத்தியில் மனத்தையும் — முழு குல மார்க்கத்தையும் — பிளந்து, சகஸ்ராரத் தாமரையில் உன் நாதனுடன் ரகசியமாக விளையாடுகிறாய்.",
  {tip:"The <b>Kuṇḍalinī</b> journey through six elements and cakras, ending in the <b>sahasrāra</b>."}),
 v(10, "Her form & Śrīcakra", "Sprinkling the body with nectar from your feet, you return to your place and sleep coiled in the Kula-kuṇḍa.",
  ["सुधाधारासारैश्चरणयुगलान्तर्विगलितैः|with showers of nectar flowing from between your feet",
   "प्रपञ्चं|the body-world; सिञ्चन्ती|sprinkling; पुनरपि|again; रसाम्नायमहसः|from the light of the nectar (moon)",
   "अवाप्य|reaching; स्वां|your own; भूमिं|ground; भुजगनिभमध्युष्टवलयं|in three and a half coils like a serpent",
   "स्वमात्मानं|yourself; कृत्वा|making; स्वपिषि|you sleep; कुलकुण्डे|in the Kula-kuṇḍa; कुहरिणि|in the hollow"],
  "With showers of nectar flowing from between your feet, you sprinkle the world of the body again from the light of the moon; then, returning to your own ground, coiling yourself like a serpent in three and a half rings, you sleep in the hollow of the Kula-kuṇḍa.",
  "உன் இரு பாதங்களின் இடையிலிருந்து பொழியும் அமுத தாரைகளால் உடல் எனும் பிரபஞ்சத்தை மீண்டும் நனைத்து, தன் இடத்துக்குத் திரும்பி, பாம்பு போல் மூன்றரைச் சுருளாகச் சுருண்டு, குலகுண்டத்தின் குழியில் உறங்குகிறாய்."),
 v(11, "Her form & Śrīcakra", "Four Śiva-triangles and five Śakti-triangles, with lotuses and lines — the 44 angles of your Śrīcakra.",
  ["चतुर्भिः|with four; श्रीकण्ठैः|Śiva-triangles; शिवयुवतिभिः|Śakti-triangles; पञ्चभिरपि|and five",
   "प्रभिन्नाभिः|distinct; शम्भोर्नवभिरपि|from Śambhu, and the nine; मूलप्रकृतिभिः|root principles",
   "चतुश्चत्वारिंशद्वसुदलकलाश्रत्रिवलय|forty-four, with the eight petals, sixteen petals, three circles",
   "त्रिरेखाभिः|three lines; सार्धं|together with; तव|your; शरणकोणाः|angles of the abode; परिणताः|have formed"],
  "With four Śiva-triangles and five distinct Śakti-triangles — nine root principles — together with the eight-petalled and sixteen-petalled lotuses, three circles and three lines, the forty-four angles of your abode (the Śrīcakra) have formed.",
  "நான்கு சிவ கோணங்களும் சிவனிடமிருந்து வேறான ஐந்து சக்தி கோணங்களும் ஆகிய ஒன்பது மூலப் பிரகிருதிகளுடன், எட்டிதழ், பதினாறிதழ், மூன்று வட்டங்கள், மூன்று கோடுகள் ஆகியவற்றுடன் உன் இருப்பிடமான ஸ்ரீசக்கரத்தின் நாற்பத்து நான்கு கோணங்கள் அமைந்துள்ளன.",
  {tip:"The <b>Śrīcakra</b> described: 4 upward (Śiva) + 5 downward (Śakti) triangles, two lotuses, three circles, a square of three lines."}),
 v(12, "Fruits of worship", "Even Brahmā and the great poets fail to describe your beauty; goddesses long in their minds for Śiva's union.",
  ["त्वदीयं|your; सौन्दर्यं|beauty; तुहिनगिरिकन्ये|O daughter of the snow mountain; तुलयितुं|to compare",
   "कवीन्द्राः|the great poets; कल्पन्ते|manage; कथमपि|somehow; विरिञ्चिप्रभृतयः|Brahmā and others",
   "यदालोकौत्सुक्यादमरललना|longing to see which, the goddesses|yat · āloka · autsukyāt · amara · lalanāḥ; यान्ति|attain; मनसा|in mind",
   "तपोभिर्दुष्प्रापामपि|hard to win even by penance|tapobhiḥ · duṣprāpām · api; गिरिशसायुज्यपदवीम्|the state of union with Śiva"],
  "O daughter of the snow mountain, Brahmā and the great poets can only somehow attempt to compare your beauty. Longing to see it, the goddesses reach in their minds the state of union with Śiva — hard to attain even by penance.",
  "இமயமகளே, உன் அழகை ஒப்பிட பிரம்மன் முதலிய கவிச்சிறந்தோர் எப்படியோ முயல்கிறார்கள். அதைக் காணும் ஆவலால் தேவமாதர்கள், தவத்தாலும் அடைய முடியாத சிவசாயுஜ்ய நிலையை மனத்தால் அடைகிறார்கள்."),
 v(13, "Fruits of worship", "Even an old, unlovely man, touched by your glance, is followed by hundreds of young women.",
  ["नरं|a man; वर्षीयांसं|very old; नयनविरसं|unpleasing to the eye; नर्मसु|in love-play; जडं|dull",
   "तवापाङ्गालोके|in the light of your side-glance|tava · apāṅga · āloke; पतितमनुधावन्ति|fallen, they run after|patitam · anudhāvanti; शतशः|by hundreds",
   "गलद्वेणीबन्धाः|their braids loosening; कुचकलशविस्रस्तसिचया|garments slipping from their breasts",
   "हठात्त्रुट्यत्काञ्च्यो|girdles suddenly snapping|haṭhāt · truṭyat · kāñcyaḥ; विगलितदुकूला|silks slipping; युवतयः|young women"],
  "A man very old, unpleasing to look at, dull in love — once your side-glance falls on him, young women by the hundreds run after him, their braids loosening, garments slipping, girdles snapping, silks falling.",
  "மிக வயதானவனும், காண இனிமையற்றவனும், காதலில் மந்தமானவனுமான ஒருவன் மேல் உன் கடைக்கண் விழுந்தால், நூற்றுக்கணக்கான இளம்பெண்கள் கூந்தல் அவிழ, ஆடை நழுவ, ஒட்டியாணம் அறுபட அவனைப் பின்தொடர்கின்றனர்."),
 v(14, "Fruits of worship", "56 rays in earth, 52 in water, 62 in fire, 54 in air, 72 in space, 64 in mind — your feet are above them all.",
  ["क्षितौ|in earth; षट्पञ्चाशद्द्विसमधिकपञ्चाशदुदके|fifty-six, and in water fifty-two",
   "हुताशे|in fire; द्वाषष्टिश्चतुरधिकपञ्चाशदनिले|sixty-two, and in air fifty-four",
   "दिवि|in space; द्विःषट्त्रिंशन्मनसि|seventy-two, in mind|dviḥ · ṣaṭtriṃśat · manasi; च|and; चतुःषष्टिरिति|sixty-four — thus; ये|which",
   "मयूखास्तेषामप्युपरि|rays — above even them|mayūkhāḥ · teṣām · api · upari; तव|your; पादाम्बुजयुगम्|pair of lotus feet"],
  "Fifty-six rays in earth, fifty-two in water, sixty-two in fire, fifty-four in air, seventy-two in space and sixty-four in mind — above even all these rays are your two lotus feet.",
  "பூமியில் ஐம்பத்தாறு, நீரில் ஐம்பத்திரண்டு, தீயில் அறுபத்திரண்டு, காற்றில் ஐம்பத்து நான்கு, ஆகாசத்தில் எழுபத்திரண்டு, மனத்தில் அறுபத்து நான்கு — இந்தக் கதிர்கள் அனைத்துக்கும் மேலே உன் திருவடித் தாமரைகள்.",
  {tip:"The numbers add up to <b>360</b> — the days of the year. Her feet are beyond time."}),
 v(15, "Fruits of worship", "Pure as autumn moonlight, holding boon, rosary and book — bow to her once and your words become sweet as honey.",
  ["शरज्ज्योत्स्नाशुद्धां|pure as autumn moonlight; शशियुतजटाजूटमकुटां|crowned with matted hair holding the moon",
   "वरत्रासत्राणस्फटिकघुटिकापुस्तककराम्|with hands showing boon and fearlessness, holding a crystal rosary and a book",
   "सकृन्न|not even once|sakṛt · na; त्वा|you; नत्वा|having bowed; कथमिव|how; सतां|of the good; सन्निदधते|would come",
   "मधुक्षीरद्राक्षामधुरिमधुरीणाः|surpassing honey, milk and grapes in sweetness; फणितयः|words"],
  "How could words sweeter than honey, milk and grapes come to the good, if they had not bowed even once to you — pure as autumn moonlight, crowned with matted hair and the moon, your hands giving boon and fearlessness and holding a crystal rosary and a book?",
  "சரத்கால நிலவொளி போல் தூயவளும், சந்திரனுடன் கூடிய ஜடாமகுடம் தரித்தவளும், வரம், அபயம், ஸ்படிக மாலை, புத்தகம் ஏந்திய கைகளுடையவளுமான உன்னை ஒருமுறையாவது வணங்காமல், நல்லோருக்குத் தேன், பால், திராட்சையைவிட இனிய சொற்கள் எப்படி வரும்?",
  {tip:"Here she is <b>Sarasvatī</b>, white, with book and rosary — chanted for the gift of speech."}),
 v(16, "Fruits of worship", "Those who worship you as Aruṇā, morning sun to poets' minds, charm the good with words deep as waves of love.",
  ["कवीन्द्राणां|of great poets; चेतःकमलवनबालातपरुचिं|the morning sunlight on the lotus forest of the mind",
   "भजन्ते|worship; ये|who; सन्तः|the good; कतिचिदरुणामेव|some, as Aruṇā, the red one|katicit · aruṇām · eva; भवतीम्|you",
   "विरिञ्चिप्रेयस्यास्तरुणतरशृङ्गारलहरी|(with words like) the young waves of love of Brahmā's beloved (Sarasvatī)",
   "गभीराभिर्वाग्भिर्विदधति|with deep words they create|gabhīrābhiḥ · vāgbhiḥ · vidadhati; सतां|of the good; रञ्जनममी|delight, they|rañjanam · amī"],
  "Those few good people who worship you as Aruṇā, the red one — the morning sunlight on the lotus forest of great poets' minds — delight the good with words as deep as the youthful waves of love of Brahmā's beloved, Sarasvatī.",
  "கவிச்சிறந்தோரின் மனத்தாமரைக் காட்டுக்கு இளஞ்சூரிய ஒளியான உன்னை அருணா வடிவில் வழிபடும் சில நல்லோர், சரஸ்வதியின் இளம் சிருங்கார அலைகள் போன்ற ஆழ்ந்த சொற்களால் நல்லோரை மகிழ்விக்கிறார்கள்."),
 v(17, "Fruits of worship", "Meditating on you with Vaśinī and the speech-goddesses, one becomes a poet whose words smell of Sarasvatī's lotus mouth.",
  ["सवित्रीभिर्वाचां|with the mothers of speech; शशिमणिशिलाभङ्गरुचिभिः|bright as pieces of moonstone",
   "वशिन्याद्याभिस्त्वां|you with Vaśinī and the others|vaśinī · ādyābhiḥ · tvām; सह|together; जननि|O mother; सञ्चिन्तयति|meditates; यः|who",
   "स|he; कर्ता|maker; काव्यानां|of poems; भवति|becomes; महतां|of the great; भङ्गिरुचिभिः|lovely in style",
   "वचोभिर्वाग्देवीवदनकमलामोदमधुरैः|with words sweet with the fragrance of Sarasvatī's lotus face"],
  "O mother, one who meditates on you together with Vaśinī and the other goddesses of speech, bright as fragments of moonstone, becomes a maker of poems like the great poets, with words lovely in style and sweet with the fragrance of Sarasvatī's lotus face.",
  "தாயே, சந்திரகாந்தக் கல் துண்டுகள் போல் ஒளிரும் வசினீ முதலிய வாக்தேவியருடன் உன்னைத் தியானிப்பவன், சரஸ்வதியின் முகத்தாமரையின் மணத்தால் இனிய, அழகிய நடையுடைய சொற்களால் பெரும் கவிகள் போன்ற காவியங்களை இயற்றுபவனாகிறான்."),
 v(18, "Fruits of worship", "One who sees heaven and earth drowned in your red glow is followed by Urvaśī and the celestial maidens.",
  ["तनुच्छायाभिस्ते|by the glow of your body|tanu · chāyābhiḥ · te; तरुणतरणिश्रीसरणिभिः|like the rising sun's splendour",
   "दिवं|heaven; सर्वामुर्वीमरुणिमनि|and all the earth, in redness|sarvām · urvīm · aruṇimani; मग्नां|immersed; स्मरति|meditates on; यः|who",
   "भवन्त्यस्य|they become his|bhavanti · asya; त्रस्यद्वनहरिणशालीननयनाः|with eyes shy as a startled forest doe",
   "सहोर्वश्या|with Urvaśī|saha · urvaśyā; वश्याः|under his sway; कति|how many; कति|how many; न|not; गीर्वाणगणिकाः|celestial maidens"],
  "One who meditates on heaven and the whole earth immersed in the red glow of your body, like the splendour of the rising sun — how many celestial maidens, Urvaśī among them, with eyes shy as a startled forest doe, do not come under his sway!",
  "உதய சூரியன் போன்ற உன் உடலொளியின் சிவப்பில் விண்ணும் மண்ணும் மூழ்கியதாகத் தியானிப்பவனுக்கு, அச்சமுற்ற காட்டு மான் போன்ற கண்களுடைய ஊர்வசி உட்பட எத்தனையோ தேவமங்கையர் வசப்படுகின்றனர்."),
 v(19, "Fruits of worship", "Meditating on your Kāmakalā form — face as bindu, breasts below, the triangle beneath — one charms the three worlds.",
  ["मुखं|face; बिन्दुं|as the bindu; कृत्वा|making; कुचयुगमधस्तस्य|the breasts below it|kuca · yugam · adhaḥ · tasya; तदधो|below that",
   "हरार्धं|half of Hara (the triangle); ध्यायेद्यो|who meditates|dhyāyet · yaḥ; हरमहिषि|O queen of Hara; ते|your; मन्मथकलाम्|Kāmakalā form",
   "स|he; सद्यः|at once; सङ्क्षोभं|agitation; नयति|brings; वनिता|women; इत्यतिलघु|this is a small thing|iti · ati · laghu",
   "त्रिलोकीमप्याशु|even the three worlds quickly; भ्रमयति|makes spin; रवीन्दुस्तनयुगाम्|whose breasts are sun and moon"],
  "O queen of Hara, one who meditates on your Kāmakalā form — your face as the bindu, your breasts below it, and below them the triangle — at once stirs women; that is a small thing — he soon sets spinning the three worlds themselves, whose breasts are the sun and moon.",
  "ஹரனின் மகிஷியே, முகத்தைப் பிந்துவாகவும், கீழே ஸ்தனங்களையும், அதன் கீழே திரிகோணத்தையும் கொண்ட உன் காமகலா வடிவத்தைத் தியானிப்பவன் உடனே பெண்களைக் கலங்கச் செய்கிறான் — அது சிறிய விஷயம்; சூரிய சந்திரர்களை ஸ்தனங்களாகக் கொண்ட மூவுலகையும் விரைவில் சுழலச் செய்கிறான்."),
 v(20, "Fruits of worship", "One who holds you in the heart as a moonstone image pouring nectar rays tames snake-poison and cools fever with a glance.",
  ["किरन्तीमङ्गेभ्यः|pouring from your limbs|kirantīm · aṅgebhyaḥ; किरणनिकुरुम्बामृतरसं|nectar from clusters of rays",
   "हृदि|in the heart; त्वामाधत्ते|holds you|tvām · ādhatte; हिमकरशिलामूर्तिमिव|like a moonstone image; यः|who",
   "स|he; सर्पाणां|of serpents; दर्पं|pride (poison); शमयति|subdues; शकुन्ताधिप|the king of birds (Garuḍa); इव|like",
   "ज्वरप्लुष्टान्दृष्ट्या|the fever-burned, by a glance|jvara · pluṣṭān · dṛṣṭyā; सुखयति|comforts; सुधाधारसिरया|with a vein of nectar"],
  "One who holds you in his heart like an image carved of moonstone, pouring nectar from the rays of your limbs, subdues the pride of serpents like Garuḍa, and with a glance flowing with nectar comforts those burned by fever.",
  "உன் அங்கங்களிலிருந்து கதிர்க்கூட்டங்களால் அமுதம் பொழியும் சந்திரகாந்தச் சிலை போல் உன்னை இதயத்தில் தியானிப்பவன், கருடன் போல் பாம்புகளின் விஷத்தை அடக்குகிறான்; அமுத நாடியுடைய பார்வையால் காய்ச்சலால் வாடுபவர்களுக்குச் சுகம் தருகிறான்."),
 v(21, "Fruits of worship", "Seeing your form, slender as lightning, above the six lotuses, the great are filled with waves of supreme joy.",
  ["तटिल्लेखातन्वीं|slender as a streak of lightning; तपनशशिवैश्वानरमयीं|made of sun, moon and fire",
   "निषण्णां|seated; षण्णामप्युपरि|above even the six|ṣaṇṇām · api · upari; कमलानां|lotuses; तव|your; कलाम्|digit, form",
   "महापद्माटव्यां|in the great lotus forest (sahasrāra); मृदितमलमायेन|with impurity and illusion crushed; मनसा|by a mind",
   "महान्तः|the great; पश्यन्तो|seeing; दधति|hold; परमाह्लादलहरीम्|a wave of supreme joy"],
  "Seeing with a mind from which impurity and illusion have been crushed your form — slender as a streak of lightning, made of sun, moon and fire, seated above the six lotuses in the great lotus forest — the great are filled with waves of supreme joy.",
  "மின்னல் கீற்று போல் மெல்லியதும், சூரியன், சந்திரன், அக்னி மயமானதும், ஆறு தாமரைகளுக்கும் மேலே மகாபத்ம வனத்தில் அமர்ந்ததுமான உன் கலையை, மலமும் மாயையும் நீங்கிய மனத்தால் காணும் மகான்கள் பரமானந்த அலையில் திளைக்கிறார்கள்."),
 v(22, "Fruits of worship", "One who begins “Bhavāni, you…” to ask for your glance — before he finishes, you give him union with yourself.",
  ["भवानि|O Bhavānī; त्वं|you; दासे|on your servant; मयि|on me; वितर|bestow; दृष्टिं|a glance; सकरुणां|full of compassion",
   "इति|thus; स्तोतुं|to praise; वाञ्छन्|wishing; कथयति|says; भवानि|“Bhavāni”; त्वमिति|“you…” — thus|tvam · iti; यः|who",
   "तदैव|at that very moment; त्वं|you; तस्मै|to him; दिशसि|grant; निजसायुज्यपदवीं|the state of union with you",
   "मुकुन्दब्रह्मेन्द्रस्फुटमकुटनीराजितपदाम्|whose feet are worshipped with lamps by the shining crowns of Mukunda, Brahmā and Indra"],
  "One who, wishing to praise you with “Bhavāni, you, on me your servant, bestow a compassionate glance”, says just “Bhavāni, you…” — at that very moment you grant him the state of union with you, whose feet are waved with lamps by the shining crowns of Mukunda, Brahmā and Indra.",
  "‘பவானி, நீ அடியவனான என்மீது கருணைப் பார்வையைச் செலுத்து’ என்று துதிக்க விரும்பி ‘பவானி த்வம்’ என்று சொல்லத் தொடங்கியவுடனேயே, முகுந்தன், பிரம்மன், இந்திரன் ஆகியோரின் ஒளிரும் மகுடங்களால் ஆரத்தி எடுக்கப்படும் திருவடிகளுடைய உன் சாயுஜ்யத்தை அவனுக்கு அருள்கிறாய்.",
  {tip:"A pun: <b>bhavāni tvam</b> means “O Bhavānī, you…” and also “may I become you” — so she grants union at once."}),
 v(23, "Śiva & Śakti", "Not content with Śiva's left half, you seem to have taken his right half too — your whole form is red and three-eyed.",
  ["त्वया|by you; हृत्वा|having taken; वामं|the left; वपुरपरितृप्तेन|body, not satisfied|vapuḥ · aparitṛptena; मनसा|with mind",
   "शरीरार्धं|half the body; शम्भोरपरमपि|of Śambhu, the other too|śambhoḥ · aparam · api; शङ्के|I suspect; हृतमभूत्|has been taken",
   "यदेतत्त्वद्रूपं|since this form of yours|yat · etat · tvat · rūpam; सकलमरुणाभं|all red-hued; त्रिनयनं|three-eyed",
   "कुचाभ्यामानम्रं|bent by your breasts; कुटिलशशिचूडालमकुटम्|with a crown bearing the crescent moon"],
  "Having taken Śambhu's left half, and not content in your mind, I suspect you took the other half too — for this whole form of yours is red, three-eyed, bent with your breasts, and crowned with the crescent moon.",
  "சம்புவின் இடப்பாதி உடலை எடுத்துக்கொண்டும் திருப்தியடையாமல், மறுபாதியையும் எடுத்துக்கொண்டாய் என்று சந்தேகிக்கிறேன் — ஏனெனில் உன் முழு வடிவமும் சிவந்து, முக்கண்ணுடன், ஸ்தனங்களால் வளைந்து, பிறைச்சந்திர மகுடத்துடன் இருக்கிறது."),
 v(24, "Śiva & Śakti", "Brahmā creates, Viṣṇu protects, Rudra destroys, Īśa conceals, Sadāśiva blesses — all at a flicker of your brows.",
  ["जगत्सूते|creates the world; धाता|Brahmā; हरिरवति|Hari protects|hariḥ · avati; रुद्रः|Rudra; क्षपयते|destroys",
   "तिरस्कुर्वन्नेतत्स्वमपि|withdrawing this and his own|tiraskurvan · etat · svam · api; वपुरीशस्तिरयति|body, Īśa conceals|vapuḥ · īśaḥ · tirayati",
   "सदापूर्वः|Sadāśiva; सर्वं|all; तदिदमनुगृह्णाति|this he blesses|tat · idam · anugṛhṇāti; च|and; शिव|Śiva",
   "स्तवाज्ञामालम्ब्य|resting on your command|tava · ājñām · ālambya; क्षणचलितयोर्भ्रूलतिकयोः|of your creeper-brows moved for a moment"],
  "Brahmā creates the world, Hari protects it, Rudra destroys it; Īśa, withdrawing it and his own body, conceals; and Sadāśiva blesses it all — each relying on your command, given by a moment's flicker of your creeper-like brows.",
  "பிரம்மன் உலகைப் படைக்கிறான், ஹரி காக்கிறான், ருத்ரன் அழிக்கிறான்; ஈசன் இதையும் தன் உடலையும் மறைக்கிறான்; சதாசிவன் இவை அனைத்தையும் அருள்கிறான் — உன் புருவக்கொடிகளின் கண நேர அசைவான ஆணையைப் பற்றியே.",
  {tip:"The <b>five acts</b> again (Lalitā 63–64) — all moved by her <b>bhrū-latikā</b>."}),
 v(25, "Śiva & Śakti", "Worship of your feet is worship of the three gods — they stand by your footstool with folded hands on their crowns.",
  ["त्रयाणां|of the three; देवानां|gods; त्रिगुणजनितानां|born of the three guṇas; तव|of you; शिवे|O Śivā",
   "भवेत्पूजा|becomes worship|bhavet · pūjā; पूजा|the worship; तव|your; चरणयोर्या|at your feet which|caraṇayoḥ · yā; विरचिता|is done",
   "तथा|thus; हि|indeed; त्वत्पादोद्वहनमणिपीठस्य|of the jewelled stool bearing your feet; निकटे|near",
   "स्थिता|standing; ह्येते|they indeed|hi · ete; शश्वन्मुकुलितकरोत्तंसमकुटाः|ever with folded hands on their crowns"],
  "O Śivā, the worship done at your feet is itself worship of the three gods born of your three guṇas — for they stand ever near the jewelled footstool that bears your feet, their hands folded like buds upon their crowns.",
  "சிவையே, உன் திருவடிகளுக்குச் செய்யும் பூஜையே உன் முக்குணங்களில் பிறந்த மூன்று தேவர்களுக்குமான பூஜை — ஏனெனில் அவர்கள் உன் பாதங்களைத் தாங்கும் மணிப் பீடத்தின் அருகே எப்போதும் கூப்பிய கைகளை மகுடத்தில் வைத்து நிற்கிறார்கள்."),
 v(26, "Śiva & Śakti", "At the great dissolution Brahmā, Viṣṇu, Yama and Kubera perish — only your husband sports on, O Satī.",
  ["विरिञ्चिः|Brahmā; पञ्चत्वं|death (return to the five elements); व्रजति|goes to; हरिराप्नोति|Hari reaches|hariḥ · āpnoti; विरतिं|cessation",
   "विनाशं|destruction; कीनाशो|Yama; भजति|meets; धनदो|Kubera; याति|goes to; निधनम्|his end",
   "वितन्द्री|unwearied; माहेन्द्री|of Indra; विततिरपि|the host too; संमीलितदृशा|with closed eyes",
   "महासंहारेऽस्मिन्|in this great dissolution; विहरति|sports; सति|O Satī; त्वत्पतिरसौ|this husband of yours"],
  "In the great dissolution Brahmā returns to the elements, Hari ceases, Yama is destroyed, Kubera meets his end, and even Indra's tireless host closes its eyes for ever — but your husband, O Satī, sports on.",
  "மகாப்ரளயத்தில் பிரம்மன் மரணமடைகிறான், ஹரி ஓய்கிறான், யமன் அழிகிறான், குபேரன் முடிவடைகிறான், இந்திரனின் சேனையும் கண்மூடுகிறது — சதியே, உன் கணவன் மட்டும் விளையாடிக்கொண்டிருக்கிறான்.",
  {tip:"Why does Śiva survive? Because of her — her tāṭaṅka (verse 28) and her presence as his wife."}),
 v(27, "Śiva & Śakti", "Let my talk be japa, my gestures mudrās, my walking pradakṣiṇa, my eating an offering — all I do, your worship.",
  ["जपो|japa; जल्पः|my chatter; शिल्पं|work of my hands; सकलमपि|all; मुद्राविरचना|making of mudrās",
   "गतिः|walking; प्रादक्षिण्यक्रमणमशनाद्याहुतिविधिः|circumambulation, eating and the rest an offering in the fire",
   "प्रणामः|prostration; संवेशः|lying down; सुखमखिलमात्मार्पणदृशा|all my joys, seen as self-offering",
   "सपर्यापर्यायस्तव|a form of your worship|saparyā · paryāyaḥ · tava; भवतु|may it be; यन्मे|whatever my|yat · me; विलसितम्|activity"],
  "May my chatter be japa, all the work of my hands mudrās, my walking pradakṣiṇa, my eating and drinking offerings in the fire, my lying down prostration, all my pleasures self-offering — may whatever I do be a form of your worship.",
  "என் பேச்சு ஜபமாகட்டும்; கைவேலைகளெல்லாம் முத்திரைகளாகட்டும்; நடை பிரதக்ஷிணமாகட்டும்; உணவு முதலியவை ஆகுதியாகட்டும்; படுப்பது நமஸ்காரமாகட்டும்; என் இன்பங்களெல்லாம் ஆத்ம சமர்ப்பணமாகட்டும் — நான் செய்வதெல்லாம் உன் பூஜையாகட்டும்.",
  {tip:"<b>The most-quoted verse</b> — all of life as worship. Learn it first."}),
 v(28, "Śiva & Śakti", "The gods drank nectar and still die; Śiva drank poison and lives — that is the power of your earrings.",
  ["सुधामप्यास्वाद्य|even after tasting nectar|sudhām · api · āsvādya; प्रतिभयजरामृत्युहरिणीं|that removes dreaded old age and death",
   "विपद्यन्ते|perish; विश्वे|all; विधिशतमखाद्या|Brahmā, Indra and the rest; दिविषदः|the gods",
   "करालं|terrible; यत्क्ष्वेलं|the poison which|yat · kṣvelam; कबलितवतः|of him who swallowed; कालकलना|the reckoning of time (death)",
   "न|not; शम्भोस्तन्मूलं|for Śambhu, the cause of that|śambhoḥ · tat · mūlam; तव|your; जननि|O mother; ताटङ्कमहिमा|the glory of your earrings"],
  "Even after tasting nectar, which removes dreaded old age and death, all the gods — Brahmā, Indra and the rest — perish. That Śambhu, who swallowed the terrible poison, is not touched by death — the cause of that, O mother, is the glory of your earrings.",
  "முதுமையையும் மரணத்தையும் போக்கும் அமுதத்தை உண்டும் பிரம்மன், இந்திரன் முதலிய தேவர்கள் அழிகிறார்கள். கொடிய விஷத்தை விழுங்கிய சம்புவுக்கு மரணம் இல்லாததற்குக் காரணம், தாயே, உன் தாடங்கங்களின் மகிமையே.",
  {tip:"<b>tāṭaṅka-mahimā</b> — her earrings are the sign of a married woman (sumaṅgalī); her husband cannot die."}),
 v(29, "Śiva & Śakti", "As you rise to greet Śiva, your maids cry: “Mind Brahmā's crown! Don't trip on Viṣṇu's! Step past Indra's!”",
  ["किरीटं|the crown; वैरिञ्चं|of Brahmā; परिहर|avoid; पुरः|in front; कैटभभिदः|of Viṣṇu",
   "कठोरे|hard; कोटीरे|on the crown; स्खलसि|you will trip; जहि|leave aside; जम्भारिमकुटम्|Indra's crown",
   "प्रणम्रेष्वेतेषु|as these bow|praṇamreṣu · eteṣu; प्रसभमुपयातस्य|of him who has suddenly come|prasabham · upayātasya; भवनं|to the house",
   "भवस्याभ्युत्थाने|in rising to greet Bhava|bhavasya · abhyutthāne; तव|your; परिजनोक्तिर्विजयते|the words of your attendants triumph"],
  "When Śiva suddenly comes home and you rise to greet him while the gods lie bowed before you, your attendants' words ring out: “Avoid Brahmā's crown in front! You'll trip on Viṣṇu's hard crown! Step past Indra's!”",
  "சிவன் திடீரென வீடு திரும்பும்போது, தேவர்கள் உன் முன் வணங்கிக் கிடக்க, நீ எழுந்து வரவேற்கும்போது உன் தோழியர் ‘பிரம்மனின் கிரீடத்தைத் தவிர்! விஷ்ணுவின் கடினமான கிரீடத்தில் இடறுவாய்! இந்திரனின் மகுடத்தை விலக்கு!’ என்று சொல்வது வெல்கிறது."),
 v(30, "Śiva & Śakti", "To one who meditates “I am you”, the fire of dissolution itself performs ārati.",
  ["स्वदेहोद्भूताभिर्घृणिभिरणिमाद्याभिरभितो|surrounded by rays born of your own body, Aṇimā and the others",
   "निषेव्ये|O you who are served; नित्ये|O eternal one; त्वामहमिति|“I am you” — thus|tvām · aham · iti; सदा|always; भावयति|meditates; यः|who",
   "किमाश्चर्यं|what wonder|kim · āścaryam; तस्य|for him; त्रिनयनसमृद्धिं|the glory of Śiva; तृणयतो|who counts as straw",
   "महासंवर्ताग्निर्विरचयति|the great fire of dissolution performs; नीराजनविधिम्|the rite of ārati"],
  "O eternal one, served all around by Aṇimā and the other powers born from the rays of your own body — for one who always meditates “I am you”, who counts even Śiva's wealth as straw, what wonder that the great fire of dissolution performs ārati to him?",
  "உன் உடலிலிருந்து தோன்றிய அணிமா முதலிய கதிர்களால் சூழப்பட்ட நித்யையே, ‘நானே நீ’ என்று எப்போதும் தியானிப்பவனுக்கு, சிவனின் செல்வத்தையும் புல்லாக மதிப்பவனுக்கு, மகாப்ரளய அக்னியே ஆரத்தி எடுப்பதில் என்ன ஆச்சரியம்?"),
 v(31, "Śiva & Śakti", "Śiva bound the world with sixty-four tantras; at your insistence he brought down your own tantra, giving all four aims.",
  ["चतुःषष्ट्या|with sixty-four; तन्त्रैः|tantras; सकलमतिसन्धाय|having deceived the whole|sakalam · atisandhāya; भुवनं|world",
   "स्थितस्तत्तत्सिद्धिप्रसवपरतन्त्रैः|having stayed with tantras that give particular powers; पशुपतिः|Paśupati",
   "पुनस्त्वन्निर्बन्धादखिलपुरुषार्थैकघटना|then, at your insistence, (your tantra) that alone brings all aims of life",
   "स्वतन्त्रं|independent; ते|your; तन्त्रं|tantra; क्षितितलमवातीतरदिदम्|he brought down to earth, this"],
  "Paśupati, having bound the whole world with sixty-four tantras, each giving some particular power, then at your insistence brought down to earth this independent tantra of yours, which alone brings all the aims of life.",
  "பசுபதி அறுபத்து நான்கு தந்திரங்களால் உலகைக் கட்டிவைத்து, பின்பு உன் வற்புறுத்தலால், எல்லா புருஷார்த்தங்களையும் தரும் சுதந்திரமான உன் தந்திரத்தைப் பூமிக்குக் கொண்டுவந்தான்."),
 v(32, "Śiva & Śakti", "Śiva, Śakti, Kāma, earth… with hrīṃ at the ends — these letters, Mother, become the parts of your name (the pañcadaśī).",
  ["शिवः|Śiva (ka); शक्तिः|Śakti (e); कामः|Kāma (ī); क्षितिरथ|earth (la), then|kṣitiḥ · atha; रविः|sun (ha); शीतकिरणः|moon (sa)",
   "स्मरो|Smara (ka); हंसः|Haṃsa (ha); शक्रस्तदनु|Indra (la), then|śakraḥ · tadanu; च|and; परामारहरयः|Parā (sa), Māra (ka), Hari (la)",
   "अमी|these; हृल्लेखाभिस्तिसृभिरवसानेषु|with three hrīṃs at the ends; घटिता|joined",
   "भजन्ते|attain; वर्णास्ते|letters, your|varṇāḥ · te; तव|your; जननि|O mother; नामावयवताम्|the state of limbs of your name"],
  "Śiva, Śakti, Kāma, earth; then sun, moon, Smara, Haṃsa, Indra; then Parā, Māra and Hari — these letters, joined at their ends with the three hrīṃs, O mother, become the limbs of your name (the fifteen-syllable mantra).",
  "சிவன், சக்தி, காமன், பூமி; சூரியன், சந்திரன், ஸ்மரன், ஹம்ஸன், இந்திரன்; பரா, மாரன், ஹரி — முடிவுகளில் மூன்று ஹ்ரீங்காரங்களுடன் இணைந்த இந்த எழுத்துக்கள், தாயே, உன் நாமத்தின் அங்கங்களாகின்றன.",
  {tip:"A coded verse: the <b>pañcadaśī</b> mantra — ka e ī la hrīṃ · ha sa ka ha la hrīṃ · sa ka la hrīṃ."}),
 v(33, "Śiva & Śakti", "Placing Kāma, yoni and Lakṣmī before your mantra, the blessed offer ghee into Śiva's fire with wish-jewel rosaries.",
  ["स्मरं|Smara (klīṃ); योनिं|yoni (aiṃ); लक्ष्मीं|Lakṣmī (śrīṃ); त्रितयमिदमादौ|these three at the start; तव|your; मनो|mantra",
   "र्निधायैके|having placed, some|nidhāya · eke; नित्ये|O eternal one; निरवधिमहाभोगरसिकाः|enjoying boundless great bliss",
   "भजन्ति|worship; त्वां|you; चिन्तामणिगुणनिबद्धाक्षवलयाः|with rosaries strung with wish-jewels",
   "शिवाग्नौ|in Śiva's fire; जुह्वन्तः|offering; सुरभिघृतधाराहुतिशतैः|with hundreds of offerings of fragrant ghee"],
  "O eternal one, placing these three — Smara, yoni and Lakṣmī — at the start of your mantra, some enjoy boundless bliss and worship you with rosaries of wish-jewels, offering hundreds of streams of fragrant ghee into the fire of Śiva.",
  "நித்யையே, ஸ்மரன், யோனி, லக்ஷ்மி ஆகிய மூன்றையும் உன் மந்திரத்தின் தொடக்கத்தில் வைத்து, சிலர் எல்லையற்ற பேரானந்தத்தை அனுபவித்து, சிந்தாமணி ஜபமாலைகளுடன், சிவாக்னியில் நறுமண நெய்த் தாரைகளை ஆகுதி செய்து உன்னை வழிபடுகிறார்கள்."),
 v(34, "Śiva & Śakti", "You are Śambhu's body, sun and moon your breasts; he is your Self — so the bond of whole and part is shared by both.",
  ["शरीरं|body; त्वं|you; शम्भोः|of Śambhu; शशिमिहिरवक्षोरुहयुगं|with moon and sun as your two breasts",
   "तवात्मानं|your Self|tava · ātmānam; मन्ये|I think; भगवति|O Bhagavatī; नवात्मानमनघम्|the ninefold, sinless (Śiva)",
   "अतः|so; शेषः|the part; शेषीत्ययमुभयसाधारणतया|and the whole — this, common to both",
   "स्थितः|stands; सम्बन्धो|the relation; वां|of you two; समरसपरानन्दपरयोः|equal in flavour, the highest bliss"],
  "You are the body of Śambhu, with the moon and sun as your breasts; your Self, O Bhagavatī, I think, is the sinless ninefold Śiva. So the relation of part and whole stands as common to you both — equal in flavour, the supreme bliss.",
  "நீ சம்புவின் உடல், சந்திர சூரியர்களே உன் ஸ்தனங்கள்; உன் ஆத்மா, பகவதியே, குறையற்ற நவாத்மனான சிவன் என்று நினைக்கிறேன். ஆகவே சேஷ-சேஷி உறவு உங்கள் இருவருக்கும் பொதுவாக — சமரசமான பரமானந்தமாக — நிலைக்கிறது."),
 v(35, "Śiva & Śakti", "You are mind, space, air, fire, water and earth — there is nothing beyond you; you take the form of the universe.",
  ["मनस्त्वं|you are mind|manaḥ · tvam; व्योम|space; त्वं|you; मरुदसि|you are air|marut · asi; मरुत्सारथिरसि|you are fire (air's charioteer)",
   "त्वमापस्त्वं|you are water, you|tvam · āpaḥ · tvam; भूमिस्त्वयि|earth, in you|bhūmiḥ · tvayi; परिणतायां|transformed; न|not; हि|indeed; परम्|anything beyond",
   "त्वमेव|you alone; स्वात्मानं|your own self; परिणमयितुं|to transform; विश्ववपुषा|into the form of the universe",
   "चिदानन्दाकारं|of the form of consciousness and bliss; शिवयुवति|O Śiva's young wife; भावेन|by intention; बिभृषे|you bear"],
  "You are mind; you are space; you are air; you are fire; you are water; you are earth — when you have transformed into all, there is nothing beyond. O young wife of Śiva, you alone, to transform yourself into the universe, take on the form of consciousness and bliss.",
  "நீயே மனம், நீயே ஆகாசம், நீயே காற்று, நீயே அக்னி, நீயே நீர், நீயே பூமி — நீ இவையாக மாறியபின் அப்பால் எதுவும் இல்லை. சிவனின் இளம் தேவியே, உன்னை உலக வடிவாக மாற்றவே சிதானந்த வடிவை நீ தாங்குகிறாய்.",
  {tip:"Six elements in six cakras — verses 36–41 go through them one by one, from the top down."}),
 v(36, "The cakras", "I bow to Śambhu in your Ājñā cakra, bright as a crore of suns and moons — who worships him dwells in a world of light.",
  ["तवाज्ञाचक्रस्थं|in your Ājñā cakra; तपनशशिकोटिद्युतिधरं|bearing the light of a crore of suns and moons",
   "परं|supreme; शम्भुं|Śambhu; वन्दे|I bow; परिमिलितपार्श्वं|whose side is joined; परचिता|with the supreme Consciousness (you)",
   "यमाराध्यन्|worshipping whom|yam · ārādhyan; भक्त्या|with devotion; रविशशिशुचीनामविषये|beyond the reach of sun, moon and fire",
   "निरालोकेऽलोके|in a world needing no light|nirāloke · aloke; निवसति|dwells; हि|indeed; भालोकभुवने|in a world of light"],
  "I bow to the supreme Śambhu in your Ājñā cakra, bearing the light of a crore of suns and moons, his side joined with you, the supreme Consciousness. One who worships him with devotion dwells in a world of light, beyond the reach of sun, moon and fire.",
  "உன் ஆக்ஞா சக்கரத்தில், கோடி சூரிய சந்திரர்களின் ஒளியுடன், பரசித்தான உன்னுடன் இணைந்த பரம சம்புவை வணங்குகிறேன். அவனைப் பக்தியுடன் ஆராதிப்பவன் சூரியன், சந்திரன், அக்னி எட்டாத ஒளி உலகில் வசிக்கிறான்."),
 v(37, "The cakras", "In your Viśuddhi I worship Śiva, pure as crystal, and the Goddess his equal — their light frees the world from darkness.",
  ["विशुद्धौ|in Viśuddhi; ते|your; शुद्धस्फटिकविशदं|clear as pure crystal; व्योमजनकं|creator of space",
   "शिवं|Śiva; सेवे|I serve; देवीमपि|and the Goddess|devīm · api; शिवसमानव्यवसिताम्|equal to Śiva in resolve",
   "ययोः|whose; कान्त्या|by the light; यान्त्याः|moving; शशिकिरणसारूप्यसरणेः|like the path of moonbeams",
   "विधूतान्तर्ध्वान्ता|its inner darkness shaken off; विलसति|shines; चकोरीव|like a cakora bird|cakorī · iva; जगती|the world"],
  "In your Viśuddhi cakra I serve Śiva, clear as pure crystal, creator of space, and the Goddess equal to Śiva in resolve; by their light, moving like moonbeams, the world, its inner darkness shaken off, rejoices like a cakora bird.",
  "உன் விசுத்தியில், தூய ஸ்படிகம் போல் தெளிந்த, ஆகாசத்தைப் படைத்த சிவனையும், சிவனுக்குச் சமமான தேவியையும் சேவிக்கிறேன்; நிலவுக்கதிர் போல் பரவும் அவர்கள் ஒளியால், உள்ளிருள் நீங்கிய உலகம் சகோர பக்ஷி போல் மகிழ்கிறது."),
 v(38, "The cakras", "I worship the swan pair in the heart's lotus — from whose talk come the eighteen sciences.",
  ["समुन्मीलत्संवित्कमलमकरन्दैकरसिकं|delighting only in the honey of the blooming lotus of awareness",
   "भजे|I worship; हंसद्वन्द्वं|the pair of swans; किमपि|indescribable; महतां|of the great; मानसचरम्|moving in the Mānasa lake (mind)",
   "यदालापादष्टादशगुणितविद्यापरिणतिः|from whose talk the eighteen sciences arise",
   "यदादत्ते|which takes|yat · ādatte; दोषाद्गुणमखिलमद्भ्यः|the good from the bad, as from water|doṣāt · guṇam · akhilam · adbhyaḥ; पय|milk; इव|like"],
  "I worship that indescribable pair of swans (Śiva and Śakti in the Anāhata), delighting only in the honey of the blooming lotus of awareness, moving in the minds of the great; from their talk come the eighteen sciences, and they take all good from the bad, as a swan takes milk from water.",
  "மலரும் ஞானத்தாமரையின் தேனை மட்டும் விரும்பும், மகான்களின் மனம் எனும் மானசத்தில் சஞ்சரிக்கும் அந்த அன்ன ஜோடியை வணங்குகிறேன்; அவர்கள் உரையாடலிலிருந்து பதினெட்டு வித்யைகள் தோன்றுகின்றன; நீரிலிருந்து பாலைப் பிரிப்பது போல் குற்றத்திலிருந்து குணத்தை எடுக்கிறார்கள்."),
 v(39, "The cakras", "In your Svādhiṣṭhāna I praise the fire Saṃvarta and Samayā — her cool glance soothes the worlds he burns.",
  ["तव|your; स्वाधिष्ठाने|in Svādhiṣṭhāna; हुतवहमधिष्ठाय|presiding over fire|hutavaham · adhiṣṭhāya; निरतं|ever",
   "तमीडे|I praise him|tam · īḍe; संवर्तं|Saṃvarta (the fire of dissolution); जननि|O mother; महतीं|great; तां|her; च|and; समयाम्|Samayā",
   "यदालोके|whose glance; लोकान्|the worlds; दहति|burns; महति|great; क्रोधकलिते|filled with anger",
   "दयार्द्रा|moist with mercy; या|which; दृष्टिः|glance; शिशिरमुपचारं|a cool remedy; रचयति|makes"],
  "O mother, in your Svādhiṣṭhāna I praise Saṃvarta, the fire ever present there, and the great Samayā — when his angry glance burns the worlds, her glance, moist with mercy, gives a cooling remedy.",
  "தாயே, உன் சுவாதிஷ்டானத்தில் உள்ள சம்வர்த்த அக்னியையும் மகதியான சமயாவையும் துதிக்கிறேன் — அவன் கோபப் பார்வை உலகங்களை எரிக்கும்போது, கருணையால் நனைந்த அவள் பார்வை குளிர்ந்த மருந்தாகிறது."),
 v(40, "The cakras", "I worship the dark cloud in your Maṇipūra, with lightning and rainbow, raining on the world scorched by Śiva's fire.",
  ["तटित्वन्तं|with lightning; शक्त्या|as Śakti; तिमिरपरिपन्थिस्फुरणया|flashing against darkness",
   "स्फुरन्नानारत्नाभरणपरिणद्धेन्द्रधनुषम्|with a rainbow of her many shining jewelled ornaments",
   "तव|your; श्यामं|dark; मेघं|cloud; कमपि|indescribable; मणिपूरैकशरणं|whose only home is the Maṇipūra",
   "निषेवे|I worship; वर्षन्तं|raining; हरमिहिरतप्तं|scorched by Hara as the sun; त्रिभुवनम्|the three worlds"],
  "I worship the indescribable dark cloud whose only home is your Maṇipūra — with you, Śakti, as lightning flashing against the darkness, and the rainbow of your shining jewels — raining on the three worlds scorched by Śiva's sun-fire.",
  "உன் மணிபூரகத்தையே இருப்பிடமாகக் கொண்ட அந்தக் கருமேகத்தை வழிபடுகிறேன் — இருளை எதிர்க்கும் மின்னலாக நீ, உன் ரத்தின ஆபரணங்களின் வானவில்லுடன் — சிவனின் சூரிய வெப்பத்தால் வாடிய மூவுலகுக்கும் மழை பொழிகிறது."),
 v(41, "The cakras", "In your Mūlādhāra, Śiva dances with Samayā — from their dance the world was born, with them as father and mother.",
  ["तवाधारे|in your Ādhāra|tava · ādhāre; मूले|root (Mūlādhāra); सह|with; समयया|Samayā; लास्यपरया|devoted to the lāsya dance",
   "नवात्मानं|the ninefold one; मन्ये|I think of; नवरसमहाताण्डवनटम्|the dancer of the great tāṇḍava of nine rasas",
   "उभाभ्यामेताभ्यामुदयविधिमुद्दिश्य|by these two, intending creation; दयया|with compassion",
   "सनाथाभ्यां|having them as protectors; जज्ञे|was born; जनकजननीमज्जगदिदम्|this world, having a father and mother"],
  "In your Mūlādhāra I think of the ninefold Śiva dancing the great tāṇḍava of the nine rasas, with Samayā devoted to the gentle lāsya. By these two, compassionately intending creation, this world was born — having a father and a mother.",
  "உன் மூலாதாரத்தில், லாஸ்யத்தில் ஈடுபட்ட சமயாவுடன் நவரச மகாதாண்டவம் ஆடும் நவாத்மனை நினைக்கிறேன். கருணையுடன் படைப்பை நோக்கிய இவ்விருவரால், தந்தையும் தாயும் உடைய இந்த உலகம் பிறந்தது.",
  {tip:"The end of the <b>Ānanda Laharī</b>. From verse 42 begins the <b>Saundarya Laharī</b> — her beauty from crown to feet."}),
 v(42, "Crown to feet", "Your golden crown, studded with the twelve suns as jewels — a poet thinks its curve is Indra's rainbow.",
  ["गतैर्माणिक्यत्वं|become rubies|gataiḥ · māṇikyatvam; गगनमणिभिः|by the sky-jewels (suns); सान्द्रघटितं|densely set",
   "किरीटं|crown; ते|your; हैमं|golden; हिमगिरिसुते|O daughter of the Himālaya; कीर्तयति|praises; यः|who",
   "स|he; नीडेयच्छायाच्छुरणशबलं|dappled with the light of the gems in their settings; चन्द्रशकलं|the crescent moon",
   "धनुः|bow; शौनासीरं|of Indra; किमिति|“what is it?”; न|not; निबध्नाति|forms; धिषणाम्|the thought"],
  "One who praises your golden crown, O daughter of the Himālaya — densely set with the twelve suns become rubies — would he not think the crescent moon on it, dappled with the light of the gems, to be Indra's rainbow?",
  "இமயமகளே, சூரியர்களே மாணிக்கங்களாகப் பதிக்கப்பட்ட உன் பொன் கிரீடத்தைப் புகழ்பவன், ரத்தினங்களின் ஒளியால் பல வண்ணமாகத் தோன்றும் அதிலுள்ள பிறைச்சந்திரனை இந்திரனின் வானவில் என்று நினைக்க மாட்டானா?"),
 v(43, "Crown to feet", "May your dense, glossy hair dispel our darkness — Indra's garden flowers live in it to borrow its fragrance.",
  ["धुनोतु|may (it) shake off; ध्वान्तं|darkness; नस्तुलितदलितेन्दीवरवनं|our — like a forest of blooming blue lilies|naḥ · tulita · dalita · indīvara · vanam",
   "घनस्निग्धश्लक्ष्णं|dense, glossy, soft; चिकुरनिकुरुम्बं|mass of hair; तव|your; शिवे|O Śivā",
   "यदीयं|whose; सौरभ्यं|fragrance; सहजमुपलब्धुं|natural, to gain; सुमनसो|the flowers",
   "वसन्त्यस्मिन्|live in it; मन्ये|I think; बलमथनवाटीविटपिनाम्|of the trees in Indra's garden"],
  "O Śivā, may your mass of hair — dense, glossy and soft, like a forest of blooming blue lilies — dispel our darkness. I think the flowers of the trees in Indra's garden live in it to gain its natural fragrance.",
  "சிவையே, மலர்ந்த நீலோத்பலக் காடு போன்ற, அடர்ந்த, பளபளப்பான, மென்மையான உன் கூந்தல் நம் இருளைப் போக்கட்டும். அதன் இயற்கை மணத்தைப் பெறவே இந்திரனின் நந்தவன மரங்களின் மலர்கள் அதில் வசிக்கின்றன என்று நினைக்கிறேன்."),
 v(44, "Crown to feet", "Your hair-parting, red with vermilion, is like a stream of your beauty — or the young sun caught by your dark locks.",
  ["तनोतु|may (it) spread; क्षेमं|welfare; नस्तव|our, your|naḥ · tava; वदनसौन्दर्यलहरी|wave of your face's beauty",
   "परीवाहस्रोतःसरणिरिव|like the channel of its overflow; सीमन्तसरणिः|the line of your hair-parting",
   "वहन्ती|bearing; सिन्दूरं|vermilion; प्रबलकबरीभारतिमिर|the darkness of your heavy braid",
   "द्विषां|of the enemies; बृन्दैर्बन्दीकृतमिव|as if taken captive by the hosts; नवीनार्ककिरणम्|the rays of the young sun"],
  "May the line of your hair-parting spread our welfare — like the channel of the overflowing waves of your face's beauty, bearing vermilion, as if the rays of the rising sun were taken captive by the darkness of your heavy braid, its enemies.",
  "உன் முக அழகலையின் பெருக்கு ஓடும் கால்வாய் போன்ற, சிந்தூரம் தாங்கிய உன் வகிடு நம் நலனைப் பெருக்கட்டும் — கனத்த கூந்தல் இருள் எனும் பகைவர்கள் இளஞ்சூரியனின் கதிர்களைச் சிறைப்பிடித்தது போல் உள்ளது."),
 v(45, "Crown to feet", "Your face, framed by curls like young bees, mocks the lotus — Śiva's eyes are the bees drunk on its fragrance.",
  ["अरालैः|with curling; स्वाभाव्यादलिकलभसश्रीभिरलकैः|naturally, locks lovely as young bees",
   "परीतं|surrounded; ते|your; वक्त्रं|face; परिहसति|laughs at; पङ्केरुहरुचिम्|the beauty of the lotus",
   "दरस्मेरे|gently smiling; यस्मिन्|in which; दशनरुचिकिञ्जल्करुचिरे|lovely with teeth like filaments",
   "सुगन्धौ|fragrant; माद्यन्ति|are intoxicated; स्मरदहनचक्षुर्मधुलिहः|the bees that are the eyes of Kāma's burner (Śiva)"],
  "Your face, surrounded by naturally curling locks lovely as young bees, laughs at the lotus — in that gently smiling, fragrant face, lovely with teeth like lotus filaments, the bee-like eyes of Śiva, burner of Kāma, are intoxicated.",
  "இயல்பாகச் சுருண்ட, இளம் வண்டுகள் போன்ற கூந்தலால் சூழப்பட்ட உன் முகம் தாமரையின் அழகைக் கேலி செய்கிறது; தாமரைக் கேசரம் போன்ற பற்களுடன் மெல்லப் புன்னகைக்கும் அந்த மணமுள்ள முகத்தில் காமனை எரித்தவனின் கண்கள் எனும் வண்டுகள் மயங்குகின்றன."),
 v(46, "Crown to feet", "Your forehead is a second crescent; put with the crescent on your crown, the two make the full moon.",
  ["ललाटं|forehead; लावण्यद्युतिविमलमाभाति|shines pure with the light of beauty|lāvaṇya · dyuti · vimalam · ābhāti; तव|your; यत्|which",
   "द्वितीयं|a second; तन्मन्ये|that I think|tat · manye; मकुटघटितं|set in the crown; चन्द्रशकलम्|crescent moon",
   "विपर्यासन्यासादुभयमपि|both, placed reversed|viparyāsa · nyāsāt · ubhayam · api; सम्भूय|joining; च|and; मिथः|together",
   "सुधालेपस्यूतिः|sewn with a paste of nectar; परिणमति|becomes; राकाहिमकरः|the full moon"],
  "Your forehead, shining pure with the light of beauty, I think is a second crescent to the one set in your crown; the two, placed back to back and joined with a paste of nectar, become the full moon.",
  "அழகொளியால் தூயதாக ஒளிரும் உன் நெற்றி, மகுடத்தில் பதித்த பிறைக்கு இரண்டாவது பிறை என்று நினைக்கிறேன்; இரண்டும் எதிரெதிராக வைத்து அமுதப் பசையால் இணைக்கப்பட்டால் பூரண சந்திரன் ஆகும்."),
 v(47, "Crown to feet", "Your brows, bent to break the world's fear, are Kāma's bow, its string your bee-dark eyes, his fist hiding its middle.",
  ["भ्रुवौ|brows; भुग्ने|bent; किञ्चिद्भुवनभयभङ्गव्यसनिनि|a little — O you eager to break the world's fear",
   "त्वदीये|your; नेत्राभ्यां|by the eyes; मधुकररुचिभ्यां|dark as bees; धृतगुणम्|holding the string",
   "धनुर्मन्ये|a bow, I think|dhanuḥ · manye; सव्येतरकरगृहीतं|held in the left hand; रतिपतेः|of Rati's lord",
   "प्रकोष्ठे|forearm; मुष्टौ|fist; च|and; स्थगयति|hides; निगूढान्तरमुमे|its hidden middle, O Umā"],
  "O Umā, eager to break the fear of the world, your slightly bent brows, with your bee-dark eyes as the string, I think are the bow held in the left hand of Kāma, whose forearm and fist hide its middle.",
  "உலக பயத்தைப் போக்கும் ஆர்வமுடைய உமையே, வண்டு போன்ற கண்களை நாணாகக் கொண்ட சற்று வளைந்த உன் புருவங்கள், மன்மதன் இடக்கையில் பிடித்த வில் — நடுப்பகுதியை அவன் முஷ்டி மறைக்கிறது — என்று நினைக்கிறேன்."),
 v(48, "Crown to feet", "Your right eye is the sun, making day; the left, the moon, making night; the third, a golden lotus, makes twilight.",
  ["अहः|day; सूते|creates; सव्यं|right; तव|your; नयनमर्कात्मकतया|eye, being the sun",
   "त्रियामां|night; वामं|left; ते|your; सृजति|creates; रजनीनायकतया|being the moon",
   "तृतीया|third; ते|your; दृष्टिर्दरदलितहेमाम्बुजरुचिः|eye, like a half-blown golden lotus",
   "समाधत्ते|brings about; सन्ध्यां|twilight; दिवसनिशयोरन्तरचरीम्|that moves between day and night"],
  "Your right eye, being the sun, creates the day; your left, being the moon, creates the night; your third eye, like a half-opened golden lotus, brings about the twilight that moves between day and night.",
  "உன் வலக்கண் சூரியனாக பகலைப் படைக்கிறது; இடக்கண் சந்திரனாக இரவைப் படைக்கிறது; பாதி மலர்ந்த பொற்றாமரை போன்ற மூன்றாம் கண் பகலுக்கும் இரவுக்கும் இடைப்பட்ட சந்தியாவை உண்டாக்குகிறது."),
 v(49, "Crown to feet", "Your glance is Viśālā, Kalyāṇī, Ayodhyā, Dhārā, Madhurā, Bhogavatī, Avantī, Vijayā — eight cities in one.",
  ["विशाला|wide (Viśālā); कल्याणी|auspicious (Kalyāṇī); स्फुटरुचिरयोध्या|bright, unconquerable (Ayodhyā)|sphuṭa · ruciḥ · ayodhyā; कुवलयैः|by blue lilies",
   "कृपाधाराधारा|the support of streams of mercy (Dhārā); किमपि|indescribably; मधुराऽऽभोगवतिका|sweet (Madhurā), vast (Bhogavatī)",
   "अवन्ती|protecting (Avantī); दृष्टिस्ते|your glance|dṛṣṭiḥ · te; बहुनगरविस्तारविजया|victorious, the spread of many cities (Vijayā)",
   "ध्रुवं|surely; तत्तन्नामव्यवहरणयोग्या|fit to be called by each of those names; विजयते|triumphs"],
  "Your glance is wide (Viśālā), auspicious (Kalyāṇī), bright and unconquerable by blue lilies (Ayodhyā), a support for streams of mercy (Dhārā), sweet (Madhurā), vast (Bhogavatī), protecting (Avantī), victorious (Vijayā) — surely it triumphs, fit to be called by the names of all these cities.",
  "உன் பார்வை விசாலமானது (விசாலா), மங்களமானது (கல்யாணி), நீலோத்பலங்களால் வெல்ல முடியாதது (அயோத்யா), கருணை தாரைகளின் ஆதாரம் (தாரா), இனியது (மதுரா), பரந்தது (போகவதி), காப்பது (அவந்தி), வெற்றியுடையது (விஜயா) — இந்த நகரங்களின் பெயர்களுக்கெல்லாம் தகுந்தது.",
  {tip:"A pun on <b>eight ancient cities</b>: Viśālā, Kalyāṇī, Ayodhyā, Dhārā, Madhurā, Bhogavatī, Avantī, Vijayā."}),
 v(50, "Crown to feet", "Your ears drink poets' honeyed verses; your eye-bees, darting to them, make your third eye red with jealousy.",
  ["कवीनां|of poets; सन्दर्भस्तबकमकरन्दैकरसिकं|delighting in the honey of the flower-clusters of their compositions",
   "कटाक्षव्याक्षेपभ्रमरकलभौ|the two young bees of your darting side-glances; कर्णयुगलम्|the pair of ears",
   "अमुञ्चन्तौ|not leaving; दृष्ट्वा|seeing; तव|your; नवरसास्वादतरलौ|trembling to taste the nine rasas",
   "असूयासंसर्गादलिकनयनं|from touch of envy, the forehead eye|asūyā · saṃsargāt · alika · nayanam; किञ्चिदरुणम्|is slightly red"],
  "Seeing your two eyes, like young bees, never leaving your ears that delight in the honey of poets' compositions, trembling to taste the nine rasas — your forehead eye has turned slightly red with envy.",
  "கவிகளின் படைப்புகளின் தேனை விரும்பும் உன் காதுகளை விட்டு நீங்காத, நவரசங்களைச் சுவைக்கத் துடிக்கும் இளம் வண்டுகள் போன்ற உன் இரு கண்களைக் கண்டு, உன் நெற்றிக்கண் பொறாமையால் சற்றுச் சிவந்துள்ளது."),
 v(51, "Crown to feet", "Your glance is loving to Śiva, scornful to others, angry at Gaṅgā, wondering at his deeds — and to me, compassionate.",
  ["शिवे|towards Śiva; शृङ्गारार्द्रा|moist with love; तदितरजने|towards other people; कुत्सनपरा|full of disdain",
   "सरोषा|angry; गङ्गायां|at Gaṅgā; गिरिशचरिते|at Giriśa's deeds; विस्मयवती|full of wonder",
   "हराहिभ्यो|of Hara's serpents; भीता|afraid; सरसिरुहसौभाग्यजननी|surpassing the lotus in beauty",
   "सखीषु|towards friends; स्मेरा|smiling; ते|your; मयि|towards me; जननि|O mother; दृष्टिः|glance; सकरुणा|compassionate"],
  "O mother, your glance is moist with love towards Śiva, scornful towards others, angry at Gaṅgā (on his head), full of wonder at Giriśa's deeds, afraid of his serpents, more lovely than the lotus, smiling towards your friends — and towards me, full of compassion.",
  "தாயே, உன் பார்வை சிவனிடம் சிருங்காரத்தால் நனைந்தது, மற்றவர்களிடம் இகழ்ச்சியுடையது, கங்கையிடம் கோபமுடையது, கிரீசனின் செயல்களில் வியப்புடையது, ஹரனின் பாம்புகளிடம் அச்சமுடையது, தாமரையைவிட அழகியது, தோழியரிடம் புன்னகையுடையது — என்னிடம் கருணையுடையது.",
  {tip:"The <b>nine rasas</b> in one glance: śṛṅgāra, bībhatsa, raudra, adbhuta, bhayānaka, vīra (beauty), hāsya, karuṇā…"}),
 v(52, "Crown to feet", "Your eyes reach your ears, lashes like arrow-feathers — they look like Kāma's arrows drawn to the ear.",
  ["गते|having gone; कर्णाभ्यर्णं|near the ears; गरुत|feathers; इव|like; पक्ष्माणि|lashes; दधती|bearing",
   "पुरां|of the cities; भेत्तुश्चित्तप्रशमरसविद्रावणफले|whose fruit is melting the calm of the destroyer of the cities",
   "इमे|these; नेत्रे|two eyes; गोत्राधरपतिकुलोत्तंसकलिके|O bud adorning the family of the mountain king",
   "तवाकर्णाकृष्टस्मरशरविलासं|the charm of Kāma's arrows drawn to the ear; कलयतः|display"],
  "O bud adorning the mountain king's family, your two eyes, reaching to your ears, their lashes like the feathers of arrows, whose result is to melt the calm of Śiva — they show the charm of Kāma's arrows drawn back to the ear.",
  "மலையரசன் குலத்தை அலங்கரிக்கும் மொட்டே, காதுவரை நீண்ட, அம்பின் இறகுகள் போன்ற இமைகளுடைய, திரிபுராரியின் அமைதியைக் கரைக்கும் உன் இரு கண்களும் காதுவரை இழுத்த மன்மத அம்புகளின் அழகைக் காட்டுகின்றன."),
 v(53, "Crown to feet", "Your three eyes, three-coloured with collyrium, seem to bear rajas, sattva and tamas — to recreate Brahmā, Viṣṇu, Rudra.",
  ["विभक्तत्रैवर्ण्यं|divided into three colours; व्यतिकरितलीलाञ्जनतया|by the playful collyrium mixed in",
   "विभाति|shines; त्वन्नेत्रत्रितयमिदमीशानदयिते|this triad of your eyes, O beloved of Īśāna",
   "पुनः|again; स्रष्टुं|to create; देवान्|the gods; द्रुहिणहरिरुद्रानुपरतान्|Brahmā, Hari and Rudra, who had ceased",
   "रजः|rajas; सत्त्वं|sattva; बिभ्रत्तम|bearing tamas|bibhrat · tamaḥ; इति|thus; गुणानां|of the guṇas; त्रयमिव|like the three"],
  "O beloved of Īśāna, your three eyes, three-coloured with the playful collyrium, shine as if bearing the three guṇas — rajas, sattva and tamas — to create again Brahmā, Viṣṇu and Rudra, who had ceased to be.",
  "ஈசானனின் பிரியையே, விளையாட்டாகத் தீட்டிய மையால் மூன்று நிறங்களாகப் பிரிந்த உன் மூன்று கண்களும், லயமடைந்த பிரம்மா, ஹரி, ருத்ரனை மீண்டும் படைக்க ரஜஸ், சத்வம், தமஸ் எனும் முக்குணங்களைத் தாங்கியவை போல் ஒளிர்கின்றன."),
 v(54, "Crown to feet", "Red, white and dark, your eyes are Śoṇa, Gaṅgā and Yamunā — you bring us the sinless meeting of three holy rivers.",
  ["पवित्रीकर्तुं|to purify; नः|us; पशुपतिपराधीनहृदये|O you whose heart belongs to Paśupati",
   "दयामित्रैर्नेत्रैररुणधवलश्यामरुचिभिः|with eyes that are friends of mercy, red, white and dark",
   "नदः|the river; शोणो|Śoṇa; गङ्गा|Gaṅgā; तपनतनयेति|the sun's daughter (Yamunā) — thus; ध्रुवममुं|surely this",
   "त्रयाणां|of the three; तीर्थानामुपनयसि|holy rivers you bring|tīrthānām · upanayasi; सम्भेदमनघम्|the sinless confluence"],
  "O you whose heart belongs to Paśupati, to purify us, with your eyes — friends of mercy, red, white and dark — you surely bring us the sinless confluence of three holy rivers: the Śoṇa, the Gaṅgā and the Yamunā.",
  "பசுபதியிடம் இதயத்தை ஒப்படைத்தவளே, எங்களைத் தூய்மைப்படுத்த, கருணையின் நண்பர்களான சிவப்பு, வெள்ளை, கருப்பு நிறக் கண்களால் சோணா, கங்கை, யமுனை ஆகிய மூன்று தீர்த்தங்களின் புனித சங்கமத்தை எங்களுக்குக் கொண்டுவருகிறாய்."),
 v(55, "Crown to feet", "The world ends and begins as you close and open your eyes — so, to save it, I think your eyes never blink.",
  ["निमेषोन्मेषाभ्यां|by closing and opening (of eyes); प्रलयमुदयं|dissolution and rise; याति|goes to; जगती|the world",
   "तवेत्याहुः|“yours” — thus they say|tava · iti · āhuḥ; सन्तो|the wise; धरणिधरराजन्यतनये|O daughter of the mountain king",
   "त्वदुन्मेषाज्जातं|born from your opening (of eyes); जगदिदमशेषं|this whole world; प्रलयतः|from dissolution",
   "परित्रातुं|to save; शङ्के|I think; परिहृतनिमेषास्तव|have given up blinking, your; दृशः|eyes"],
  "The wise say the world goes to dissolution and rise with the closing and opening of your eyes, O daughter of the mountain king. So I think your eyes have given up blinking, to save this whole world, born from their opening, from dissolution.",
  "மலையரசன் மகளே, உன் கண்கள் மூடித் திறப்பதால் உலகம் அழிந்து தோன்றுகிறது என்று சான்றோர் சொல்கிறார்கள். உன் கண் திறப்பால் பிறந்த இந்த உலகை அழிவிலிருந்து காக்கவே உன் கண்கள் இமைப்பதை விட்டுவிட்டன என்று நினைக்கிறேன்."),
 v(56, "Crown to feet", "The fish hide in the water unblinking, afraid your eyes will tell tales; the lily opens only at night when your eyes rest.",
  ["तवापर्णे|O Aparṇā, your; कर्णेजपनयनपैशुन्यचकिता|afraid of the tale-telling of your eyes that whisper at your ears",
   "निलीयन्ते|hide; तोये|in water; नियतमनिमेषाः|always unblinking; शफरिकाः|the little fish",
   "इयं|this; च|and; श्रीर्बद्धच्छदपुटकवाटं|Śrī, closing the doors of its petals; कुवलयं|the blue lily",
   "जहाति|leaves; प्रत्यूषे|at dawn; निशि|at night; च|and; विघटय्य|opening; प्रविशति|enters"],
  "O Aparṇā, afraid of your eyes that whisper at your ears telling tales of them, the little fish hide in the water, always unblinking; and Śrī leaves the blue lily, closing its petal-doors at dawn, and enters it only at night, opening them.",
  "அபர்ணையே, காதருகே கோள் சொல்லும் உன் கண்களுக்கு அஞ்சி, சிறு மீன்கள் இமைக்காமல் நீரில் ஒளிந்துகொள்கின்றன; லக்ஷ்மியும் விடியலில் இதழ்க் கதவுகளை மூடி நீலோத்பலத்தை விட்டு, இரவில் திறந்து நுழைகிறாள்."),
 v(57, "Crown to feet", "Bathe me too, far off and wretched, with your long glance — the moon shines alike on forest and palace.",
  ["दृशा|with a glance; द्राघीयस्या|very long; दरदलितनीलोत्पलरुचा|bright as a half-opened blue lotus",
   "दवीयांसं|far away; दीनं|wretched; स्नपय|bathe; कृपया|with mercy; मामपि|me too; शिवे|O Śivā",
   "अनेनायं|by this, this one|anena · ayam; धन्यो|blessed; भवति|becomes; न|not; च|and; ते|to you; हानिरियता|any loss by this",
   "वने|in a forest; वा|or; हर्म्ये|in a palace; वा|or; समकरनिपातो|whose rays fall alike; हिमकरः|the moon"],
  "O Śivā, bathe me too with mercy — far away and wretched — with your long glance, bright as a half-opened blue lotus. By this I become blessed, and you lose nothing — the moon's rays fall alike on a forest and a palace.",
  "சிவையே, பாதி மலர்ந்த நீலோத்பலம் போன்ற உன் நீண்ட பார்வையால் தொலைவில் உள்ள ஏழையான என்னையும் கருணையுடன் நனைப்பாயாக. இதனால் நான் பாக்கியவானாகிறேன்; உனக்கு இழப்பில்லை — காட்டிலும் மாளிகையிலும் சந்திரனின் கதிர்கள் சமமாகவே விழுகின்றன.",
  {tip:"A loved prayer: <b>snapaya kṛpayā mām api</b> — “bathe me too”. The moon shines on all alike."}),
 v(58, "Crown to feet", "Your curved temples look like Kāma's bow; your side-glance crossing your ear looks like an arrow set on it.",
  ["अरालं|curved; ते|your; पालीयुगलमगराजन्यतनये|pair of temples, O daughter of the mountain king",
   "न|not; केषामाधत्ते|whose (mind) does it give|keṣām · ādhatte; कुसुमशरकोदण्डकुतुकम्|the fancy of the flower-archer's bow",
   "तिरश्चीनो|slanting; यत्र|where; श्रवणपथमुल्लङ्घ्य|crossing the path of the ear; विलसन्|shining",
   "अपाङ्गव्यासङ्गो|the reach of your side-glance; दिशति|gives; शरसन्धानधिषणाम्|the idea of an arrow fitted"],
  "O daughter of the mountain king, in whose mind does the curve of your two temples not raise the fancy of Kāma's flower-bow — where your side-glance, slanting across past your ear, gives the idea of an arrow fitted to it?",
  "மலையரசன் மகளே, உன் வளைந்த இரு நெற்றிப் பொட்டுகள் யாருக்குத்தான் மன்மதனின் மலர்வில்லை நினைவூட்டாது? அங்கே காதைக் கடந்து சாய்ந்து ஒளிரும் உன் கடைக்கண் அம்பு பொருத்தியது போல் தோன்றுகிறது."),
 v(59, "Crown to feet", "Your face, with earrings reflected in your cheeks, is Kāma's four-wheeled chariot — riding it he challenges Śiva.",
  ["स्फुरद्गण्डाभोगप्रतिफलितताटङ्कयुगलं|with the pair of earrings reflected in your shining cheeks",
   "चतुश्चक्रं|four-wheeled; मन्ये|I think; तव|your; मुखमिदं|this face; मन्मथरथम्|Kāma's chariot",
   "यमारुह्य|mounting which; द्रुह्यत्यवनिरथमर्केन्दुचरणं|he attacks (Śiva) whose chariot is the earth with sun and moon as wheels",
   "महावीरो|the great hero; मारः|Māra (Kāma); प्रमथपतये|the lord of the Pramathas; सज्जितवते|who stood ready"],
  "I think your face, with the pair of earrings reflected in your shining cheeks, is Kāma's four-wheeled chariot — mounting which the great hero Kāma attacks the lord of the Pramathas, who stood ready on his chariot, the earth, with the sun and moon as wheels.",
  "பளபளக்கும் கன்னங்களில் தாடங்கங்கள் பிரதிபலிக்கும் உன் முகம், நான்கு சக்கரமுடைய மன்மத ரதம் என்று நினைக்கிறேன் — அதில் ஏறி மகாவீரனான மாரன், பூமியைத் தேராகவும் சூரிய சந்திரரைச் சக்கரங்களாகவும் கொண்டு தயாரான பிரமதபதியை எதிர்க்கிறான்."),
 v(60, "Crown to feet", "As you drink Sarasvatī's nectar words, your nodding head makes your earrings jingle — as if answering her.",
  ["सरस्वत्याः|of Sarasvatī; सूक्तीरमृतलहरीकौशलहरीः|words surpassing waves of nectar in skill",
   "पिबन्त्याः|drinking; शर्वाणि|O Śarvāṇī; श्रवणचुलुकाभ्यामविरलम्|with the cups of your ears, constantly",
   "चमत्कारश्लाघाचलितशिरसः|your head nodding in wonder and praise; कुण्डलगणो|the earrings",
   "झणत्कारैस्तारैः|with high jingling; प्रतिवचनमाचष्ट|seem to answer|prativacanam · ācaṣṭe; इव|as if; ते|your"],
  "O Śarvāṇī, as you drink constantly with the cups of your ears Sarasvatī's words, surpassing waves of nectar, your head nods in wonder and praise — and your earrings, with their high jingling, seem to give her an answer.",
  "சர்வாணியே, அமுத அலைகளையும் மிஞ்சும் சரஸ்வதியின் சொற்களைக் காதுகளால் இடைவிடாமல் பருகும்போது, வியப்பாலும் பாராட்டாலும் தலையசைக்கும் உன் குண்டலங்கள் உரத்த ஜணத்கார ஒலியால் அவளுக்குப் பதில் சொல்வது போல் உள்ளன."),
 v(61, "Crown to feet", "Your nose, a bamboo of the Himālaya's line, holds pearls within — breathed out as your pearl nose-ring.",
  ["असौ|this; नासावंशस्तुहिनगिरिवंशध्वजपटि|bamboo of your nose, O banner of the Himālaya's line",
   "त्वदीयो|your; नेदीयः|very near; फलतु|may it yield; फलमस्माकमुचितम्|fruit fitting for us",
   "वहत्यन्तर्मुक्ताः|it bears pearls within; शिशिरकरनिश्वासगलितं|breathed out through the cool (moon) nostril",
   "समृद्ध्या|in abundance; यत्तासां|so that of them|yat · tāsām; बहिरपि|outside too; च|and; मुक्तामणिधरः|wearing a pearl"],
  "O banner of the Himālaya's line, may the bamboo of your nose yield us fitting fruit soon. It bears pearls within, so abundant that one, breathed out through your cool left nostril, is worn outside as a pearl ornament.",
  "இமய வம்சத்தின் கொடியே, உன் மூக்கு எனும் மூங்கில் எங்களுக்குத் தகுந்த பலனை விரைவில் தரட்டும். அது உள்ளே முத்துக்களைத் தாங்குகிறது; அவை நிறைந்திருப்பதால் குளிர்ந்த மூச்சால் வெளிவந்த ஒன்றை வெளியேயும் முத்து மூக்குத்தியாக அணிந்திருக்கிறது.",
  {tip:"Pearls were believed to grow inside <b>bamboo</b> — her nose is that bamboo."}),
 v(62, "Crown to feet", "Coral and bimba fruit cannot match your red lips — even the bimba is ashamed, red only from reflecting them.",
  ["प्रकृत्याऽऽरक्तायास्तव|naturally red, of your|prakṛtyā · āraktāyāḥ · tava; सुदति|O you with lovely teeth; दन्तच्छदरुचेः|of the beauty of your lips",
   "प्रवक्ष्ये|I shall tell; सादृश्यं|a likeness; जनयतु|may produce; फलं|fruit; विद्रुमलता|the coral creeper",
   "न|not; बिम्बं|the bimba fruit; तद्बिम्बप्रतिफलनरागादरुणितं|reddened by reflecting their colour",
   "तुलामध्यारोढुं|to be weighed against|tulām · adhyāroḍhum; कथमिव|how; विलज्जेत|would not be ashamed; कलया|even slightly"],
  "O you with lovely teeth, for the beauty of your naturally red lips, I would name a likeness — if the coral creeper bore fruit! The bimba fruit, reddened only by reflecting their colour, would surely be ashamed to be weighed against them.",
  "அழகிய பற்களுடையவளே, இயல்பாகச் சிவந்த உன் உதடுகளுக்கு உவமை சொல்வேன் — பவழக்கொடி பழம் தந்தால்! அவற்றின் நிறத்தைப் பிரதிபலித்ததால் மட்டுமே சிவந்த கோவைப்பழம் ஒப்பிட நாணும்."),
 v(63, "Crown to feet", "The cakora birds, sated with your moon-face's smile, now drink the moon's nectar only as sour gruel.",
  ["स्मितज्योत्स्नाजालं|the moonlight of your smile; तव|your; वदनचन्द्रस्य|of the moon of your face; पिबतां|of those drinking",
   "चकोराणामासीदतिरसतया|for the cakoras, from too much sweetness; चञ्चुजडिमा|numbness of the beak",
   "अतस्ते|so they; शीतांशोरमृतलहरीमम्लरुचयः|the nectar-waves of the moon, wanting something sour",
   "पिबन्ति|drink; स्वच्छन्दं|freely; निशि|night; निशि|after night; भृशं|greatly; काञ्जिकधिया|thinking it sour gruel"],
  "The cakora birds, drinking the moonlight of the smile on your moon-face, got numb beaks from too much sweetness; so now, wanting something sour, they drink the moon's nectar freely night after night, thinking it sour rice-gruel.",
  "உன் முகச்சந்திரனின் புன்னகை நிலவொளியைப் பருகிய சகோர பக்ஷிகளுக்கு அதிக இனிப்பால் அலகு மரத்தது; ஆகவே புளிப்பை விரும்பி, சந்திரனின் அமுத அலைகளைப் புளித்த கஞ்சி என்று நினைத்து இரவுதோறும் பருகுகின்றன."),
 v(64, "Crown to feet", "Your tongue, red as hibiscus from ever chanting your Lord's praise — on it the crystal Sarasvatī turns ruby-red.",
  ["अविश्रान्तं|without rest; पत्युर्गुणगणकथाम्रेडनजपा|repeating the tale of your Lord's virtues as japa",
   "जपापुष्पच्छाया|bright as the hibiscus flower; तव|your; जननि|O mother; जिह्वा|tongue; जयति|triumphs; सा|that",
   "यदग्रासीनायाः|seated on whose tip; स्फटिकदृषदच्छच्छविमयी|clear as crystal stone",
   "सरस्वत्या|of Sarasvatī; मूर्तिः|form; परिणमति|turns into; माणिक्यवपुषा|a body of ruby"],
  "O mother, triumphant is your tongue, red as a hibiscus flower, ceaselessly chanting the tale of your Lord's virtues as japa — on whose tip Sarasvatī's form, clear as crystal, turns into a body of ruby.",
  "தாயே, கணவனின் குணக் கதைகளை இடைவிடாமல் ஜபிக்கும் செம்பருத்திப் பூ போன்ற உன் நாக்கு வெல்கிறது — அதன் நுனியில் அமர்ந்த ஸ்படிகம் போன்ற சரஸ்வதியின் வடிவம் மாணிக்க உடலாக மாறுகிறது."),
 v(65, "Crown to feet", "Returning from war, Skanda, Indra and Viṣṇu get your camphor betel — and leave Śiva's offerings untouched.",
  ["रणे|in battle; जित्वा|having conquered; दैत्यानपहृतशिरस्त्रैः|the demons, with helmets removed; कवचिभिः|in armour",
   "निवृत्तैश्चण्डांशत्रिपुरहरनिर्माल्यविमुखैः|returned, turning from Caṇḍa's share of Śiva's offerings",
   "विशाखेन्द्रोपेन्द्रैः|by Skanda, Indra and Viṣṇu; शशिविशदकर्पूरशकलाः|with bits of camphor white as the moon",
   "विलीयन्ते|are consumed; मातस्तव|O mother, your|mātaḥ · tava; वदनताम्बूलकबलाः|mouthfuls of betel from your mouth"],
  "O mother, having conquered the demons in battle, Skanda, Indra and Viṣṇu return, helmets off, still in armour, turning away from Śiva's leftover offerings (meant for Caṇḍa), and consume the mouthfuls of betel from your mouth, with bits of camphor white as the moon.",
  "தாயே, போரில் அசுரர்களை வென்று, தலைக்கவசத்தைக் கழற்றி, கவசத்துடனே திரும்பிய ஸ்கந்தன், இந்திரன், விஷ்ணு ஆகியோர் சண்டேசுவரனுக்குரிய சிவ நிர்மால்யத்தை விட்டு, சந்திரன் போல் வெண்மையான கற்பூரத் துண்டுகளுடன் கூடிய உன் வாய்த் தாம்பூலத்தை உண்கிறார்கள்."),
 v(66, "Crown to feet", "Sarasvatī sings Śiva's deeds on her vīṇā; when you say “well done”, she hides her vīṇā, shamed by your voice.",
  ["विपञ्च्या|on the vīṇā; गायन्ती|singing; विविधमपदानं|the various deeds; पशुपतेः|of Paśupati",
   "त्वयारब्धे|when you begin|tvayā · ārabdhe; वक्तुं|to speak; चलितशिरसा|with a nod of the head; साधुवचने|words of praise",
   "तदीयैर्माधुर्यैरपलपिततन्त्रीकलरवां|whose sweet notes are put to shame by their sweetness",
   "निजां|her own; वीणां|vīṇā; वाणी|Sarasvatī; निचुलयति|covers; चोलेन|with its case; निभृतम्|quietly"],
  "As Sarasvatī sings Paśupati's many deeds on her vīṇā and you begin, with a nod, to say “well done”, she quietly covers her vīṇā in its case — its sweet notes put to shame by the sweetness of your voice.",
  "வீணையில் பசுபதியின் பல சாதனைகளைச் சரஸ்வதி பாடும்போது, நீ தலையசைத்து ‘நன்று’ என்று சொல்லத் தொடங்கியதும், உன் குரலின் இனிமையால் தன் வீணையின் இனிய ஒலி தோற்றதால் அவள் அதை மெதுவாக உறையால் மூடுகிறாள்.",
  {tip:"Compare Lalitā Sahasranāma verse 11 — her speech shames Sarasvatī's <b>kacchapī</b>."}),
 v(67, "Crown to feet", "Your chin, touched by Himavān in love and lifted by Śiva — how shall we describe it? It has no comparison.",
  ["कराग्रेण|with fingertips; स्पृष्टं|touched; तुहिनगिरिणा|by the snow mountain (your father); वत्सलतया|in affection",
   "गिरीशेनोदस्तं|lifted by Giriśa|girīśena · udastam; मुहुरधरपानाकुलतया|often, eager to drink your lips",
   "करग्राह्यं|to be held by the hand; शम्भोर्मुखमुकुरवृन्तं|of Śambhu, the handle of the mirror of your face; गिरिसुते|O mountain's daughter",
   "कथङ्कारं|how; ब्रूमस्तव|shall we speak of your|brūmaḥ · tava; चिबुकमौपम्यरहितम्|chin beyond comparison"],
  "O daughter of the mountain, how shall we speak of your chin, beyond all comparison — touched with his fingertips in affection by the Himālaya, often lifted by Śiva eager to drink your lips, the handle of the mirror of your face for Śambhu's hand?",
  "மலைமகளே, தந்தை இமவான் அன்பால் விரல் நுனியால் தொட்ட, உதட்டமுதம் பருக ஆவலுடன் கிரீசன் அடிக்கடி உயர்த்திய, சம்புவின் கை பிடிக்கும் முகக் கண்ணாடியின் கைப்பிடியான, உவமையற்ற உன் மோவாயை எப்படி வர்ணிப்போம்?"),
 v(68, "Crown to feet", "Your neck, thrilled by Śiva's embrace, is the stalk of your lotus face; the pearl string below it is the lotus fibre.",
  ["भुजाश्लेषान्नित्यं|ever from the embrace of the arms; पुरदमयितुः|of the destroyer of the cities; कण्टकवती|bristling (with thrill)",
   "तव|your; ग्रीवा|neck; धत्ते|bears; मुखकमलनालश्रियमियम्|the beauty of the stalk of your lotus face",
   "स्वतः|by itself; श्वेता|white; कालागुरुबहुलजम्बालमलिना|darkened by thick agaru paste like mud",
   "मृणालीलालित्यं|the charm of a lotus fibre; वहति|bears; यदधो|below which; हारलतिका|the necklace"],
  "Ever thrilled by the embrace of Śiva's arms, your neck bears the beauty of the stalk of your lotus face; and the necklace below it, white by nature but darkened with thick black agaru paste like mud, has the charm of a lotus fibre.",
  "திரிபுராரியின் தழுவலால் எப்போதும் புல்லரிக்கும் உன் கழுத்து, முகத் தாமரையின் தண்டு போன்ற அழகுடையது; அதன் கீழுள்ள, இயல்பாக வெண்மையான ஆனால் கருப்பு அகில் குழம்பால் சேறு போல் கருத்த முத்து மாலை தாமரை நூலின் அழகைக் கொண்டுள்ளது."),
 v(69, "Crown to feet", "The three lines on your throat, master of music, mark the three musical scales — and the threads of your wedding.",
  ["गले|on the neck; रेखास्तिस्रो|three lines; गतिगमकगीतैकनिपुणे|O you expert in gati, gamaka and song",
   "विवाहव्यानद्धप्रगुणगुणसङ्ख्याप्रतिभुवः|witnesses of the number of the threads tied at your wedding",
   "विराजन्ते|shine; नानाविधमधुररागाकरभुवां|the sources of many sweet rāgas",
   "त्रयाणां|of the three; ग्रामाणां|musical scales; स्थितिनियमसीमान|the boundary lines of their place; इव|like; ते|your"],
  "O you expert in gati, gamaka and song, the three lines on your throat — witnesses of the threads tied at your wedding — shine like the boundary lines of the three musical scales (grāmas), sources of many sweet rāgas.",
  "கதி, கமகம், கீதம் ஆகியவற்றில் வல்லவளே, உன் திருமணத்தில் கட்டிய நூல்களின் எண்ணிக்கைக்குச் சாட்சியான உன் கழுத்தின் மூன்று ரேகைகள், பல இனிய ராகங்களின் மூலமான மூன்று கிராமங்களின் எல்லைக் கோடுகள் போல் ஒளிர்கின்றன."),
 v(70, "Crown to feet", "Brahmā praises your four arms with his four faces — begging protection for his heads from Śiva's nails.",
  ["मृणालीमृद्वीनां|soft as lotus fibres; तव|your; भुजलतानां|creeper-like arms; चतसृणां|four",
   "चतुर्भिः|with four; सौन्दर्यं|the beauty; सरसिजभवः|the lotus-born (Brahmā); स्तौति|praises; वदनैः|faces",
   "नखेभ्यः|from the nails; सन्त्रस्यन्|afraid; प्रथममथनादन्तकरिपोः|of the slayer of Death, who first cut (one head)",
   "चतुर्णां|of the four; शीर्षाणां|heads; सममभयहस्तार्पणधिया|hoping you'll give all of them a hand of protection"],
  "Brahmā praises with his four faces the beauty of your four creeper-like arms, soft as lotus fibres — afraid of the nails of Śiva, who already cut off his fifth head, and hoping you'll give a protecting hand to all four of his heads at once.",
  "தாமரை நூல் போன்ற மென்மையான உன் நான்கு கைகளின் அழகைப் பிரம்மன் தன் நான்கு முகங்களால் துதிக்கிறான் — முன்பு ஒரு தலையைக் கொய்த அந்தகாரியின் நகங்களுக்கு அஞ்சி, நான்கு தலைகளுக்கும் சமமாக அபயக் கை தருவாய் என்ற எண்ணத்தால்."),
 v(71, "Crown to feet", "How can we describe your hands, their nails mocking fresh lotuses? Only if a lotus touched Lakṣmī's lac-red feet could it compare.",
  ["नखानामुद्द्योतैर्नवनलिनरागं|by the light of whose nails, the redness of fresh lotuses; विहसतां|which mock",
   "कराणां|of the hands; ते|your; कान्तिं|beauty; कथय|tell me; कथयामः|shall we describe; कथमुमे|how, O Umā",
   "कयाचिद्वा|in some way; साम्यं|equality; भजतु|may attain; कलया|by a fraction; हन्त|alas; कमलं|the lotus",
   "यदि|if; क्रीडल्लक्ष्मीचरणतललाक्षारसछणम्|it were adorned with the lac of playing Lakṣmī's soles"],
  "O Umā, tell me, how shall we describe the beauty of your hands, whose nails' light mocks the redness of fresh lotuses? Alas — the lotus might gain some fraction of likeness only if it were adorned with the red lac from the soles of Lakṣmī playing on it.",
  "உமையே, நகங்களின் ஒளியால் புதிய தாமரைகளின் சிவப்பைக் கேலி செய்யும் உன் கைகளின் அழகை எப்படி வர்ணிப்போம், சொல்? அதில் விளையாடும் லக்ஷ்மியின் பாதச் செம்பஞ்சுக் குழம்பு பட்டால்தான் தாமரை சிறிதளவாவது ஒப்புமை பெறும்."),
 v(72, "Crown to feet", "Your breasts, drunk from by Skanda and Gaṇeśa — seeing them, Gaṇeśa anxiously feels for his own temples.",
  ["समं|at once; देवि|O Goddess; स्कन्दद्विपवदनपीतं|drunk from by Skanda and the elephant-faced; स्तनयुगं|pair of breasts",
   "तवेदं|this of yours; नः|our; खेदं|sorrow; हरतु|may remove; सततं|always; प्रस्नुतमुखम्|flowing with milk",
   "यदालोक्याशङ्काकुलितहृदयो|seeing which, his heart troubled with doubt; हासजनकः|causing laughter",
   "स्वकुम्भौ|his own temples; हेरम्बः|Heramba (Gaṇeśa); परिमृशति|feels; हस्तेन|with his hand (trunk); झडिति|quickly"],
  "O Goddess, may your breasts, flowing with milk, from which Skanda and Gaṇeśa drink together, always remove our sorrow — seeing which, Gaṇeśa, his heart troubled with doubt, quickly feels his own temples with his trunk, causing laughter.",
  "தேவியே, ஸ்கந்தனும் கஜமுகனும் ஒன்றாகப் பருகும், பால் சுரக்கும் உன் ஸ்தனங்கள் எங்கள் துயரை எப்போதும் போக்கட்டும் — அவற்றைக் கண்டு, தன் மத்தகங்களோ என்ற ஐயத்துடன் ஹேரம்பன் விரைந்து தும்பிக்கையால் அவற்றைத் தடவிப் பார்ப்பது சிரிப்பூட்டுகிறது."),
 v(73, "Crown to feet", "Your breasts are ruby jars of nectar — that is why Skanda and Gaṇeśa, who drink from them, are ever young.",
  ["अमू|these; ते|your; वक्षोजावमृतरसमाणिक्यकुतुपौ|breasts, ruby jars of nectar",
   "न|no; सन्देहस्पन्दो|stir of doubt; नगपतिपताके|O banner of the mountain king; मनसि|in the mind; नः|our",
   "पिबन्तौ|drinking; तौ|those two; यस्मादविदितवधूसङ्गरसिकौ|because, never knowing the joy of a bride",
   "कुमारावद्यापि|are youths even today|kumārau · adya · api; द्विरदवदनक्रौञ्चदलनौ|the elephant-faced one and the splitter of Krauñca"],
  "O banner of the mountain king, there is no doubt in our minds that your breasts are ruby jars of nectar — for, drinking from them, the elephant-faced Gaṇeśa and Skanda, splitter of Mount Krauñca, are youths even today, never knowing the company of a bride.",
  "மலையரசன் கொடியே, உன் ஸ்தனங்கள் அமுதம் நிறைந்த மாணிக்கக் குடங்கள் என்பதில் எங்களுக்கு ஐயமில்லை — அவற்றைப் பருகுவதால்தான் கஜமுகனும் கிரௌஞ்சத்தைப் பிளந்தவனும் இன்றும் மணமறியாக் குமாரர்களாக இருக்கிறார்கள்."),
 v(74, "Crown to feet", "Your pearl necklace, tinged red by your lips, is like Śiva's fame mixed with his valour.",
  ["वहत्यम्ब|bears, O mother|vahati · amba; स्तम्बेरमदनुजकुम्भप्रकृतिभिः|born from the temples of the elephant-demon",
   "समारब्धां|made; मुक्तामणिभिरमलां|of pure pearls; हारलतिकाम्|a necklace",
   "कुचाभोगो|the expanse of your breasts; बिम्बाधररुचिभिरन्तः|by the glow of your bimba lips within; शबलितां|tinged",
   "प्रतापव्यामिश्रां|mixed with valour; पुरदमयितुः|of the conqueror of the cities; कीर्तिमिव|like the fame; ते|your"],
  "O mother, your bosom bears a necklace of pure pearls from the temples of the elephant-demon (Gajāsura), tinged within by the glow of your bimba-red lips — like the fame of Śiva, mixed with his valour.",
  "தாயே, கஜாசுரனின் மத்தகத்தில் தோன்றிய தூய முத்துக்களாலான மாலையை உன் ஸ்தன மண்டலம் தாங்குகிறது; உன் கோவை உதடுகளின் ஒளியால் உள்ளே சிவந்த அது, திரிபுராரியின் வீரத்துடன் கலந்த புகழ் போல் விளங்குகிறது."),
 v(75, "Crown to feet", "Your milk is an ocean of poetry — the Tamil child who drank it, given by you in mercy, became a great poet.",
  ["तव|your; स्तन्यं|breast-milk; मन्ये|I think; धरणिधरकन्ये|O daughter of the mountain; हृदयतः|from the heart",
   "पयःपारावारः|an ocean of milk; परिवहति|flows; सारस्वतमिव|like (a stream of) Sarasvatī",
   "दयावत्या|by you in compassion; दत्तं|given; द्रविडशिशुरास्वाद्य|the Tamil child, having tasted; तव|your; यत्|which",
   "कवीनां|among poets; प्रौढानामजनि|of the mature, became; कमनीयः|charming; कवयिता|a poet"],
  "O daughter of the mountain, I think your milk flows from your heart as an ocean of poetry; having tasted it, given by you in compassion, the Tamil child (Jñānasambandar) became a charming poet among the masters.",
  "மலைமகளே, உன் பால் இதயத்திலிருந்து சரஸ்வதி பிரவாகம் போன்ற பாற்கடலாகப் பெருகுகிறது என்று நினைக்கிறேன்; நீ கருணையுடன் அளித்த அதைச் சுவைத்த திராவிடக் குழந்தை (ஞானசம்பந்தர்) சிறந்த கவிகளிடையே இனிய கவிஞரானார்.",
  {tip:"<b>draviḍa-śiśu</b> — the Tamil child, traditionally Tirujñānasambandar, fed by the Goddess at Sīrkāḻi."}),
 v(76, "Crown to feet", "Kāma, burned by Śiva's fire, dived into the lake of your navel — the smoke rising from it is your line of hair.",
  ["हरक्रोधज्वालावलिभिरवलीढेन|licked by the flames of Hara's anger; वपुषा|with his body",
   "गभीरे|in the deep; ते|your; नाभीसरसि|lake of the navel; कृतसङ्गो|plunged; मनसिजः|Kāma",
   "समुत्तस्थौ|rose up; तस्मादचलतनये|from it, O mountain's daughter|tasmāt · acalatanaye; धूमलतिका|a creeper of smoke",
   "जनस्तां|people, it|janaḥ · tām; जानीते|know; तव|your; जननि|O mother; रोमावलिरिति|as the line of hair"],
  "Kāma, his body licked by the flames of Hara's anger, plunged into the deep lake of your navel; from it, O daughter of the mountain, rose a creeper of smoke — which people know, O mother, as your fine line of hair.",
  "ஹரனின் கோபத் தீச்சுடர்களால் தீண்டப்பட்ட உடலுடன் மன்மதன் உன் ஆழ்ந்த நாபிக் குளத்தில் மூழ்கினான்; அதிலிருந்து எழுந்த புகைக்கொடியை, மலைமகளே, மக்கள் உன் ரோமாவளி என்று அறிகிறார்கள்."),
 v(77, "Crown to feet", "The thin line on your slender waist, like a ripple of Yamunā, seems to be the sky squeezed between your breasts, entering your navel.",
  ["यदेतत्कालिन्दीतनुतरतरङ्गाकृति|this, shaped like a fine ripple of the Kālindī (Yamunā); शिवे|O Śivā",
   "कृशे|slender; मध्ये|in the waist; किञ्चिज्जननि|something, O mother|kiñcit · janani; तव|your; यद्भाति|which shines; सुधियाम्|to the wise",
   "विमर्दादन्योन्यं|from pressing against each other; कुचकलशयोरन्तरगतं|that went between your breasts",
   "तनूभूतं|made thin; व्योम|the sky; प्रविशदिव|as if entering|praviśat · iva; नाभिं|the navel; कुहरिणीम्|hollow"],
  "O Śivā, that thing shining on your slender waist like a fine ripple of the Yamunā appears to the wise as the sky — squeezed thin from between your pressing breasts — entering the hollow of your navel.",
  "சிவையே, உன் மெல்லிடையில் யமுனையின் மெல்லிய அலை போல் ஒளிரும் அது, ஒன்றையொன்று அழுத்தும் ஸ்தனங்களின் இடையிலிருந்து மெலிந்த ஆகாசம் உன் நாபிக் குழியில் நுழைவது போல் அறிஞர்களுக்குத் தோன்றுகிறது."),
 v(78, "Crown to feet", "Your navel: Gaṅgā's still whirlpool, basin for the creeper of hair, Kāma's fire-pit, Rati's playhouse — gate to Śiva's eyes.",
  ["स्थिरो|still; गङ्गावर्तः|a whirlpool of Gaṅgā; स्तनमुकुलरोमावलिलता|the creeper of hair bearing the buds of your breasts",
   "कलावालं|its basin; कुण्डं|the fire-pit; कुसुमशरतेजोहुतभुजः|of the fire of the flower-archer's splendour",
   "रतेर्लीलागारं|Rati's playhouse; किमपि|indescribable; तव|your; नाभिर्गिरिसुते|navel, O mountain's daughter",
   "बिलद्वारं|the cave entrance; सिद्धेर्गिरिशनयनानां|to the success of Giriśa's eyes; विजयते|triumphs"],
  "O daughter of the mountain, your navel triumphs — a still whirlpool of the Gaṅgā; the basin for the creeper of hair bearing the buds of your breasts; the fire-pit of Kāma's splendour; Rati's playhouse; the cave entrance to the success of Śiva's eyes.",
  "மலைமகளே, உன் நாபி வெல்கிறது — கங்கையின் அசையாச் சுழல்; ஸ்தன மொட்டுகளுடைய ரோமக்கொடிக்குப் பாத்தி; மன்மதனின் தேஜஸ் எனும் அக்னிக்குக் குண்டம்; ரதியின் விளையாட்டு மாளிகை; கிரீசனின் கண்களின் சித்திக்குக் குகை வாயில்."),
 v(79, "Crown to feet", "Ornament of women, may your waist — slender, tired by your bosom's weight, like a tree on a crumbling bank — be well for ever.",
  ["निसर्गक्षीणस्य|naturally slender; स्तनतटभरेण|by the weight of your bosom; क्लमजुषो|tired",
   "नमन्मूर्तेर्नारीतिलक|bending, O ornament of women|naman · mūrteḥ · nārī · tilaka; शनकैस्त्रुट्यत|slowly breaking|śanakaiḥ · truṭyataḥ; इव|as if",
   "चिरं|long; ते|your; मध्यस्य|of the waist; त्रुटिततटिनीतीरतरुणा|like a tree on a crumbling river bank",
   "समावस्थास्थेम्नो|whose steadiness is in the same state; भवतु|may there be; कुशलं|well-being; शैलतनये|O mountain's daughter"],
  "O ornament of women, O daughter of the mountain — may your waist, naturally slender, tired by the weight of your bosom, bending as if slowly breaking, as unsteady as a tree on a crumbling river bank, be well for ever.",
  "பெண்களின் திலகமே, மலைமகளே — இயல்பாக மெலிந்த, ஸ்தனபாரத்தால் சோர்ந்த, மெல்ல முறிவது போல் வளையும், இடிந்த ஆற்றங்கரை மரம் போல் நிலையற்ற உன் இடை என்றும் நலமாக இருக்கட்டும்."),
 v(80, "Crown to feet", "Kāma, fearing your waist would break under your bosom, tied it three times with creepers — your three folds.",
  ["कुचौ|breasts; सद्यःस्विद्यत्तटघटितकूर्पासभिदुरौ|bursting the bodice as their sides suddenly sweat",
   "कषन्तौ|rubbing; दोर्मूले|at the armpits; कनककलशाभौ|like golden pots; कलयता|by (Kāma) making",
   "तव|your; त्रातुं|to protect; भङ्गादलमिति|from breaking — enough|bhaṅgāt · alam · iti; वलग्नं|the waist; तनुभुवा|by Kāma",
   "त्रिधा|in three; नद्धं|tied; देवि|O Goddess; त्रिवलि|the three folds; लवलीवल्लिभिरिव|as if with lavalī creepers"],
  "O Goddess, seeing your golden-pot-like breasts bursting your bodice and pressing against your arms, Kāma, to protect your waist from breaking, tied it three times — your three folds — as if with lavalī creepers.",
  "தேவியே, திடீரென வியர்த்து ரவிக்கையை உடைக்கும், தோள் அடியை உரசும் பொற்குடம் போன்ற உன் ஸ்தனங்களைக் கண்டு, இடை முறியாமல் காக்க மன்மதன் லவலீ கொடிகளால் மூன்று முறை கட்டியதே உன் திரிவலி."),
 v(81, "Crown to feet", "Your father the Himālaya gave you weight and breadth as dowry — so your hips cover the earth and make it light.",
  ["गुरुत्वं|weight; विस्तारं|breadth; क्षितिधरपतिः|the king of mountains; पार्वति|O Pārvatī; निजात्|from his own",
   "नितम्बादाच्छिद्य|cutting from his slopes|nitambāt · ācchidya; त्वयि|in you; हरणरूपेण|as a dowry; निदधे|placed",
   "अतस्ते|so your; विस्तीर्णो|broad; गुरुरयमशेषां|heavy, this, the whole|guruḥ · ayam · aśeṣām; वसुमतीं|earth",
   "नितम्बप्राग्भारः|the expanse of your hips; स्थगयति|covers; लघुत्वं|lightness; नयति|brings; च|and"],
  "O Pārvatī, the king of mountains cut weight and breadth from his own slopes and gave them to you as dowry. So the broad, heavy expanse of your hips covers the whole earth — and makes it seem light.",
  "பார்வதியே, மலையரசன் தன் சாரல்களிலிருந்து கனத்தையும் அகலத்தையும் எடுத்து உனக்குச் சீதனமாக அளித்தான். ஆகவே அகன்ற, கனமான உன் நிதம்பம் முழு பூமியையும் மூடி அதை லேசாக்குகிறது."),
 v(82, "Crown to feet", "Your thighs surpass elephants' trunks and golden plantain stems; your knees, hardened by bowing to Śiva, surpass Airāvata's temples.",
  ["करीन्द्राणां|of great elephants; शुण्डान्|trunks; कनककदलीकाण्डपटलीम्|the rows of golden plantain stems",
   "उभाभ्यामूरुभ्यामुभयमपि|with your two thighs, both; निर्जित्य|having surpassed; भवति|you",
   "सुवृत्ताभ्यां|well-rounded; पत्युः|to your husband; प्रणतिकठिनाभ्यां|hardened by bowing; गिरिसुते|O mountain's daughter",
   "विधिज्ञे|O knower of rites; जानुभ्यां|with your knees; विबुधकरिकुम्भद्वयमसि|you surpass the temples of the divine elephant"],
  "With your two thighs you surpass both the trunks of great elephants and rows of golden plantain stems; and, O daughter of the mountain, knower of rites, with your rounded knees, hardened by bowing to your husband, you surpass the twin temples of the celestial elephant.",
  "உன் இரு தொடைகளால் பெரும் யானைகளின் தும்பிக்கைகளையும் பொன் வாழைத் தண்டுகளையும் வென்றாய்; மலைமகளே, விதியறிந்தவளே, கணவனை வணங்கிக் கடினமான உருண்ட முழங்கால்களால் ஐராவதத்தின் இரு மத்தகங்களையும் வென்றாய்."),
 v(83, "Crown to feet", "To defeat Śiva, Kāma made your calves into quivers with double arrows — your toenails are the ten arrow-tips.",
  ["पराजेतुं|to defeat; रुद्रं|Rudra; द्विगुणशरगर्भौ|holding twice the arrows; गिरिसुते|O mountain's daughter",
   "निषङ्गौ|two quivers; जङ्घे|your calves; ते|your; विषमविशिखो|the odd-arrowed one (Kāma); बाढमकृत|surely made|bāḍham · akṛta",
   "यदग्रे|at whose tips|yat · agre; दृश्यन्ते|are seen; दशशरफलाः|ten arrow-heads; पादयुगली|of your pair of feet",
   "नखाग्रच्छद्मानः|in the guise of toenails; सुरमकुटशाणैकनिशिताः|sharpened on the whetstones of the gods' crowns"],
