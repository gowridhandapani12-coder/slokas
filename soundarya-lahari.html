  "O daughter of the mountain, to defeat Rudra, the five-arrowed Kāma surely made your calves into two quivers holding twice his arrows — at whose ends ten arrow-heads are seen in the guise of your toenails, sharpened on the whetstones of the gods' crowns (as they bow).",
  "மலைமகளே, ருத்ரனை வெல்ல, ஐந்து அம்புடைய மன்மதன் உன் கணைக்கால்களை இருமடங்கு அம்புகள் கொண்ட இரு அம்பறாத்தூணிகளாக்கினான் — அவற்றின் முனையில், தேவர்களின் மகுடங்கள் எனும் சாணைக்கல்லில் தீட்டிய உன் கால் நகங்களே பத்து அம்பு முனைகளாகத் தெரிகின்றன."),
 v(84, "Crown to feet", "Your feet, worn as a crown by the Upaniṣads — place them on my head too, Mother.",
  ["श्रुतीनां|of the Vedas; मूर्धानो|the heads (Upaniṣads); दधति|wear; तव|your; यौ|which (two); शेखरतया|as a crest",
   "ममाप्येतौ|on mine too, these two|mama · api · etau; मातः|O mother; शिरसि|on the head; दयया|in mercy; धेहि|place; चरणौ|feet",
   "ययोः|whose; पाद्यं|foot-washing; पाथः|water; पशुपतिजटाजूटतटिनी|the river in Paśupati's matted hair (Gaṅgā)",
   "ययोर्लाक्षालक्ष्मीररुणहरिचूडामणिरुचिः|whose red lac is the glow of the red jewel in Hari's crown"],
  "O mother, in mercy place on my head too those two feet which the heads of the Vedas wear as a crest — whose foot-washing water is the river in Paśupati's matted hair, whose red lac is the glow of the ruby in Hari's crown.",
  "தாயே, வேதங்களின் சிரங்கள் கிரீடமாக அணியும் — பசுபதியின் ஜடையிலுள்ள கங்கையே பாத்ய நீராகவும், ஹரியின் சூடாமணியின் செவ்வொளியே செம்பஞ்சுக் குழம்பாகவும் உள்ள — உன் திருவடிகளை என் தலையிலும் கருணையுடன் வைப்பாயாக.",
  {tip:"A prayer to keep: <b>mamāpy etau mātaḥ śirasi dayayā dhehi caraṇau</b> — “place your feet on my head too”."}),
 v(85, "Crown to feet", "We bow to your lovely red-lac feet — even Śiva envies the aśoka tree that longs to be kicked by them.",
  ["नमोवाकं|the word of salutation; ब्रूमो|we speak; नयनरमणीयाय|delightful to the eyes; पदयोः|of your feet",
   "तवास्मै|to this (pair) of yours; द्वन्द्वाय|pair; स्फुटरुचिरसालक्तकवते|bright with fresh lac",
   "असूयत्यत्यन्तं|envies greatly; यदभिहननाय|being kicked by which; स्पृहयते|longs",
   "पशूनामीशानः|the lord of beings (Śiva); प्रमदवनकङ्केलितरवे|the aśoka tree in the pleasure garden"],
  "We say “namaḥ” to your pair of feet, delightful to the eyes, bright with fresh red lac — Śiva, lord of beings, greatly envies the aśoka tree in the pleasure garden, which longs to be struck by them (to blossom).",
  "கண்களுக்கு இனிய, புதிய செம்பஞ்சுக் குழம்பால் ஒளிரும் உன் திருவடியிணைக்கு நமஸ்காரம் சொல்கிறோம் — அவற்றால் உதைபட ஏங்கும் நந்தவன அசோக மரத்தின் மீது பசுபதியும் பொறாமைப்படுகிறான்."),
 v(86, "Crown to feet", "When Śiva, having slipped and said another's name, bows in shame, you kick his forehead — and Kāma cheers with your anklets.",
  ["मृषा|falsely; कृत्वा|making; गोत्रस्खलनमथ|a slip of name, then; वैलक्ष्यनमितं|bowed in embarrassment",
   "ललाटे|on the forehead; भर्तारं|your husband; चरणकमले|with your lotus foot; ताडयति|strikes; ते|your",
   "चिरादन्तःशल्यं|the long-standing thorn within; दहनकृतमुन्मूलितवता|caused by the burning, uprooted",
   "तुलाकोटिक्वाणैः|by the jingling of your anklets; किलिकिलितमीशानरिपुणा|a cheer raised by Śiva's enemy (Kāma)"],
  "When your husband, having slipped and called you by another's name, bows in embarrassment, your lotus foot strikes him on the forehead — and Kāma, Śiva's enemy, as if the old thorn of his burning were pulled out, raises a cheer through the jingling of your anklets.",
  "கணவன் தவறி வேறு பெயரைச் சொல்லி வெட்கத்தால் வணங்கும்போது, உன் திருவடித் தாமரை அவன் நெற்றியில் அடிக்கிறது — எரிக்கப்பட்ட நீண்ட நாள் முள் பிடுங்கப்பட்டது போல், ஈசனின் பகைவனான மன்மதன் உன் சிலம்பொலி வழியே ஆரவாரம் செய்கிறான்."),
 v(87, "Crown to feet", "Your feet win over the lotus — it is killed by snow, sleeps at night, and is Lakṣmī's; your feet live in snow, wake at night, and give Lakṣmī.",
  ["हिमानीहन्तव्यं|to be killed by snow; हिमगिरिनिवासैकचतुरौ|skilled at living only on the snow mountain",
   "निशायां|at night; निद्राणं|sleeping; निशि|at night; चरमभागे|in the last part; च|and; विशदौ|bright",
   "परं|only; लक्ष्मीपात्रं|a vessel of Lakṣmī; श्रियमतिसृजन्तौ|giving wealth abundantly; समयिनां|to devotees",
   "सरोजं|the lotus; त्वत्पादौ|your feet; जननि|O mother; जयतश्चित्रमिह|conquer — what wonder here|jayataḥ · citram · iha; किम्|what"],
  "The lotus is killed by snow, your feet live happily on the snow mountain; the lotus sleeps at night, your feet are bright all night; the lotus is merely Lakṣmī's vessel, your feet give abundant wealth to devotees — what wonder, O mother, that your feet conquer the lotus?",
  "தாமரை பனியால் அழியும், உன் பாதங்கள் பனிமலையில் வசிக்கின்றன; தாமரை இரவில் உறங்கும், உன் பாதங்கள் இரவிலும் ஒளிர்கின்றன; தாமரை லக்ஷ்மியின் இருப்பிடம் மட்டுமே, உன் பாதங்கள் பக்தர்களுக்குச் செல்வத்தை அள்ளித் தருகின்றன — தாயே, உன் பாதங்கள் தாமரையை வெல்வதில் என்ன வியப்பு?"),
 v(88, "Crown to feet", "How could poets compare your tender instep to a tortoise shell — or Śiva place it on a stone at your wedding?",
  ["पदं|the abode; ते|your; कीर्तीनां|of glories; प्रपदमपदं|your instep, no place|prapadam · apadam; देवि|O Goddess; विपदां|for misfortunes",
   "कथं|how; नीतं|was brought; सद्भिः|by the good (poets); कठिनकमठीकर्परतुलाम्|to comparison with a hard tortoise shell",
   "कथं|how; वा|or; पाणिभ्यामुपयमनकाले|with his hands at the time of marriage; पुरभिदा|by the destroyer of the cities",
   "यदादाय|taking which|yat · ādāya; न्यस्तं|was placed; दृषदि|on the stone; दयमानेन|compassionate; मनसा|in mind"],
  "O Goddess, your instep — the home of glories, no place for misfortunes — how could poets compare it with the hard shell of a tortoise? And how could Śiva, tender-hearted, take it in his hands at your wedding and place it on the stone?",
  "தேவியே, புகழின் இருப்பிடமும் துன்பங்களுக்கு இடமில்லாததுமான உன் பாத மேற்பகுதியைக் கடினமான ஆமை ஓட்டுடன் கவிகள் எப்படி ஒப்பிட்டார்கள்? கருணை மனமுடைய திரிபுராரி திருமணத்தின்போது அதைக் கையால் எடுத்து அம்மிக்கல்லில் எப்படி வைத்தான்?",
  {tip:"<b>aśmārohaṇa</b> — the wedding rite of placing the bride's foot on a grinding stone."}),
 v(89, "Crown to feet", "Your feet, whose nails close the lotus-hands of heavenly women, mock the wish-trees — they give the poor, not just the gods.",
  ["नखैर्नाकस्त्रीणां|with nails that, for the heavenly women; करकमलसङ्कोचशशिभिः|are moons closing their lotus hands",
   "तरूणां|of the trees; दिव्यानां|divine; हसत|laugh; इव|as if; ते|your; चण्डि|O Caṇḍī; चरणौ|feet",
   "फलानि|fruits; स्वःस्थेभ्यः|to those in heaven; किसलयकराग्रेण|with tips of their sprout-hands; ददतां|giving",
   "दरिद्रेभ्यो|to the poor; भद्रां|auspicious; श्रियमनिशमह्नाय|wealth, always and quickly; ददतौ|giving"],
  "O Caṇḍī, your feet — whose nails are moons that make the heavenly women's lotus-hands fold — laugh as it were at the divine wish-trees, which give fruit only to those in heaven with their sprout-hands, while your feet give auspicious wealth to the poor, always and at once.",
  "சண்டியே, தேவமாதர்களின் கைத்தாமரைகளை மூடச் செய்யும் சந்திரன் போன்ற நகங்களுடைய உன் பாதங்கள், சுவர்க்கவாசிகளுக்கு மட்டும் துளிர்க் கைகளால் பழம் தரும் கற்பக மரங்களைக் கேலி செய்வது போல், ஏழைகளுக்கு எப்போதும் உடனே மங்களச் செல்வத்தைத் தருகின்றன."),
 v(90, "Crown to feet", "May my soul, with its six senses, become a six-legged bee at your foot, sweet as a mandāra cluster.",
  ["ददाने|giving; दीनेभ्यः|to the poor; श्रियमनिशमाशानुसदृशीम्|wealth always, as they wish",
   "अमन्दं|abundant; सौन्दर्यप्रकरमकरन्दं|the honey of a wealth of beauty; विकिरति|which scatters",
   "तवास्मिन्|in this of yours; मन्दारस्तबकसुभगे|lovely as a mandāra cluster; यातु|may (it) go; चरणे|in your foot",
   "निमज्जन्मज्जीवः|sinking in, my soul|nimajjan · majjīvaḥ; करणचरणः|with the senses as its legs; षट्चरणताम्|to bee-hood (six-footedness)"],
  "In your foot, lovely as a cluster of mandāra flowers, which always gives the poor wealth as they wish and scatters abundant honey of beauty — may my soul, sinking in, its six senses as legs, become a six-legged bee.",
  "ஏழைகளுக்கு விரும்பியபடி எப்போதும் செல்வம் தருவதும், அழகுத் தேனை அள்ளிச் சிதறுவதும், மந்தார மலர்க்கொத்து போல் அழகியதுமான உன் திருவடியில் மூழ்கி, ஆறு புலன்களையும் கால்களாகக் கொண்டு என் ஜீவன் ஆறுகால் வண்டாகட்டும்."),
 v(91, "Crown to feet", "Your house swans follow your gait to learn it; your anklets' jingle seems to be your feet teaching them.",
  ["पदन्यासक्रीडापरिचयमिवारब्धुमनसः|as if wishing to learn the play of your steps",
   "स्खलन्तस्ते|stumbling, they|skhalantaḥ · te; खेलं|play; भवनकलहंसा|the house swans; न|not; जहति|leave",
   "अतस्तेषां|so to them; शिक्षां|teaching; सुभगमणिमञ्जीररणित|the ringing of your lovely jewelled anklets",
   "च्छलादाचक्षाणं|under the guise of, giving|chalāt · ācakṣāṇam; चरणकमलं|your lotus feet; चारुचरिते|O you of lovely conduct"],
  "O you of lovely conduct, the swans of your house, as if eager to learn the play of your steps, stumble but never give up following you; so your lotus feet, under the guise of the ringing of your jewelled anklets, seem to be giving them lessons.",
  "அழகிய நடத்தையுடையவளே, உன் நடை விளையாட்டைக் கற்க விரும்புவது போல் உன் வீட்டு அன்னங்கள் தடுமாறியும் பின்தொடர்வதை விடுவதில்லை; ஆகவே உன் திருவடித் தாமரைகள் மணிச்சிலம்பொலி என்ற சாக்கில் அவற்றுக்குப் பாடம் சொல்கின்றன."),
 v(92, "Closing", "Brahmā, Viṣṇu, Rudra and Īśvara are your couch's legs, Śiva its cover — red with your light, he is love embodied.",
  ["गतास्ते|they have become|gatāḥ · te; मञ्चत्वं|the state of a couch; द्रुहिणहरिरुद्रेश्वरभृतः|Brahmā, Hari, Rudra and Īśvara as its bearers",
   "शिवः|Śiva; स्वच्छच्छायाघटितकपटप्रच्छदपटः|the cover-cloth, made of his clear white light",
   "त्वदीयानां|of your; भासां|rays; प्रतिफलनरागारुणतया|red from reflecting their colour",
   "शरीरी|embodied; शृङ्गारो|love; रस|rasa; इव|like; दृशां|for the eyes; दोग्धि|yields; कुतुकम्|delight"],
  "Brahmā, Hari, Rudra and Īśvara have become the legs of your couch; Śiva, by his clear white light, is its cover-cloth — and, reddened by reflecting your rays, he seems to be the rasa of love in bodily form, a delight to the eyes.",
  "பிரம்மா, ஹரி, ருத்ரன், ஈஸ்வரன் உன் கட்டிலின் கால்களாகியுள்ளனர்; சிவன் தன் தூய வெண்ணொளியால் அதன் விரிப்பாகிறான் — உன் ஒளியைப் பிரதிபலித்துச் சிவந்து, உடல் கொண்ட சிருங்கார ரசம் போல் கண்களுக்கு மகிழ்ச்சி தருகிறான்."),
 v(93, "Closing", "Curly in hair, straight in smile, soft as śirīṣa in heart, firm in bosom — Śiva's compassion, Aruṇā, triumphs to save the world.",
  ["अराला|curly; केशेषु|in the hair; प्रकृतिसरला|naturally straight (simple); मन्दहसिते|in the gentle smile",
   "शिरीषाभा|soft as śirīṣa flowers; चित्ते|in the heart; दृषदुपलशोभा|firm as stone; कुचतटे|in the bosom",
   "भृशं|very; तन्वी|slender; मध्ये|in the waist; पृथुरुरसिजारोहविषये|broad in bosom and hips",
   "जगत्त्रातुं|to save the world; शम्भोर्जयति|Śambhu's — triumphs; करुणा|compassion; काचिदरुणा|a certain red (Aruṇā)"],
  "Curly in her hair, naturally simple in her gentle smile, soft as śirīṣa flowers in heart, firm as stone in bosom, very slender at the waist, full in breasts and hips — a certain red compassion of Śambhu (Aruṇā) triumphs to save the world.",
  "கூந்தலில் சுருளும், மந்தஹாசத்தில் இயல்பான நேர்மையும், மனத்தில் சிரீஷ மலர் மென்மையும், ஸ்தனத்தில் கல் போன்ற திண்மையும், இடையில் மிக மெலிவும், ஸ்தன நிதம்பங்களில் பருமையும் உடைய, உலகைக் காக்கும் சம்புவின் கருணையான அருணா வெல்கிறாள்.",
  {tip:"A summary of her beauty in contrasts — <b>arālā / saralā</b> (curly / straight), <b>śirīṣa / dṛṣad</b> (soft / hard)."}),
 v(94, "Closing", "The moon is your camphor box, its spot your musk — emptied by your daily use, Brahmā refills it each month.",
  ["कलङ्कः|the spot; कस्तूरी|is musk; रजनिकरबिम्बं|the moon's orb; जलमयं|made of water (rose-water)",
   "कलाभिः|with its digits; कर्पूरैर्मरकतकरण्डं|with camphor, an emerald box; निबिडितम्|filled",
   "अतस्त्वद्भोगेन|so, by your use; प्रतिदिनमिदं|daily this; रिक्तकुहरं|empty inside",
   "विधिर्भूयो|Brahmā again; भूयो|and again; निबिडयति|fills; नूनं|surely; तव|your; कृते|for (you)"],
  "The moon's spot is musk; its orb is water; its digits are camphor, filling an emerald box — and since your daily use empties it, Brahmā surely fills it again and again for you (as the moon waxes).",
  "சந்திரனின் களங்கம் கஸ்தூரி; அதன் மண்டலம் பன்னீர்; அதன் கலைகள் கற்பூரம் — நிரப்பப்பட்ட மரகதப் பெட்டி; உன் தினசரி பயன்பாட்டால் அது காலியாவதால் பிரம்மன் உனக்காக மீண்டும் மீண்டும் நிரப்புகிறான் (வளர்பிறை)."),
 v(95, "Closing", "You are Śiva's inner palace — worship of your feet is hard for the fickle; even Indra waits at your gate with Aṇimā and the siddhis.",
  ["पुरारातेरन्तःपुरमसि|you are the inner palace of the enemy of the cities; ततस्त्वच्चरणयोः|so, of your feet",
   "सपर्यामर्यादा|the bounds of worship; तरलकरणानामसुलभा|not easy for those with unsteady senses",
   "तथा|thus; ह्येते|indeed these; नीताः|have attained; शतमखमुखाः|Indra and the others; सिद्धिमतुलां|unequalled power",
   "तव|your; द्वारोपान्तस्थितिभिरणिमाद्याभिरमराः|the gods, standing near your door with Aṇimā and the rest"],
  "You are the inner palace of Śiva; so the worship of your feet is not easy for those with unsteady senses. That is why Indra and the other gods attain unequalled powers only by standing near your door with Aṇimā and the other siddhis.",
  "நீ திரிபுராரியின் அந்தப்புரம்; ஆகவே உன் திருவடி பூஜை புலன்கள் அலையும் மனிதர்களுக்கு எளிதல்ல. இந்திரன் முதலிய தேவர்கள் அணிமா முதலிய சித்திகளுடன் உன் வாசலருகே நின்றே ஒப்பற்ற சித்தியை அடைகிறார்கள்."),
 v(96, "Closing", "Many poets win Sarasvatī, many rich men Lakṣmī — but you, first of faithful wives, no one but Śiva may touch.",
  ["कलत्रं|wife; वैधात्रं|of Brahmā (Sarasvatī); कतिकति|how many; भजन्ते|attain; न|not; कवयः|poets",
   "श्रियो|of Śrī; देव्याः|the goddess; को|who; वा|or; न|not; भवति|becomes; पतिः|master; कैरपि|with some; धनैः|wealth",
   "महादेवं|Mahādeva; हित्वा|except; तव|your; सति|O Satī; सतीनामचरमे|O foremost of faithful wives",
   "कुचाभ्यामासङ्गः|contact with your breasts; कुरवकतरोरप्यसुलभः|is rare even for the kuravaka tree"],
  "How many poets do not win Brahmā's wife (Sarasvatī)? Who, with some wealth, does not become master of the goddess Śrī? But O Satī, foremost of faithful wives, contact with your breasts — except for Mahādeva — is rare even for the kuravaka tree.",
  "எத்தனை கவிகள் பிரம்மனின் மனைவியான சரஸ்வதியை அடைவதில்லை? சிறிது செல்வத்தால் யார்தான் லக்ஷ்மிக்குத் தலைவனாவதில்லை? சதியே, பதிவிரதைகளில் முதன்மையானவளே, மகாதேவனைத் தவிர உன் ஸ்தன ஸ்பரிசம் குரவக மரத்துக்கும் கிடைக்காதது."),
 v(97, "Closing", "They call you Sarasvatī, Lakṣmī, Pārvatī — but you are the fourth, beyond reach, Mahāmāyā, queen of the Supreme Brahman.",
  ["गिरामाहुर्देवीं|they call (you) the goddess of speech; द्रुहिणगृहिणीमागमविदो|Brahmā's wife, those who know the scriptures",
   "हरेः|of Hari; पत्नीं|wife; पद्मां|Padmā; हरसहचरीमद्रितनयाम्|Hara's companion, the mountain's daughter",
   "तुरीया|the fourth; कापि|some; त्वं|you; दुरधिगमनिःसीममहिमा|of unreachable, boundless greatness",
   "महामाया|Mahāmāyā; विश्वं|the universe; भ्रमयसि|make spin; परब्रह्ममहिषि|O queen of the Supreme Brahman"],
  "Those who know the scriptures call you the goddess of speech, Brahmā's wife; Padmā, Hari's wife; the mountain's daughter, Hara's companion. But you are some indescribable fourth, of unreachable, boundless greatness — Mahāmāyā, who makes the universe spin, O queen of the Supreme Brahman.",
  "ஆகமம் அறிந்தோர் உன்னை பிரம்மனின் மனைவியான வாக்தேவி என்றும், ஹரியின் மனைவியான பத்மா என்றும், ஹரனின் துணைவியான மலைமகள் என்றும் சொல்கிறார்கள். ஆனால் நீ எட்ட முடியாத எல்லையற்ற மகிமையுடைய நான்காமவள் — உலகைச் சுழற்றும் மகாமாயை, பரப்பிரம்மத்தின் மகிஷி."),
 v(98, "Closing", "When, Mother, shall I, a seeker of learning, drink the water that washed your feet — which makes even the mute poets?",
  ["कदा|when; काले|in time; मातः|O mother; कथय|tell; कलितालक्तकरसं|mixed with red lac",
   "पिबेयं|shall I drink; विद्यार्थी|a seeker of learning; तव|your; चरणनिर्णेजनजलम्|the water that washed your feet",
   "प्रकृत्या|by nature; मूकानामपि|even of the mute; च|and; कविताकारणतया|as the cause of poetry",
   "कदा|when; धत्ते|will it take; वाणीमुखकमलताम्बूलरसताम्|the state of the betel juice of Sarasvatī's lotus mouth"],
  "Tell me, mother, when shall I, a seeker of learning, drink the water that washed your feet, mixed with red lac — which, making even the born-mute into poets, takes on the quality of the betel juice of Sarasvatī's lotus mouth?",
  "தாயே, சொல் — செம்பஞ்சுக் குழம்பு கலந்த உன் பாதம் கழுவிய நீரை, கல்வியை நாடும் நான் எப்போது பருகுவேன்? இயல்பாக ஊமையானவர்களையும் கவிஞர்களாக்குவதால் அது சரஸ்வதியின் முகத்தாமரைத் தாம்பூல ரசம் போன்றது."),
 v(99, "Closing", "Your worshipper sports with Sarasvatī and Lakṣmī, rivals Kāma in beauty, lives long, freed, and tastes supreme bliss.",
  ["सरस्वत्या|with Sarasvatī; लक्ष्म्या|with Lakṣmī; विधिहरिसपत्नो|a rival of Brahmā and Hari; विहरते|sports",
   "रतेः|of Rati; पातिव्रत्यं|faithfulness; शिथिलयति|loosens; रम्येण|with a charming; वपुषा|body",
   "चिरं|long; जीवन्नेव|living indeed; क्षपितपशुपाशव्यतिकरः|with the bonds of the bound soul destroyed",
   "परानन्दाभिख्यं|called supreme bliss; रसयति|tastes; रसं|the flavour; त्वद्भजनवान्|your worshipper"],
  "Your worshipper sports with Sarasvatī and Lakṣmī as a rival of Brahmā and Hari; with his charming body he shakes even Rati's faithfulness; living long, with the bonds of the bound soul destroyed, he tastes the flavour called supreme bliss.",
  "உன்னை வழிபடுபவன் பிரம்மனுக்கும் ஹரிக்கும் போட்டியாளனாக சரஸ்வதியுடனும் லக்ஷ்மியுடனும் விளையாடுகிறான்; அழகிய உடலால் ரதியின் பதிவிரதத்தையும் தளரச் செய்கிறான்; நீண்ட காலம் வாழ்ந்து, பசு பாசங்கள் நீங்கி, பரமானந்தம் எனும் ரசத்தைச் சுவைக்கிறான்.",
  {kind:"phala", short:"Phala-śruti", label:"Verse 99"}),
 v(100, "Closing", "Ārati to the sun with a lamp, arghya to the moon with moonstone water, the ocean with its own water — so I praise you with your words.",
  ["प्रदीपज्वालाभिर्दिवसकरनीराजनविधिः|the rite of waving lamps to the sun with flames of a lamp",
   "सुधासूतेश्चन्द्रोपलजललवैरर्घ्यरचना|offering arghya to the moon with drops from a moonstone",
   "स्वकीयैरम्भोभिः|with its own waters; सलिलनिधिसौहित्यकरणं|satisfying the ocean",
   "त्वदीयाभिर्वाग्भिस्तव|with your own words, your|tvadīyābhiḥ · vāgbhiḥ · tava; जननि|O mother; वाचां|of speech; स्तुतिरियम्|this praise"],
  "Like waving a lamp's flame before the sun, like offering the moon water from a moonstone, like satisfying the ocean with its own waters — O mother, mother of speech, this praise of you is made with your own words.",
  "சூரியனுக்கு விளக்குச் சுடரால் ஆரத்தி எடுப்பது போல, சந்திரனுக்குச் சந்திரகாந்தக் கல்லின் நீர்த்துளிகளால் அர்க்யம் தருவது போல, கடலை அதன் நீராலேயே திருப்திப்படுத்துவது போல, வாக்கின் தாயே, உன் சொற்களாலேயே இந்தத் துதி.",
  {kind:"phala", short:"Closing", label:"Verse 100", tip:"Śaṅkara's humble close: every word of this hymn was already <b>hers</b>."})
];
