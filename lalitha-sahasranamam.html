  "In the form of the powers of will, knowledge and action; support of all; firmly established; bearing the forms of both being and non-being.",
  "இச்சா சக்தி, ஞான சக்தி, கிரியா சக்தி வடிவினள்; எல்லாவற்றுக்கும் ஆதாரம்; உறுதியாக நிலைத்தவள்; சத்து அசத்து வடிவங்களைத் தாங்குபவள்.",
  {tip:"The three Śaktis: <b>icchā</b> (will), <b>jñāna</b> (knowledge), <b>kriyā</b> (action) — one long name."}),
 v(131, "Her glories", "Eightfold form, conqueror of ignorance, ordainer of the world's course — alone, vast, non-dual, beyond duality.",
  "अष्टमूर्तिरजाजैत्री|of eight forms, conqueror of ignorance|aṣṭa · mūrtiḥ · ajā · jaitrī; लोकयात्राविधायिनी|ordainer of the course of the world",

  "Of eight forms; conqueror of ignorance; ordainer of the course of the world; the one alone; the Infinite (Bhūmā); non-dual; free from duality.",
  "எட்டு வடிவினள்; அவித்யையை வென்றவள்; உலக நடையை வகுப்பவள்; ஏகாகினி; பூமா வடிவினள்; இரண்டற்றவள்; த்வைதம் அற்றவள்."),
 v(132, "Her glories", "Giver of food and wealth, the ancient, one with Brahman — Bṛhatī, Brāhmaṇī, Brāhmī, Brahman's bliss.",
  "अन्नदा|giver of food; वसुदा|giver of wealth; वृद्धा|the ancient; ब्रह्मात्मैक्यस्वरूपिणी|the oneness of Brahman and Self",
  "बृहती|the vast; ब्राह्मणी|Brāhmaṇī; ब्राह्मी|Brāhmī; ब्रह्मानन्दा|the bliss of Brahman; बलिप्रिया|fond of offerings",
  "Giver of food; giver of wealth; the ancient one; the oneness of Brahman and the Self; the vast; Brāhmaṇī; Brāhmī; the bliss of Brahman; fond of offerings.",
  "அன்னம் தருபவள்; செல்வம் தருபவள்; முதியவள்; பிரம்ம-ஆத்ம ஐக்ய வடிவினள்; ப்ருகதீ; பிராம்மணீ; பிராம்மீ; பிரம்மானந்தம்; பலியை விரும்புபவள்."),
 v(133, "Her glories", "Language itself, with a vast army, beyond being and non-being — easy to worship, auspicious, the easy path.",
  "भाषारूपा|language itself; बृहत्सेना|with a vast army; भावाभावविवर्जिता|beyond being and non-being",
  "सुखाराध्या|easily worshipped; शुभकरी|bringer of good; शोभना|beautiful; सुलभा|easy to reach; गतिः|the goal",
  "Language itself; with a vast army; beyond existence and non-existence; easy to worship; doer of good; beautiful; easy to reach; the goal.",
  "மொழியே வடிவானவள்; பெரும் சேனையுடையவள்; இருப்பு இன்மைக்கு அப்பாற்பட்டவள்; எளிதில் ஆராதிக்கப்படுபவள்; நன்மை செய்பவள்; அழகியவள்; எளிதில் அடையப்படும் கதி."),
 v(134, "Her glories", "Rājarājeśvarī, giver of kingdoms, beloved of kingdoms — of shining mercy, seating her devotees on thrones.",
  "राजराजेश्वरी|queen of the king of kings; राज्यदायिनी|giver of kingdoms; राज्यवल्लभा|beloved of kingdoms",

 v(135, "Her glories", "Rājyalakṣmī, mistress of the treasury, ruler of the four-fold army — giver of empire, true to her word, ocean-girdled.",
  "राज्यलक्ष्मीः|the Lakṣmī of kingdoms; कोशनाथा|mistress of the treasury; चतुरङ्गबलेश्वरी|ruler of the four-fold army",

  "Rājyalakṣmī; mistress of the treasury; ruler of the four-fold army; giver of empire; true to her word; with the ocean as her girdle.",
  "ராஜ்யலக்ஷ்மி; கருவூலத்தின் தலைவி; நால்வகைச் சேனைகளின் ஈஸ்வரி; சாம்ராஜ்யம் தருபவள்; சத்ய சந்தை; கடலை ஒட்டியாணமாக உடையவள்."),
 v(136, "Her glories", "Initiated, quelling demons, bringing all worlds under her — giver of all aims, Sāvitrī, being-consciousness-bliss.",

  "The initiated one; subduer of demons; who brings all worlds under her sway; giver of every aim; Sāvitrī; whose form is sat-cit-ānanda.",
  "தீக்ஷை பெற்றவள்; தைத்யர்களை அடக்குபவள்; எல்லா உலகங்களையும் வசப்படுத்துபவள்; எல்லாப் பொருள்களையும் தருபவள்; சாவித்திரி; சச்சிதானந்த வடிவினள்."),
 v(137, "Her glories", "Unlimited by place or time, everywhere, enchanting all — Sarasvatī, made of the śāstras, Guha's mother, secret.",

  "सरस्वती|Sarasvatī; शास्त्रमयी|made of the scriptures; गुहाम्बा|mother of Guha; गुह्यरूपिणी|of secret form",
  "Unlimited by space and time; all-pervading; enchanting all; Sarasvatī; made of the scriptures; mother of Guha; of secret form.",
  "இடம் காலத்தால் கட்டுப்படாதவள்; எங்கும் செல்பவள்; எல்லோரையும் மயக்குபவள்; சரஸ்வதி; சாஸ்திரமயமானவள்; குகனின் தாய்; ரகசிய வடிவினள்."),
 v(138, "Her glories", "Free from all limits, devoted wife of Sadāśiva — queen of the tradition, chaste, the circle of gurus.",

  "Free from all limiting adjuncts; the devoted wife of Sadāśiva; queen of the sacred tradition; the chaste one; in the form of the circle of gurus.",

 v(139, "Her glories", "Beyond the Kula, worshipped in the sun's orb, Māyā, Madhumatī, the earth — mother of the gaṇas, dear to the guru.",
  "कुलोत्तीर्णा|beyond the Kula; भगाराध्या|worshipped in the sun's orb; माया|Māyā; मधुमती|Madhumatī; मही|the earth",
  "गणाम्बा|mother of the gaṇas; गुह्यकाराध्या|worshipped by the guhyakas; कोमलाङ्गी|tender-limbed; गुरुप्रिया|dear to the guru",
  "Beyond the Kula; worshipped in the sun's orb; Māyā; Madhumatī; the earth; mother of the gaṇas; worshipped by the guhyakas; tender-limbed; dear to the guru.",
  "குலத்தைக் கடந்தவள்; சூரிய மண்டலத்தில் ஆராதிக்கப்படுபவள்; மாயா; மதுமதி; மஹீ; கணங்களின் தாய்; குஹ்யகர்களால் ஆராதிக்கப்படுபவள்; மென்மையான அங்கமுடையவள்; குருவுக்குப் பிரியமானவள்."),
 v(140, "Her glories", "Independent, queen of all tantras, in the form of Dakṣiṇāmūrti — worshipped by Sanaka, giver of Śiva-knowledge.",

  "सनकादिसमाराध्या|worshipped by Sanaka and the others; शिवज्ञानप्रदायिनी|giver of the knowledge of Śiva",
  "Independent; queen of all tantras; in the form of Dakṣiṇāmūrti; worshipped by Sanaka and the other sages; giver of the knowledge of Śiva.",
  "சுதந்திரமானவள்; எல்லா தந்திரங்களின் ஈஸ்வரி; தக்ஷிணாமூர்த்தி வடிவினள்; சனகாதியரால் ஆராதிக்கப்படுபவள்; சிவஞானம் அருள்பவள்.",
  {tip:"<b>dakṣiṇāmūrti-rūpiṇī</b> — she is the silent teacher under the banyan, teaching Sanaka and his brothers."}),
 v(141, "Her glories", "A spark of consciousness, a bud of bliss, love itself — pleased by recitation of her names, Naṭeśvarī.",
  "चित्कलाऽऽनन्दकलिका|a ray of consciousness, a bud of bliss|cit · kalā · ānanda · kalikā; प्रेमरूपा|love itself; प्रियङ्करी|doer of what is dear",
  "नामपारायणप्रीता|pleased by the recitation of her names; नन्दिविद्या|the vidyā of Nandi; नटेश्वरी|queen of the dancer (Naṭarāja)",
  "A ray of consciousness; a bud of bliss; love itself; doer of what is dear; pleased by the recitation of her names; the vidyā worshipped by Nandi; consort of Naṭarāja.",
  "சித்கலை; ஆனந்த மொட்டு; பிரேம வடிவினள்; பிரியமானதைச் செய்பவள்; நாம பாராயணத்தால் மகிழ்பவள்; நந்தி வித்யை; நடேஸ்வரி.",
  {tip:"<b>nāma-pārāyaṇa-prītā</b> — “pleased by the chanting of her names” — this very hymn."}),
 v(142, "Her glories", "Substrate of the illusory world, giver of liberation, liberation itself — fond of dance, dissolver, modesty.",
  "मिथ्याजगदधिष्ठाना|substrate of the illusory world; मुक्तिदा|giver of liberation; मुक्तिरूपिणी|liberation itself",
  "लास्यप्रिया|fond of the gentle dance; लयकरी|dissolver; लज्जा|modesty; रम्भादिवन्दिता|honoured by Rambhā and the apsarases",
  "Substrate of the illusory world; giver of liberation; liberation itself; fond of the lāsya dance; the dissolver; modesty; honoured by Rambhā and other apsarases.",
  "மித்யா ஜகத்தின் அதிஷ்டானம்; முக்தி தருபவள்; முக்தி வடிவினள்; லாஸ்ய நடனத்தை விரும்புபவள்; லயம் செய்பவள்; நாணம்; ரம்பை முதலியோரால் வணங்கப்படுபவள்."),
 v(143, "Her glories", "Nectar rain on saṃsāra's forest fire, wildfire to the forest of sin — a gale to the cotton of ill-luck, sun to the darkness of age.",
  "भवदावसुधावृष्टिः|nectar rain on the forest fire of saṃsāra; पापारण्यदवानला|wildfire to the forest of sin",
  "दौर्भाग्यतूलवातूला|a gale to the cotton-wisps of misfortune; जराध्वान्तरविप्रभा|sunlight to the darkness of old age",
  "A rain of nectar on the forest fire of worldly life; a wildfire to the forest of sins; a gale that scatters the cotton of misfortune; sunlight to the darkness of old age.",
  "சம்சாரக் காட்டுத் தீக்கு அமுத மழை; பாவக் காட்டுக்குக் காட்டுத் தீ; துர்பாக்கியப் பஞ்சுக்குச் சூறாவளி; முதுமை இருளுக்குச் சூரிய ஒளி.",
  {tip:"Verses 143–144: a run of <b>pictures</b> — rain, fire, wind, sun, moonlight, cloud, thunderbolt, axe."}),
 v(144, "Her glories", "Moonlight to the ocean of fortune, a rain cloud to the peacocks of devotees' minds — thunderbolt to disease, axe to death.",
  "भाग्याब्धिचन्द्रिका|moonlight to the ocean of good fortune; भक्तचित्तकेकिघनाघना|rain cloud to the peacocks of devotees' minds",
  "रोगपर्वतदम्भोलिर्|thunderbolt to the mountain of disease; मृत्युदारुकुठारिका|axe to the tree of death",
  "Moonlight that swells the ocean of good fortune; a thick rain cloud for the peacocks of devotees' minds; a thunderbolt to the mountain of disease; an axe to the tree of death.",
  "பாக்கியக் கடலுக்கு நிலவொளி; பக்தர் மனமெனும் மயில்களுக்கு மழைமேகம்; நோய் மலைக்கு வஜ்ராயுதம்; மரண மரத்துக்குக் கோடரி."),
 v(145, "Her glories", "Maheśvarī, Mahākālī, the great devourer — Aparṇā, Caṇḍikā, slayer of Caṇḍa and Muṇḍa.",
  "महेश्वरी|Maheśvarī; महाकाली|Mahākālī; महाग्रासा|the great devourer; महाशना|of great appetite",
  "अपर्णा|Aparṇā (who fasted even from leaves); चण्डिका|Caṇḍikā; चण्डमुण्डासुरनिषूदिनी|slayer of the demons Caṇḍa and Muṇḍa",
  "Maheśvarī; Mahākālī; the great devourer; of great appetite; Aparṇā; Caṇḍikā; slayer of the demons Caṇḍa and Muṇḍa.",
  "மகேஸ்வரி; மகாகாளி; பெரும் விழுங்குபவள்; பெரும் உணவுடையவள்; அபர்ணா; சண்டிகா; சண்ட முண்டர்களை அழித்தவள்."),
 v(146, "Her glories", "The perishable and imperishable, ruler of all worlds, bearer of the universe — giver of the three aims, Tryambakā.",
  "क्षराक्षरात्मिका|the perishable and the imperishable; सर्वलोकेशी|ruler of all worlds; विश्वधारिणी|bearer of the universe",
  "त्रिवर्गदात्री|giver of the three aims; सुभगा|graceful; त्र्यम्बका|three-eyed; त्रिगुणात्मिका|of the three guṇas",
  "Both the perishable and the imperishable; ruler of all worlds; bearer of the universe; giver of dharma, wealth and love; graceful; three-eyed; made of the three guṇas.",
  "க்ஷரமும் அக்ஷரமுமானவள்; எல்லா உலகங்களின் ஈஸ்வரி; உலகைத் தாங்குபவள்; மூன்று புருஷார்த்தங்களைத் தருபவள்; சுபகா; திரியம்பகா; முக்குண வடிவினள்."),
 v(147, "Her glories", "Giver of heaven and liberation, pure, red as the hibiscus — vigorous, radiant, sacrifice itself, true to her vows.",
  "स्वर्गापवर्गदा|giver of heaven and liberation; शुद्धा|pure; जपापुष्पनिभाकृतिः|red as the hibiscus flower",
  "ओजोवती|full of vigour; द्युतिधरा|radiant; यज्ञरूपा|sacrifice itself; प्रियव्रता|fond of vows",
  "Giver of heaven and liberation; pure; red as the hibiscus flower; full of vigour; radiant; sacrifice itself; fond of sacred vows.",
  "சுவர்க்கமும் மோக்ஷமும் தருபவள்; தூயவள்; செம்பருத்திப் பூ போன்ற வடிவினள்; ஓஜஸ் நிறைந்தவள்; ஒளி தாங்கியவள்; யக்ஞ வடிவினள்; விரதங்களை விரும்புபவள்."),
 v(148, "Her glories", "Hard to worship, unconquerable, fond of pāṭalī flowers — great, dwelling on Meru, fond of mandāra flowers.",
  "दुराराध्या|hard to worship (for the undisciplined); दुराधर्षा|unconquerable; पाटलीकुसुमप्रिया|fond of pāṭalī flowers",
  "महती|great; मेरुनिलया|dwelling on Meru; मन्दारकुसुमप्रिया|fond of mandāra flowers",
  "Hard to worship for the undisciplined; unconquerable; fond of pāṭalī flowers; great; dwelling on Mount Meru; fond of mandāra flowers.",
  "ஆராதிப்பதற்கரியவள்; வெல்ல முடியாதவள்; பாதிரிப் பூவை விரும்புபவள்; மகதீ; மேருவில் வசிப்பவள்; மந்தார மலரை விரும்புபவள்."),
 v(149, "Her glories", "Worshipped by heroes, the cosmic form, stainless, facing all ways — the inner self, supreme space, giver and form of life.",
  "वीराराध्या|worshipped by heroes; विराड्रूपा|the cosmic form (Virāṭ); विरजा|stainless; विश्वतोमुखी|facing all ways",
  "प्रत्यग्रूपा|the inner self; पराकाशा|the supreme space; प्राणदा|giver of life; प्राणरूपिणी|life itself",
  "Worshipped by heroes; the cosmic form; stainless; facing all directions; the inner self; the supreme space; giver of life; life itself.",
  "வீரர்களால் ஆராதிக்கப்படுபவள்; விராட் வடிவினள்; விரஜா; எல்லாத் திசைகளிலும் முகமுடையவள்; பிரத்யக் வடிவினள்; பராகாசம்; உயிர் தருபவள்; பிராண வடிவினள்."),
 v(150, "Her glories", "Worshipped by Mārtāṇḍa-Bhairava, giving her kingdom's burden to Mantriṇī — Tripureśī, victorious, beyond the guṇas.",
  "मार्ताण्डभैरवाराध्या|worshipped by Mārtāṇḍa-Bhairava; मन्त्रिणीन्यस्तराज्यधूः|who has entrusted the burden of rule to Mantriṇī",
  "त्रिपुरेशी|queen of Tripura; जयत्सेना|with a victorious army; निस्त्रैगुण्या|beyond the three guṇas; परापरा|both higher and lower",
  "Worshipped by Mārtāṇḍa-Bhairava; who has entrusted the burden of her kingdom to Mantriṇī; queen of Tripura; with a victorious army; beyond the three guṇas; both the higher and the lower.",
  "மார்த்தாண்ட பைரவனால் ஆராதிக்கப்படுபவள்; ராஜ்ய பாரத்தை மந்திரிணியிடம் ஒப்படைத்தவள்; திரிபுரேசி; வெற்றிச் சேனையுடையவள்; முக்குணங்களுக்கு அப்பாற்பட்டவள்; பராபரா."),
 v(151, "Bliss & the Śrīcakra", "Truth, knowledge and bliss; devoted to oneness — Kapardinī, a garland of arts, the wish-cow, taking any form.",
  "सत्यज्ञानानन्दरूपा|truth, knowledge and bliss; सामरस्यपरायणा|devoted to perfect harmony (of Śiva and Śakti)",
  "कपर्दिनी|consort of the matted-haired; कलामाला|a garland of arts; कामधुक्|the wish-cow; कामरूपिणी|taking any form at will",
  "Truth, knowledge and bliss; devoted to the perfect harmony of Śiva and Śakti; consort of Kapardin; a garland of the arts; the wish-giving cow; taking any form at will.",
  "சத்யம், ஞானம், ஆனந்தம் வடிவினள்; சாமரஸ்யத்தில் ஈடுபட்டவள்; கபர்தினி; கலைகளின் மாலை; காமதேனு; விரும்பிய வடிவம் எடுப்பவள்."),
 v(152, "Bliss & the Śrīcakra", "Treasure of arts, the art of poetry, knower of rasa — nourished, ancient, adorable, lotus-eyed.",
  "कलानिधिः|treasure of the arts; काव्यकला|the art of poetry; रसज्ञा|knower of rasa; रसशेवधिः|treasury of rasa",
  "पुष्टा|well nourished; पुरातना|ancient; पूज्या|adorable; पुष्करा|the lotus; पुष्करेक्षणा|lotus-eyed",
  "Treasure of the arts; the art of poetry; knower of rasa; treasury of rasa; well nourished; ancient; adorable; the lotus; lotus-eyed.",
  "கலைகளின் நிதி; காவியக் கலை; ரசம் அறிந்தவள்; ரசத்தின் கருவூலம்; புஷ்டா; புராதனி; பூஜிக்கத்தக்கவள்; புஷ்கரா; தாமரைக் கண்ணாள்."),
 v(153, "Bliss & the Śrīcakra", "Supreme light, supreme abode, the subtlest atom — noose in hand, destroyer of bonds and of hostile spells.",
  "परञ्ज्योतिः|the supreme light; परन्धाम|the supreme abode; परमाणुः|the subtlest atom; परात्परा|higher than the highest",
  "पाशहस्ता|noose in hand; पाशहन्त्री|destroyer of bonds; परमन्त्रविभेदिनी|breaker of hostile spells",
  "The supreme light; the supreme abode; the subtlest atom; higher than the highest; with the noose in her hand; destroyer of bonds; breaker of hostile spells.",
  "பரஞ்ஜோதி; பரந்தாமம்; பரமாணு; பராத்பரா; பாசம் ஏந்தியவள்; பந்தங்களை அழிப்பவள்; பிறர் மந்திரங்களை முறிப்பவள்."),
 v(154, "Bliss & the Śrīcakra", "With form and without, ever content, a swan in sages' minds — true to her vow, truth itself, the inner ruler, Satī.",
  "मूर्ताऽमूर्ताऽनित्यतृप्ता|with form, formless, pleased even with brief worship|mūrtā · amūrtā · anitya · tṛptā; मुनिमानसहंसिका|a swan in the lake of sages' minds",
  "सत्यव्रता|true to her vow; सत्यरूपा|truth itself; सर्वान्तर्यामिनी|the inner ruler of all; सती|Satī",
  "With form; without form; pleased even with transient offerings; a swan in the minds of sages; true to her vow; truth itself; the inner ruler of all; Satī.",
  "உருவமுள்ளவள்; உருவமற்றவள்; நிலையற்ற பூஜையாலும் திருப்தியடைபவள்; முனிவர் மனத்தில் அன்னம்; சத்ய விரதை; சத்ய வடிவினள்; எல்லோருக்குள்ளும் அந்தர்யாமி; சதி."),
 v(155, "Bliss & the Śrīcakra", "Brahmāṇī, mother of Brahmā, of many forms, worshipped by the wise — bringer forth, fierce, command, foundation, manifest.",
  "ब्रह्माणी|Brahmāṇī; ब्रह्मजननी|mother of Brahmā; बहुरूपा|of many forms; बुधार्चिता|worshipped by the wise",
  "प्रसवित्री|the one who brings forth; प्रचण्डाऽऽज्ञा|fierce, the command itself|pracaṇḍā · ājñā; प्रतिष्ठा|the foundation; प्रकटाकृतिः|manifest in form",
  "Brahmāṇī; mother of Brahmā; of many forms; worshipped by the wise; the one who brings forth; fierce; the command itself; the foundation; manifest in form.",
  "பிரம்மாணி; பிரம்மனின் தாய்; பல வடிவினள்; அறிஞர்களால் அர்ச்சிக்கப்படுபவள்; பிரசவிப்பவள்; பிரசண்டா; ஆணை; பிரதிஷ்டை; வெளிப்படையான வடிவினள்."),
 v(156, "Bliss & the Śrīcakra", "Queen and giver of life, the fifty pīṭhas — unbound, in solitude, mother of heroes, mother of space.",
  "प्राणेश्वरी|queen of life; प्राणदात्री|giver of life; पञ्चाशत्पीठरूपिणी|in the form of the fifty seats (pīṭhas)",
  "विशृङ्खला|unfettered; विविक्तस्था|dwelling in solitude; वीरमाता|mother of heroes; वियत्प्रसूः|mother of space",
  "Queen of the life-breath; giver of life; in the form of the fifty pīṭhas; unfettered; dwelling in solitude; mother of heroes; mother of space.",
  "பிராணேஸ்வரி; உயிர் தருபவள்; ஐம்பது பீட வடிவினள்; தளையற்றவள்; தனிமையில் இருப்பவள்; வீரர்களின் தாய்; ஆகாசத்தைத் தோற்றுவித்தவள்."),
 v(157, "Bliss & the Śrīcakra", "Mukundā, home of liberation, the root form — knower of hearts, healer of saṃsāra, turner of its wheel.",
  "मुकुन्दा|giver of liberation; मुक्तिनिलया|abode of liberation; मूलविग्रहरूपिणी|in the root form (of all deities)",
  "भावज्ञा|knower of feelings; भवरोगघ्नी|healer of the disease of saṃsāra; भवचक्रप्रवर्तिनी|who turns the wheel of saṃsāra",
  "Mukundā, giver of liberation; abode of liberation; the root form of all deities; knower of all feelings; destroyer of the disease of worldly existence; who turns the wheel of saṃsāra.",
  "முகுந்தா; முக்தியின் இருப்பிடம்; மூல வடிவினள்; உணர்வுகளை அறிபவள்; பிறவிப் பிணியை அழிப்பவள்; பவசக்கரத்தைச் சுழற்றுபவள்."),
 v(158, "Bliss & the Śrīcakra", "Essence of the metres, the śāstras, the mantras; slim-waisted — of great fame, of boundless glory, the letters.",
  "छन्दस्सारा|essence of the Vedas (metres); शास्त्रसारा|essence of the scriptures; मन्त्रसारा|essence of the mantras; तलोदरी|slim-waisted",
  "उदारकीर्तिरुद्दामवैभवा|of noble fame, of unrestrained glory|udāra · kīrtiḥ · uddāma · vaibhavā; वर्णरूपिणी|in the form of the letters",
  "Essence of the Vedas; essence of the scriptures; essence of the mantras; slim-waisted; of noble fame; of unbounded glory; in the form of the letters.",
  "வேதங்களின் சாரம்; சாஸ்திரங்களின் சாரம்; மந்திரங்களின் சாரம்; மெல்லிடையாள்; உயர்ந்த புகழுடையவள்; கட்டற்ற மகிமையுடையவள்; அக்ஷர வடிவினள்."),
 v(159, "Bliss & the Śrīcakra", "Rest for those scorched by birth, death and age — proclaimed by all the Upaniṣads, beyond peace itself.",
  "जन्ममृत्युजरातप्तजनविश्रान्तिदायिनी|giver of rest to people scorched by birth, death and old age|janma · mṛtyu · jarā · tapta · jana · viśrānti · dāyinī",
  "सर्वोपनिषदुद्घुष्टा|proclaimed by all the Upaniṣads; शान्त्यतीतकलात्मिका|the state beyond peace",
  "Giver of rest to those scorched by birth, death and old age; proclaimed by all the Upaniṣads; whose nature is the kalā beyond even peace.",
  "பிறப்பு, இறப்பு, மூப்பு ஆகியவற்றால் வாடுபவர்களுக்கு ஓய்வு தருபவள்; எல்லா உபநிஷத்துகளாலும் முழங்கப்படுபவள்; சாந்திக்கும் அப்பாற்பட்ட கலை வடிவினள்."),
 v(160, "Bliss & the Śrīcakra", "Deep, in the heart of the sky, proud, fond of song — beyond imagining, the goal, half of her beloved's body.",
  "गम्भीरा|deep; गगनान्तस्था|dwelling in the sky; गर्विता|proud; गानलोलुपा|fond of music",
  "कल्पनारहिता|beyond imagining; काष्ठाऽकान्ता|the goal, beyond sorrow|kāṣṭhā · akāntā; कान्तार्धविग्रहा|half of her beloved's body",
  "Deep; dwelling in the sky; proud; fond of music; beyond imagination; the final goal; free from sorrow; whose body is half of her beloved's.",
  "ஆழமானவள்; வானத்தில் இருப்பவள்; பெருமிதமுடையவள்; இசையை விரும்புபவள்; கற்பனைக்கு அப்பாற்பட்டவள்; காஷ்டை (எல்லை); துயரற்றவள்; காந்தனின் பாதி உடலானவள்."),
 v(161, "Bliss & the Śrīcakra", "Free from cause and effect, rippling with love's play — with shining gold earrings, taking forms in play.",
  "कार्यकारणनिर्मुक्ता|free from cause and effect; कामकेलितरङ्गिता|rippling with the play of love",
  "कनत्कनकताटङ्का|with shining golden earrings; लीलाविग्रहधारिणी|taking forms in play",
  "Free from cause and effect; rippling with the play of love; wearing shining golden earrings; taking on forms in play.",
  "காரண காரியங்களிலிருந்து விடுபட்டவள்; காம விளையாட்டில் அலைமோதுபவள்; ஒளிரும் பொன் தோடுகள் அணிந்தவள்; லீலைக்காக வடிவங்களைத் தாங்குபவள்."),
 v(162, "Bliss & the Śrīcakra", "Unborn, free from decay, innocent, quick to please — worshipped by the inward-turned, rare to the outward.",
  "अजा|unborn; क्षयविनिर्मुक्ता|free from decay; मुग्धा|innocent, charming; क्षिप्रप्रसादिनी|quick to be pleased",
  "अन्तर्मुखसमाराध्या|worshipped by those turned inward; बहिर्मुखसुदुर्लभा|very hard to reach for those turned outward",
  "Unborn; free from decay; innocent and charming; quickly pleased; worshipped by those turned inward; very hard to reach for those turned outward.",
  "பிறப்பற்றவள்; தேய்வற்றவள்; அழகிய அப்பாவி; விரைவில் அருள்பவள்; உள்முகமானவர்களால் ஆராதிக்கப்படுபவள்; வெளிமுகமானவர்களுக்கு அரிதானவள்."),
 v(163, "Bliss & the Śrīcakra", "The three Vedas, home of the three aims, in the three — Tripuramālinī, healthy, supportless, delighting in the Self.",
  "त्रयी|the three Vedas; त्रिवर्गनिलया|home of the three aims; त्रिस्था|dwelling in the three (worlds); त्रिपुरमालिनी|Tripuramālinī",
  "निरामया|free of illness; निरालम्बा|without support; स्वात्मारामा|delighting in her own Self; सुधासृतिः|a stream of nectar",
  "The three Vedas; the home of the three aims; dwelling in the three worlds; Tripuramālinī; free from illness; without support; delighting in her own Self; a stream of nectar.",
  "த்ரயீ (மூன்று வேதம்); மூன்று புருஷார்த்தங்களின் இருப்பிடம்; மூன்றில் இருப்பவள்; திரிபுரமாலினி; நோயற்றவள்; ஆதாரமற்றவள்; தன் ஆத்மாவில் மகிழ்பவள்; அமுத தாரை."),
 v(164, "Bliss & the Śrīcakra", "Expert at lifting those sunk in saṃsāra's mud — lover, doer and patron of sacrifice.",
  "संसारपङ्कनिर्मग्नसमुद्धरणपण्डिता|expert at lifting those sunk in the mud of saṃsāra|saṃsāra · paṅka · nirmagna · samuddharaṇa · paṇḍitā",
  "यज्ञप्रिया|fond of sacrifice; यज्ञकर्त्री|performer of sacrifice; यजमानस्वरूपिणी|in the form of the patron of sacrifice",
  "Skilled in lifting out those sunk in the mire of worldly life; fond of sacrifice; the performer of sacrifice; in the form of the yajamāna.",
  "சம்சாரச் சேற்றில் மூழ்கியவர்களை மீட்பதில் வல்லவள்; யாகத்தை விரும்புபவள்; யாகம் செய்பவள்; யஜமான வடிவினள்."),
 v(165, "Bliss & the Śrīcakra", "Support of dharma, guardian of wealth, increasing riches and grain — dear to the learned, making the universe turn.",
  "धर्माधारा|support of dharma; धनाध्यक्षा|guardian of wealth; धनधान्यविवर्धिनी|increaser of wealth and grain",
  "विप्रप्रिया|dear to the learned; विप्ररूपा|in the form of the learned; विश्वभ्रमणकारिणी|who makes the universe revolve",
  "Support of dharma; guardian of wealth; increaser of wealth and grain; dear to the learned; in the form of the learned; who makes the universe revolve.",
  "தர்மத்தின் ஆதாரம்; செல்வத்தின் அதிகாரி; தனதான்யங்களைப் பெருக்குபவள்; அந்தணர்களுக்குப் பிரியமானவள்; அந்தண வடிவினள்; உலகைச் சுழற்றுபவள்."),
 v(166, "Bliss & the Śrīcakra", "Devourer of the universe, coral-bright, Vaiṣṇavī — unborn yet the source, unchanging, the Kula itself.",
  "विश्वग्रासा|devourer of the universe; विद्रुमाभा|bright as coral; वैष्णवी|Vaiṣṇavī; विष्णुरूपिणी|in the form of Viṣṇu",
  "अयोनिर्|without source; योनिनिलया|the abode of all sources; कूटस्था|unchanging; कुलरूपिणी|the Kula itself",
  "Devourer of the universe (at dissolution); coral-bright; Vaiṣṇavī; in the form of Viṣṇu; without origin; the abode of all origins; unchanging; the Kula itself.",
  "உலகை விழுங்குபவள்; பவழ ஒளியுடையவள்; வைஷ்ணவி; விஷ்ணு வடிவினள்; மூலமற்றவள்; எல்லா மூலங்களின் இருப்பிடம்; கூடஸ்தா; குல வடிவினள்."),
 v(167, "Bliss & the Śrīcakra", "Fond of heroes' gatherings, heroic, beyond action, sound itself — the play of knowledge, skilful, seated on the bindu.",
  "वीरगोष्ठीप्रिया|fond of the assembly of heroes; वीरा|heroic; नैष्कर्म्या|beyond action; नादरूपिणी|sound itself",
  "विज्ञानकलना|the realisation of knowledge; कल्या|capable; विदग्धा|skilful; बैन्दवासना|seated on the bindu",
  "Fond of the gathering of heroes; heroic; beyond action; in the form of sound; the realisation of knowledge; capable; skilful; seated on the bindu.",
  "வீரர் கூட்டத்தை விரும்புபவள்; வீரா; நைஷ்கர்ம்யா; நாத வடிவினள்; விஞ்ஞானத்தை உணர்த்துபவள்; ஆற்றலுடையவள்; திறமையானவள்; பிந்துவில் அமர்ந்தவள்."),
 v(168, "Bliss & the Śrīcakra", "Beyond the tattvas yet made of them, the meaning of ‘That’ and ‘thou’ — fond of Sāma songs, gentle, Sadāśiva's wife.",
  "तत्त्वाधिका|beyond the tattvas; तत्त्वमयी|made of the tattvas; तत्त्वमर्थस्वरूपिणी|the meaning of “That” and “thou”",
  "सामगानप्रिया|fond of Sāma chanting; सौम्या|gentle; सदाशिवकुटुम्बिनी|the wife of Sadāśiva",
  "Beyond the tattvas; made of the tattvas; whose form is the meaning of “tat” and “tvam”; fond of Sāma chanting; gentle; the wife of Sadāśiva.",
  "தத்துவங்களைக் கடந்தவள்; தத்துவமயமானவள்; ‘தத்’, ‘த்வம்’ சொற்களின் பொருளானவள்; சாமகானத்தை விரும்புபவள்; சௌம்யா; சதாசிவனின் குடும்பினி."),
 v(169, "Bliss & the Śrīcakra", "On the right and left paths, warding off all dangers — at peace, sweet by nature, wise, worshipped by the wise.",
  "सव्यापसव्यमार्गस्था|on both the right and left paths; सर्वापद्विनिवारिणी|warding off all dangers",
  "स्वस्था|at peace in herself; स्वभावमधुरा|sweet by nature; धीरा|wise; धीरसमर्चिता|worshipped by the wise",
  "Present on both the right and left paths of worship; warding off all dangers; at peace in herself; sweet by nature; wise; worshipped by the wise.",
  "சவ்ய அபசவ்ய மார்க்கங்களில் இருப்பவள்; எல்லா ஆபத்துகளையும் தடுப்பவள்; தன்னில் நிலைத்தவள்; இயல்பாக இனியவள்; தீரா; தீரர்களால் அர்ச்சிக்கப்படுபவள்."),
 v(170, "Bliss & the Śrīcakra", "Worshipped with the offering of awareness, fond of the flowers of consciousness — ever risen, ever content, rosy as the young sun.",
  "चैतन्यार्घ्यसमाराध्या|worshipped with the offering of awareness; चैतन्यकुसुमप्रिया|fond of the flowers of consciousness",
  "सदोदिता|ever risen; सदातुष्टा|ever content; तरुणादित्यपाटला|rosy as the rising sun",
  "Worshipped with the arghya of awareness; fond of the flowers of consciousness; ever risen; ever content; rosy as the young sun.",
  "சைதன்யம் எனும் அர்க்யத்தால் ஆராதிக்கப்படுபவள்; சைதன்ய மலர்களை விரும்புபவள்; என்றும் உதித்தவள்; என்றும் திருப்தியானவள்; இளஞ்சூரியன் போல் சிவந்தவள்."),
 v(171, "Bliss & the Śrīcakra", "Worshipped by the learned and the simple, with a gently smiling lotus face — Kaulinī, giver of priceless liberation.",
  "दक्षिणादक्षिणाराध्या|worshipped by the learned and the unlearned alike; दरस्मेरमुखाम्बुजा|with a gently smiling lotus face",
  "कौलिनीकेवलाऽनर्घ्यकैवल्यपददायिनी|Kaulinī, the only one, giver of priceless liberation|kaulinī · kevalā · anarghya · kaivalya · pada · dāyinī",
  "Worshipped by the learned and the simple alike; with a lotus face gently smiling; Kaulinī; the only one; giver of the priceless state of liberation.",
  "அறிஞராலும் அறியாதவராலும் ஆராதிக்கப்படுபவள்; மெல்லிய புன்னகை முகத்தாமரையுடையவள்; கௌலினி; கேவலா; விலைமதிப்பற்ற கைவல்யம் அருள்பவள்."),
 v(172, "Bliss & the Śrīcakra", "Fond of hymns, full of praise, glorified by the Vedas — high-minded, honoured, Maheśī, auspicious in form.",
  "स्तोत्रप्रिया|fond of hymns; स्तुतिमती|full of praise; श्रुतिसंस्तुतवैभवा|whose glory is praised by the Vedas",
  "मनस्विनी|high-minded; मानवती|full of dignity; महेशी|Maheśī; मङ्गलाकृतिः|auspicious in form",
  "Fond of hymns; full of praise; whose glory the Vedas sing; high-minded; full of dignity; Maheśī; auspicious in form.",
  "ஸ்தோத்திரங்களை விரும்புபவள்; துதிக்கப்படுபவள்; வேதங்களால் போற்றப்படும் மகிமையுடையவள்; மனஸ்வினி; மானவதி; மகேசி; மங்கள வடிவினள்."),
 v(173, "Bliss & the Śrīcakra", "Mother and nurse of the world, wide-eyed, dispassionate — bold, most generous, supreme joy, made of mind.",
  "विश्वमाता|mother of the universe; जगद्धात्री|nurse of the world; विशालाक्षी|wide-eyed; विरागिणी|dispassionate",
  "प्रगल्भा|bold; परमोदारा|most generous; परामोदा|supreme joy; मनोमयी|made of mind",
  "Mother of the universe; nurse of the world; wide-eyed; dispassionate; bold; supremely generous; supreme joy; made of mind.",
  "உலக அன்னை; ஜகத்தாத்ரி; விசாலாக்ஷி; விரக்தியுடையவள்; துணிவுடையவள்; பெரும் வள்ளல்; பரம ஆனந்தம்; மனோமயி."),
 v(174, "Bliss & the Śrīcakra", "Sky-haired, in the celestial car, wielder of the vajra, Vāmakeśvarī — fond of the five sacrifices, resting on the couch of five.",
  "व्योमकेशी|whose hair is the sky; विमानस्था|in the celestial car; वज्रिणी|wielder of the vajra; वामकेश्वरी|Vāmakeśvarī",
  "पञ्चयज्ञप्रिया|fond of the five sacrifices; पञ्चप्रेतमञ्चाधिशायिनी|reclining on the couch of the five pretas",
  "Whose hair is the sky; dwelling in the celestial car; wielder of the thunderbolt; Vāmakeśvarī; fond of the five daily sacrifices; reclining on the couch formed by the five pretas.",
  "வானமே கூந்தலானவள்; விமானத்தில் இருப்பவள்; வஜ்ரம் ஏந்தியவள்; வாமகேஸ்வரி; பஞ்ச யக்ஞங்களை விரும்புபவள்; பஞ்சப் பிரேதக் கட்டிலில் சயனிப்பவள்."),
 v(175, "Bliss & the Śrīcakra", "The fifth, queen of the five elements, worshipped with five offerings — eternal, of eternal lordship, giver of joy, Śambhu's enchantress.",
  "पञ्चमी|the fifth (Sadāśiva's consort); पञ्चभूतेशी|queen of the five elements; पञ्चसङ्ख्योपचारिणी|worshipped with five offerings",
  "शाश्वती|eternal; शाश्वतैश्वर्या|of eternal lordship; शर्मदा|giver of happiness; शम्भुमोहिनी|enchantress of Śambhu",
  "The fifth; queen of the five elements; worshipped with the five offerings; eternal; of everlasting lordship; giver of happiness; enchantress of Śambhu.",
  "பஞ்சமீ; பஞ்ச பூதங்களின் ஈஸ்வரி; ஐந்து உபசாரங்களால் பூஜிக்கப்படுபவள்; சாஸ்வதி; நிலையான ஐஸ்வர்யமுடையவள்; இன்பம் தருபவள்; சம்புவை மயக்குபவள்."),
 v(176, "Bliss & the Śrīcakra", "The earth, the mountain's daughter, blessed, dharma's own — beyond the worlds, beyond guṇas, beyond all, peace itself.",
  "धरा|the earth; धरसुता|daughter of the mountain; धन्या|blessed; धर्मिणी|righteous; धर्मवर्धिनी|increaser of dharma",
  "लोकातीता|beyond the worlds; गुणातीता|beyond the guṇas; सर्वातीता|beyond all; शमात्मिका|of the nature of peace",
  "The earth; daughter of the mountain; blessed; righteous; increaser of dharma; beyond the worlds; beyond the guṇas; beyond everything; peace itself.",
  "தரா; மலைமகள்; பாக்கியவதி; தர்மிணி; தர்மத்தை வளர்ப்பவள்; உலகங்களைக் கடந்தவள்; குணங்களைக் கடந்தவள்; எல்லாவற்றையும் கடந்தவள்; சாந்த வடிவினள்.",
  {tip:"Three <b>-atītā</b>: lokātītā · guṇātītā · sarvātītā — beyond worlds, qualities, everything."}),
 v(177, "Bliss & the Śrīcakra", "Red as the bandhūka flower, the child, playful — ever-married, giver of joy, finely dressed, the auspicious wife.",
