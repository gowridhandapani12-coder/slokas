          <h1>Lalitha Sahasranamam</h1>
          <p class="lead" style="margin-top:8px">“The thousand names of Lalitā.” Composed by the eight Vāg-devīs at the Goddess's command and taught by Hayagrīva to Agastya. It begins <i>śrīmātā</i> — “the auspicious Mother” — and ends <i>lalitāmbikā</i>. On the way it describes her rising from the fire of consciousness, her form from crown to feet, her city, her war against Bhaṇḍāsura, the cakras of the body, and her nature beyond all qualities.</p>
        </div>

  "தன் இனிய பேச்சால் சரஸ்வதியின் கச்சபி வீணையையும் வெட்கப்படச் செய்பவள்; தன் மந்தஹாச ஒளிப்பெருக்கில் காமேஸ்வரனின் மனத்தை மூழ்கடிப்பவள்.",
  {tip:"Sarasvatī heard Lalitā speak and quietly put her vīṇā (<b>kacchapī</b>) back in its case."}),
 v(12, "Crown to feet", "A chin beyond compare; the maṅgalasūtra Kāmeśa tied adorns her neck.",
  "अनाकलितसादृश्यचिबुकश्रीविराजिता|shining with a chin whose like cannot be found|anākalita · sādṛśya · cibuka · śrī · virājitā",
  "कामेशबद्धमाङ्गल्यसूत्रशोभितकन्धरा|her neck adorned with the maṅgalasūtra tied by Kāmeśa|kāmeśa · baddha · māṅgalya · sūtra · śobhita · kandharā",
  "Shining with a chin of incomparable beauty; her neck adorned with the auspicious thread (maṅgalasūtra) tied by Kāmeśvara.",
  "ஒப்புமை காண முடியாத அழகிய மோவாயுடையவள்; காமேஸ்வரன் கட்டிய மாங்கல்ய சூத்திரத்தால் அழகுற்ற கழுத்துடையவள்."),
 v(13, "Crown to feet", "Lovely arms with golden armlets; a jewelled necklace with a swinging pearl pendant.",
  "कनकाङ्गदकेयूरकमनीयभुजान्विता|with lovely arms wearing golden armlets|kanaka · aṅgada · keyūra · kamanīya · bhuja · anvitā",
  "रत्नग्रैवेयचिन्ताकलोलमुक्ताफलान्विता|with a jewelled necklace and a swinging pearl pendant|ratna · graiveya · cintāka · lola · muktā · phala · anvitā",
  "With lovely arms adorned with golden armlets; wearing a jewelled necklace with a pendant of swinging pearls.",
  "பொன் தோள்வளைகள் அணிந்த அழகிய கைகளுடையவள்; ரத்தின அட்டிகையும் அசையும் முத்துப் பதக்கமும் அணிந்தவள்."),
 v(14, "Crown to feet", "Her bosom is the price for Kāmeśvara's jewel of love — fruits of the creeper rising from her navel.",
  "कामेश्वरप्रेमरत्नमणिप्रतिपणस्तनी|whose breasts are given in exchange for Kāmeśvara's jewel of love|kāmeśvara · prema · ratna · maṇi · pratipaṇa · stanī",
  "नाभ्यालवालरोमालिलताफलकुचद्वयी|whose breasts are the fruits of the creeper of fine hair rising from her navel|nābhi · ālavāla · romāli · latā · phala · kuca · dvayī",
  "Whose breasts are given in exchange for the precious jewel of Kāmeśvara's love; whose breasts are like the two fruits of the creeper of fine hair rising from the basin of her navel.",
  "காமேஸ்வரனின் அன்பு எனும் ரத்தினத்துக்கு ஈடாகத் தன் ஸ்தனங்களைத் தருபவள்; நாபி எனும் பாத்தியிலிருந்து எழும் ரோமக் கொடியின் கனிகள் போன்ற ஸ்தனங்கள் உடையவள்."),
 v(15, "Crown to feet", "A waist so slender it is only guessed from the line of hair; three folds on her waist.",
  "लक्ष्यरोमलताधारतासमुन्नेयमध्यमा|whose waist can only be inferred as the support of the visible line of hair|lakṣya · roma · latā · ādhāratā · samunneya · madhyamā",
  "स्तनभारदलन्मध्यपट्टबन्धवलित्रया|with three folds like a belt round her waist, bending under her bosom|stana · bhāra · dalat · madhya · paṭṭa · bandha · vali · trayā",
  "Whose waist is so slender it can only be inferred as the support of the line of fine hair; with three folds, like a belt, on her waist bending under the weight of her bosom.",
  "காணப்படும் ரோமக் கொடிக்கு ஆதாரம் என்பதால் மட்டுமே ஊகிக்கக்கூடிய மெல்லிடையாள்; ஸ்தனபாரத்தால் வளையும் இடையில் பட்டை போன்ற மூன்று மடிப்புகள் உடையவள்."),
 v(16, "Crown to feet", "Hips in a dawn-red silk; a girdle with tinkling jewelled bells.",
  "अरुणारुणकौसुम्भवस्त्रभास्वत्कटीतटी|her hips shining in silk red as the dawn|aruṇa · aruṇa · kausumbha · vastra · bhāsvat · kaṭī · taṭī",
  "रत्नकिङ्किणिकारम्यरशनादामभूषिता|adorned with a girdle lovely with jewelled bells|ratna · kiṅkiṇikā · ramya · raśanā · dāma · bhūṣitā",
  "Her hips shining in a silk garment red as the dawn; adorned with a girdle lovely with tinkling jewelled bells.",
  "உதய சூரியன் போல் சிவந்த குசும்பப் பட்டாடையால் ஒளிரும் இடையுடையவள்; ரத்தின கிண்கிணிகள் ஒலிக்கும் ஒட்டியாணம் அணிந்தவள்."),
 v(17, "Crown to feet", "Thighs whose softness only Kāmeśa knows; knees like ruby crowns.",
  "कामेशज्ञातसौभाग्यमार्दवोरुद्वयान्विता|with thighs whose beauty and softness are known only to Kāmeśa|kāmeśa · jñāta · saubhāgya · mārdava · ūru · dvaya · anvitā",
  "माणिक्यमुकुटाकारजानुद्वयविराजिता|shining with knees like ruby crowns|māṇikya · mukuṭa · ākāra · jānu · dvaya · virājitā",
  "With thighs whose beauty and softness are known only to Kāmeśvara; shining with knees shaped like ruby crowns.",
  "காமேஸ்வரன் மட்டுமே அறிந்த அழகும் மென்மையும் கொண்ட தொடைகளுடையவள்; மாணிக்க மகுடம் போன்ற முழங்கால்களால் ஒளிர்பவள்."),
 v(18, "Crown to feet", "Calves like Kāma's quivers; hidden ankles; insteps finer than a tortoise's back.",
  "इन्द्रगोपपरिक्षिप्तस्मरतूणाभजङ्घिका|with calves like Kāma's quivers studded with red beetles|indragopa · parikṣipta · smara · tūṇa · ābha · jaṅghikā",
  "गूढगुल्फा|with hidden ankles; कूर्मपृष्ठजयिष्णुप्रपदान्विता|with insteps surpassing a tortoise's back|kūrma · pṛṣṭha · jayiṣṇu · prapada · anvitā",
  "With calves like Kāma's quivers studded with red indragopa beetles; with ankles hidden (by flesh); with insteps whose curve surpasses a tortoise's back.",
  "இந்திரகோபப் பூச்சிகள் பதித்த மன்மதனின் அம்பறாத்தூணி போன்ற கணைக்கால்கள் உடையவள்; மறைந்த கணுக்கால்கள் உடையவள்; ஆமை முதுகையும் மிஞ்சும் பாத மேற்பகுதி உடையவள்."),
 v(19, "Crown to feet", "The light of her toenails dispels the darkness of those who bow; her feet outshine lotuses.",
  "नखदीधितिसञ्छन्ननमज्जनतमोगुणा|by the light of whose toenails the darkness of those who bow is dispelled|nakha · dīdhiti · sañchanna · namat · jana · tamoguṇā",
  "पदद्वयप्रभाजालपराकृतसरोरुहा|whose two feet with their rays outshine lotuses|pada · dvaya · prabhā · jāla · parākṛta · saroruhā",
  "By the radiance of whose toenails the darkness of those who bow to her is dispelled; the rays of whose two feet put lotuses to shame.",
  "தன் நக ஒளியால் வணங்குபவர்களின் தமோ குணத்தைப் போக்குபவள்; தன் இரு பாதங்களின் ஒளிக்கற்றையால் தாமரைகளையும் தோற்கடிப்பவள்.",
  {tip:"The darkness inside those who bow is removed just by the light of her <b>toenails</b>."}),
 v(20, "Crown to feet", "Tinkling jewelled anklets; the gait of a swan; a treasure of great beauty.",
  "सिञ्जानमणिमञ्जीरमण्डितश्रीपदाम्बुजा|her lotus feet adorned with tinkling jewelled anklets|siñjāna · maṇi · mañjīra · maṇḍita · śrī · pada · ambujā",
  "मरालीमन्दगमना|walking slowly like a swan|marālī · manda · gamanā; महालावण्यशेवधिः|a treasure-house of great beauty|mahā · lāvaṇya · śevadhi",
  "Her lotus feet adorned with tinkling jewelled anklets; walking slowly and gracefully like a female swan; a treasure-house of great beauty.",
  "ஒலிக்கும் மணிச் சிலம்புகள் அணிந்த திருவடித் தாமரைகளுடையவள்; அன்னம் போல் மெதுவாக நடப்பவள்; பேரழகின் கருவூலம்."),
 v(21, "Crown to feet", "All red, flawless, adorned with every ornament — seated on Kāmeśvara's lap.",
  "सर्वारुणाऽनवद्याङ्गी|all red, flawless in limb|sarva · aruṇā · anavadya · aṅgī; सर्वाभरणभूषिता|adorned with all ornaments",
  "शिवकामेश्वराङ्कस्था|seated on the lap of Śiva Kāmeśvara|śiva · kāmeśvara · aṅka · sthā; शिवा|the auspicious|śivā; स्वाधीनवल्लभा|whose beloved is devoted to her|svādhīna · vallabhā",
  "Red all over; flawless in every limb; adorned with every ornament; seated on the lap of Śiva-Kāmeśvara; Śivā; whose beloved is under her loving sway.",
  "எங்கும் சிவந்தவள்; குறையற்ற அங்கமுடையவள்; எல்லா ஆபரணங்களும் அணிந்தவள்; சிவகாமேஸ்வரனின் மடியில் அமர்ந்தவள்; சிவா; கணவனைத் தன் வசம் கொண்டவள்."),
 v(22, "Her home", "On the central peak of Meru, ruler of the city, in the wish-jewel palace, on the seat of the five Brahmās.",
  "सुमेरुमध्यशृङ्गस्था|on the middle peak of Mount Meru; श्रीमन्नगरनायिका|ruler of the glorious city (Śrīpura)",
  "चिन्तामणिगृहान्तस्था|within the palace of wish-jewels|cintāmaṇi · gṛha · antaḥ · sthā; पञ्चब्रह्मासनस्थिता|seated on the throne of the five Brahmās",
  "Dwelling on the central peak of Mount Meru; ruler of the glorious city; within the palace of wish-fulfilling jewels; seated on the throne formed by the five Brahmās.",
  "மேருமலையின் நடுச் சிகரத்தில் இருப்பவள்; ஸ்ரீநகரத்தின் தலைவி; சிந்தாமணி மாளிகையில் உள்ளவள்; பஞ்சப் பிரம்மாக்களாலான ஆசனத்தில் அமர்ந்தவள்."),
 v(23, "Her home", "In the great lotus forest, the kadamba grove, the ocean of nectar — Kāmākṣī, giver of desires.",
  "महापद्माटवीसंस्था|in the great forest of lotuses; कदम्बवनवासिनी|dwelling in the kadamba forest",
  "सुधासागरमध्यस्था|in the middle of the ocean of nectar; कामाक्षी|Kāmākṣī, of loving eyes|kāma · akṣī; कामदायिनी|giver of desires",
  "Dwelling in the great lotus forest; living in the kadamba grove; in the middle of the ocean of nectar; Kāmākṣī; giver of all desires.",
  "மகா பத்மக் காட்டில் இருப்பவள்; கடம்ப வனத்தில் வசிப்பவள்; அமுதக் கடலின் நடுவில் உள்ளவள்; காமாக்ஷி; விருப்பங்களை அருள்பவள்.",
  {tip:"<b>Kāmākṣī</b> of Kāñcī is named here."}),
 v(24, "The war", "Praised by gods and sages; with her armies of Śaktis ready to slay Bhaṇḍāsura.",
  "देवर्षिगणसङ्घातस्तूयमानात्मवैभवा|whose glory is praised by hosts of gods and sages|deva · ṛṣi · gaṇa · saṅghāta · stūyamāna · ātma · vaibhavā",
  "भण्डासुरवधोद्युक्तशक्तिसेनासमन्विता|with the army of Śaktis ready to slay Bhaṇḍāsura|bhaṇḍa · asura · vadha · udyukta · śakti · senā · samanvitā",
  "Whose glory is praised by hosts of gods and sages; accompanied by the army of Śaktis ready to slay the demon Bhaṇḍa.",
  "தேவர், ரிஷிகளின் கூட்டங்களால் போற்றப்படும் மகிமையுடையவள்; பண்டாசுரனை அழிக்கத் தயாரான சக்திச் சேனையுடன் இருப்பவள்.",
  {tip:"Verses 24–34 tell the war against <b>Bhaṇḍāsura</b>, born from the ashes of Kāma."}),
 v(25, "The war", "Served by Sampatkarī's elephants and Aśvārūḍhā's millions of horses.",
  "सम्पत्करीसमारूढसिन्धुरव्रजसेविता|served by the herds of elephants ridden by Sampatkarī|sampatkarī · samārūḍha · sindhura · vraja · sevitā",
  "अश्वारूढाधिष्ठिताश्वकोटिकोटिभिरावृता|surrounded by crores of horses led by Aśvārūḍhā|aśvārūḍhā · adhiṣṭhita · aśva · koṭi · koṭibhiḥ · āvṛtā",
  "Served by herds of elephants led by the Śakti Sampatkarī; surrounded by crores of horses commanded by Aśvārūḍhā.",
  "சம்பத்கரி தலைமையிலான யானைக் கூட்டங்களால் சேவிக்கப்படுபவள்; அஸ்வாரூடா தலைமையிலான கோடிக்கணக்கான குதிரைகளால் சூழப்பட்டவள்."),
 v(26, "The war", "On the Śrīcakra chariot with all weapons; served by Mantriṇī on the Geyacakra chariot.",
  "चक्रराजरथारूढसर्वायुधपरिष्कृता|on the Śrīcakra chariot, adorned with all weapons|cakrarāja · ratha · ārūḍha · sarva · āyudha · pariṣkṛtā",
  "गेयचक्ररथारूढमन्त्रिणीपरिसेविता|served by Mantriṇī riding the Geyacakra chariot|geyacakra · ratha · ārūḍha · mantriṇī · parisevitā",
  "Riding the Cakrarāja (Śrīcakra) chariot, equipped with all weapons; attended by Mantriṇī (Śyāmalā) riding the Geyacakra chariot.",
  "சக்கரராஜ ரதத்தில் ஏறி எல்லா ஆயுதங்களும் தாங்கியவள்; கேயசக்கர ரதத்தில் ஏறிய மந்திரிணியால் சேவிக்கப்படுபவள்."),
 v(27, "The war", "Daṇḍanāthā on the Kiricakra leads the way; Jvālāmālinī raises a wall of fire round her.",
  "किरिचक्ररथारूढदण्डनाथापुरस्कृता|led by Daṇḍanāthā (Vārāhī) riding the Kiricakra chariot|kiricakra · ratha · ārūḍha · daṇḍanāthā · puraskṛtā",
  "ज्वालामालिनिकाक्षिप्तवह्निप्राकारमध्यगा|in the middle of the wall of fire thrown up by Jvālāmālinī|jvālāmālinikā · ākṣipta · vahni · prākāra · madhyagā",
  "Led by Daṇḍanāthā (Vārāhī) riding the Kiricakra chariot; standing within the wall of fire raised by Jvālāmālinī.",
  "கிரிசக்கர ரதத்தில் ஏறிய தண்டநாதாவை (வாராஹி) முன்னிட்டவள்; ஜ்வாலாமாலினி எழுப்பிய அக்னிச் சுவரின் நடுவில் இருப்பவள்."),
 v(28, "The war", "Delighted by her Śaktis' valour against Bhaṇḍa's army; eager to see the Nityās fight.",
  "भण्डसैन्यवधोद्युक्तशक्तिविक्रमहर्षिता|delighted by the valour of the Śaktis slaying Bhaṇḍa's army|bhaṇḍa · sainya · vadha · udyukta · śakti · vikrama · harṣitā",
  "नित्यापराक्रमाटोपनिरीक्षणसमुत्सुका|eager to watch the fierce valour of the Nityā goddesses|nityā · parākrama · āṭopa · nirīkṣaṇa · samutsukā",
  "Delighted by the valour of the Śaktis destroying Bhaṇḍa's army; eager to watch the might of the Nityā goddesses.",
  "பண்டனின் சேனையை அழிக்கும் சக்திகளின் வீரத்தால் மகிழ்ந்தவள்; நித்யா தேவியரின் பராக்கிரமத்தைக் காண ஆர்வமுடையவள்."),
 v(29, "The war", "Pleased by Bālā slaying Bhaṇḍa's sons and by Mantriṇī slaying Viṣaṅga.",
  "भण्डपुत्रवधोद्युक्तबालाविक्रमनन्दिता|pleased by the valour of Bālā, ready to slay Bhaṇḍa's sons|bhaṇḍa · putra · vadha · udyukta · bālā · vikrama · nanditā",
  "मन्त्रिण्यम्बाविरचितविषङ्गवधतोषिता|pleased by Mantriṇī's slaying of Viṣaṅga|mantriṇī · ambā · viracita · viṣaṅga · vadha · toṣitā",
  "Delighted by the valour of Bālā (her daughter) in slaying Bhaṇḍa's sons; pleased by Mantriṇī's slaying of Viṣaṅga.",
  "பண்டனின் புதல்வர்களை அழித்த பாலாவின் வீரத்தால் மகிழ்ந்தவள்; மந்திரிணி விஷங்கனை அழித்ததால் திருப்தியடைந்தவள்."),
 v(30, "The war", "Pleased by Vārāhī slaying Viśukra; she made Gaṇeśa by a glance at Kāmeśvara's face.",
  "विशुक्रप्राणहरणवाराहीवीर्यनन्दिता|pleased by Vārāhī's valour in taking Viśukra's life|viśukra · prāṇa · haraṇa · vārāhī · vīrya · nanditā",
  "कामेश्वरमुखालोककल्पितश्रीगणेश्वरा|who created Gaṇeśa by looking at Kāmeśvara's face|kāmeśvara · mukha · āloka · kalpita · śrī · gaṇeśvarā",
  "Delighted by Vārāhī's valour in slaying Viśukra; who brought forth Śrī Gaṇeśa by glancing at Kāmeśvara's face.",
  "விசுக்ரனின் உயிரைப் பறித்த வாராஹியின் வீரத்தால் மகிழ்ந்தவள்; காமேஸ்வரனின் முகத்தை நோக்கியே ஸ்ரீ கணேசரைத் தோற்றுவித்தவள்."),
 v(31, "The war", "Delighted when Gaṇeśa broke the obstacle-yantra; she answers Bhaṇḍa's weapons with her own.",
  "महागणेशनिर्भिन्नविघ्नयन्त्रप्रहर्षिता|delighted when Mahāgaṇeśa shattered the obstacle-yantra|mahāgaṇeśa · nirbhinna · vighna · yantra · praharṣitā",
  "भण्डासुरेन्द्रनिर्मुक्तशस्त्रप्रत्यस्त्रवर्षिणी|showering counter-weapons against Bhaṇḍa's weapons|bhaṇḍa · asura · indra · nirmukta · śastra · pratyastra · varṣiṇī",
  "Delighted when Mahāgaṇeśa shattered the obstacle-yantra; raining counter-weapons against every weapon released by Bhaṇḍāsura.",
  "மகாகணேசர் விக்னயந்திரத்தை உடைத்ததால் மகிழ்ந்தவள்; பண்டாசுரன் ஏவிய ஆயுதங்களுக்கு எதிர் அஸ்திரங்களைப் பொழிபவள்."),
 v(32, "The war", "From her fingernails came Nārāyaṇa's ten avatāras; the Pāśupata fire burned the demon army.",
  "कराङ्गुलिनखोत्पन्ननारायणदशाकृतिः|from whose fingernails arose Nārāyaṇa's ten forms|kara · aṅguli · nakha · utpanna · nārāyaṇa · daśa · ākṛti",
  "महापाशुपतास्त्राग्निनिर्दग्धासुरसैनिका|who burned the demon soldiers with the fire of the great Pāśupata weapon|mahā · pāśupata · astra · agni · nirdagdha · asura · sainikā",
  "From whose fingernails arose the ten avatāras of Nārāyaṇa; who burned the demon army with the fire of the great Pāśupata weapon.",
  "தன் விரல் நகங்களிலிருந்து நாராயணனின் பத்து அவதாரங்களைத் தோற்றுவித்தவள்; மகாபாசுபத அஸ்திரத்தின் தீயால் அசுர சேனையை எரித்தவள்.",
  {tip:"The <b>daśāvatāra</b> spring from her ten fingernails — a famous image."}),
 v(33, "The war", "With the Kāmeśvara weapon she burned Bhaṇḍa and his city; Brahmā, Viṣṇu and Indra praised her.",
  "कामेश्वरास्त्रनिर्दग्धसभण्डासुरशून्यका|who burned Bhaṇḍa and his city Śūnyaka with the Kāmeśvara weapon|kāmeśvara · astra · nirdagdha · sa · bhaṇḍāsura · śūnyakā",
  "ब्रह्मोपेन्द्रमहेन्द्रादिदेवसंस्तुतवैभवा|whose glory is praised by Brahmā, Viṣṇu, Indra and the gods|brahma · upendra · mahendra · ādi · deva · saṃstuta · vaibhavā",
  "Who burned Bhaṇḍāsura together with his city Śūnyaka by the Kāmeśvara weapon; whose glory is praised by Brahmā, Viṣṇu, Indra and the other gods.",
  "காமேஸ்வர அஸ்திரத்தால் பண்டாசுரனையும் அவன் நகரான சூன்யகத்தையும் எரித்தவள்; பிரம்மா, விஷ்ணு, இந்திரன் முதலிய தேவர்களால் போற்றப்படும் மகிமையுடையவள்."),
 v(34, "Mantra & Kuṇḍalinī", "She revived Kāma burned by Śiva's eye; her lotus face is the Vāgbhava kūṭa.",
  "हरनेत्राग्निसन्दग्धकामसञ्जीवनौषधिः|the life-giving herb for Kāma burned by Śiva's eye|hara · netra · agni · sandagdha · kāma · sañjīvana · auṣadhi",
  "श्रीमद्वाग्भवकूटैकस्वरूपमुखपङ्कजा|whose lotus face is the Vāgbhava kūṭa (first part of the mantra)|śrīmat · vāgbhava · kūṭa · eka · svarūpa · mukha · paṅkajā",
  "The life-giving herb that revived Kāma, burned by the fire of Śiva's eye; whose lotus face is the glorious Vāgbhava kūṭa of her mantra.",
  "சிவனின் நெற்றிக்கண் தீயால் எரிந்த மன்மதனை உயிர்ப்பித்த சஞ்சீவி; ஸ்ரீ வாக்பவ கூடமே தன் முகத்தாமரையாக உடையவள்.",
  {tip:"Verses 34–36: her body is the <b>pañcadaśī</b> mantra in three kūṭas — face (vāgbhava), middle (kāmarāja), below the waist (śakti)."}),
 v(35, "Mantra & Kuṇḍalinī", "From neck to waist she is the middle kūṭa; below the waist, the Śakti kūṭa.",
  "कण्ठाधःकटिपर्यन्तमध्यकूटस्वरूपिणी|whose body from neck to waist is the middle kūṭa|kaṇṭha · adhaḥ · kaṭi · paryanta · madhya · kūṭa · svarūpiṇī",
  "शक्तिकूटैकतापन्नकट्यधोभागधारिणी|whose body below the waist is one with the Śakti kūṭa|śakti · kūṭa · ekatā · āpanna · kaṭi · adhaḥ · bhāga · dhāriṇī",
  "Whose body from the neck down to the waist is the middle (Kāmarāja) kūṭa; whose body below the waist is one with the Śakti kūṭa.",
  "கழுத்து முதல் இடை வரை மத்திய (காமராஜ) கூடமாக உள்ளவள்; இடைக்குக் கீழ் சக்தி கூடமாக உள்ளவள்."),
 v(36, "Mantra & Kuṇḍalinī", "The root mantra itself, its three kūṭas her body; she guards the secrets of the Kula path.",
  "मूलमन्त्रात्मिका|the root mantra itself; मूलकूटत्रयकलेबरा|whose body is the three kūṭas of the root mantra",
  "कुलामृतैकरसिका|who delights only in the nectar of Kula|kula · amṛta · eka · rasikā; कुलसङ्केतपालिनी|guardian of the secret codes of Kula",
  "The root mantra itself; whose body is the three kūṭas of the root mantra; who delights in the nectar of Kula alone; guardian of the secret signs of the Kula path.",
  "மூல மந்திரமே வடிவானவள்; மூல மந்திரத்தின் மூன்று கூடங்களே உடலானவள்; குல அமுதத்தில் மட்டும் ரசிப்பவள்; குல சங்கேதங்களைக் காப்பவள்."),
 v(37, "Mantra & Kuṇḍalinī", "Lady of the Kula, within it, Kaulinī, yoginī of the Kula — beyond it too, devoted to Samaya worship.",
  "कुलाङ्गना|lady of the noble family (Kula); कुलान्तस्था|dwelling within the Kula; कौलिनी|Kaulinī; कुलयोगिनी|yoginī of the Kula",
  "अकुला|beyond the Kula|akulā; समयान्तस्था|dwelling within Samaya; समयाचारतत्परा|devoted to the Samaya way of worship",
  "Lady of the Kula; dwelling within the Kula; Kaulinī; the yoginī of the Kula; beyond the Kula (Akulā); dwelling within Samaya; devoted to the Samaya path of inner worship.",
  "குலாங்கனா; குலத்துள் இருப்பவள்; கௌலினி; குல யோகினி; அகுலா; சமயத்துள் இருப்பவள்; சமயாசாரத்தில் ஈடுபட்டவள்."),
 v(38, "Mantra & Kuṇḍalinī", "Living in the Mūlādhāra, she pierces Brahmā's knot; rising in the Maṇipūra, Viṣṇu's knot.",
  "मूलाधारैकनिलया|whose one home is the Mūlādhāra; ब्रह्मग्रन्थिविभेदिनी|who pierces the knot of Brahmā",
  "मणिपूरान्तरुदिता|who rises within the Maṇipūra; विष्णुग्रन्थिविभेदिनी|who pierces the knot of Viṣṇu",
  "Whose one dwelling is the Mūlādhāra; piercer of Brahmā's knot; rising within the Maṇipūra; piercer of Viṣṇu's knot.",
  "மூலாதாரத்தையே இருப்பிடமாகக் கொண்டவள்; பிரம்ம கிரந்தியைப் பிளப்பவள்; மணிபூரகத்தில் உதிப்பவள்; விஷ்ணு கிரந்தியைப் பிளப்பவள்.",
  {tip:"Verses 38–40: <b>Kuṇḍalinī</b> rises from the Mūlādhāra through the three knots (granthi) to the thousand-petalled lotus."}),
 v(39, "Mantra & Kuṇḍalinī", "In the Ājñā cakra, she pierces Rudra's knot; mounting the thousand-petalled lotus, she showers nectar.",
  "आज्ञाचक्रान्तरालस्था|dwelling within the Ājñā cakra; रुद्रग्रन्थिविभेदिनी|who pierces the knot of Rudra",
  "सहस्राराम्बुजारूढा|who mounts the thousand-petalled lotus; सुधासाराभिवर्षिणी|who pours down streams of nectar",
  "Dwelling within the Ājñā cakra; piercer of Rudra's knot; mounting the thousand-petalled lotus (Sahasrāra); pouring down streams of nectar.",
  "ஆக்ஞா சக்கரத்தில் இருப்பவள்; ருத்ர கிரந்தியைப் பிளப்பவள்; சகஸ்ராரத் தாமரையில் ஏறியவள்; அமுதத் தாரையைப் பொழிபவள்."),
 v(40, "Mantra & Kuṇḍalinī", "Bright as a lightning streak, above the six cakras — Kuṇḍalinī, fine as a lotus fibre.",
  "तडिल्लतासमरुचिः|bright as a streak of lightning|taḍit · latā · sama · ruci; षट्चक्रोपरिसंस्थिता|dwelling above the six cakras",
  "महासक्तिः|of great attachment (to devotees)|mahā · sakti; कुण्डलिनी|Kuṇḍalinī, the coiled one; बिसतन्तुतनीयसी|finer than a lotus-stalk fibre|bisa · tantu · tanīyasī",
  "Bright as a streak of lightning; dwelling above the six cakras; of great attachment; Kuṇḍalinī, the coiled power; finer than the fibre of a lotus stalk.",
  "மின்னல் கொடி போல் ஒளிர்பவள்; ஆறு சக்கரங்களுக்கு மேல் இருப்பவள்; பெரும் பற்றுடையவள்; குண்டலினி; தாமரைத் தண்டின் நூலைவிட மெல்லியவள்."),
 v(41, "Bhakti & the formless", "Bhavānī, reached by meditation, the axe for the forest of saṃsāra — giver of good fortune to devotees.",
  "भवानी|Bhavānī, Bhava's consort; भावनागम्या|reached by meditation|bhāvanā · gamyā; भवारण्यकुठारिका|axe for the forest of saṃsāra|bhava · araṇya · kuṭhārikā",
  "भद्रप्रिया|lover of the good; भद्रमूर्तिर्|auspicious in form; भक्तसौभाग्यदायिनी|giver of good fortune to devotees",
  "Bhavānī; reached through meditation; the axe for the forest of worldly life; lover of the good; auspicious in form; giver of good fortune to her devotees.",
  "பவானி; தியானத்தால் அடையப்படுபவள்; சம்சாரக் காட்டுக்குக் கோடரி; நன்மையை விரும்புபவள்; மங்கள வடிவினள்; பக்தர்களுக்குச் சௌபாக்கியம் தருபவள்."),
 v(42, "Bhakti & the formless", "Loving devotion, reached by devotion, won by devotion — Śāmbhavī, worshipped by Śāradā.",
  "भक्तिप्रिया|lover of devotion; भक्तिगम्या|reached by devotion; भक्तिवश्या|won over by devotion; भयापहा|remover of fear",
  "शाम्भवी|Śāmbhavī, Śambhu's consort; शारदाराध्या|worshipped by Śāradā (Sarasvatī); शर्वाणी|Śarvāṇī; शर्मदायिनी|giver of happiness",
  "Lover of devotion; reached by devotion; won over by devotion; remover of fear; Śāmbhavī; worshipped by Sarasvatī; Śarvāṇī; giver of happiness.",
  "பக்தியை விரும்புபவள்; பக்தியால் அடையப்படுபவள்; பக்திக்கு வசப்படுபவள்; பயத்தைப் போக்குபவள்; சாம்பவி; சாரதையால் ஆராதிக்கப்படுபவள்; சர்வாணி; இன்பம் தருபவள்.",
  {tip:"Three <b>bhakti</b> names in a row: <b>bhaktipriyā · bhaktigamyā · bhaktivaśyā</b>."}),
 v(43, "Bhakti & the formless", "Śāṅkarī, bringer of prosperity, chaste, autumn-moon-faced, slender — without support, without stain.",
  "शाङ्करी|Śaṅkara's consort; श्रीकरी|bringer of prosperity; साध्वी|the chaste one; शरच्चन्द्रनिभानना|with a face like the autumn moon",
  "शातोदरी|slender-waisted; शान्तिमती|full of peace; निराधारा|needing no support; निरञ्जना|stainless",
  "Śāṅkarī; bringer of prosperity; the chaste one; with a face like the autumn moon; slender-waisted; peaceful; needing no support; stainless.",
  "சாங்கரி; செல்வம் தருபவள்; பதிவிரதை; சரத்காலச் சந்திரன் போன்ற முகமுடையவள்; மெல்லிடையாள்; அமைதி நிறைந்தவள்; ஆதாரமற்றவள்; மாசற்றவள்."),
 v(44, "Bhakti & the formless", "Untainted, pure, eternal, formless, untroubled — beyond qualities, partless, calm.",
  "निर्लेपा|untainted; निर्मला|pure; नित्या|eternal; निराकारा|formless; निराकुला|untroubled",
  "निर्गुणा|beyond qualities; निष्कला|partless; शान्ता|calm; निष्कामा|desireless; निरुपप्लवा|indestructible",
  "Untainted; pure; eternal; formless; untroubled; beyond the guṇas; without parts; calm; desireless; indestructible.",
  "பற்றற்றவள்; தூயவள்; நித்யமானவள்; உருவமற்றவள்; கலக்கமற்றவள்; குணமற்றவள்; பகுதியற்றவள்; சாந்தமானவள்; ஆசையற்றவள்; அழிவற்றவள்.",
  {tip:"The <b>nir-</b> names start: free from stain, form, qualities, parts, desire…"}),
 v(45, "Bhakti & the formless", "Ever free, changeless, beyond the world, without support — ever pure, ever awake, faultless.",
  "नित्यमुक्ता|ever free; निर्विकारा|changeless; निष्प्रपञ्चा|beyond the world; निराश्रया|without support",
  "नित्यशुद्धा|ever pure; नित्यबुद्धा|ever awake; निरवद्या|faultless; निरन्तरा|without gap, all-pervading",
  "Ever free; changeless; beyond the world of forms; depending on nothing; ever pure; ever enlightened; faultless; continuous, all-pervading.",
  "நித்யமுக்தி; மாறுபாடற்றவள்; பிரபஞ்சத்துக்கு அப்பாற்பட்டவள்; ஆதாரமற்றவள்; நித்ய சுத்தம்; நித்ய புத்தம்; குற்றமற்றவள்; இடைவெளியற்றவள்."),
 v(46, "Bhakti & the formless", "Without cause, stainless, unconditioned, with no lord above her — passionless, destroyer of passion.",
  "निष्कारणा|without cause; निष्कलङ्का|spotless; निरुपाधिर्|unconditioned; निरीश्वरा|with no one above her",
  "नीरागा|without passion; रागमथनी|destroyer of passion; निर्मदा|without pride; मदनाशिनी|destroyer of pride",
  "Without cause; spotless; unconditioned; having no lord over her; without passion; destroyer of passion; without pride; destroyer of pride.",
  "காரணமற்றவள்; களங்கமற்றவள்; உபாதியற்றவள்; தனக்கு மேல் ஈஸ்வரன் இல்லாதவள்; ஆசையற்றவள்; ஆசையை அழிப்பவள்; கர்வமற்றவள்; கர்வத்தை அழிப்பவள்.",
  {tip:"Now in <b>pairs</b>: free of it, then destroyer of it — nīrāgā/rāgamathanī, nirmadā/madanāśinī. The pattern runs to verse 49."}),
 v(47, "Bhakti & the formless", "Free of worry, ego, delusion — destroyer of delusion; free of ‘mine’, sin — destroyer of sin.",
  "निश्चिन्ता|free of worry; निरहङ्कारा|without ego; निर्मोहा|without delusion; मोहनाशिनी|destroyer of delusion",
  "निर्ममा|without “mine”; ममताहन्त्री|destroyer of possessiveness; निष्पापा|sinless; पापनाशिनी|destroyer of sin",
  "Free of worry; without ego; without delusion; destroyer of delusion; without possessiveness; destroyer of possessiveness; sinless; destroyer of sin.",
  "கவலையற்றவள்; அகங்காரமற்றவள்; மோகமற்றவள்; மோகத்தை அழிப்பவள்; மமதையற்றவள்; மமதையை அழிப்பவள்; பாவமற்றவள்; பாவத்தை அழிப்பவள்."),
 v(48, "Bhakti & the formless", "Free of anger, greed, doubt, rebirth — and the destroyer of each.",
  "निष्क्रोधा|free of anger; क्रोधशमनी|calmer of anger; निर्लोभा|free of greed; लोभनाशिनी|destroyer of greed",
  "निःसंशया|free of doubt; संशयघ्नी|destroyer of doubt; निर्भवा|without birth; भवनाशिनी|destroyer of rebirth",
  "Free of anger; calmer of anger; free of greed; destroyer of greed; free of doubt; destroyer of doubt; without birth; destroyer of rebirth.",
  "கோபமற்றவள்; கோபத்தைத் தணிப்பவள்; பேராசையற்றவள்; பேராசையை அழிப்பவள்; ஐயமற்றவள்; ஐயத்தை அழிப்பவள்; பிறப்பற்றவள்; பிறவியை அழிப்பவள்."),
 v(49, "Bhakti & the formless", "Free of doubt, obstruction and division — destroyer of division; deathless, destroyer of death.",
  "निर्विकल्पा|free of mental constructs; निराबाधा|unobstructed; निर्भेदा|without division; भेदनाशिनी|destroyer of division",
  "निर्नाशा|imperishable; मृत्युमथनी|destroyer of death; निष्क्रिया|actionless; निष्परिग्रहा|possessing nothing",
  "Beyond mental constructs; unobstructed; without division; destroyer of division; imperishable; destroyer of death; actionless; possessing nothing.",
  "விகல்பமற்றவள்; தடையற்றவள்; பேதமற்றவள்; பேதத்தை அழிப்பவள்; அழிவற்றவள்; மரணத்தை அழிப்பவள்; செயலற்றவள்; எதையும் உடைமையாகக் கொள்ளாதவள்."),
 v(50, "Bhakti & the formless", "Peerless, dark-haired, imperishable — hard to reach, Durgā, ender of sorrow, giver of joy.",
  "निस्तुला|peerless; नीलचिकुरा|dark-haired; निरपाया|indestructible; निरत्यया|insurmountable",
  "दुर्लभा|hard to attain; दुर्गमा|hard to approach; दुर्गा|Durgā; दुःखहन्त्री|destroyer of sorrow; सुखप्रदा|giver of happiness",
  "Peerless; dark-haired; indestructible; insurmountable; hard to attain; hard to approach; Durgā; destroyer of sorrow; giver of happiness.",
  "ஒப்பற்றவள்; கருங்கூந்தலுடையவள்; அழிவற்றவள்; மீற முடியாதவள்; அடைதற்கரியவள்; அணுகுதற்கரியவள்; துர்க்கை; துயர் தீர்ப்பவள்; இன்பம் தருபவள்."),
 v(51, "Bhakti & the formless", "Far from the wicked, ending evil conduct, faultless — all-knowing, full of compassion, without equal.",
  "दुष्टदूरा|far from the wicked; दुराचारशमनी|ender of evil conduct; दोषवर्जिता|free from faults",
  "सर्वज्ञा|all-knowing; सान्द्रकरुणा|of dense compassion; समानाधिकवर्जिता|having none equal or superior",
  "Far from the wicked; ender of evil conduct; free from all faults; all-knowing; full of deep compassion; with none equal to or above her.",
  "தீயோருக்கு எட்டாதவள்; தீய நடத்தையைத் தணிப்பவள்; குறையற்றவள்; எல்லாம் அறிந்தவள்; அடர்ந்த கருணையுடையவள்; சமமானவரும் மேலானவரும் இல்லாதவள்."),
 v(52, "Bhakti & the formless", "Made of all powers, all-auspicious, giver of the good path — queen of all, all mantras' form.",
  "सर्वशक्तिमयी|made of all powers; सर्वमङ्गला|all-auspicious; सद्गतिप्रदा|giver of the good goal",
  "सर्वेश्वरी|queen of all; सर्वमयी|present in all; सर्वमन्त्रस्वरूपिणी|whose form is all mantras",
  "Made of all powers; all-auspicious; giver of the right path; ruler of all; pervading all; whose form is every mantra.",
  "எல்லா சக்திகளும் நிறைந்தவள்; சர்வமங்களா; நற்கதி தருபவள்; சர்வேஸ்வரி; எல்லாவற்றிலும் இருப்பவள்; எல்லா மந்திரங்களின் வடிவினள்."),
 v(53, "Bhakti & the formless", "All yantras and tantras, beyond the mind — Māheśvarī, Mahādevī, Mahālakṣmī, Śiva's beloved.",
  "सर्वयन्त्रात्मिका|soul of all yantras; सर्वतन्त्ररूपा|form of all tantras; मनोन्मनी|beyond the mind",
  "माहेश्वरी|Māheśvarī; महादेवी|the great Goddess; महालक्ष्मीर्|Mahālakṣmī; मृडप्रिया|beloved of Mṛḍa (Śiva)",
  "Soul of all yantras; form of all tantras; Manonmanī, beyond the mind; Māheśvarī; Mahādevī; Mahālakṣmī; beloved of Śiva.",
  "எல்லா யந்திரங்களின் ஆத்மா; எல்லா தந்திரங்களின் வடிவம்; மனோன்மனி; மாகேஸ்வரி; மகாதேவி; மகாலக்ஷ்மி; ம்ருடனின் பிரியை.",
  {tip:"Verses 53–57 are a <b>mahā-</b> chain: mahādevī, mahālakṣmī, mahārūpā, mahāpūjyā, mahāmāyā…"}),
 v(54, "Bhakti & the formless", "Of great form, greatly worshipped, destroyer of great sins — great Māyā, great power, great delight.",
  "महारूपा|of great form; महापूज्या|greatly worshipped; महापातकनाशिनी|destroyer of great sins",
  "महामाया|great Māyā; महासत्त्वा|of great strength; महाशक्तिर्|great power; महारतिः|great delight",
  "Of great form; greatly worshipped; destroyer of great sins; great Māyā; of great strength; great power; great delight.",
  "பெரும் வடிவினள்; பெரிதும் பூஜிக்கப்படுபவள்; மகா பாதகங்களை அழிப்பவள்; மகாமாயை; பெரும் சத்வமுடையவள்; மகாசக்தி; மகாரதி."),
 v(55, "Bhakti & the formless", "Great enjoyment, sovereignty, valour, strength, intellect, success — queen of the great yogīśvaras.",
  "महाभोगा|great enjoyment; महैश्वर्या|great sovereignty; महावीर्या|great valour; महाबला|great strength",
  "महाबुद्धिर्|great intellect; महासिद्धिर्|great success; महायोगेश्वरेश्वरी|queen of the great lords of yoga",
  "Of great enjoyment; great sovereignty; great valour; great strength; great intellect; great attainment; queen of the great lords of yoga.",
  "பெரும் போகம்; பெரும் ஐஸ்வர்யம்; பெரும் வீரியம்; பெரும் பலம்; பெரும் புத்தி; பெரும் சித்தி; மகாயோகேஸ்வரர்களின் ஈஸ்வரி."),
 v(56, "Bhakti & the formless", "Great tantra, mantra, yantra and seat — worshipped in the great sacrifice, worshipped by Mahābhairava.",
  "महातन्त्रा|the great tantra; महामन्त्रा|the great mantra; महायन्त्रा|the great yantra; महासना|of the great seat",
  "महायागक्रमाराध्या|worshipped in the order of the great sacrifice; महाभैरवपूजिता|worshipped by Mahābhairava",
  "The great tantra; the great mantra; the great yantra; on the great seat; worshipped in the rite of the great sacrifice; worshipped by Mahābhairava (Śiva).",
  "மகா தந்திரம்; மகா மந்திரம்; மகா யந்திரம்; பெரும் ஆசனமுடையவள்; மகாயாக முறையில் ஆராதிக்கப்படுபவள்; மகாபைரவனால் பூஜிக்கப்படுபவள்."),
 v(57, "Bhakti & the formless", "Witness to Maheśvara's great dance at the end of the great cycle — queen of Mahākāmeśa, Mahātripurasundarī.",
  "महेश्वरमहाकल्पमहाताण्डवसाक्षिणी|witness of Maheśvara's great dance at the end of the great age|maheśvara · mahākalpa · mahā · tāṇḍava · sākṣiṇī",
  "महाकामेशमहिषी|queen of the great Kāmeśvara; महात्रिपुरसुन्दरी|the great Tripurasundarī",
  "Witness to Maheśvara's great tāṇḍava at the end of the great cosmic age; queen of the great Kāmeśvara; the great Tripurasundarī.",
  "மகாகல்ப முடிவில் மகேஸ்வரனின் மகாதாண்டவத்துக்குச் சாட்சி; மகாகாமேசனின் மகிஷி; மகா திரிபுரசுந்தரி."),
 v(58, "Bhakti & the formless", "Worshipped with the 64 offerings, made of the 64 arts — served by 64 crore yoginīs.",
  "चतुःषष्ट्युपचाराढ्या|honoured with the sixty-four offerings; चतुःषष्टिकलामयी|made of the sixty-four arts",
  "महाचतुःषष्टिकोटियोगिनीगणसेविता|served by the hosts of sixty-four crore great yoginīs",
  "Honoured with the sixty-four offerings; made of the sixty-four arts; served by hosts of sixty-four crore great yoginīs.",
  "அறுபத்து நான்கு உபசாரங்களால் போற்றப்படுபவள்; அறுபத்து நான்கு கலைகளானவள்; அறுபத்து நான்கு கோடி யோகினிகளால் சேவிக்கப்படுபவள்.",
  {tip:"The number <b>64</b> three times: upacāras, kalās, and crores of yoginīs."}),
 v(59, "Bhakti & the formless", "Manu's and Candra's vidyā, in the moon's orb — lovely in form and smile, wearing the lovely crescent.",
  "मनुविद्या|the vidyā worshipped by Manu; चन्द्रविद्या|the vidyā worshipped by Candra; चन्द्रमण्डलमध्यगा|in the middle of the moon's orb",
  "चारुरूपा|lovely in form; चारुहासा|lovely in smile; चारुचन्द्रकलाधरा|wearing the lovely crescent moon",
  "The Śrīvidyā as worshipped by Manu; and by Candra; dwelling in the middle of the moon's orb; lovely in form; lovely in smile; wearing the lovely crescent moon.",
  "மனுவால் உபாசிக்கப்பட்ட வித்யை; சந்திரனால் உபாசிக்கப்பட்ட வித்யை; சந்திர மண்டலத்தின் நடுவில் இருப்பவள்; அழகிய வடிவினள்; அழகிய புன்னகையுடையவள்; அழகிய பிறைச் சந்திரனைத் தரித்தவள்.",
  {tip:"Three <b>cāru</b> (lovely): cārurūpā · cāruhāsā · cārucandrakalādharā."}),
 v(60, "Bhakti & the formless", "Ruler of all that moves and is still, dwelling in the Śrīcakra — Pārvatī, lotus-eyed, ruby-bright.",
  "चराचरजगन्नाथा|ruler of the moving and unmoving world; चक्रराजनिकेतना|dwelling in the king of cakras (Śrīcakra)",
  "पार्वती|Pārvatī; पद्मनयना|lotus-eyed; पद्मरागसमप्रभा|bright as a ruby",
  "Ruler of the world of moving and unmoving things; whose home is the Śrīcakra; Pārvatī; lotus-eyed; radiant as a ruby.",
  "அசைவன அசையாதனவான உலகின் நாயகி; ஸ்ரீசக்கரத்தை இருப்பிடமாகக் கொண்டவள்; பார்வதி; தாமரைக் கண்ணாள்; பதுமராகம் போல் ஒளிர்பவள்."),
 v(61, "Bhakti & the formless", "Seated on the five corpses, the five Brahmās in form — pure consciousness, supreme bliss.",
  "पञ्चप्रेतासनासीना|seated on the seat of the five corpses (the five Brahmās); पञ्चब्रह्मस्वरूपिणी|whose form is the five Brahmās",
  "चिन्मयी|pure consciousness; परमानन्दा|supreme bliss; विज्ञानघनरूपिणी|whose form is dense knowledge",
  "Seated on the seat of the five “corpses” (the five Brahmās, powerless without her); whose form is the five Brahmās; pure consciousness; supreme bliss; a solid mass of knowledge.",
  "பஞ்சப் பிரேதங்களை ஆசனமாகக் கொண்டவள்; பஞ்சப் பிரம்ம வடிவினள்; சின்மயி; பரமானந்தம்; விஞ்ஞானமே திரண்ட வடிவினள்.",
  {tip:"Without Śakti, Brahmā, Viṣṇu, Rudra, Īśvara and Sadāśiva are <b>pretas</b> — lifeless; they become her seat."}),
 v(62, "Cosmos & cakras", "Meditation, meditator and meditated; beyond dharma and adharma — the waking, dreaming states.",
  "ध्यानध्यातृध्येयरूपा|meditation, meditator and object of meditation; धर्माधर्मविवर्जिता|beyond merit and demerit",
  "विश्वरूपा|Viśva (the waking self); जागरिणी|the waking state; स्वपन्ती|the dreaming state; तैजसात्मिका|Taijasa (the dreaming self)",
  "Meditation, the meditator and the meditated; beyond merit and demerit; Viśva; the waking state; the dreaming state; Taijasa.",
  "தியானம், தியானிப்பவன், தியானிக்கப்படுவது ஆனவள்; தர்ம அதர்மங்களுக்கு அப்பாற்பட்டவள்; விஸ்வரூபா; ஜாக்ரத் நிலை; ஸ்வப்ன நிலை; தைஜஸ வடிவினள்.",
  {tip:"Verses 62–63: the <b>states of consciousness</b> — waking (viśva), dream (taijasa), deep sleep (prājña), and turīya beyond."}),
 v(63, "Cosmos & cakras", "Deep sleep, Prājña, Turīya, beyond all states — creator as Brahmā, protector as Govinda.",
  "सुप्ता|deep sleep; प्राज्ञात्मिका|Prājña (the sleeping self); तुर्या|Turīya, the fourth; सर्वावस्थाविवर्जिता|beyond all states",
  "सृष्टिकर्त्री|creator; ब्रह्मरूपा|in the form of Brahmā; गोप्त्री|protector; गोविन्दरूपिणी|in the form of Govinda",
  "Deep sleep; Prājña; Turīya; beyond all states; the creator; in the form of Brahmā; the protector; in the form of Govinda.",
  "சுஷுப்தி; ப்ராஜ்ஞ வடிவினள்; துரீயம்; எல்லா நிலைகளுக்கும் அப்பாற்பட்டவள்; படைப்பவள்; பிரம்ம வடிவினள்; காப்பவள்; கோவிந்த வடிவினள்."),
 v(64, "Cosmos & cakras", "Destroyer as Rudra, concealer as Īśvara, grace-giver as Sadāśiva — devoted to the five acts.",
  "संहारिणी|destroyer; रुद्ररूपा|in the form of Rudra; तिरोधानकरीश्वरी|Īśvarī who conceals|tirodhāna · karī · īśvarī",
  "सदाशिवाऽनुग्रहदा|Sadāśivā, giver of grace|sadāśivā · anugraha · dā; पञ्चकृत्यपरायणा|devoted to the five acts",
  "The destroyer; in the form of Rudra; Īśvarī who conceals; Sadāśivā who gives grace; devoted to the five cosmic acts.",
  "அழிப்பவள்; ருத்ர வடிவினள்; மறைக்கும் ஈஸ்வரி; அனுக்ரகம் தரும் சதாசிவா; ஐந்தொழில்களில் ஈடுபட்டவள்.",
  {tip:"The <b>five acts</b> in order across verses 63–64: create (Brahmā), protect (Govinda), destroy (Rudra), conceal (Īśvara), bless (Sadāśiva)."}),
 v(65, "Cosmos & cakras", "In the sun's orb, Bhairavī, garlanded with Bhaga — lotus-seated, Bhagavatī, Padmanābha's sister.",
  "भानुमण्डलमध्यस्था|in the middle of the sun's orb; भैरवी|Bhairavī; भगमालिनी|Bhagamālinī (a Nityā goddess)",
  "पद्मासना|seated on a lotus; भगवती|the blessed Goddess; पद्मनाभसहोदरी|sister of Padmanābha (Viṣṇu)",
  "Dwelling in the middle of the sun's orb; Bhairavī; Bhagamālinī; seated on a lotus; Bhagavatī; sister of Padmanābha.",
  "சூரிய மண்டலத்தின் நடுவில் இருப்பவள்; பைரவி; பகமாலினி; பத்மாசனத்தில் அமர்ந்தவள்; பகவதி; பத்மநாபனின் சகோதரி."),
 v(66, "Cosmos & cakras", "Worlds arise and vanish as she opens and closes her eyes — thousand-headed, thousand-eyed, thousand-footed.",
  "उन्मेषनिमिषोत्पन्नविपन्नभुवनावली|by the opening and closing of whose eyes rows of worlds arise and vanish|unmeṣa · nimiṣa · utpanna · vipanna · bhuvana · āvalī",
  "सहस्रशीर्षवदना|thousand-headed and faced; सहस्राक्षी|thousand-eyed; सहस्रपात्|thousand-footed",
  "By the opening and closing of whose eyes rows of worlds come into being and vanish; with a thousand heads and faces; a thousand eyes; a thousand feet.",
  "கண் திறந்து மூடுவதால் உலக வரிசைகளைத் தோற்றுவித்து அழிப்பவள்; ஆயிரம் தலைகளும் முகங்களும் உடையவள்; ஆயிரம் கண்கள் உடையவள்; ஆயிரம் பாதங்கள் உடையவள்.",
  {tip:"<b>sahasra-śīrṣa · sahasrākṣa · sahasrapāt</b> — the words of the Puruṣa Sūkta, now for her."}),
 v(67, "Cosmos & cakras", "Mother of all from Brahmā to the worm; founder of varṇa and āśrama; her command is the Veda.",
  "आब्रह्मकीटजननी|mother of all from Brahmā to a worm; वर्णाश्रमविधायिनी|ordainer of the varṇas and āśramas",
  "निजाज्ञारूपनिगमा|whose own commands are the Vedas; पुण्यापुण्यफलप्रदा|giver of the fruits of merit and demerit",
  "Mother of all beings from Brahmā to the worm; ordainer of the varṇas and āśramas; whose commands take the form of the Vedas; giver of the fruits of good and bad deeds.",
  "பிரம்மன் முதல் புழு வரை எல்லாவற்றுக்கும் தாய்; வர்ணாசிரமங்களை வகுத்தவள்; தன் ஆணையே வேதமாக உடையவள்; புண்ணிய பாவங்களின் பலனைத் தருபவள்."),
 v(68, "Cosmos & cakras", "The dust of her feet is vermilion in the parting of the Vedas; the pearl in the shell of all scriptures.",
  "श्रुतिसीमन्तसिन्दूरीकृतपादाब्जधूलिका|the dust of whose lotus feet is the vermilion in the hair-parting of the Vedas|śruti · sīmanta · sindūrī · kṛta · pāda · abja · dhūlikā",
  "सकलागमसन्दोहशुक्तिसम्पुटमौक्तिका|the pearl within the shell of all the scriptures|sakala · āgama · sandoha · śukti · sampuṭa · mauktikā",
  "The dust of whose lotus feet is the vermilion in the hair-parting of the Vedas (personified as women); the pearl within the shell formed by all the scriptures.",
  "தன் திருவடித் தாமரையின் தூசியை வேதங்களின் வகிட்டுக் குங்குமமாகக் கொண்டவள்; எல்லா ஆகமங்களின் சிப்பிக்குள் இருக்கும் முத்து."),
 v(69, "Cosmos & cakras", "Giver of the aims of life, full, enjoyer, ruler of the worlds — Ambikā, without beginning or end.",
  "पुरुषार्थप्रदा|giver of the four aims of life; पूर्णा|full; भोगिनी|enjoyer; भुवनेश्वरी|ruler of the worlds",
  "अम्बिकाऽनादिनिधना|Ambikā, without beginning or end|ambikā · anādi · nidhanā; हरिब्रह्मेन्द्रसेविता|served by Hari, Brahmā and Indra",
  "Giver of the four aims of life; full; the enjoyer; Bhuvaneśvarī; Ambikā; without beginning or end; served by Viṣṇu, Brahmā and Indra.",
  "புருஷார்த்தங்களைத் தருபவள்; பூரணமானவள்; போகினி; புவனேஸ்வரி; அம்பிகை; ஆதி அந்தமற்றவள்; ஹரி, பிரம்மா, இந்திரனால் சேவிக்கப்படுபவள்."),
 v(70, "Cosmos & cakras", "Nārāyaṇī, sound itself, beyond name and form — Hrīṅkārī, beyond what to take or leave.",
  "नारायणी|Nārāyaṇī; नादरूपा|in the form of sound; नामरूपविवर्जिता|beyond name and form",
  "ह्रीङ्कारी|maker of the syllable hrīṃ; ह्रीमती|modest; हृद्या|dear to the heart; हेयोपादेयवर्जिता|beyond what is to be rejected or accepted",
  "Nārāyaṇī; in the form of sound (nāda); beyond name and form; she of the syllable hrīṃ; modest; dear to the heart; beyond rejecting and accepting.",
  "நாராயணி; நாத வடிவினள்; நாம ரூபங்களுக்கு அப்பாற்பட்டவள்; ஹ்ரீங்காரி; நாணமுடையவள்; இதயத்துக்கு இனியவள்; விடுவது ஏற்பது அற்றவள்."),
 v(71, "Cosmos & cakras", "Worshipped by the king of kings, queen, lovely, lotus-eyed — delightful, with a tinkling girdle.",
  "राजराजार्चिता|worshipped by the king of kings (Kubera); राज्ञी|the queen; रम्या|lovely; राजीवलोचना|lotus-eyed",
  "रञ्जनी|delighting; रमणी|the beloved; रस्या|full of flavour; रणत्किङ्किणिमेखला|with a girdle of tinkling bells",
  "Worshipped by the king of kings; the queen; lovely; lotus-eyed; delighting; the beloved; full of rasa; with a girdle of tinkling bells.",
  "ராஜராஜனால் அர்ச்சிக்கப்படுபவள்; ராணி; அழகியவள்; தாமரைக் கண்ணாள்; மகிழ்விப்பவள்; ரமணி; ரசமுடையவள்; ஒலிக்கும் கிண்கிணி ஒட்டியாணம் உடையவள்.",
  {tip:"Verses 71–72 almost all begin with <b>ra-</b>: rājñī, ramyā, rañjanī, ramaṇī, ramā, rakṣākarī…"}),
 v(72, "Cosmos & cakras", "Ramā, full-moon-faced, Rati's form — protector, slayer of demons, delighting in her beloved.",
  "रमा|Ramā (Lakṣmī); राकेन्दुवदना|with a face like the full moon; रतिरूपा|in the form of Rati; रतिप्रिया|dear to Rati",
  "रक्षाकरी|the protector; राक्षसघ्नी|slayer of demons; रामा|the delightful; रमणलम्पटा|devoted to her beloved",
  "Ramā; full-moon-faced; in the form of Rati; dear to Rati; the protector; slayer of rākṣasas; the delightful one; devoted to her beloved.",
  "ரமா; பூரண சந்திர முகமுடையவள்; ரதி வடிவினள்; ரதிக்குப் பிரியமானவள்; காப்பவள்; ராக்ஷஸரை அழிப்பவள்; ராமா; கணவனிடம் ஈடுபட்டவள்."),
 v(73, "Cosmos & cakras", "Desirable, Kāmakalā, lover of kadamba flowers — Kalyāṇī, root of the world, ocean of compassion.",
  "काम्या|desirable; कामकलारूपा|in the form of Kāmakalā; कदम्बकुसुमप्रिया|fond of kadamba flowers",
  "कल्याणी|auspicious; जगतीकन्दा|the root of the world; करुणारससागरा|an ocean of compassion",
  "Desirable; in the form of Kāmakalā; fond of kadamba flowers; Kalyāṇī, the auspicious; the root of the world; an ocean of compassion.",
  "விரும்பத்தக்கவள்; காமகலா வடிவினள்; கடம்ப மலரை விரும்புபவள்; கல்யாணி; உலகின் வேர்; கருணைக் கடல்."),
 v(74, "Cosmos & cakras", "Skilled in the arts, sweet-voiced, lovely — boon-giver, beautiful-eyed, rapt in divine bliss.",
  "कलावती|skilled in the arts; कलालापा|of sweet speech; कान्ता|lovely; कादम्बरीप्रिया|fond of kādambarī (mead)",
  "वरदा|giver of boons; वामनयना|beautiful-eyed; वारुणीमदविह्वला|rapt in the intoxication of vāruṇī (bliss)",
  "Skilled in the arts; sweet in speech; lovely; fond of mead; giver of boons; beautiful-eyed; rapt in the intoxication of divine bliss.",
  "கலைகள் நிறைந்தவள்; இனிய பேச்சுடையவள்; அழகியவள்; காதம்பரியை விரும்புபவள்; வரம் தருபவள்; அழகிய கண்ணாள்; வாருணீ மயக்கத்தில் திளைப்பவள்."),
 v(75, "Cosmos & cakras", "Beyond the universe, known by the Vedas, dwelling in the Vindhyas — creatress, mother of the Vedas, Viṣṇumāyā.",
  "विश्वाधिका|beyond the universe; वेदवेद्या|known by the Vedas; विन्ध्याचलनिवासिनी|dwelling on the Vindhya mountain",
  "विधात्री|the creatress; वेदजननी|mother of the Vedas; विष्णुमाया|Viṣṇumāyā; विलासिनी|the playful one",
  "Transcending the universe; known through the Vedas; dwelling on the Vindhya mountains; the creatress; mother of the Vedas; Viṣṇu's Māyā; the playful one.",
  "உலகைக் கடந்தவள்; வேதங்களால் அறியப்படுபவள்; விந்திய மலையில் வசிப்பவள்; படைப்பவள்; வேதங்களின் தாய்; விஷ்ணுமாயை; விளையாடுபவள்."),
 v(76, "Cosmos & cakras", "She is the field and its ruler, protector of field and knower — free from decay and growth.",
  "क्षेत्रस्वरूपा|the field (the body) itself; क्षेत्रेशी|ruler of the field; क्षेत्रक्षेत्रज्ञपालिनी|protector of the field and its knower",
  "क्षयवृद्धिविनिर्मुक्ता|free from decay and growth; क्षेत्रपालसमर्चिता|worshipped by Kṣetrapāla",
  "The field (body) itself; ruler of the field; protector of the field and its knower; free from decline and growth; worshipped by Kṣetrapāla.",
  "க்ஷேத்திர வடிவினள்; க்ஷேத்திரத்தின் ஈஸ்வரி; க்ஷேத்திரத்தையும் க்ஷேத்ரஜ்ஞனையும் காப்பவள்; தேய்வும் வளர்ச்சியும் அற்றவள்; க்ஷேத்திரபாலனால் அர்ச்சிக்கப்படுபவள்.",
  {tip:"<b>kṣetra</b> and <b>kṣetrajña</b> — the field and its knower, from Bhagavad Gītā chapter 13."}),
 v(77, "Cosmos & cakras", "Victorious, pure, adorable, loving to those who praise — goddess of speech, Vāmakeśī, in the circle of fire.",
  "विजया|victorious; विमला|pure; वन्द्या|adorable; वन्दारुजनवत्सला|loving to those who bow",
  "वाग्वादिनी|the goddess of speech; वामकेशी|Vāmakeśī; वह्निमण्डलवासिनी|dwelling in the circle of fire",
  "Victorious; pure; adorable; loving to those who bow to her; the goddess of speech; Vāmakeśī; dwelling in the circle of fire.",
  "வெற்றியுடையவள்; தூயவள்; வணங்கத்தக்கவள்; வணங்குபவர்களிடம் வாத்ஸல்யமுடையவள்; வாக்வாதினி; வாமகேசி; அக்னி மண்டலத்தில் வசிப்பவள்."),
 v(78, "Cosmos & cakras", "Wish-creeper of devotees, freeing souls from bonds — destroyer of false teachings, upholder of good conduct.",
  "भक्तिमत्कल्पलतिका|a wish-creeper for devotees; पशुपाशविमोचिनी|freeing bound souls from their bonds",
  "संहृताशेषपाषण्डा|destroyer of all false doctrines; सदाचारप्रवर्तिका|promoter of good conduct",
  "A wish-fulfilling creeper for devotees; releaser of bound souls from their bonds; destroyer of all heresies; promoter of right conduct.",
  "பக்தர்களுக்குக் கற்பகக்கொடி; பசுக்களை (ஜீவர்களை) பாசத்திலிருந்து விடுவிப்பவள்; எல்லாப் பாஷண்டங்களையும் அழிப்பவள்; சதாசாரத்தை வளர்ப்பவள்."),
 v(79, "Cosmos & cakras", "Moonlight cooling those burned by the three fires; young, worshipped by ascetics, slender — dispeller of darkness.",
  "तापत्रयाग्निसन्तप्तसमाह्लादनचन्द्रिका|moonlight soothing those burned by the fire of the three afflictions|tāpa · traya · agni · santapta · samāhlādana · candrikā",
  "तरुणी|young; तापसाराध्या|worshipped by ascetics; तनुमध्या|slender-waisted; तमोऽपहा|dispeller of darkness",
  "Moonlight that soothes those burned by the fire of the three afflictions; ever young; worshipped by ascetics; slender-waisted; dispeller of darkness.",
  "மூவகைத் தாபத் தீயால் வாடுபவர்களைக் குளிர்விக்கும் நிலவொளி; இளமையானவள்; தவசிகளால் ஆராதிக்கப்படுபவள்; மெல்லிடையாள்; இருளைப் போக்குபவள்."),
 v(80, "Cosmos & cakras", "Consciousness, the meaning of ‘That’, one flavour of awareness — Brahmā's bliss is a drop of her own.",
  "चितिस्|consciousness; तत्पदलक्ष्यार्था|the meaning indicated by the word “That” (tat); चिदेकरसरूपिणी|of the one flavour of consciousness",
  "स्वात्मानन्दलवीभूतब्रह्माद्यानन्दसन्ततिः|for whom the bliss of Brahmā and others is a drop of her own bliss|sva · ātma · ānanda · lavī · bhūta · brahma · ādi · ānanda · santati",
  "Consciousness itself; the meaning indicated by “That” (in tat tvam asi); of the single flavour of consciousness; compared to whose own bliss the bliss of Brahmā and the gods is but a drop.",
  "சித் (உணர்வு); ‘தத்’ என்ற சொல்லின் பொருள்; ஒரே சித் ரசமான வடிவினள்; தன் ஆனந்தத்தின் ஒரு துளியாகவே பிரம்மன் முதலியோரின் ஆனந்தத்தைக் கொண்டவள்."),
 v(81, "Cosmos & cakras", "Parā, Paśyantī, Madhyamā, Vaikharī — the four levels of speech; a swan in devotees' minds.",
  "परा|Parā (supreme speech); प्रत्यक्चितीरूपा|inward consciousness; पश्यन्ती|Paśyantī (seeing speech); परदेवता|the supreme deity",
  "मध्यमा|Madhyamā (middle speech); वैखरीरूपा|Vaikharī (spoken word); भक्तमानसहंसिका|a swan in the lake of devotees' minds",
  "Parā, the supreme level of speech; inward consciousness; Paśyantī; the supreme deity; Madhyamā; Vaikharī, spoken speech; a swan in the lake of devotees' minds.",
  "பரா; உள்முக சித் வடிவினள்; பச்யந்தி; பரதேவதை; மத்யமா; வைகரீ வடிவினள்; பக்தர்களின் மனத்தில் அன்னப்பறவை.",
  {tip:"The four levels of speech in order: <b>parā · paśyantī · madhyamā · vaikharī</b>."}),
 v(82, "Cosmos & cakras", "Kāmeśvara's life-breath, grateful, worshipped by Kāma, full of love's rasa — Jayā, at Jālandhara.",
  "कामेश्वरप्राणनाडी|the life-channel of Kāmeśvara; कृतज्ञा|grateful, all-knowing; कामपूजिता|worshipped by Kāma",
  "शृङ्गाररससम्पूर्णा|full of the flavour of love; जया|victorious; जालन्धरस्थिता|dwelling in the Jālandhara pīṭha",
  "The very life-breath of Kāmeśvara; grateful; worshipped by Kāma; full of the rasa of love; victorious; dwelling in the Jālandhara seat.",
  "காமேஸ்வரனின் பிராண நாடி; நன்றி அறிபவள்; காமனால் பூஜிக்கப்படுபவள்; சிருங்கார ரசம் நிறைந்தவள்; ஜயா; ஜாலந்தர பீடத்தில் இருப்பவள்."),
 v(83, "Cosmos & cakras", "In the Oḍyāṇa seat and the Bindu circle — worshipped in the secret rite, pleased with secret offerings.",
  "ओड्याणपीठनिलया|dwelling in the Oḍyāṇa pīṭha; बिन्दुमण्डलवासिनी|dwelling in the circle of the Bindu",
  "रहोयागक्रमाराध्या|worshipped by the secret inner rite; रहस्तर्पणतर्पिता|pleased by secret offerings",
  "Dwelling in the Oḍyāṇa seat; living in the Bindu (centre of the Śrīcakra); worshipped by the secret inner rite; pleased by secret offerings.",
  "ஓட்யாண பீடத்தில் இருப்பவள்; பிந்து மண்டலத்தில் வசிப்பவள்; ரகசிய யாகத்தால் ஆராதிக்கப்படுபவள்; ரகசிய தர்ப்பணத்தால் திருப்தியடைபவள்."),
 v(84, "Cosmos & cakras", "Quick to grace, witness of the universe with no witness — with the six limb-deities, full of the six qualities.",
  "सद्यःप्रसादिनी|quick to give grace; विश्वसाक्षिणी|witness of the universe; साक्षिवर्जिता|having no witness",
  "षडङ्गदेवतायुक्ता|with the deities of the six limbs; षाड्गुण्यपरिपूरिता|full of the six divine qualities",
  "Quick to give grace; witness of the universe; herself without witness; accompanied by the deities of the six limbs; full of the six divine qualities.",
  "உடனே அருள்பவள்; உலகுக்குச் சாட்சி; தனக்குச் சாட்சியற்றவள்; ஆறு அங்க தேவதைகளுடன் இருப்பவள்; ஆறு குணங்கள் நிறைந்தவள்."),
 v(85, "Cosmos & cakras", "Ever tender, incomparable, giver of nirvāṇa's bliss — the sixteen Nityās, half of Śrīkaṇṭha's body.",
  "नित्यक्लिन्ना|ever compassionate (tender); निरुपमा|incomparable; निर्वाणसुखदायिनी|giver of the bliss of liberation",
  "नित्याषोडशिकारूपा|in the form of the sixteen Nityā goddesses; श्रीकण्ठार्धशरीरिणी|half of Śrīkaṇṭha's (Śiva's) body",
  "Ever tender with compassion; incomparable; giver of the bliss of liberation; in the form of the sixteen Nityā goddesses; half of the body of Śiva.",
  "என்றும் கருணையால் நனைந்தவள்; உவமையற்றவள்; நிர்வாண சுகம் தருபவள்; பதினாறு நித்யா தேவியர் வடிவினள்; ஸ்ரீகண்டனின் பாதி உடலானவள்."),
 v(86, "Cosmos & cakras", "Radiant, radiance itself, famous, supreme queen — primal nature, unmanifest, both manifest and unmanifest.",
  "प्रभावती|radiant; प्रभारूपा|radiance itself; प्रसिद्धा|renowned; परमेश्वरी|the supreme queen",
  "मूलप्रकृतिरव्यक्ता|primal nature, unmanifest|mūla · prakṛtiḥ · avyaktā; व्यक्ताव्यक्तस्वरूपिणी|both manifest and unmanifest",
  "Radiant; radiance itself; renowned; the supreme queen; primal nature; the unmanifest; whose form is both manifest and unmanifest.",
  "ஒளியுடையவள்; ஒளியே வடிவானவள்; புகழ்பெற்றவள்; பரமேஸ்வரி; மூலப் பிரகிருதி; அவ்யக்தம்; வ்யக்தமும் அவ்யக்தமுமான வடிவினள்."),
 v(87, "Cosmos & cakras", "All-pervading, of many forms, knowledge and ignorance — moonlight for the lilies of Kāmeśa's eyes.",
  "व्यापिनी|all-pervading; विविधाकारा|of many forms; विद्याविद्यास्वरूपिणी|both knowledge and ignorance",
  "महाकामेशनयनकुमुदाह्लादकौमुदी|moonlight delighting the lilies of Mahākāmeśa's eyes|mahākāmeśa · nayana · kumuda · āhlāda · kaumudī",
  "All-pervading; of many forms; both knowledge and ignorance; moonlight that delights the lilies of Mahākāmeśvara's eyes.",
  "எங்கும் நிறைந்தவள்; பல வடிவினள்; வித்யையும் அவித்யையுமானவள்; மகாகாமேசனின் கண்கள் எனும் அல்லிகளை மகிழ்விக்கும் நிலவொளி."),
 v(88, "Cosmos & cakras", "Sunlight dispelling the darkness in devotees' hearts — Śiva's messenger, worshipped by Śiva, bringer of good.",
  "भक्तहार्दतमोभेदभानुमद्भानुसन्ततिः|a stream of sunlight piercing the darkness in devotees' hearts|bhakta · hārda · tamas · bheda · bhānumat · bhānu · santati",
  "शिवदूती|who made Śiva her messenger; शिवाराध्या|worshipped by Śiva; शिवमूर्तिः|auspicious in form; शिवङ्करी|bringer of good",
  "A stream of sunrays piercing the darkness in devotees' hearts; she who sent Śiva as her messenger; worshipped by Śiva; auspicious in form; bringer of good.",
  "பக்தர்களின் இதய இருளைப் பிளக்கும் சூரியக் கதிர்களின் பெருக்கு; சிவனைத் தூதனாக்கியவள்; சிவனால் ஆராதிக்கப்படுபவள்; மங்கள வடிவினள்; மங்களம் செய்பவள்."),
 v(89, "Cosmos & cakras", "Dear to Śiva, devoted to Śiva, loved by the good — immeasurable, self-luminous, beyond mind and speech.",
  "शिवप्रिया|dear to Śiva; शिवपरा|devoted to Śiva; शिष्टेष्टा|loved by the good; शिष्टपूजिता|worshipped by the good",
  "अप्रमेया|immeasurable; स्वप्रकाशा|self-luminous; मनोवाचामगोचरा|beyond the reach of mind and speech",
  "Dear to Śiva; devoted to Śiva; beloved of the virtuous; worshipped by the virtuous; immeasurable; self-luminous; beyond the reach of mind and speech.",
  "சிவனுக்குப் பிரியமானவள்; சிவனிடம் ஈடுபட்டவள்; நல்லோருக்கு இஷ்டமானவள்; நல்லோரால் பூஜிக்கப்படுபவள்; அளவிட முடியாதவள்; தானே ஒளிர்பவள்; மனம் வாக்கிற்கு எட்டாதவள்."),
 v(90, "Cosmos & cakras", "Power of consciousness and of matter — Gāyatrī, the vyāhṛtis, Sandhyā, served by the twice-born.",
  "चिच्छक्तिश्|the power of consciousness; चेतनारूपा|awareness itself; जडशक्तिर्|the power of matter; जडात्मिका|matter itself",
  "गायत्री|Gāyatrī; व्याहृतिः|the vyāhṛtis; सन्ध्या|Sandhyā; द्विजवृन्दनिषेविता|served by the hosts of the twice-born",
  "The power of consciousness; awareness itself; the power of matter; matter itself; Gāyatrī; the vyāhṛtis; Sandhyā; served by the twice-born.",
  "சித் சக்தி; சேதன வடிவினள்; ஜட சக்தி; ஜடமானவள்; காயத்ரி; வியாஹ்ருதி; சந்தியா; இருபிறப்பாளர்களால் சேவிக்கப்படுபவள்."),
 v(91, "Cosmos & cakras", "Seated on the tattvas, made of them, within the five sheaths — of boundless glory, ever young.",
  "तत्त्वासना|seated on the tattvas; तत्त्वमयी|made of the tattvas; पञ्चकोशान्तरस्थिता|dwelling within the five sheaths",
  "निःसीममहिमा|of boundless glory; नित्ययौवना|ever youthful; मदशालिनी|radiant with joy",
  "Seated on the tattvas; made of the tattvas; dwelling within the five sheaths; of boundless glory; ever youthful; radiant with divine joy.",
  "தத்துவங்களை ஆசனமாகக் கொண்டவள்; தத்துவமயமானவள்; பஞ்சகோசங்களுக்குள் இருப்பவள்; எல்லையற்ற மகிமையுடையவள்; என்றும் இளமையானவள்; மதம் நிறைந்தவள்."),
 v(92, "Cosmos & cakras", "Reddened eyes rolling with joy, rosy cheeks — body smeared with sandal, fond of campaka.",
  "मदघूर्णितरक्ताक्षी|with red eyes rolling in rapture; मदपाटलगण्डभूः|with cheeks rosy with rapture",
  "चन्दनद्रवदिग्धाङ्गी|her body smeared with liquid sandal; चाम्पेयकुसुमप्रिया|fond of campaka flowers",
  "With reddened eyes rolling in rapture; with cheeks flushed rosy; her body smeared with sandal paste; fond of campaka flowers.",
  "மதத்தால் சுழலும் சிவந்த கண்களுடையவள்; மதத்தால் சிவந்த கன்னங்களுடையவள்; சந்தனக் குழம்பு பூசிய உடலுடையவள்; சம்பக மலரை விரும்புபவள்."),
 v(93, "Cosmos & cakras", "Skilful, tender in form, Kurukullā, queen of the Kula — dwelling in the Kula-kuṇḍa, served by the Kaula path.",
  "कुशला|skilful; कोमलाकारा|tender in form; कुरुकुल्ला|Kurukullā; कुलेश्वरी|queen of the Kula",
  "कुलकुण्डालया|dwelling in the Kula-kuṇḍa (Mūlādhāra); कौलमार्गतत्परसेविता|served by those devoted to the Kaula path",
  "Skilful; tender in form; Kurukullā; queen of the Kula; dwelling in the Kula-kuṇḍa; served by those devoted to the Kaula path.",
  "திறமையானவள்; மென்மையான வடிவினள்; குருகுல்லா; குலேஸ்வரி; குலகுண்டத்தில் இருப்பவள்; கௌல மார்க்கத்தில் ஈடுபட்டவர்களால் சேவிக்கப்படுபவள்."),
 v(94, "Cosmos & cakras", "Mother of Kumāra and Gaṇeśa — contentment, nourishment, wisdom, courage, peace, radiance, remover of obstacles.",
  "कुमारगणनाथाम्बा|mother of Kumāra and Gaṇanātha; तुष्टिः|contentment; पुष्टिर्|nourishment; मतिर्|wisdom; धृतिः|steadfastness",
  "शान्तिः|peace; स्वस्तिमती|full of well-being; कान्तिर्|radiance; नन्दिनी|delighting; विघ्ननाशिनी|destroyer of obstacles",
  "Mother of Kumāra (Skanda) and Gaṇeśa; contentment; nourishment; wisdom; steadfastness; peace; well-being; radiance; delight; destroyer of obstacles.",
  "குமாரனுக்கும் கணநாதனுக்கும் தாய்; துஷ்டி; புஷ்டி; மதி; த்ருதி; சாந்தி; ஸ்வஸ்திமதி; காந்தி; நந்தினி; விக்னங்களை அழிப்பவள்."),
 v(95, "Cosmos & cakras", "Radiant, three-eyed, with restless eyes, taking forms at will — Mālinī, Haṃsinī, Mother, on the Malaya hills.",
  "तेजोवती|radiant; त्रिनयना|three-eyed; लोलाक्षीकामरूपिणी|with restless eyes, taking any form at will|lolākṣī · kāmarūpiṇī",
  "मालिनी|garlanded; हंसिनी|swan-like; माता|the Mother; मलयाचलवासिनी|dwelling on the Malaya mountain",
  "Radiant; three-eyed; with restless eyes; taking any form at will; garlanded; swan-like; the Mother; dwelling on the Malaya mountain.",
  "தேஜஸ் மிக்கவள்; மூன்று கண்களுடையவள்; அசையும் கண்களுடையவள், விரும்பிய வடிவம் எடுப்பவள்; மாலினி; ஹம்ஸினி; தாய்; மலய மலையில் வசிப்பவள்."),
 v(96, "Cosmos & cakras", "Lovely-faced, lotus-like, fine-browed, radiant, leader of the gods — dark-throated, bright, the subtle one.",
  "सुमुखी|lovely-faced; नलिनी|lotus-like; सुभ्रूः|with fine brows; शोभना|radiant; सुरनायिका|leader of the gods",
  "कालकण्ठी|dark-throated (Śiva's consort); कान्तिमती|lustrous; क्षोभिणी|who stirs (creation); सूक्ष्मरूपिणी|subtle in form",
  "Lovely-faced; lotus-like; with fine eyebrows; radiant; leader of the gods; consort of the dark-throated; lustrous; who stirs creation; subtle in form.",
  "அழகிய முகமுடையவள்; நளினி; அழகிய புருவமுடையவள்; ஒளிர்பவள்; தேவர்களின் தலைவி; காலகண்டி; காந்திமதி; க்ஷோபிணி; சூக்ஷ்ம வடிவினள்."),
 v(97, "Cosmos & cakras", "Vajreśvarī, Vāmadevī, beyond age — queen of siddhas, their vidyā and mother, glorious.",
  "वज्रेश्वरी|Vajreśvarī; वामदेवी|Vāmadevī; वयोऽवस्थाविवर्जिता|beyond the stages of age",
  "सिद्धेश्वरी|queen of the siddhas; सिद्धविद्या|the perfected vidyā; सिद्धमाता|mother of the siddhas; यशस्विनी|glorious",
  "Vajreśvarī; Vāmadevī; beyond the stages of age; queen of the perfected ones; the perfected vidyā; mother of the siddhas; glorious.",
  "வஜ்ரேஸ்வரி; வாமதேவி; வயது நிலைகளுக்கு அப்பாற்பட்டவள்; சித்தேஸ்வரி; சித்த வித்யை; சித்தர்களின் தாய்; புகழுடையவள்."),
 v(98, "Cosmos & cakras", "In the Viśuddhi cakra, rose-red, three-eyed, with the khaṭvāṅga — one-faced (Ḍākinī).",
  "विशुद्धिचक्रनिलयाऽऽरक्तवर्णा|dwelling in the Viśuddhi cakra, pink in colour|viśuddhi · cakra · nilayā · ārakta · varṇā; त्रिलोचना|three-eyed",
  "खट्वाङ्गादिप्रहरणा|holding the khaṭvāṅga and other weapons; वदनैकसमन्विता|with one face",
  "Dwelling in the Viśuddhi cakra; pink in colour; three-eyed; holding the khaṭvāṅga and other weapons; with one face.",
  "விசுத்தி சக்கரத்தில் இருப்பவள்; இளஞ்சிவப்பு நிறத்தவள்; மூன்று கண்களுடையவள்; கட்வாங்கம் முதலிய ஆயுதங்கள் ஏந்தியவள்; ஒரு முகமுடையவள்.",
  {tip:"Verses 98–110: the seven <b>yoginīs</b> of the cakras — each with her colour, faces, weapons, bodily element and favourite food."}),
 v(99, "Cosmos & cakras", "Fond of pāyasa, in the skin, frightening to the ignorant — surrounded by Amṛtā and others, Ḍākinīśvarī.",
  "पायसान्नप्रिया|fond of sweet rice (pāyasa); त्वक्स्था|presiding over the skin; पशुलोकभयङ्करी|frightening to the ignorant",
  "अमृतादिमहाशक्तिसंवृता|surrounded by Amṛtā and the great Śaktis; डाकिनीश्वरी|Ḍākinīśvarī",
  "Fond of pāyasa; presiding over the skin; frightening to the ignorant; surrounded by Amṛtā and other great Śaktis; Ḍākinīśvarī.",
  "பாயசத்தை விரும்புபவள்; தோலில் இருப்பவள்; அறியாதவர்களுக்கு அச்சம் தருபவள்; அம்ருதா முதலிய மகாசக்திகளால் சூழப்பட்டவள்; டாகினீஸ்வரி."),
 v(100, "Cosmos & cakras", "In the Anāhata lotus, dark-hued, two-faced, with tusks and a rosary — presiding over blood (Rākiṇī).",
  "अनाहताब्जनिलया|dwelling in the Anāhata lotus; श्यामाभा|dark in colour; वदनद्वया|two-faced",
  "दंष्ट्रोज्ज्वलाऽक्षमालादिधरा|bright with tusks, holding a rosary and more|daṃṣṭrā · ujjvalā · akṣamālā · ādi · dharā; रुधिरसंस्थिता|presiding over blood",
  "Dwelling in the Anāhata lotus; dark in colour; two-faced; bright with tusks; holding a rosary and other things; presiding over the blood.",
  "அனாஹதத் தாமரையில் இருப்பவள்; கருநிறத்தவள்; இரு முகங்களுடையவள்; கோரைப்பற்களால் ஒளிர்பவள்; அக்ஷமாலை முதலியவை தாங்கியவள்; ரத்தத்தில் இருப்பவள்."),
 v(101, "Cosmos & cakras", "Surrounded by Kālarātri and others, fond of ghee-rice — boon-giver to great heroes, Rākiṇī herself.",
  "कालरात्र्यादिशक्त्यौघवृता|surrounded by Kālarātri and other Śaktis; स्निग्धौदनप्रिया|fond of rice with ghee",
  "महावीरेन्द्रवरदा|giver of boons to great heroes; राकिण्यम्बास्वरूपिणी|in the form of Mother Rākiṇī",
  "Surrounded by Kālarātri and other Śaktis; fond of rice with ghee; giver of boons to great heroes; in the form of Mother Rākiṇī.",
  "காளராத்திரி முதலிய சக்திகளால் சூழப்பட்டவள்; நெய்ச் சாதத்தை விரும்புபவள்; மகாவீரர்களுக்கு வரம் தருபவள்; ராகினீ அம்பா வடிவினள்."),
 v(102, "Cosmos & cakras", "In the Maṇipūra lotus, three-faced, with the vajra — surrounded by Ḍāmarī and others (Lākinī).",
  "मणिपूराब्जनिलया|dwelling in the Maṇipūra lotus; वदनत्रयसंयुता|three-faced",
  "वज्रादिकायुधोपेता|holding the vajra and other weapons; डामर्यादिभिरावृता|surrounded by Ḍāmarī and others",
  "Dwelling in the Maṇipūra lotus; three-faced; holding the vajra and other weapons; surrounded by Ḍāmarī and others.",
  "மணிபூரகத் தாமரையில் இருப்பவள்; மூன்று முகங்களுடையவள்; வஜ்ரம் முதலிய ஆயுதங்கள் ஏந்தியவள்; டாமரீ முதலியோரால் சூழப்பட்டவள்."),
 v(103, "Cosmos & cakras", "Red, in the flesh, fond of jaggery-rice — giving joy to all devotees, Lākinī herself.",
  "रक्तवर्णा|red in colour; मांसनिष्ठा|presiding over flesh; गुडान्नप्रीतमानसा|fond of rice with jaggery",
  "समस्तभक्तसुखदा|giver of joy to all devotees; लाकिन्यम्बास्वरूपिणी|in the form of Mother Lākinī",
  "Red in colour; presiding over the flesh; fond of rice with jaggery; giver of happiness to all devotees; in the form of Mother Lākinī.",
  "சிவந்த நிறத்தவள்; தசையில் இருப்பவள்; வெல்லச் சாதத்தை விரும்புபவள்; எல்லா பக்தர்களுக்கும் சுகம் தருபவள்; லாகினீ அம்பா வடிவினள்."),
 v(104, "Cosmos & cakras", "In the Svādhiṣṭhāna lotus, four-faced, with the trident — golden, very proud (Kākinī).",
  "स्वाधिष्ठानाम्बुजगता|in the Svādhiṣṭhāna lotus; चतुर्वक्त्रमनोहरा|lovely with four faces",
  "शूलाद्यायुधसम्पन्ना|holding the trident and other weapons; पीतवर्णाऽतिगर्विता|yellow in colour, very proud|pīta · varṇā · ati · garvitā",
  "Dwelling in the Svādhiṣṭhāna lotus; lovely with four faces; holding the trident and other weapons; yellow in colour; very proud.",
  "சுவாதிஷ்டானத் தாமரையில் இருப்பவள்; நான்கு முகங்களால் அழகியவள்; சூலம் முதலிய ஆயுதங்கள் ஏந்தியவள்; மஞ்சள் நிறத்தவள்; பெருமிதமுடையவள்."),
 v(105, "Cosmos & cakras", "In the fat, fond of honey, with Bandhinī and others — fond of curd-rice, Kākinī herself.",
  "मेदोनिष्ठा|presiding over fat; मधुप्रीता|fond of honey; बन्धिन्यादिसमन्विता|with Bandhinī and others",
  "दध्यन्नासक्तहृदया|fond of curd-rice; काकिनीरूपधारिणी|in the form of Kākinī",
  "Presiding over fat; fond of honey; accompanied by Bandhinī and others; fond of curd-rice; in the form of Kākinī.",
  "கொழுப்பில் இருப்பவள்; தேனை விரும்புபவள்; பந்தினீ முதலியோருடன் இருப்பவள்; தயிர்ச் சாதத்தை விரும்புபவள்; காகினீ வடிவினள்."),
 v(106, "Cosmos & cakras", "On the Mūlādhāra lotus, five-faced, in the bones — with the goad, served by Varadā and others (Sākinī).",
  "मूलाधाराम्बुजारूढा|on the Mūlādhāra lotus; पञ्चवक्त्राऽस्थिसंस्थिता|five-faced, presiding over the bones|pañca · vaktrā · asthi · saṃsthitā",
  "अङ्कुशादिप्रहरणा|holding the goad and other weapons; वरदादिनिषेविता|served by Varadā and others",
  "Seated on the Mūlādhāra lotus; five-faced; presiding over the bones; holding the goad and other weapons; served by Varadā and others.",
  "மூலாதாரத் தாமரையில் அமர்ந்தவள்; ஐந்து முகங்களுடையவள்; எலும்பில் இருப்பவள்; அங்குசம் முதலிய ஆயுதங்கள் ஏந்தியவள்; வரதா முதலியோரால் சேவிக்கப்படுபவள்."),
 v(107, "Cosmos & cakras", "Fond of mung-dal rice, Sākinī herself — in the Ājñā lotus, white, six-faced (Hākinī).",
  "मुद्गौदनासक्तचित्ता|fond of rice with green gram; साकिन्यम्बास्वरूपिणी|in the form of Mother Sākinī",
  "आज्ञाचक्राब्जनिलया|dwelling in the Ājñā cakra lotus; शुक्लवर्णा|white; षडानना|six-faced",
  "Fond of rice cooked with green gram; in the form of Mother Sākinī; dwelling in the Ājñā lotus; white in colour; six-faced.",
  "பாசிப்பருப்புச் சாதத்தை விரும்புபவள்; சாகினீ அம்பா வடிவினள்; ஆக்ஞா சக்கரத் தாமரையில் இருப்பவள்; வெண்ணிறத்தவள்; ஆறு முகங்களுடையவள்."),
 v(108, "Cosmos & cakras", "In the marrow, with Haṃsavatī and others — fond of turmeric-rice, Hākinī herself.",
  "मज्जासंस्था|presiding over the marrow; हंसवतीमुख्यशक्तिसमन्विता|with Haṃsavatī and the chief Śaktis",
  "हरिद्रान्नैकरसिका|fond of turmeric rice; हाकिनीरूपधारिणी|in the form of Hākinī",
  "Presiding over the marrow; accompanied by Haṃsavatī and other chief Śaktis; fond of turmeric rice; in the form of Hākinī.",
  "மஜ்ஜையில் இருப்பவள்; ஹம்ஸவதீ முதலிய சக்திகளுடன் இருப்பவள்; மஞ்சள் சாதத்தை விரும்புபவள்; ஹாகினீ வடிவினள்."),
 v(109, "Cosmos & cakras", "In the thousand-petalled lotus, shining in all colours, all weapons, in the semen, facing all ways (Yākinī).",
  "सहस्रदलपद्मस्था|in the thousand-petalled lotus; सर्ववर्णोपशोभिता|shining in all colours",
  "सर्वायुधधरा|holding all weapons; शुक्लसंस्थिता|presiding over the vital essence; सर्वतोमुखी|facing all directions",
  "Dwelling in the thousand-petalled lotus; shining with all colours; holding all weapons; presiding over the vital essence; facing every direction.",
  "ஆயிரம் இதழ்த் தாமரையில் இருப்பவள்; எல்லா நிறங்களாலும் ஒளிர்பவள்; எல்லா ஆயுதங்களும் ஏந்தியவள்; சுக்லத்தில் இருப்பவள்; எல்லாத் திசைகளிலும் முகமுடையவள்."),
 v(110, "Cosmos & cakras", "Fond of all foods, Yākinī herself — Svāhā, Svadhā, beyond thought, wisdom, Śruti, Smṛti, the highest.",
  "सर्वौदनप्रीतचित्ता|fond of all kinds of rice; याकिन्यम्बास्वरूपिणी|in the form of Mother Yākinī",
  "स्वाहा|Svāhā; स्वधाऽमतिर्|Svadhā, beyond thought|svadhā · amatiḥ; मेधा|wisdom; श्रुतिः|the Veda; स्मृतिरनुत्तमा|Smṛti, the highest|smṛtiḥ · anuttamā",
  "Fond of all kinds of food; in the form of Mother Yākinī; Svāhā; Svadhā; ignorance (as Māyā); wisdom; the Veda; tradition (Smṛti); the unsurpassed.",
  "எல்லா வகைச் சாதங்களையும் விரும்புபவள்; யாகினீ அம்பா வடிவினள்; ஸ்வாஹா; ஸ்வதா; அமதி; மேதா; சுருதி; ஸ்ம்ருதி; ஒப்பற்றவள்."),
 v(111, "Her glories", "Of holy fame, reached by merit, holy to hear and sing — worshipped by Indra's queen, freeing from bonds.",
  "पुण्यकीर्तिः|of holy fame; पुण्यलभ्या|attained through merit; पुण्यश्रवणकीर्तना|holy to hear of and sing",
  "पुलोमजार्चिता|worshipped by Pulomajā (Śacī); बन्धमोचनी|freeing from bondage; बन्धुरालका|with lovely curling locks",
  "Of holy fame; attained through merit; holy to hear of and to sing; worshipped by Śacī, Indra's queen; freeing from bondage; with lovely wavy locks.",
  "புண்ணியப் புகழுடையவள்; புண்ணியத்தால் அடையப்படுபவள்; கேட்பதும் பாடுவதும் புண்ணியமானவள்; புலோமஜையால் அர்ச்சிக்கப்படுபவள்; பந்தத்திலிருந்து விடுவிப்பவள்; அழகிய சுருள் கூந்தலுடையவள்."),
 v(112, "Her glories", "Reflective awareness, knowledge, mother of space and the world — healer of all disease, warding off death.",
  "विमर्शरूपिणी|in the form of reflective awareness; विद्या|knowledge; वियदादिजगत्प्रसूः|mother of space and the world",
  "सर्वव्याधिप्रशमनी|healer of all diseases; सर्वमृत्युनिवारिणी|warding off every kind of death",
  "In the form of vimarśa, reflective awareness; knowledge; mother of the world beginning with space; healer of all diseases; warding off all untimely death.",
  "விமர்ச வடிவினள்; வித்யா; ஆகாசம் முதலிய உலகைத் தோற்றுவிப்பவள்; எல்லா நோய்களையும் தணிப்பவள்; எல்லா அகால மரணங்களையும் தடுப்பவள்."),
 v(113, "Her glories", "First of all, of unthinkable form, destroyer of Kali's sins — Kātyāyanī, slayer of time, served by Viṣṇu.",
  "अग्रगण्याऽचिन्त्यरूपा|to be counted first, of unthinkable form|agra · gaṇyā · acintya · rūpā; कलिकल्मषनाशिनी|destroyer of the sins of Kali",
  "कात्यायनी|Kātyāyanī; कालहन्त्री|destroyer of time (death); कमलाक्षनिषेविता|served by the lotus-eyed (Viṣṇu)",
  "Foremost of all; of unthinkable form; destroyer of the impurities of the Kali age; Kātyāyanī; destroyer of time; served by lotus-eyed Viṣṇu.",
  "முதன்மையானவள்; சிந்தைக்கு எட்டாத வடிவினள்; கலியின் பாவங்களை அழிப்பவள்; காத்யாயனி; காலனை அழிப்பவள்; கமலாக்ஷனால் சேவிக்கப்படுபவள்."),
 v(114, "Her glories", "Mouth full of betel, bright as pomegranate flowers — doe-eyed, enchanting, foremost, Mṛḍānī, a friend.",
  "ताम्बूलपूरितमुखी|her mouth full of betel; दाडिमीकुसुमप्रभा|bright as a pomegranate flower",
  "मृगाक्षी|doe-eyed; मोहिनी|enchanting; मुख्या|foremost; मृडानी|Mṛḍānī (Śiva's consort); मित्ररूपिणी|in the form of a friend (the sun)",
  "Her mouth full of betel; bright as the pomegranate flower; doe-eyed; enchanting; foremost; Mṛḍānī; in the form of a friend.",
  "தாம்பூலம் நிறைந்த வாயுடையவள்; மாதுளம்பூ போல் ஒளிர்பவள்; மான் கண்ணாள்; மோகினி; முதன்மையானவள்; ம்ருடானி; நண்பன் (சூரியன்) வடிவினள்."),
 v(115, "Her glories", "Ever content, treasure of devotees, ruler and queen of all — reached by friendliness, witness of the great dissolution.",
  "नित्यतृप्ता|ever content; भक्तनिधिर्|treasure of devotees; नियन्त्री|the controller; निखिलेश्वरी|queen of all",
  "मैत्र्यादिवासनालभ्या|reached by friendliness and like virtues; महाप्रलयसाक्षिणी|witness of the great dissolution",
  "Ever content; treasure of devotees; the inner controller; queen of all; attained by friendliness, compassion and the like; witness of the great dissolution.",
  "என்றும் திருப்தியானவள்; பக்தர்களின் நிதி; நியமிப்பவள்; நிகிலேஸ்வரி; மைத்ரி முதலிய பண்புகளால் அடையப்படுபவள்; மகாப்ரளயத்துக்குச் சாட்சி."),
 v(116, "Her glories", "Supreme power, the highest goal, dense wisdom — languid with mādhvī, intoxicated, the letters of the alphabet.",
  "परा|supreme; शक्तिः|power; परा|supreme; निष्ठा|the goal; प्रज्ञानघनरूपिणी|whose form is dense wisdom",
  "माध्वीपानालसा|languid from drinking mādhvī; मत्ता|intoxicated (with bliss); मातृकावर्णरूपिणी|in the form of the letters of the alphabet",
  "The supreme power; the supreme goal; whose form is dense wisdom; languid from drinking mādhvī; intoxicated with bliss; whose form is the letters of the alphabet.",
  "பராசக்தி; பரநிஷ்டை; பிரக்ஞானமே திரண்ட வடிவினள்; மாத்வீ பானத்தால் சோர்ந்தவள்; மத்தை; மாத்ருகா அக்ஷரங்களின் வடிவினள்."),
 v(117, "Her glories", "Dwelling on great Kailāsa, arms soft as lotus stalks — adorable, compassion embodied, ruler of a great empire.",
  "महाकैलासनिलया|dwelling on great Kailāsa; मृणालमृदुदोर्लता|with arms soft as lotus stalks",
  "महनीया|adorable; दयामूर्तिर्|compassion embodied; महासाम्राज्यशालिनी|ruler of a great empire",
  "Dwelling on the great Kailāsa; with creeper-like arms soft as lotus stalks; adorable; compassion embodied; ruler of a great empire.",
  "மகா கைலாசத்தில் வசிப்பவள்; தாமரைத் தண்டு போன்ற மென்மையான கைகளுடையவள்; போற்றத்தக்கவள்; கருணையின் வடிவம்; மகா சாம்ராஜ்யம் உடையவள்."),
 v(118, "Her glories", "Self-knowledge, the great vidyā, Śrīvidyā — the sixteen-syllable vidyā, three-peaked, Kāmakoṭikā.",
  "आत्मविद्या|knowledge of the Self; महाविद्या|the great vidyā; श्रीविद्या|Śrīvidyā; कामसेविता|served by Kāma",
  "श्रीषोडशाक्षरीविद्या|the sixteen-syllable Śrīvidyā; त्रिकूटा|of three kūṭas; कामकोटिका|Kāmakoṭikā",
  "Knowledge of the Self; the great vidyā; Śrīvidyā; worshipped by Kāma; the sixteen-syllable vidyā; of three peaks (kūṭas); Kāmakoṭikā.",
  "ஆத்ம வித்யை; மகா வித்யை; ஸ்ரீ வித்யை; காமனால் சேவிக்கப்படுபவள்; ஸ்ரீ ஷோடசாக்ஷரீ வித்யை; மூன்று கூடங்கள் உடையவள்; காமகோடிகா."),
 v(119, "Her glories", "Served by crores of Lakṣmīs who are servants of her glance — moon-like on the head, rainbow on the brow.",
  "कटाक्षकिङ्करीभूतकमलाकोटिसेविता|served by crores of Lakṣmīs who are servants of her glance|kaṭākṣa · kiṅkarī · bhūta · kamalā · koṭi · sevitā",
  "शिरःस्थिता|dwelling in the head; चन्द्रनिभा|moon-like; भालस्थेन्द्रधनुःप्रभा|in the forehead, bright as a rainbow",
  "Served by crores of Lakṣmīs who have become servants of her glance; dwelling in the head, like the moon; in the forehead, bright as a rainbow.",
  "தன் கடைக்கண்ணுக்குப் பணிப்பெண்களான கோடி லக்ஷ்மிகளால் சேவிக்கப்படுபவள்; தலையில் சந்திரன் போல் இருப்பவள்; நெற்றியில் வானவில் போல் ஒளிர்பவள்."),
 v(120, "Her glories", "In the heart like the sun, a lamp in the triangle — Dākṣāyaṇī, slayer of demons, destroyer of Dakṣa's sacrifice.",
  "हृदयस्था|dwelling in the heart; रविप्रख्या|like the sun; त्रिकोणान्तरदीपिका|a lamp within the triangle",
  "दाक्षायणी|Dākṣāyaṇī (Satī); दैत्यहन्त्री|slayer of demons; दक्षयज्ञविनाशिनी|destroyer of Dakṣa's sacrifice",
  "Dwelling in the heart, like the sun; a lamp within the central triangle; Dākṣāyaṇī; slayer of demons; destroyer of Dakṣa's sacrifice.",
  "இதயத்தில் சூரியன் போல் இருப்பவள்; திரிகோணத்துக்குள் தீபம்; தாக்ஷாயணி; தைத்யர்களை அழிப்பவள்; தக்ஷயாகத்தை அழித்தவள்."),
 v(121, "Her glories", "Long eyes gently moving, face bright with a soft smile — guru in form, treasure of virtues, mother of Guha.",
  "दरान्दोलितदीर्घाक्षी|with long eyes gently moving; दरहासोज्ज्वलन्मुखी|her face bright with a gentle smile",
  "गुरुमूर्तिर्|in the form of the guru; गुणनिधिर्|treasure of virtues; गोमाता|mother of cows (Kāmadhenu); गुहजन्मभूः|birthplace of Guha (Skanda)",
  "With long eyes gently moving; her face bright with a soft smile; in the form of the guru; treasure of virtues; Mother Cow; the birthplace of Guha.",
  "மெதுவாக அசையும் நீண்ட கண்களுடையவள்; மெல்லிய புன்னகையால் ஒளிரும் முகமுடையவள்; குரு வடிவினள்; குணங்களின் நிதி; கோமாதா; குகனின் பிறப்பிடம்."),
 v(122, "Her glories", "Queen of the gods, in the rod of justice, the space within the heart — worshipped by the lunar days from pratipad to full moon.",
  "देवेशी|queen of the gods; दण्डनीतिस्था|abiding in justice; दहराकाशरूपिणी|the subtle space within the heart",
  "प्रतिपन्मुख्यराकान्ततिथिमण्डलपूजिता|worshipped by the lunar days from pratipad to full moon|pratipat · mukhya · rākā · anta · tithi · maṇḍala · pūjitā",
  "Queen of the gods; abiding in the rule of justice; the subtle space within the heart; worshipped by the circle of lunar days from the first to the full moon.",
  "தேவர்களின் ஈஸ்வரி; தண்டநீதியில் இருப்பவள்; தஹராகாச வடிவினள்; பிரதமை முதல் பௌர்ணமி வரையிலான திதிகளால் பூஜிக்கப்படுபவள்."),
 v(123, "Her glories", "The digits of the moon, the moon's ruler, delighting in poetry — served by Lakṣmī and Sarasvatī with fans.",
  "कलात्मिका|the digits (of the moon) themselves; कलानाथा|ruler of the arts; काव्यालापविनोदिनी|delighting in poetic speech",
  "सचामररमावाणीसव्यदक्षिणसेविता|served on left and right by Lakṣmī and Sarasvatī holding chowries|sa · cāmara · ramā · vāṇī · savya · dakṣiṇa · sevitā",
  "The arts themselves; ruler of the arts; delighting in poetry; attended on her left and right by Lakṣmī and Sarasvatī waving chowries.",
  "கலைகளே வடிவானவள்; கலைகளின் நாயகி; கவிதைப் பேச்சில் மகிழ்பவள்; சாமரம் வீசும் லக்ஷ்மியாலும் சரஸ்வதியாலும் இடமும் வலமும் சேவிக்கப்படுபவள்."),
 v(124, "Her glories", "The primal power, immeasurable, supreme, pure in form — mother of countless universes, divine in body.",
  "आदिशक्तिरमेयाऽऽत्मा|the primal power, immeasurable, the Self|ādi · śaktiḥ · ameyā · ātmā; परमा|supreme; पावनाकृतिः|of purifying form",
  "अनेककोटिब्रह्माण्डजननी|mother of countless crores of universes; दिव्यविग्रहा|of divine form",
  "The primal power; immeasurable; the Self; supreme; of purifying form; mother of countless crores of universes; of divine form.",
  "ஆதிசக்தி; அளவற்றவள்; ஆத்மா; பரமா; புனித வடிவினள்; பல கோடி அண்டங்களின் தாய்; திவ்ய வடிவினள்."),
 v(125, "Her glories", "Klīṅkārī, the only one, secret, giver of liberation — Tripurā, worshipped by three worlds, the Trinity.",
  "क्लीङ्कारी|maker of the syllable klīṃ; केवला|the only one; गुह्या|secret; कैवल्यपददायिनी|giver of the state of liberation",
  "त्रिपुरा|Tripurā; त्रिजगद्वन्द्या|worshipped by the three worlds; त्रिमूर्तिस्|the three forms; त्रिदशेश्वरी|queen of the gods",
  "She of the syllable klīṃ; the one alone; the secret; giver of kaivalya; Tripurā; worshipped by the three worlds; the three forms (Brahmā, Viṣṇu, Śiva); queen of the gods.",
  "க்லீங்காரி; தனித்தவள்; ரகசியமானவள்; கைவல்யம் தருபவள்; திரிபுரா; மூவுலகாலும் வணங்கப்படுபவள்; மும்மூர்த்தி; தேவர்களின் ஈஸ்வரி.",
  {tip:"Many <b>tri-</b> names: tripurā · trijagadvandyā · trimūrti · tridaśeśvarī · tryakṣarī (v126)."}),
 v(126, "Her glories", "Of three syllables, fragrant, adorned with a vermilion mark — Umā, daughter of the mountain, Gaurī.",
  "त्र्यक्षरी|of three syllables; दिव्यगन्धाढ्या|rich in divine fragrance; सिन्दूरतिलकाञ्चिता|adorned with a vermilion mark",
  "उमा|Umā; शैलेन्द्रतनया|daughter of the king of mountains; गौरी|Gaurī, the fair; गन्धर्वसेविता|served by gandharvas",
  "Of three syllables; rich in divine fragrance; adorned with a vermilion tilaka; Umā; daughter of the king of mountains; Gaurī; served by the gandharvas.",
  "மூன்று அக்ஷரங்களானவள்; திவ்ய மணம் நிறைந்தவள்; சிந்தூரத் திலகம் அணிந்தவள்; உமா; மலையரசன் மகள்; கௌரி; கந்தர்வர்களால் சேவிக்கப்படுபவள்."),
 v(127, "Her glories", "Womb of the universe, the golden womb, mistress of speech — reached by meditation, boundless, giver of knowledge.",
  "विश्वगर्भा|womb of the universe; स्वर्णगर्भाऽवरदा|the golden womb, slayer of the wicked|svarṇa · garbhā · avaradā; वागधीश्वरी|mistress of speech",
  "ध्यानगम्याऽपरिच्छेद्या|reached by meditation, boundless|dhyāna · gamyā · aparicchedyā; ज्ञानदा|giver of knowledge; ज्ञानविग्रहा|knowledge embodied",
  "Womb of the universe; the golden womb; destroyer of the wicked; mistress of speech; reached by meditation; boundless; giver of knowledge; knowledge embodied.",
  "உலகைக் கருவில் கொண்டவள்; ஸ்வர்ண கர்ப்பா; தீயோரை அழிப்பவள்; வாக்கின் ஈஸ்வரி; தியானத்தால் அடையப்படுபவள்; எல்லையற்றவள்; ஞானம் தருபவள்; ஞான வடிவினள்."),
 v(128, "Her glories", "Known through all the Upaniṣads, truth and bliss — worshipped by Lopāmudrā, creating universes in play.",
  "सर्ववेदान्तसंवेद्या|known through all the Upaniṣads; सत्यानन्दस्वरूपिणी|whose nature is truth and bliss",
  "लोपामुद्रार्चिता|worshipped by Lopāmudrā; लीलाक्लृप्तब्रह्माण्डमण्डला|who creates the universe in play",
  "Known through all the Upaniṣads; whose nature is truth and bliss; worshipped by Lopāmudrā (Agastya's wife); who made the circle of universes in play.",
  "எல்லா வேதாந்தங்களாலும் அறியப்படுபவள்; சத்திய ஆனந்த வடிவினள்; லோபாமுத்திரையால் அர்ச்சிக்கப்படுபவள்; விளையாட்டாக அண்டங்களைப் படைத்தவள்."),
 v(129, "Her glories", "Invisible, beyond the seen, the knower, beyond the known — yoginī, giver of yoga, bliss of yoga, upholder of the ages.",
  "अदृश्या|invisible; दृश्यरहिता|beyond all that is seen; विज्ञात्री|the knower; वेद्यवर्जिता|beyond the known",
  "योगिनी|the yoginī; योगदा|giver of yoga; योग्या|worthy; योगानन्दा|the bliss of yoga; युगन्धरा|upholder of the ages",
  "Invisible; beyond all objects; the knower; with nothing left for her to know; the yoginī; giver of yoga; worthy; the bliss of yoga; upholder of the ages.",
  "காணப்படாதவள்; காட்சிப் பொருள்களுக்கு அப்பாற்பட்டவள்; அறிபவள்; அறியப்பட வேண்டியது இல்லாதவள்; யோகினி; யோகம் தருபவள்; தகுதியானவள்; யோகானந்தம்; யுகங்களைத் தாங்குபவள்."),
 v(130, "Her glories", "The powers of will, knowledge and action — support of all, firmly established, being and non-being.",
  "इच्छाशक्तिज्ञानशक्तिक्रियाशक्तिस्वरूपिणी|in the form of the powers of will, knowledge and action|icchā · śakti · jñāna · śakti · kriyā · śakti · svarūpiṇī",
  "सर्वाधारा|support of all; सुप्रतिष्ठा|firmly established; सदसद्रूपधारिणी|bearing the forms of being and non-being",
