          <div class="ttl" id="heroTitle"></div>
          <h1>Hanuman Chalisa</h1>
          <p class="lead" style="margin-top:8px">“Forty verses to Hanumān.” Tulasīdās first cleans the mirror of his mind with the dust of his guru's feet, then sings Hanumān's story — the leap to Laṅkā, the burning city, the sañjīvanī mountain — and what his name does: no ghost comes near, illness goes, every hardship is cut away.</p>
        </div>

      </div>

        <div class="fact"><span>Language</span><b>Awadhi</b><span>old Hindi — not Sanskrit</span></div>
        <div class="fact"><span>Metres</span><b>Dohā · caupāī</b><span>counted in beats, not syllables</span></div>
        <div class="fact"><span>Source</span><b>Her PDF</b><span>Vaidika Vignanam, Tamil script</span></div>
        <div class="fact"><span>On her plan</span><b>Tuesday</b><span>Hanumān's day</span></div>
      </div>

        <h2>Saying Awadhi words</h2>
        <p class="muted" style="margin:6px 0 12px">The page spells every word in full, as her book does (ஜய, jaya). When it is sung, the short <b>a</b> at the end of a word is mostly not said, and a few letters soften:</p>
        <div class="say">
          <div><b>jaya hanumāna jñāna guṇa sāgara</b><span>is sung <b>jai hanumān gyān gun sāgar</b></span></div>
          <div><b>ṣ · ś</b><span>in Hindi both are said like <b>sh</b>; <b>ṇ</b> like <b>n</b></span></div>
          <div><b>jñāna</b><span>said <b>gyān</b> in Hindi (in Sanskrit, <i>jñāna</i>)</span></div>
          <div><b>ai · au at the end (gāvai, sumirau)</b><span>a long open <b>ai</b> / <b>au</b> sound</span></div>
        </div>
        <div class="tip" style="margin-top:12px"><b>Tip.</b> Keep the final <b>a</b> where the tune needs a beat — singers often hold it at the end of a line (<i>sāgara</i>, <i>ujāgara</i>). The Memorise tab's recording lets you compare with the way she learnt it.</div>
      </div>

  {tip:"The famous picture: Hanumān opening his chest to show Rāma and Sītā inside."}),
 c(9, "Tiny, he showed himself to Sītā; huge and fearsome, he burnt Laṅkā.",

  "विकट|a fearsome|vikaṭa; रूपधरि|form taking|rūpa · dhari; लङ्क|Laṅkā|laṅka; जलावा|burnt|jalāvā",
  "Taking a tiny form, you showed yourself to Sītā; taking a fearsome form, you burnt Laṅkā.",

 c(10, "In a terrible form he destroyed the demons, and finished Rāma's work.",

 c(11, "Bringing the sañjīvanī herb, he revived Lakṣmaṇa; Rāma, overjoyed, held him to his heart.",

  "श्री|Śrī|śrī; रघुवीर|the hero of the Raghus|raghu · vīra; हरषि|rejoicing|haraṣi; उरलाये|held to his chest|ura = chest · lāye",
  "Bringing the sañjīvanī herb, you brought Lakṣmaṇa back to life; Śrī Raghuvīra, rejoicing, held you to his heart.",

 c(12, "Rāma praised him greatly: “You are as dear to me as my brother Bharata.”",

  "तुम|you|tuma; मम|to me|mama; प्रिय|dear|priya; भरत|Bharata|bharata; सम|like|sama; भाई|brother|bhāī",
  "Raghupati praised you greatly: “You are as dear to me as my brother Bharata.”",

  {tip:"Rāma's words: <b>tuma mama priya bharata sama bhāī</b>."}),
 c(13, "“May the thousand-mouthed serpent sing your fame,” said Śrī's Lord, and embraced him.",

  "अस|thus|asa; कहि|saying|kahi; श्रीपति|Śrī's Lord (Rāma)|śrī · pati; कण्ठ|to the neck|kaṇṭha; लगावै|embraces|lagāvai",

  "“ஆயிரம் வாயுடைய ஆதிசேஷனும் உன் புகழைப் பாடுகிறான்” என்று சொல்லி ஸ்ரீபதி உன்னைக் கழுத்தோடு அணைத்தான்."),
 c(14, "Sanaka and the sages, Brahmā and the gods, Nārada, Sarasvatī and the serpent king —",

  "Sanaka and the other sages, Brahmā and the gods, the great munis, Nārada, Śāradā and the lord of serpents —",
  "சனகாதி முனிவர்கள், பிரம்மா முதலான தேவர்கள், முனிவர் தலைவர்கள், நாரதர், சாரதை, நாகராஜன் —",
  {tip:"Caupāīs 14–15 are one sentence: all these cannot fully tell your glory."}),
 c(15, "— Yama, Kubera, the guardians of the directions, poets and scholars — how could they tell it all?",

  "कवि|poets|kavi; कोविद|scholars|kovida; कहि|tell|kahi; सके|could|sake; कहां|how|kahāṃ; ते|then|te",

  "— யமன், குபேரன், திக்பாலர்கள், கவிஞர்கள், அறிஞர்கள் — இவர்கள் உன் புகழை எப்படி முழுதும் சொல்ல முடியும்?"),
 c(16, "You helped Sugrīva — you brought him to Rāma and gave him the kingdom.",

 c(17, "Vibhīṣaṇa took your advice and became lord of Laṅkā — the whole world knows it.",

  "Vibhīṣaṇa accepted your counsel and became lord of Laṅkā — the whole world knows it.",

 c(18, "The sun, thousands of yojanas away — you swallowed it, thinking it a sweet fruit.",

 c(19, "With the Lord's ring in your mouth you leapt the ocean — no wonder.",

 c(20, "Every hard task in the world becomes easy by your grace.",

 c(21, "You guard Rāma's door; no one enters without your leave.",

 c(23, "Only you can hold back your own power; at your roar the three worlds tremble.",

 c(24, "Ghosts and spirits do not come near when the name of Mahāvīra is spoken.",

 c(25, "Illness perishes and all pain goes, for whoever keeps chanting brave Hanumān's name.",

 c(26, "Hanumān frees from trouble whoever fixes on him in mind, deed and word.",

 c(27, "Rāma the ascetic king is above all — and you accomplished all his work.",

 c(29, "Your glory fills all four ages; your light is famous through the world.",

 c(30, "Guardian of saints and sages, destroyer of demons, Rāma's darling.",

 c(31, "Giver of the eight siddhis and nine treasures — Mother Jānakī gave you this boon.",

  {tip:"Sītā's boon in the Aśoka grove."}),
 c(32, "You hold the elixir of Rāma's name; may you always remain Rāma's servant.",
