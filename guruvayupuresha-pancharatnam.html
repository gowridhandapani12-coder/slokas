          <h1>Guruvayupuresha Pancharatnam</h1>
          <p class="lead" style="margin-top:8px">Five gems for Guruvāyūrappan, the Lord of Guruvāyūr (“Vātālaya”, the home of Vāyu). Each verse is followed by sixteen <i>Nārāyaṇa</i>s — four lines of four — sung together like a bhajan.</p>

        <div class="fact"><span>Refrain</span><b>Nārāyaṇa × 16</b><span>after every verse</span></div>
        <div class="fact"><span>Best</span><b>Three times a day</b><span>“trikālam” — verse 6</span></div>
        <div class="fact"><span>On her plan</span><b>Wednesday</b><span>third of the day</span></div>
      </div>
