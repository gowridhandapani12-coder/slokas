<template id="overview">
      <div class="hero">
        <div>
          <p class="eyebrow">Mukkūr Śrīnivāsa Varadācārya · Sanskrit · 8 verses</p>
          <div class="ttl" id="heroTitle"></div>
          <h1>Ashtalakshmi Stotram</h1>
          <p class="lead" style="margin-top:8px">“The hymn to the eight Lakṣmīs.” One verse for each of her eight forms — the first Lakṣmī, and the Lakṣmīs of grain, courage, elephants, children, victory, learning and wealth. Every verse ends with the same call: <i>jaya jaya he madhusūdana-kāmini</i> — “victory to you, beloved of Madhusūdana — protect me.”</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Composed by</span><b>Mukkūr Śrīnivāsa Varadācārya</b><span>20th-century Śrīvaiṣṇava scholar</span></div>
        <div class="fact"><span>Goddess</span><b>Mahālakṣmī</b><span>in eight forms</span></div>

        <div class="fact"><span>Rhythm</span><b>A song metre</b><span>beats of four, sung, not counted</span></div>
        <div class="fact"><span>Source</span><b>Her PDF</b><span>Sunder Kidāmbi, prapatti.com</span></div>
        <div class="fact"><span>On her plan</span><b>Friday</b><span>with the other Lakṣmī hymns</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The shape of the hymn</h2><span class="muted" style="font-size:.85rem">Tap a block to open it</span></div>
        <div class="gems" id="gems" style="margin-top:14px"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>One refrain, eight times</h2>
          <p class="muted" style="margin:6px 0 12px">Every verse ends with these two quarters. Only the name changes — and in verses 4, 5 and 8 the word before <i>pālaya</i>.</p>
          <div class="refrain" id="refrain"></div>
          <p style="margin-top:6px">“Victory, victory to you, O beloved of Madhusūdana! O ___-Lakṣmī, always protect me.”</p>
          <div class="tip" style="margin-top:14px"><b>Three small changes</b> to watch for: <b>gajalakṣmi rūpeṇa</b> (v4), <b>santānalakṣmi tvaṃ</b> (v5), <b>dhanalakṣmi rūpeṇa</b> (v8). All the others say <b>sadā</b>.</div>
        </div>
        <div class="card">
          <h2>Remember the order</h2>
          <p class="muted" style="margin:6px 0 14px">The eight names, in order — say them as a little chant: <b>Ādi · Dhānya · Dhairya · Gaja · Santāna · Vijaya · Vidyā · Dhana</b>.</p>
          <div class="mn" id="openings"></div>
          <div class="tip" style="margin-top:14px"><b>A story to hold the order:</b> first she comes (<i>Ādi</i>), the fields fill with grain (<i>Dhānya</i>), we find courage (<i>Dhairya</i>), elephants arrive with the king's honour (<i>Gaja</i>), children are born (<i>Santāna</i>), we win (<i>Vijaya</i>), we learn (<i>Vidyā</i>), and the drums sound for wealth (<i>Dhana</i>).</div>
        </div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The eight Lakṣmīs</h2><span class="muted" style="font-size:.85rem">Tap one to see the word in its verse</span></div>
        <div class="icons" id="icons" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <h2>What it gives</h2>
        <p class="muted" style="margin:6px 0 12px">The hymn has no separate phala-śruti — each verse is itself the gift its Lakṣmī brings.</p>
        <div class="benefits" id="benefits"></div>
      </div>
