          <h1>Ganapathy Atharvashirsham</h1>
          <p class="lead" style="margin-top:8px">“The head of the Atharva Veda” — a short Upaniṣad to Gaṇapati. It speaks to him directly: <i>tvam eva pratyakṣaṃ tattvam asi</i>, “you alone are the truth made visible.” Then it gives his mantra <b>gaṃ</b>, his Gāyatrī, his picture, and what chanting it brings.</p>

  "इन्द्रस्त्वम्|are Indra; you|indraḥ · tvam; अग्निस्त्वं|are Agni; you|agniḥ · tvam; वायुस्त्वं|are Vāyu; you|vāyuḥ · tvam; सूर्यस्त्वं|are Sūrya; you|sūryaḥ · tvam; चन्द्रमास्त्वं|are the Moon; you|candramāḥ · tvam",
  "ब्रह्म|are Brahman|brahma; भूर्भुवः|earth, sky|bhūḥ · bhuvaḥ; स्वरोम्|heaven, Om|svaḥ · om"],
  "You are beyond the three guṇas, beyond the three states, beyond the three bodies, beyond the three times. You dwell always in the mūlādhāra. You are the three powers. Yogis meditate on you always. You are Brahmā, Viṣṇu, Rudra, Indra, Agni, Vāyu, the Sun and the Moon; you are Brahman — earth, sky, heaven and Om.",
  "நீ மூன்று குணங்கள், மூன்று நிலைகள், மூன்று உடல்கள், மூன்று காலங்கள் கடந்தவன். நீ எப்போதும் மூலாதாரத்தில் இருப்பவன். நீ மூன்று சக்திகளின் வடிவம். யோகிகள் உன்னை எப்போதும் தியானிக்கிறார்கள். நீயே பிரம்மா, விஷ்ணு, ருத்ரன், இந்திரன், அக்னி, வாயு, சூரியன், சந்திரன்; நீயே பிரம்மம் — பூ:, புவ:, ஸுவ:, ஓம்.",
  {tip:"A <b>-traya-atīta</b> (beyond the three) chain: guṇa · avasthā · deha · kāla."}),
 m(7, "The mantra", "How the mantra is built: g, then a, then the nasal ṃ — gaṃ. Its seer, metre and deity.", [
  "गणादिं|the first letter of “gaṇa” (g)|gaṇa · ādi; पूर्वमुच्चार्य|saying first|pūrvam · uccārya; वर्णादिंस्तदनन्तरम्|then the first of the letters (a)|varṇa · ādi · tat · anantaram",
  "अनुस्वारः|the anusvāra (ṃ)|anusvāra; परतरः|after that|paratara",
  "अर्धेन्दुलसितम्|shining with the half-moon|ardha · indu · lasita",
  "तारेण|with Om|tāra = the syllable Om; ऋद्धम्|enriched|ṛddha",
  "एतत्तव|this is your|etat · tava; मनुस्वरूपम्|mantra-form|manu = mantra · svarūpa",
  "गकारः|the letter g|ga-kāra; पूर्वरूपम्|is the first form|pūrva · rūpa",
  "अकारो|the letter a|a-kāra; मध्यमरूपम्|is the middle form|madhyama · rūpa",
  "अनुस्वारश्चान्त्यरूपम्|the anusvāra is the last form|anusvāraḥ · ca · antya · rūpa",
  "बिन्दुरुत्तररूपम्|the bindu is the higher form|binduḥ · uttara · rūpa",
  "नादः|the sound|nāda; सन्धानम्|is the joining|sandhāna",
  "संहिता|the union|saṃhitā; सन्धिः|is the meeting|sandhi",
  "सैषा|this is the|sā · eṣā; गणेशविद्या|Gaṇeśa vidyā|gaṇeśa · vidyā",
  "गणक|Gaṇaka|gaṇaka; ऋषिः|is the seer|ṛṣi; निचृद्गायत्री|nicṛd gāyatrī|nicṛt · gāyatrī; छन्दः|is the metre|chandas",
  "महागणपतिर्देवता|Mahāgaṇapati is the deity|mahā · gaṇapatiḥ · devatā",
  "ओं|Om|om; गं|gaṃ|gaṃ = the seed syllable; गणपतये|to Gaṇapati|gaṇapati; नमः|salutations|namaḥ"],
  "First say the first letter of “gaṇa” (g), then the first of the letters (a), then the anusvāra, shining with the half-moon, joined with Om. This is the form of your mantra: g is the first form, a the middle form, the anusvāra the last form, the bindu the higher form; the sound joins them; their union is the meeting. This is the Gaṇeśa-vidyā. Its seer is Gaṇaka, its metre nicṛd gāyatrī, its deity Mahāgaṇapati. Om gaṃ gaṇapataye namaḥ.",
  "முதலில் ‘கண’வின் முதலெழுத்தை (க), பின் எழுத்துகளின் முதலான ‘அ’வை, பின் அனுஸ்வாரத்தைச் சொல்லி, அரை நிலவோடு ஒளிர, ஓங்காரத்தோடு சேர்ப்பது உன் மந்திர வடிவம். ‘க’ முதல் வடிவம், ‘அ’ நடு வடிவம், அனுஸ்வாரம் இறுதி வடிவம், பிந்து மேலான வடிவம்; நாதம் இணைப்பு; சம்ஹிதை சந்தி. இதுவே கணேச வித்யை. ரிஷி கணகர், சந்தஸ் நிச்ருத் காயத்ரீ, தேவதை மஹாகணபதி. ஓம் கம் கணபதயே நம:.",
  {tip:"The whole mantra built in front of you: <b>g + a + ṃ = gaṃ</b>, with Om. Ends <b>om gaṃ gaṇapataye namaḥ</b>."}),
 m(8, "Gāyatrī", "Gaṇapati Gāyatrī: we know the one-tusked one; we meditate on the curved trunk.", [
  "एकदन्ताय|the one-tusked one|eka · danta; विद्महे|we know|vidmahe",
  "वक्रतुण्डाय|the one with the curved trunk|vakra · tuṇḍa; धीमहि|we meditate on|dhīmahi",
  "तन्नो|may he, us|tat · naḥ; दन्तिः|the tusked one|dantin; प्रचोदयात्|inspire|pracodayāt"],
  "We know the one-tusked one; we meditate on the one with the curved trunk. May that tusked one inspire us.",
  "ஒற்றைத் தந்தனை அறிவோம்; வளைந்த துதிக்கையனைத் தியானிப்போம். அந்தத் தந்தி நம்மை வழிநடத்தட்டும்.",
  {meterNote:"Gāyatrī: three quarters of about 8 syllables.", tip:"The Gāyatrī pattern: <b>vidmahe · dhīmahi · pracodayāt</b> — the same shape as the Lakṣmī Gāyatrī in her Śrī Sūktam."}),
 m(9, "Dhyānam", "One tusk, four hands — noose, goad, tusk and boon; mouse on his banner; red, big-bellied, fan-eared.", [
  "एकदन्तं|one-tusked|eka · danta; चतुर्हस्तं|four-handed|catur · hasta; पाशमङ्कुशधारिणम्|holding the noose and the goad|pāśam · aṅkuśa · dhārin",
  "रदं|the tusk|rada; च|and|ca; वरदं|the boon-gesture|vara · da; हस्तैर्बिभ्राणं|holding in his hands|hastaiḥ · bibhrāṇa; मूषकध्वजम्|with the mouse as his banner|mūṣaka · dhvaja",
  "रक्तं|red|rakta; लम्बोदरं|big-bellied|lamba · udara; शूर्पकर्णकं|with ears like winnowing fans|śūrpa · karṇaka; रक्तवाससम्|in red clothes|rakta · vāsas",
  "रक्तगन्धानुलिप्ताङ्गं|his body smeared with red sandal|rakta · gandha · anulipta · aṅga; रक्तपुष्पैः|with red flowers|rakta · puṣpa; सुपूजितम्|well worshipped|su · pūjita",
  "भक्तानुकम्पिनं|compassionate to devotees|bhakta · anukampin; देवं|the God|deva; जगत्कारणमच्युतम्|cause of the world, unfailing|jagat · kāraṇam · acyutam",
  "आविर्भूतं|who appeared|āvirbhūta; च|and|ca; सृष्ट्यादौ|at the start of creation|sṛṣṭi · ādau; प्रकृतेः|beyond nature|prakṛti; पुरुषात्परम्|and beyond spirit|puruṣāt · param",
  "एवं|thus|evam; ध्यायति|meditates|dhyāyati; यो|who|yaḥ; नित्यं|daily|nityam; स|he|saḥ; योगी|is a yogi|yogin; योगिनां|of yogis|yogin; वरः|the best|vara"],
  "One-tusked, four-handed, holding the noose and the goad, the tusk and the boon-gesture, with the mouse as his banner; red, big-bellied, with ears like winnowing fans, in red clothes, his body smeared with red sandal, worshipped with red flowers; compassionate to devotees, the God, the unfailing cause of the world, who appeared at the start of creation, beyond nature and spirit — whoever meditates on him thus every day is the best of yogis.",
  "ஒற்றைத் தந்தமும் நான்கு கைகளும் உடையவன்; பாசம், அங்குசம், தந்தம், வரம் தாங்கியவன்; எலிக் கொடியோன்; சிவந்தவன், பெருவயிறன், முறம் போன்ற காதுகளன், செவ்வாடை அணிந்தவன், செஞ்சந்தனம் பூசியவன், செம்மலர்களால் பூஜிக்கப்படுபவன்; பக்தர்களிடம் கருணையுள்ளவன்; உலகின் காரணம்; அச்யுதன்; படைப்பின் தொடக்கத்தில் தோன்றியவன்; பிரகிருதிக்கும் புருஷனுக்கும் மேலானவன் — இவ்வாறு தினமும் தியானிப்பவன் யோகிகளில் சிறந்தவன்.",
  {meter:"anushtubh", meterNote:null, tip:"These seven lines are anuṣṭubh verse (checked). Count the <b>rakta</b> (red): five."}),
 m(10, "Salutations", "Salutations to the lord of the hosts, of the gaṇas, of the pramathas — big-bellied, one-tusked, Śiva's son.", [
  "नमो|salutations|namaḥ; व्रातपतये|to the lord of the hosts|vrāta · pati",
  "नमो|salutations|namaḥ; गणपतये|to the lord of the gaṇas|gaṇa · pati",
  "नमः|salutations|namaḥ; प्रमथपतये|to the lord of the pramathas (Śiva's attendants)|pramatha · pati",
  "नमस्तेऽस्तु|salutations be to you|namaḥ · te · astu; लम्बोदरायैकदन्ताय|the big-bellied, the one-tusked|lambodarāya · ekadantāya",
  "विघ्नविनाशिने|the destroyer of obstacles|vighna · vināśin; शिवसुताय|the son of Śiva|śiva · suta",
  "वरदमूर्तये|the boon-giving form|vara · da · mūrti; नमः|salutations|namaḥ"],
  "Salutations to the lord of the hosts; salutations to the lord of the gaṇas; salutations to the lord of the pramathas. Salutations to you — the big-bellied, the one-tusked, the destroyer of obstacles, the son of Śiva, the boon-giving form.",
  "கூட்டங்களின் தலைவனுக்கு நமஸ்காரம்; கணங்களின் தலைவனுக்கு நமஸ்காரம்; பிரமதர்களின் தலைவனுக்கு நமஸ்காரம். பெருவயிறனே, ஒற்றைத் தந்தனே, தடைகளை அழிப்பவனே, சிவ மைந்தனே, வரம் தரும் வடிவமே — உனக்கு நமஸ்காரம்.",
  {tip:"Three <b>-pataye</b> (to the lord of): vrāta · gaṇa · pramatha."}),
 m(11, PH, "Whoever studies it becomes Brahman, is free of obstacles and great sins; morning and evening chanting removes the day's and night's sins.", [
  "एतदथर्वशीर्षं|this Atharvaśīrṣa|etat · atharvaśīrṣa; योऽधीते|whoever studies|yaḥ · adhīte",
  "स|he|saḥ; ब्रह्मभूयाय|for becoming Brahman|brahma · bhūya; कल्पते|is fit|kalpate",
  "स|he|saḥ; सर्वविघ्नैर्न|by any obstacle not|sarva · vighnaiḥ · na; बाध्यते|is troubled|bādhyate",
  "स|he|saḥ; सर्वतः|everywhere|sarvataḥ; सुखमेधते|grows in happiness|sukham · edhate",
  "स|he|saḥ; पञ्चमहापापात्|from the five great sins|pañca · mahā · pāpa; प्रमुच्यते|is freed|pramucyate",
  "सायमधीयानो|chanting in the evening|sāyam · adhīyāna; दिवसकृतं|done in the day|divasa · kṛta; पापं|sin|pāpa; नाशयति|destroys|nāśayati",
  "प्रातरधीयानो|chanting in the morning|prātaḥ · adhīyāna; रात्रिकृतं|done in the night|rātri · kṛta; पापं|sin|pāpa; नाशयति|destroys|nāśayati",
  "सायं|evening|sāyam; प्रातः|and morning|prātaḥ; प्रयुञ्जानो|practising|prayuñjāna; पापोऽपापो|the sinner sinless|pāpaḥ · apāpaḥ; भवति|becomes|bhavati",
  "धर्मार्थकाममोक्षं|dharma, wealth, desire and liberation|dharma · artha · kāma · mokṣa; च|and|ca; विन्दति|gains|vindati",
  "इदमथर्वशीर्षमशिष्याय|this Atharvaśīrṣa, to one not a disciple|idam · atharvaśīrṣam · aśiṣyāya; न|not|na; देयम्|should be given|deya",
  "यो|who|yaḥ; यदि|if|yadi; मोहाद्|out of delusion|mohāt; दास्यति|gives it|dāsyati; स|he|saḥ; पापीयान्|more sinful|pāpīyas; भवति|becomes|bhavati",
  "सहस्रावर्तनाद्यं|by a thousand recitations, whatever|sahasra · āvartanāt · yam; यं|whatever|yam; काममधीते|wish he studies for|kāmam · adhīte; तं|that|tam; तमनेन|that, by this|tam · anena; साधयेत्|he will attain|sādhayet"],
  "Whoever studies this Atharvaśīrṣa becomes fit to be Brahman; no obstacle troubles him; he grows in happiness everywhere; he is freed from the five great sins. Chanting it in the evening destroys the sins of the day; in the morning, the sins of the night; practising it evening and morning, the sinner becomes sinless, and gains dharma, wealth, desire and liberation. It must not be given to one who is not a disciple; whoever gives it out of delusion becomes more sinful. By reciting it a thousand times one attains whatever wish one studies it for.",
  "இந்த அதர்வசீர்ஷத்தை ஓதுபவர் பிரம்ம நிலைக்குத் தகுதியாகிறார்; எந்தத் தடையும் அவரைத் துன்புறுத்தாது; எங்கும் இன்பத்தில் வளர்வார்; ஐந்து பெரும் பாவங்களிலிருந்து விடுபடுவார். மாலையில் ஓதினால் பகலின் பாவமும், காலையில் ஓதினால் இரவின் பாவமும் அழியும். காலை மாலை இரண்டிலும் ஓதுபவர் பாவமற்றவராகி அறம், பொருள், இன்பம், வீடு அடைவார். சீடர் அல்லாதவருக்கு இதைத் தரக்கூடாது. ஆயிரம் முறை ஓதினால் எந்த விருப்பத்துக்காக ஓதுகிறாரோ அதை அடைவார்.",
  {kind:"phala", short:"Phala 11", tip:"<b>sāyam … prātar …</b> — evening for the day's faults, morning for the night's."}),
 m(12, PH, "Bathe Gaṇapati with it — eloquence; chant fasting on Caturthī — learning; then no fear ever.", [
  "अनेन|with this|anena; गणपतिमभिषिञ्चति|bathes Gaṇapati|gaṇapatim · abhiṣiñcati; स|he|saḥ; वाग्मी|eloquent|vāgmin; भवति|becomes|bhavati",
  "चतुर्थ्यामनश्नन्|on Caturthī, fasting|caturthyām · anaśnan; जपति|chants|japati; स|he|saḥ; विद्यावान्|learned|vidyāvat; भवति|becomes|bhavati",
  "इत्यथर्वणवाक्यम्|thus says the Atharvaṇa (Veda)|iti · atharvaṇa · vākya",
  "ब्रह्माद्याचरणं|the practice of Brahmā and the others|brahma · ādi · ācaraṇa; विद्यान्न|knowing, not|vidyāt · na; बिभेति|fears|bibheti; कदाचनेति|ever — thus|kadācana · iti"],
  "Whoever bathes Gaṇapati while chanting this becomes eloquent. Whoever chants it fasting on Caturthī becomes learned. So says the Atharvaṇa. Knowing the practice of Brahmā and the others, one never fears.",
  "இதைச் சொல்லிக் கணபதிக்கு அபிஷேகம் செய்பவர் சொல்வன்மை பெறுவார். சதுர்த்தியன்று உண்ணாமல் ஜபிப்பவர் கல்விமான் ஆவார். இது அதர்வண வாக்கு. பிரம்மா முதலானோரின் நெறியை அறிந்தவர் ஒருபோதும் அஞ்சமாட்டார்.",
  {kind:"phala", short:"Phala 12", tip:"Her book reads <b>brahmādyācaraṇam</b> (many read <i>brahmādyāvaraṇam</i>)."}),
 m(13, PH, "Offer dūrvā grass — wealth like Kubera; puffed rice — fame and wisdom; a thousand modakas — your wish; ghee and sticks — everything.", [
  "यो|who|yaḥ; दूर्वाङ्कुरैर्यजति|worships with dūrvā sprouts|dūrvā · aṅkuraiḥ · yajati; स|he|saḥ; वैश्रवणोपमो|like Vaiśravaṇa (Kubera)|vaiśravaṇa · upama; भवति|becomes|bhavati",
  "यो|who|yaḥ; लाजैर्यजति|worships with puffed rice|lājaiḥ · yajati; स|he|saḥ; यशोवान्|famous|yaśovat; भवति|becomes|bhavati",
  "स|he|saḥ; मेधावान्|wise|medhāvat; भवति|becomes|bhavati",
  "यो|who|yaḥ; मोदकसहस्रेण|with a thousand modakas|modaka · sahasra; यजति|worships|yajati; स|he|saḥ; वाञ्छितफलमवाप्नोति|gains the fruit he wished|vāñchita · phalam · avāpnoti",
  "यः|who|yaḥ; साज्य|with ghee|sa · ājya; समिद्भिर्यजति|worships with sacred sticks|samidbhiḥ · yajati",
  "स|he|saḥ; सर्वं|everything|sarvam; लभते|gains|labhate; स|he|saḥ; सर्वं|everything|sarvam; लभते|gains|labhate"],
