<body>
<template id="overview">
      <div class="hero">
        <div>
          <p class="eyebrow">Azhagiya Maṇavāḷa Jīyar (as in her PDF) · Sanskrit · 8 verses + 1</p>
          <div class="ttl" id="heroTitle"></div>
          <h1>Narasimha Ashtakam</h1>
          <p class="lead" style="margin-top:8px">Eight verses that each end with the Lord's name called twice — <i>narasiṃha, narasiṃha!</i> His mane like ten million moons, claws red with Hiraṇya's blood, Lakṣmī by his side, and a prayer that he will come on Garuḍa at our last moment.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Given by</span><b>Azhagiya Maṇavāḷa Jīyar</b><span>“anugṛhītam”, her PDF</span></div>
        <div class="fact"><span>Deity</span><b>Lakṣmī Nṛsiṃha</b><span>with Ramā (Lakṣmī), verses 3, 5, 7</span></div>
        <div class="fact"><span>Rhythm</span><b>14 syllables</b><span>long–short–short–short × 3, then long–long</span></div>
        <div class="fact"><span>Refrain</span><b>narasiṃha! narasiṃha!</b><span>ends every verse</span></div>
        <div class="fact"><span>On her plan</span><b>Tue · Thu</b><span>with the Śani stuti and Kāmāsikāṣṭakam</span></div>
        <div class="fact"><span>Fruit</span><b>Verse 9</b><span>removes fear of sin, grants wishes</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The shape of the hymn</h2><span class="muted" style="font-size:.85rem">Tap a block to open it</span></div>
        <div class="gems" id="gems" style="margin-top:14px"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>One rhythm all the way</h2>
          <p class="muted" style="margin:6px 0 6px">Every one of the 36 lines has the same beat. Clap on each long syllable:</p>
          <div class="beat" id="beat"></div>
          <p class="muted" style="font-size:.88rem">DUM-ta-ta-ta · DUM-ta-ta-ta · DUM-ta-ta-ta · DUM-DUM. Once your body knows this beat, the words fall into place by themselves.</p>
          <div class="refrain" id="refrain" style="margin-top:10px"></div>
        </div>
        <div class="card">
          <h2>Remember the openings</h2>
          <p class="muted" style="margin:6px 0 14px">The first sound of each verse, in order.</p>
          <div class="mn" id="openings"></div>
          <div class="tip" style="margin-top:14px"><b>A story in the order.</b> 1–3 his form and the battle · 4 his feet on my head · 5 come at my last hour · 6–7 his ornaments and eyes in my mind · 8 his names · 9 the fruit.</div>
        </div>
      </div>

      <div class="card">
        <h2>What it gives</h2>
        <p class="muted" style="margin:6px 0 12px">Verse 9: whoever always recites this octet reaches his abode, and it:</p>
        <div class="benefits" id="benefits"></div>
      </div>
</template>
<script>
