          <div class="ttl" id="heroTitle"></div>
          <h1>Kamasikashtakam</h1>
          <p class="lead" style="margin-top:8px">Eight verses to Kāmāsikā Narasiṃha of Thiruvēḷukkai, near Kanchipuram — the Lord who, by his own wish (<i>kāma</i>), chose to sit (<i>āsikā</i>) in yoga on the bank of the Vegavatī. Deśika was born at Thuppul, just next to this temple.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Composed by</span><b>Vedānta Deśika</b><span>signs as “Veṅkaṭeśa” in verse 9</span></div>
        <div class="fact"><span>Deity</span><b>Yoga Narasiṃha</b><span>Azhagiya Singar, Thiruvēḷukkai</span></div>
        <div class="fact"><span>Place</span><b>Vegavatī bank</b><span>a Divya Deśam near Kanchipuram</span></div>
        <div class="fact"><span>Metres</span><b>Six</b><span>a different rhythm almost every verse</span></div>
        <div class="fact"><span>Posture</span><b>Paryaṅka-bandha</b><span>seated yoga pose, facing west</span></div>
        <div class="fact"><span>Learning from</span><b>Arthaanubhavam</b><span>her workshop notes (PDF)</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>A new rhythm almost every verse</h2><span class="muted" style="font-size:.85rem">Tap one to hear its beat</span></div>
        <p class="muted" style="margin:6px 0 12px">Deśika changes the metre as the picture changes: calm for the yogi, racing for the lion's fury. Knowing which verse “sounds” which way is a strong memory aid.</p>
        <div class="metres" id="metres"></div>
      </div>

      <div class="grid2">

          <p class="muted" style="margin:6px 0 12px">kaṇṭha = neck. Five words in one verse chime with it:</p>
          <div class="kantha" id="kantha"></div>
          <div class="tip" style="margin-top:12px"><b>Verse 4 does it with “bandh”:</b> bandhum · bandhura · bandha. <b>Verse 2 with “tāpa”:</b> tapana · tāpān · tāpanīya.</div>
        </div>
        <div class="card">
          <h2>The heart of the hymn</h2>
          <p class="muted" style="margin:6px 0 12px">Verse 8 is often quoted on its own:</p>
          <div class="big8" id="big8"></div>
          <p style="margin-top:8px">“When you protect me, what use are other protectors? When you do not, what use are they? Sure of this, I always take refuge in you, Nṛhari, who dwell on the Vegavatī's bank.”</p>
        </div>
