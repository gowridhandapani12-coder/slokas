          <h1>Vishnu Sahasranamam</h1>
          <p class="lead" style="margin-top:8px">“The thousand names of Viṣṇu.” On the battlefield, lying on his bed of arrows, Bhīṣma is asked by Yudhiṣṭhira: <i>kim ekaṃ daivataṃ loke?</i> — “Who is the one God in the world?” His answer is this hymn: a thousand names, beginning with <i>viśvam</i>, “He who is everything”.</p>

  "तमेव|him alone|tam · eva; चार्चयन्नित्यं|and worshipping daily|ca · arcayan · nityam; भक्त्या|with devotion|bhakti; पुरुषमव्ययम्|the imperishable Person|puruṣam · avyayam",
  "ध्यायन्|meditating|dhyāyan; स्तुवन्नमस्यंश्च|praising and bowing|stuvan · namasyan · ca; यजमानस्तमेव|offering to him alone|yajamānaḥ · tam · eva; च|and|ca"],
  "— worshipping that imperishable Person daily with devotion, meditating on him, praising him, bowing to him and offering worship to him alone —",
  "— அந்த அழிவற்ற புருஷனையே தினமும் பக்தியுடன் அர்ச்சித்து, தியானித்து, துதித்து, வணங்கி, அவனையே ஆராதிப்பவன் —"),
 A("a12", "12", PQ, "Anādinidhanam", "— praising the beginningless, endless Viṣṇu, the overseer of the worlds, one crosses all sorrow.", [
  "अनादिनिधनं|without beginning or end|an · ādi · nidhana; विष्णुं|Viṣṇu|viṣṇu; सर्वलोकमहेश्वरम्|great Lord of all worlds|sarva · loka · maheśvara",
  "लोकाध्यक्षं|overseer of the worlds|loka · adhyakṣa; स्तुवन्नित्यं|praising daily|stuvan · nityam; सर्वदुःखातिगो|beyond all sorrow|sarva · duḥkha · atiga; भवेत्|becomes|bhavet"],
  "— praising daily Viṣṇu, without beginning or end, the great Lord of all worlds, the overseer of the worlds, goes beyond all sorrow.",
  "— தொடக்கமும் முடிவும் இல்லாதவனும், எல்லா உலகங்களின் மகேஸ்வரனும், உலகங்களின் கண்காணிப்பாளனுமான விஷ்ணுவைத் தினமும் துதிப்பவன் எல்லாத் துன்பங்களையும் கடப்பான்."),
 A("a13", "13", PQ, "Brahmaṇyam", "Devoted to the Veda, knower of all dharma, the great being from whom all beings come.", [
  "ब्रह्मण्यं|devoted to the Veda and its people|brahmaṇya; सर्वधर्मज्ञं|knower of all dharma|sarva · dharma · jña; लोकानां|of the worlds|loka; कीर्तिवर्धनम्|who increases the fame|kīrti · vardhana",
  "लोकनाथं|Lord of the worlds|loka · nātha; महद्भूतं|the great being|mahat · bhūta; सर्वभूतभवोद्भवम्|source of all beings' birth|sarva · bhūta · bhava · udbhava"],
  "(Praise him) — devoted to the Veda, knower of all dharma, who increases the glory of the worlds, Lord of the worlds, the great being, the source from which all beings arise.",
  "வேதத்துக்கு உகந்தவனும், எல்லா தர்மமும் அறிந்தவனும், உலகங்களின் புகழை வளர்ப்பவனும், உலக நாதனும், மகத்தான பூதமும், எல்லா உயிர்களின் தோற்றத்துக்கும் மூலமானவனும் (அவனே)."),
 A("a14", "14", PQ, "Eṣa me", "This is the highest dharma: to worship the lotus-eyed one with hymns, with devotion, always.", [
  "एष|this|eṣa; मे|in my (view)|me; सर्वधर्माणां|of all dharmas|sarva · dharma; धर्मोऽधिकतमो|the highest dharma|dharmaḥ · adhikatama; मतः|is held|mata",
  "यद्भक्त्या|that, with devotion|yat · bhakti; पुण्डरीकाक्षं|the lotus-eyed one|puṇḍarīka · akṣa; स्तवैरर्चेन्नरः|a person should worship with hymns|stavaiḥ · arcet · naraḥ; सदा|always|sadā"],
  "In my view, this is the highest of all dharmas: that a person should always worship the lotus-eyed Lord with hymns, with devotion.",
  "தாமரைக் கண்ணனைப் பக்தியுடன் துதிகளால் எப்போதும் ஆராதிப்பதே எல்லா தர்மங்களிலும் மேலான தர்மம் என்பது என் கருத்து.",
  {tip:"The answer to “which dharma is highest?”: <b>stavair arcen naraḥ sadā</b> — worship him with hymns."}),
 A("a15", "15", PQ, "Paramam yo", "He is the supreme light, the supreme tapas, the supreme Brahman, the supreme goal.", [
  "परमं|supreme|parama; यो|who|yaḥ; महत्तेजः|great light|mahat · tejas; परमं|supreme|parama; यो|who|yaḥ; महत्तपः|great tapas|mahat · tapas",
  "परमं|supreme|parama; यो|who|yaḥ; महद्ब्रह्म|great Brahman|mahat · brahman; परमं|supreme|parama; यः|who|yaḥ; परायणम्|the goal|parāyaṇa"],
  "He who is the supreme great light, the supreme great tapas, the supreme great Brahman, the supreme goal —",
  "எவன் மேலான பேரொளியோ, மேலான பெருந்தவமோ, மேலான பரப்பிரம்மமோ, மேலான புகலிடமோ —",
  {tip:"Four times <b>paramaṃ yo</b>: tejaḥ · tapaḥ · brahma · parāyaṇam."}),
 A("a16", "16", PQ, "Pavitrāṇām", "Purest of the pure, most auspicious of the auspicious, God of gods, the father of all beings.", [
  "पवित्राणां|of the pure|pavitra; पवित्रं|the purest|pavitra; यो|who|yaḥ; मङ्गलानां|of auspicious things|maṅgala; च|and|ca; मङ्गलम्|the auspicious|maṅgala",
  "दैवतं|the God|daivata; देवतानां|of gods|devatā; च|and|ca; भूतानां|of beings|bhūta; योऽव्ययः|who, imperishable|yaḥ · avyaya; पिता|the father|pitṛ"],
  "— who is the purifier of the pure, the auspiciousness of the auspicious, the God of gods, the imperishable father of all beings —",
  "— தூய்மைகளுக்கெல்லாம் தூய்மையும், மங்களங்களுக்கெல்லாம் மங்களமும், தேவர்களுக்கும் தெய்வமும், உயிர்களின் அழிவற்ற தந்தையுமானவன் —"),
 A("a17", "17", PQ, "Yataḥ sarvāṇi", "From him all beings come at the dawn of the ages; into him they go at the end.", [
  "यतः|from whom|yataḥ; सर्वाणि|all|sarva; भूतानि|beings|bhūta; भवन्त्यादियुगागमे|come forth at the coming of the first age|bhavanti · ādi · yuga · āgama",
  "यस्मिंश्च|and into whom|yasmin · ca; प्रलयं|to dissolution|pralaya; यान्ति|go|yānti; पुनरेव|again|punaḥ · eva; युगक्षये|at the end of the age|yuga · kṣaya"],
  "— from whom all beings come forth at the dawn of the first age, and into whom they go back in dissolution when the age ends —",
  "— யுகத் தொடக்கத்தில் எல்லா உயிர்களும் எவனிடமிருந்து தோன்றுகின்றனவோ, யுக முடிவில் மீண்டும் எவனிடம் ஒடுங்குகின்றனவோ —"),
 A("a18", "18", PQ, "Tasya loka", "Hear from me, O king, the thousand names of Viṣṇu, which remove sin and fear.", [
  "तस्य|of him|tasya; लोकप्रधानस्य|the chief of the worlds|loka · pradhāna; जगन्नाथस्य|the Lord of the universe|jagat · nātha; भूपते|O king|bhū · pati",
  "विष्णोर्नामसहस्रं|Viṣṇu's thousand names|viṣṇoḥ · nāma · sahasra; मे|from me|me; शृणु|hear|śṛṇu; पापभयापहम्|that remove sin and fear|pāpa · bhaya · apaha"],
  "— of him, chief of the worlds, Lord of the universe, hear from me, O king, the thousand names of Viṣṇu, which take away sin and fear.",
  "— உலகங்களின் தலைவனும், ஜகந்நாதனுமான அந்த விஷ்ணுவின், பாவத்தையும் பயத்தையும் போக்கும் ஆயிரம் நாமங்களை அரசனே, என்னிடமிருந்து கேள்."),
 A("a19", "19", PQ, "Yāni nāmāni", "The names that describe his qualities, sung by the ṛṣis — I shall tell them, for your good.", [
  "यानि|which|yāni; नामानि|names|nāma; गौणानि|describing his qualities|gauṇa; विख्यातानि|well known|vikhyāta; महात्मनः|of the Great Soul|mahātman",
  "ऋषिभिः|by the seers|ṛṣi; परिगीतानि|sung everywhere|parigīta; तानि|those|tāni; वक्ष्यामि|I shall tell|vakṣyāmi; भूतये|for (your) welfare|bhūti"],
  "Those famous names of the Great Soul which describe his qualities and are sung by the ṛṣis — I shall tell them, for your welfare.",
  "மகாத்மாவின் குணங்களைக் கூறுவனவும், புகழ்பெற்றவையும், ரிஷிகளால் பாடப்பட்டவையுமான அந்த நாமங்களை உன் நலனுக்காகச் சொல்கிறேன்.",
  {tip:"<b>gauṇāni</b> — each name is a quality (guṇa) of the Lord. That is why each name below has a meaning."}),
 A("a20", "20", PD, "Ṛṣiḥ · chandaḥ", "The seer is Vyāsa, the metre anuṣṭubh, the deity Devakī's son.", [
  "ऋषिर्नामसहस्रस्य|the seer of the thousand names|ṛṣiḥ · nāma · sahasra; वेदव्यासो|is Vedavyāsa|veda · vyāsa; महामुनिः|the great sage|mahā · muni",
  "छन्दोऽनुष्टुप्|the metre, anuṣṭubh|chandaḥ · anuṣṭubh; तथा|and|tathā; देवो|the deity|deva; भगवान्|the Lord|bhagavat; देवकीसुतः|son of Devakī|devakī · suta"],
  "The seer of the thousand names is the great sage Vedavyāsa; the metre is anuṣṭubh; the deity is the Lord, the son of Devakī.",
  "ஆயிரம் நாமங்களின் ரிஷி மாமுனிவர் வேதவியாசர்; சந்தஸ் அனுஷ்டுப்; தேவதை தேவகியின் மைந்தனான பகவான்."),
 A("a21", "21", PD, "Amṛtāṃśūdbhavaḥ", "The seed, the power, the heart — and it is used for peace.", [
  "अमृतांशूद्भवो|born of the nectar-rayed (moon)|amṛta · aṃśu · udbhava; बीजं|is the seed|bīja; शक्तिर्देवकिनन्दनः|the power is Devakī's joy|śaktiḥ · devakī · nandana",
  "त्रिसामा|Trisāmā|praised by three Sāmas; हृदयं|the heart|hṛdaya; तस्य|its|tasya; शान्त्यर्थे|for peace|śānti · artha; विनियुज्यते|it is applied|viniyujyate"],
  "Amṛtāṃśūdbhava is the seed, Devakīnandana the power, Trisāmā its heart; it is chanted for peace.",
  "அம்ருதாம்ஶூத்பவன் பீஜம், தேவகீநந்தனன் சக்தி, த்ரிஸாமா இதயம்; இது அமைதிக்காக ஜபிக்கப்படுகிறது.",
  {tip:"Seed, power and heart are all names from the hymn itself (verses 31, 106, 62)."}),
 A("a22", "22", PD, "Viṣṇuṃ jiṣṇum", "I bow to Viṣṇu, the victor, the great Viṣṇu, the slayer of demons in many forms.", [
  "विष्णुं|Viṣṇu|viṣṇu; जिष्णुं|the victorious|jiṣṇu; महाविष्णुं|the great Viṣṇu|mahā · viṣṇu; प्रभविष्णुं|the all-powerful|prabhaviṣṇu; महेश्वरम्|the great Lord|mahā · īśvara",
  "अनेकरूपदैत्यान्तं|ender of demons, in many forms|aneka · rūpa · daitya · anta; नमामि|I bow to|namāmi; पुरुषोत्तमम्|the Supreme Person|puruṣottama"],
  "I bow to the Supreme Person — Viṣṇu, the victorious, the great Viṣṇu, the all-powerful, the great Lord, who in many forms ends the demons.",
  "விஷ்ணுவை, வெற்றியாளனை, மஹாவிஷ்ணுவை, எல்லாம் வல்லவனை, மகேஸ்வரனை, பல வடிவங்களில் அசுரரை அழிப்பவனை — புருஷோத்தமனை வணங்குகிறேன்.",
  {tip:"<b>viṣṇuṃ · jiṣṇuṃ · mahāviṣṇuṃ · prabhaviṣṇuṃ</b> — four rhyming -ṣṇum."}),
 A("a23", "·", PD, "Nyāsa", "The mantra is set: ṛṣi, metre, deity, seed, power, and the names that guard each side.", [
  "अस्य|of this|asya; श्रीविष्णोर्दिव्यसहस्रनामस्तोत्रमहामन्त्रस्य|great mantra, the divine thousand-name hymn of Śrī Viṣṇu|śrī · viṣṇoḥ · divya · sahasranāma · stotra · mahāmantra",
  "श्रीवेदव्यासो|Śrī Vedavyāsa|vedavyāsa; भगवान्|the revered|bhagavat; ऋषिः|is the seer|ṛṣi; अनुष्टुप्|anuṣṭubh|anuṣṭubh; छन्दः|is the metre|chandas",
  "श्रीमहाविष्णुः|Śrī Mahāviṣṇu|mahāviṣṇu; परमात्मा|the Supreme Self|paramātman; श्रीमन्नारायणो|Śrīman Nārāyaṇa|nārāyaṇa; देवता|is the deity|devatā",
  "अमृतांशूद्भवो|“born of the moon”|amṛtāṃśūdbhava; भानुरिति|“the sun” — thus|bhānuḥ · iti; बीजम्|the seed|bīja; देवकीनन्दनः|“Devakī's joy”|devakīnandana; स्रष्टेति|“the creator” — thus|sraṣṭā · iti; शक्तिः|the power|śakti",
  "उद्भवः|“the source”|udbhava; क्षोभणो|“the stirrer”|kṣobhaṇa; देव|“the shining one”|deva; इति|thus|iti; परमो|the supreme|parama; मन्त्रः|mantra|mantra",
  "शङ्खभृन्नन्दकी|“conch-bearer, sword-holder”|śaṅkhabhṛt · nandakī; चक्रीति|“discus-holder” — thus|cakrī · iti; कीलकम्|the pin (that fixes it)|kīlaka; शार्ङ्गधन्वा|“with the Śārṅga bow”|śārṅgadhanvā; गदाधर|“mace-bearer”|gadādhara; इत्यस्त्रम्|thus the weapon|iti · astra",
  "रथाङ्गपाणिरक्षोभ्य|“wheel in hand, unshakeable”|rathāṅgapāṇiḥ · akṣobhya; इति|thus|iti; नेत्रम्|the eye|netra; त्रिसामा|“Trisāmā”|trisāmā; सामगः|“singer of Sāma”|sāmaga; सामेति|“Sāma” — thus|sāma · iti; कवचम्|the armour|kavaca",
  "आनन्दं|“bliss”|ānanda; परब्रह्मेति|“the supreme Brahman” — thus|parabrahma · iti; योनिः|the source|yoni; ऋतुः|“season”|ṛtu; सुदर्शनः|“Sudarśana”|sudarśana; काल|“time”|kāla; इति|thus|iti; दिग्बन्धः|the binding of the directions|dik · bandha",
  "श्रीविश्वरूप|“Śrī Viśvarūpa”|viśvarūpa; इति|thus|iti; ध्यानम्|the meditation|dhyāna; श्रीमहाविष्णुप्रीत्यर्थे|for the pleasure of Śrī Mahāviṣṇu|mahāviṣṇu · prīti · artha; श्रीसहस्रनामजपे|in chanting the thousand names|sahasranāma · japa; विनियोगः|is the application|viniyoga"],
  "Of this great mantra, the divine thousand-name hymn of Śrī Viṣṇu: the seer is the revered Vedavyāsa; the metre anuṣṭubh; the deity Śrī Mahāviṣṇu, the Supreme Self, Śrīman Nārāyaṇa. The seed is “amṛtāṃśūdbhavo bhānuḥ”, the power “devakīnandanaḥ sraṣṭā”, the supreme mantra “udbhavaḥ kṣobhaṇo devaḥ”; the pin “śaṅkhabhṛn nandakī cakrī”, the weapon “śārṅgadhanvā gadādharaḥ”, the eye “rathāṅgapāṇir akṣobhyaḥ”, the armour “trisāmā sāmagaḥ sāma”, the source “ānandaṃ parabrahma”, the binding of the directions “ṛtuḥ sudarśanaḥ kālaḥ”; the meditation is on the Universal Form. It is chanted for the pleasure of Śrī Mahāviṣṇu.",
  "ஸ்ரீ விஷ்ணுவின் திவ்ய ஸஹஸ்ரநாம ஸ்தோத்திர மகாமந்திரத்துக்கு: ரிஷி பகவான் வேதவியாசர்; சந்தஸ் அனுஷ்டுப்; தேவதை பரமாத்மாவான ஸ்ரீமந் நாராயணன். பீஜம், சக்தி, மந்திரம், கீலகம், அஸ்திரம், நேத்திரம், கவசம், யோனி, திக்பந்தம் — எல்லாம் ஸஹஸ்ரநாமத்தின் நாமங்களே. விஸ்வரூபத் தியானம்; ஸ்ரீ மஹாவிஷ்ணுவின் ப்ரீதிக்காக ஜபம்.",
  {meter:"prose", meterNote:PROSE, tip:"Every part of the nyāsa — seed, power, pin, weapon, eye, armour — is a line of names from the hymn itself."}),
 A("a24", "·", PD, "Kṣīrodanvat", "On the pearl-strewn shore of the milk ocean, under nectar-raining clouds — Mukunda.", [
  "क्षीरोदन्वत्प्रदेशे|on the shore of the milk ocean|kṣīra · udanvat · pradeśa; शुचिमणिविलसत्सैकते|on sands shining with bright gems|śuci · maṇi · vilasat · saikata; मौक्तिकानां|of pearls|mauktika",
  "मालाक्लृप्तासनस्थः|seated on a throne made of garlands|mālā · klṛpta · āsana · stha; स्फटिकमणिनिभैर्|crystal-like|sphaṭika · maṇi · nibha; मौक्तिकैर्मण्डिताङ्गः|his body adorned with pearls|mauktika · maṇḍita · aṅga",
  "शुभ्रैरभ्रैरदभ्रैर्|by white clouds, many|śubhra · abhra · adabhra; उपरि|above|upari; विरचितैर्|spread out|viracita; मुक्तपीयूषवर्षैः|pouring showers of nectar|mukta · pīyūṣa · varṣa",
  "आनन्दी|blissful|ānandin; नः|us|naḥ; पुनीयाद्|may (he) purify|punīyāt; अरिनलिनगदाशङ्खपाणिर्|with discus, lotus, mace and conch in hand|ari · nalina · gadā · śaṅkha · pāṇi; मुकुन्दः|Mukunda|mukunda"],
  "On the shore of the milk ocean, on sands shining with bright gems, seated on a throne of pearl garlands, his body adorned with crystal-like pearls, beneath many white clouds above pouring showers of nectar — may blissful Mukunda, holding the discus, lotus, mace and conch, purify us.",
  "பாற்கடல் கரையில், ஒளிரும் ரத்தின மணலில், முத்து மாலைகளால் அமைந்த ஆசனத்தில் அமர்ந்து, படிகம் போன்ற முத்துக்களால் அலங்கரிக்கப்பட்டு, மேலே அமுதம் பொழியும் வெண்மேகங்களின் கீழ் — சக்கரம், தாமரை, கதை, சங்கு ஏந்திய ஆனந்தமயமான முகுந்தன் நம்மைத் தூய்மைப்படுத்தட்டும்.",
  {meter:"sragdhara", pat:"GGGGLGGLLLLLLGGLGGLGx", meterNote:"Sragdharā: 21 syllables a line. Her book prints each line in two pieces.", tip:"<b>ari · nalina · gadā · śaṅkha</b> — discus, lotus, mace, conch: what he holds."}),
 A("a25", "·", PD, "Bhūḥ pādau", "Earth his feet, sky his navel, sun and moon his eyes — the whole world inside him.", [
  "भूः|the earth|bhū; पादौ|(are) the feet|pāda; यस्य|whose|yasya; नाभिर्|the navel|nābhi; वियदसुरनिलश्|the sky; the wind (his breath)|viyat · asu · anila; चन्द्रसूर्यौ|moon and sun|candra · sūrya; च|and|ca; नेत्रे|the two eyes|netra",
  "कर्णावाशाः|the ears are the directions|karṇau · āśāḥ; शिरो|the head|śiras; द्यौर्|is heaven|dyauḥ; मुखमपि|the mouth too|mukham · api; दहनो|is fire|dahana; यस्य|whose|yasya; वास्तेयमब्धिः|the bladder is the ocean|vāsteyam · abdhi",
  "अन्तःस्थं|within|antaḥstha; यस्य|whose|yasya; विश्वं|the universe|viśva; सुरनरखगगोभोगिगन्धर्वदैत्यैः|with gods, men, birds, cattle, serpents, gandharvas and demons|sura · nara · khaga · go · bhogin · gandharva · daitya",
  "चित्रं|wonderfully|citram; रंरम्यते|delights|raṃramyate; तं|him|tam; त्रिभुवनवपुषं|whose body is the three worlds|tri · bhuvana · vapus; विष्णुमीशं|Viṣṇu, the Lord|viṣṇum · īśam; नमामि|I bow to|namāmi"],
  "The earth is his feet, the sky his navel, the wind his breath, the moon and sun his eyes; the directions his ears, heaven his head, fire his mouth, the ocean within him. Inside him the universe — gods, men, birds, cattle, serpents, gandharvas and demons — delights wonderfully. I bow to Viṣṇu, the Lord, whose body is the three worlds.",
  "பூமி பாதங்கள், வானம் நாபி, காற்று மூச்சு, சந்திர சூரியர் கண்கள், திசைகள் காதுகள், சுவர்க்கம் தலை, அக்னி வாய், கடல் உடலினுள் — தேவர், மனிதர், பறவை, பசு, நாகர், கந்தர்வர், அசுரர் எல்லாரும் அவனுள்ளே வியக்கத்தக்க வகையில் இன்புறுகின்றனர். மூவுலகையும் உடலாகக் கொண்ட ஈசனான விஷ்ணுவை வணங்குகிறேன்.",
  {meter:"sragdhara", pat:"GGGGLGGLLLLLLGGLGGLGx", meterNote:"Sragdharā: 21 syllables a line.", tip:"The <b>Viśvarūpa</b> dhyānam promised in the nyāsa: picture him from the feet (earth) up to the head (heaven)."}),
 A("a26", "·", PD, "Śāntākāram", "Peaceful, lying on the serpent, lotus-naveled, cloud-dark — I bow to Viṣṇu who removes the fear of saṃsāra.", [
  "शान्ताकारं|of peaceful form|śānta · ākāra; भुजगशयनं|lying on the serpent|bhujaga · śayana; पद्मनाभं|lotus-naveled|padma · nābha; सुरेशम्|lord of the gods|sura · īśa",
  "विश्वाधारं|support of the universe|viśva · ādhāra; गगनसदृशं|like the sky|gagana · sadṛśa; मेघवर्णं|cloud-coloured|megha · varṇa; शुभाङ्गम्|of auspicious limbs|śubha · aṅga",
  "लक्ष्मीकान्तं|Lakṣmī's beloved|lakṣmī · kānta; कमलनयनं|lotus-eyed|kamala · nayana; योगिहृद्ध्यानगम्यम्|reached by meditation in yogis' hearts|yogi · hṛt · dhyāna · gamya",
  "वन्दे|I bow to|vande; विष्णुं|Viṣṇu|viṣṇu; भवभयहरं|remover of the fear of saṃsāra|bhava · bhaya · hara; सर्वलोकैकनाथम्|the one Lord of all worlds|sarva · loka · eka · nātha"],
  "I bow to Viṣṇu — peaceful in form, lying on the serpent, lotus-naveled, lord of the gods, support of the universe, vast as the sky, cloud-coloured, of auspicious limbs, Lakṣmī's beloved, lotus-eyed, reached by meditation in the hearts of yogis, remover of the fear of saṃsāra, the one Lord of all worlds.",
  "அமைதியான வடிவினனும், பாம்பணையில் பள்ளிகொண்டவனும், தாமரை நாபியனும், தேவர் தலைவனும், உலகின் ஆதாரமும், வானம் போன்றவனும், மேக நிறத்தவனும், லக்ஷ்மியின் நாயகனும், தாமரைக் கண்ணனும், யோகிகளின் இதயத் தியானத்தால் அடையப்படுபவனும், பிறவிப் பயம் போக்குபவனும், எல்லா உலகங்களுக்கும் ஒரே நாதனுமான விஷ்ணுவை வணங்குகிறேன்.",
  {meter:"mandakranta", pat:"GGGGLLLLLGGLGGLGx", meterNote:"Mandākrāntā, “slowly stepping”: 17 syllables a line — four long, five short, then the swing.", tip:"Before it her book has <b>om namo bhagavate vāsudevāya</b>."}),
 A("a27", "·", PD, "Meghaśyāmam", "Cloud-dark, in yellow silk, with Śrīvatsa and the Kaustubha — I bow to Viṣṇu.", [
  "मेघश्यामं|dark as a cloud|megha · śyāma; पीतकौशेयवासं|dressed in yellow silk|pīta · kauśeya · vāsas; श्रीवत्साङ्कं|marked with Śrīvatsa|śrīvatsa · aṅka; कौस्तुभोद्भासिताङ्गम्|his body lit by the Kaustubha gem|kaustubha · udbhāsita · aṅga",
  "पुण्योपेतं|full of goodness|puṇya · upeta; पुण्डरीकायताक्षं|with long lotus eyes|puṇḍarīka · āyata · akṣa; विष्णुं|Viṣṇu|viṣṇu; वन्दे|I bow to|vande; सर्वलोकैकनाथम्|the one Lord of all worlds|sarva · loka · eka · nātha"],
  "I bow to Viṣṇu, the one Lord of all worlds — dark as a rain cloud, dressed in yellow silk, marked with Śrīvatsa, his body lit by the Kaustubha, full of goodness, with long lotus eyes.",
  "மேகம் போல் கருத்தவனும், மஞ்சள் பட்டு உடுத்தவனும், ஸ்ரீவத்ஸ மருவுடையவனும், கௌஸ்துபத்தால் ஒளிரும் மேனியனும், புண்ணியம் நிறைந்தவனும், நீண்ட தாமரைக் கண்ணனுமான, எல்லா உலகங்களின் ஒரே நாதனான விஷ்ணுவை வணங்குகிறேன்.",
  {meter:"salini", pat:"GGGGGLGGLGx".repeat(2), meterNote:"Śālinī: 11 syllables a quarter, two to a line."}),
 A("a28", "·", PD, "Namaḥ samasta", "To the first of all beings, the bearer of the earth, of countless forms.", [
  "नमः|salutation|namaḥ; समस्तभूतानामादिभूताय|to the origin of all beings|samasta · bhūta · ādi · bhūta; भूभृते|bearer of the earth|bhū · bhṛt",
  "अनेकरूपरूपाय|of countless forms|aneka · rūpa · rūpa; विष्णवे|to Viṣṇu|viṣṇu; प्रभविष्णवे|the all-powerful|prabhaviṣṇu"],
  "Salutations to Viṣṇu, the all-powerful — the origin of all beings, bearer of the earth, of countless forms.",
  "எல்லா உயிர்களுக்கும் மூலமானவனும், பூமியைத் தாங்குபவனும், பல வடிவங்கள் கொண்டவனுமான எல்லாம் வல்ல விஷ்ணுவுக்கு நமஸ்காரம்."),
 A("a29", "·", PD, "Saśaṅkhacakram", "With conch and discus, crown and earrings, yellow robe and lotus eyes — I bow my head to Viṣṇu.", [
  "सशङ्खचक्रं|with conch and discus|sa · śaṅkha · cakra; सकिरीटकुण्डलम्|with crown and earrings|sa · kirīṭa · kuṇḍala",
  "सपीतवस्त्रं|with yellow robe|sa · pīta · vastra; सरसीरुहेक्षणम्|lotus-eyed|sarasīruha · īkṣaṇa",
  "सहारवक्षःस्थलशोभिकौस्तुभम्|with the Kaustubha shining on his garlanded chest|sa · hāra · vakṣaḥsthala · śobhi · kaustubha",
  "नमामि|I bow to|namāmi; विष्णुं|Viṣṇu|viṣṇu; शिरसा|with my head|śiras; चतुर्भुजम्|the four-armed|catur · bhuja"],
  "I bow my head to the four-armed Viṣṇu — with conch and discus, crown and earrings, yellow robe, lotus eyes, and the Kaustubha shining on his garlanded chest.",
  "சங்கு சக்கரத்துடனும், கிரீட குண்டலங்களுடனும், மஞ்சள் ஆடையுடனும், தாமரைக் கண்களுடனும், மாலையணிந்த மார்பில் ஒளிரும் கௌஸ்துபத்துடனும் விளங்கும் நான்கு கைகளுடைய விஷ்ணுவைத் தலை தாழ்த்தி வணங்குகிறேன்.",
  {meter:"vamsastha", pat:"LGLGGLLGLGLx", meterNote:"Vaṃśastha: 12 syllables a line, starting short–long.", tip:"Five <b>sa-</b> (“with”) words: saśaṅkha · sakirīṭa · sapīta · sahāra."}),
 A("a30", "·", PD, "Chāyāyām", "In the shade of the Pārijāta tree, on a golden throne, with Rukmiṇī and Satyabhāmā — I take refuge in Kṛṣṇa.", [
  "छायायां|in the shade|chāyā; पारिजातस्य|of the Pārijāta tree|pārijāta; हेमसिंहासनोपरि|upon a golden throne|hema · siṃhāsana · upari",
  "आसीनमम्बुदश्याममायताक्षमलङ्कृतम्|seated, dark as a rain cloud, long-eyed, adorned|āsīnam · ambuda · śyāmam · āyata · akṣam · alaṅkṛtam"],
  "Seated in the shade of the Pārijāta tree upon a golden throne, dark as a rain cloud, long-eyed, adorned —",
  "பாரிஜாத மரத்தின் நிழலில், பொன் சிம்மாசனத்தின் மேல் அமர்ந்தவனும், மேக நிறத்தவனும், நீண்ட கண்ணனும், அலங்கரிக்கப்பட்டவனும் —"),
 A("a31", "·", PD, "Candrānanam", "Moon-faced, four-armed, Śrīvatsa on his chest — Kṛṣṇa with Rukmiṇī and Satyabhāmā.", [
  "चन्द्राननं|moon-faced|candra · ānana; चतुर्बाहुं|four-armed|catur · bāhu; श्रीवत्साङ्कितवक्षसम्|his chest marked with Śrīvatsa|śrīvatsa · aṅkita · vakṣas",
  "रुक्मिणीसत्यभामाभ्यां|with Rukmiṇī and Satyabhāmā|rukmiṇī · satyabhāmā; सहितं|together|sahita; कृष्णमाश्रये|I take refuge in Kṛṣṇa|kṛṣṇam · āśraye"],
  "— moon-faced, four-armed, his chest marked with Śrīvatsa, together with Rukmiṇī and Satyabhāmā — in that Kṛṣṇa I take refuge.",
  "— சந்திர முகத்தவனும், நான்கு கைகளுடையவனும், ஸ்ரீவத்ஸம் பதிந்த மார்பினனும், ருக்மிணி சத்யபாமையுடன் கூடியவனுமான கிருஷ்ணனைச் சரணடைகிறேன்.",
  {tip:"Then her book says <b>nāmasahasra-prārambhaḥ</b> — the names begin, with <b>Om</b>."}),
 N(1, "He is everything; he pervades it; for him the oblation is offered — Lord of past, future and present.",
  "विश्वं|the universe itself; विष्णुर्|the all-pervader; वषट्कारो|the one for whom the oblation is offered; भूतभव्यभवत्प्रभुः|Lord of past, future and present",
  "भूतकृद्|creator of beings; भूतभृद्|sustainer of beings; भावो|pure existence; भूतात्मा|the Self of all beings; भूतभावनः|who nurtures beings",
  "பிரபஞ்சமே ஆனவன்; எங்கும் நிறைந்தவன்; வஷட்காரம்; முக்காலத்துக்கும் தலைவன்; உயிர்களைப் படைத்து, தாங்கி, வளர்ப்பவன்; எல்லா உயிர்களின் ஆத்மா.",
  {tip:"The very first name is <b>viśvam</b>. Five <b>bhūta-</b> names follow: bhūtakṛt · bhūtabhṛt · bhūtātmā · bhūtabhāvanaḥ (and bhūta-bhavya-bhavat-prabhuḥ)."}),
 N(2, "The pure Self, the Supreme Self, the highest goal of the freed.",
  "पूतात्मा|the pure Self; परमात्मा|the Supreme Self; च|and; मुक्तानां|of the liberated; परमा|the highest; गतिः|goal",
  "अव्ययः|the imperishable; पुरुषः|the Person; साक्षी|the witness; क्षेत्रज्ञो|knower of the field (body); ऽक्षर|the undecaying; एव|indeed; च|and",
  "தூய ஆத்மா; பரமாத்மா; முக்தர்களின் மேலான கதி; அழிவற்றவன்; புருஷன்; சாட்சி; க்ஷேத்ரஜ்ஞன்; அக்ஷரன்.",
  {tip:"<b>kṣetrajño 'kṣara</b>: the ’ (ऽ) shows a dropped a — say kṣetrajño-kṣara."}),
 N(3, "Yoga, leader of yogis, Lord of matter and spirit, the Man-Lion, Keśava, Puruṣottama.",
  "योगो|yoga, the means; योगविदां|of those who know yoga; नेता|the leader; प्रधानपुरुषेश्वरः|Lord of matter and spirit",
  "नारसिंहवपुः|in the form of the Man-Lion; श्रीमान्|with Śrī, glorious; केशवः|Keśava, of beautiful hair; पुरुषोत्तमः|the Supreme Person",
  "யோகம்; யோகிகளின் தலைவன்; பிரகிருதி புருஷர்களின் ஈசன்; நரசிம்ம வடிவினன்; ஸ்ரீமான்; கேசவன்; புருஷோத்தமன்.",
  {tip:"Ends <b>keśavaḥ puruṣottamaḥ</b>. Narasiṃha is the first avatāra named."}),
 N(4, "All, the destroyer, auspicious, steady — source, treasure, imperishable; the Lord.",
  "सर्वः|the all; शर्वः|who destroys (at pralaya); शिवः|the auspicious; स्थाणुर्|the steady; भूतादिर्|the origin of beings; निधिरव्ययः|the imperishable treasure",
  "सम्भवो|who is born (as avatāras); भावनो|who gives (fruit); भर्ता|the supporter; प्रभवः|the source; प्रभुरीश्वरः|the mighty Lord",
  "எல்லாமானவன்; அழிப்பவன்; மங்களன்; நிலைத்தவன்; உயிர்களின் மூலம்; அழியாச் செல்வம்; அவதரிப்பவன்; பலன் தருபவன்; தாங்குபவன்; தோற்றுவாய்; பிரபு; ஈஸ்வரன்."),
 N(5, "Self-born, giver of joy, the Āditya, lotus-eyed, of great voice; creator, ordainer, supreme.",

  "सनात्सनातनतमः|the ancient (time itself); the most ancient; कपिलः|Kapila (the tawny); कपिरव्ययः|the sun; the imperishable",
  "स्वस्तिदः|giver of good; स्वस्तिकृत्|maker of good; स्वस्ति|good itself; स्वस्तिभुक्|enjoyer of good; स्वस्तिदक्षिणः|skilled in giving good",
  "தொன்மையானவன்; மிகத் தொன்மையானவன்; கபிலன்; சூரியன்; அழிவற்றவன்; மங்களம் தருபவன்; மங்களம் செய்பவன்; மங்களமே ஆனவன்; மங்களம் அனுபவிப்பவன்; மங்களம் தருவதில் திறமையானவன்.",
  {tip:"The <b>svasti</b> chain — five names that bless."}),
 N(97, "Never fierce, with earrings, with the discus, the valiant, of mighty command — beyond words, bearing words, the cool, the night-maker.",
  "अरौद्रः|never fierce; कुण्डली|wearing earrings; चक्री|holder of the discus; विक्रम्यूर्जितशासनः|the valiant; whose command is mighty",
  "शब्दातिगः|beyond words; शब्दसहः|who bears (all Vedic) words; शिशिरः|the cool; शर्वरीकरः|maker of the night",
  "உக்கிரமற்றவன்; குண்டலம் அணிந்தவன்; சக்கரதாரி; வீரன்; வலிய ஆணையினன்; சொல்லுக்கு அப்பாற்பட்டவன்; வேதச் சொற்களைத் தாங்குபவன்; குளிர்ந்தவன்; இரவைச் செய்பவன்."),
 N(98, "Not cruel, gentle, able, generous, best of the patient — most learned, fearless, whose name is holy to hear and sing.",
  "अक्रूरः|not cruel; पेशलो|gentle, handsome; दक्षो|able; दक्षिणः|generous; क्षमिणां|of the patient; वरः|the best",
  "विद्वत्तमो|most learned; वीतभयः|fearless; पुण्यश्रवणकीर्तनः|holy to hear of and to sing of",
  "கொடுமையற்றவன்; மென்மையானவன்; திறமையாளன்; வள்ளல்; பொறுமையாளரில் சிறந்தவன்; மிகக் கற்றவன்; அச்சமற்றவன்; கேட்பதும் பாடுவதும் புண்ணியமானவன்.",
  {tip:"<b>puṇya-śravaṇa-kīrtanaḥ</b> — hearing and singing his names is itself holy. That is this hymn."}),
 N(99, "He lifts us across, destroys sin, the holy one, ender of bad dreams — slayer of foes, protector, the good, life, everywhere.",
  "उत्तारणो|who lifts across (saṃsāra); दुष्कृतिहा|destroyer of wrongdoing; पुण्यो|the holy; दुःस्वप्ननाशनः|destroyer of bad dreams",
  "वीरहा|slayer of (demon) heroes; रक्षणः|the protector; सन्तो|the good (saints); जीवनः|the life-giver; पर्यवस्थितः|present everywhere",
  "சம்சாரக் கடலைக் கடக்கச் செய்பவன்; தீவினையை அழிப்பவன்; புண்ணியன்; கெட்ட கனவுகளைப் போக்குபவன்; அசுர வீரரைக் கொன்றவன்; காப்பவன்; சாதுக்கள்; உயிர் தருபவன்; எங்கும் நிலைத்தவன்.",
  {tip:"<b>duḥsvapna-nāśanaḥ</b> — “ender of bad dreams”."}),
 N(100, "Of endless forms and endless Śrī, anger conquered, fear removed — four-square, deep-souled, the giver of every direction.",
  "अनन्तरूपो|of endless forms; ऽनन्तश्रीर्|of endless Śrī; जितमन्युर्|who has conquered anger; भयापहः|remover of fear",
  "चतुरस्रो|four-square (just); गभीरात्मा|deep-souled; विदिशो|who gives variously; व्यादिशो|who commands (all); दिशः|who points the way (the Veda)",
  "முடிவற்ற வடிவினன்; முடிவற்ற ஸ்ரீயினன்; கோபத்தை வென்றவன்; அச்சம் போக்குபவன்; நேர்மையானவன்; ஆழ்ந்த ஆத்மா; பலவாறு வழங்குபவன்; ஆணையிடுபவன்; வழிகாட்டுபவன்.",
  {tip:"Verse 100. Her book reads <b>caturasro</b>."}),
 N(101, "Beginningless, earth's support, Lakṣmī, the hero, with shining armlets — the begetter, origin of all birth, the awesome.",
  "अनादिर्|without beginning; भूर्भुवो|support of the earth; लक्ष्मीः|Lakṣmī (the beauty of the earth); सुवीरो|the great hero; रुचिराङ्गदः|with shining armlets",
  "जननो|the begetter; जनजन्मादिर्|origin of people's birth; भीमो|the awesome; भीमपराक्रमः|of awesome valour",
  "தொடக்கமற்றவன்; பூமியின் ஆதாரம்; லக்ஷ்மி; பெரும் வீரன்; ஒளிரும் தோள்வளையினன்; பிறப்பிப்பவன்; பிறப்பின் மூலம்; அஞ்சத்தக்கவன்; அஞ்சத்தக்க வீரமுடையவன்."),
 N(102, "Home of the supports, the bearer, flower-smile, ever awake — rising high, walking the good path, life-giver, Om, the worthy.",
  "आधारनिलयो|home of all supports; धाता|the bearer; पुष्पहासः|whose smile is like a blossoming flower; प्रजागरः|ever awake",
  "ऊर्ध्वगः|who is on high; सत्पथाचारः|who walks the path of the good; प्राणदः|life-giver; प्रणवः|Om; पणः|the one dealt with (the worthy)",
  "எல்லா ஆதாரங்களுக்கும் இருப்பிடம்; தாங்குபவன்; மலர் போல் புன்னகைப்பவன்; எப்போதும் விழித்திருப்பவன்; மேலே இருப்பவன்; நல்வழியில் நடப்பவன்; உயிர் தருபவன்; பிரணவம்; பணம்.",
  {tip:"<b>puṣpahāsaḥ</b> — “his smile is a flower opening”."}),
 N(103, "The measure, home of life, bearer and life of breath — the truth, the One who knows it, beyond birth, death and age.",
  "प्रमाणं|the authority; प्राणनिलयः|home of life; प्राणभृत्|sustainer of life; प्राणजीवनः|who gives life to breath",
  "तत्त्वं|the truth; तत्त्वविदेकात्मा|knower of the truth; the one Self; जन्ममृत्युजरातिगः|beyond birth, death and old age",
  "பிரமாணம்; உயிர்களின் இருப்பிடம்; உயிரைத் தாங்குபவன்; உயிருக்கு உயிர்; தத்துவம்; தத்துவம் அறிந்தவன்; ஒரே ஆத்மா; பிறப்பு, இறப்பு, மூப்பு கடந்தவன்.",
  {tip:"A <b>prāṇa</b> chain in line 1."}),
 N(104, "Bhūr-bhuvaḥ-svaḥ, the tree, the saviour, the father, the great-grandfather — the sacrifice, its Lord, its doer, its limbs, its carrier.",
  "भूर्भुवस्स्वस्तरुस्|the tree of the three worlds (bhūr, bhuvaḥ, svaḥ); तारः|the saviour; सविता|the father; प्रपितामहः|the great-grandfather",
  "यज्ञो|the sacrifice; यज्ञपतिर्|Lord of the sacrifice; यज्वा|the sacrificer; यज्ञाङ्गो|whose limbs are the sacrifice; यज्ञवाहनः|who carries the sacrifice",
  "பூர், புவஸ், ஸுவஸ் என்ற மூவுலக மரம்; கரையேற்றுபவன்; தந்தை; பாட்டனுக்குப் பாட்டன்; யாகம்; யாகத்தின் தலைவன்; யாகம் செய்பவன்; யாகத்தை அங்கமாகக் கொண்டவன்; யாகத்தைச் சுமப்பவன்.",
  {tip:"The <b>yajña</b> chain begins — twelve yajña names over 104 and 105."}),
 N(105, "Bearer, maker, owner, enjoyer, means and end of the sacrifice, its secret — food, and the eater of food.",
  "यज्ञभृद्|bearer of the sacrifice; यज्ञकृद्|maker of the sacrifice; यज्ञी|lord of the sacrifice; यज्ञभुग्|enjoyer of the sacrifice; यज्ञसाधनः|whom the sacrifice reaches",
  "यज्ञान्तकृद्|who gives the sacrifice its fruit; यज्ञगुह्यम्|the secret of the sacrifice; अन्नम्|food; अन्नाद|the eater of food; एव|indeed; च|and",
  "யாகத்தைத் தாங்குபவன்; யாகம் செய்பவன்; யாகத் தலைவன்; யாகத்தை அனுபவிப்பவன்; யாகத்தால் அடையப்படுபவன்; யாகப் பலன் தருபவன்; யாக ரகசியம்; உணவு; உணவை உண்பவன்.",
  {tip:"From the Taittirīya: <b>aham annam aham annādaḥ</b> — he is both the food and the eater."}),
 N(106, "Self-sourced, self-born, Vaikhāna, the Sāma singer — Devakī's son, the creator, Lord of the earth, destroyer of sin.",
  "आत्मयोनिः|his own source; स्वयञ्जातो|self-born; वैखानः|who dug (the earth, as Varāha); सामगायनः|the Sāma singer",
  "देवकीनन्दनः|Devakī's son, her joy; स्रष्टा|the creator; क्षितीशः|Lord of the earth; पापनाशनः|destroyer of sin",
  "தானே தன் மூலம்; தானே தோன்றியவன்; பூமியைத் தோண்டியவன் (வராகன்); சாமம் பாடுபவன்; தேவகியின் மைந்தன்; படைப்பவன்; பூமியின் ஈசன்; பாவத்தை அழிப்பவன்.",
  {tip:"<b>devakīnandanaḥ sraṣṭā</b> — the nyāsa's śakti."}),
 N(107, "Conch-bearer, sword-holder, discus-holder, Śārṅga-bowman, mace-bearer — wheel in hand, unshakeable, armed with every weapon.",
  "शङ्खभृन्|bearer of the conch (Pāñcajanya); नन्दकी|holder of the sword Nandaka; चक्री|holder of the discus (Sudarśana); शार्ङ्गधन्वा|wielder of the bow Śārṅga; गदाधरः|bearer of the mace (Kaumodakī)",
  "रथाङ्गपाणिरक्षोभ्यः|with the wheel in hand; unshakeable; सर्वप्रहरणायुधः|armed with every weapon",
  "சங்கு தாங்கியவன்; நந்தகம் என்ற வாள் உடையவன்; சக்கரதாரி; சார்ங்க வில்லாளி; கதை தாங்கியவன்; சக்கரத்தைக் கையில் கொண்டவன்; அசைக்க முடியாதவன்; எல்லா ஆயுதங்களும் உடையவன்.",
  {tip:"His five weapons: <b>conch, sword, discus, bow, mace</b> — as in her Pañcāyudha Stotram. Her book then says <b>śrī sarvapraharaṇāyudha om nama iti</b>."}),
 N(108, "With the forest garland, mace, bow, conch, discus and sword — may Śrīman Nārāyaṇa, Viṣṇu, Vāsudeva protect us.",
  "वनमाली|wearing the forest garland; गदी|with the mace; शार्ङ्गी|with the bow; शङ्खी|with the conch; चक्री|with the discus; च|and; नन्दकी|with the sword",
  "श्रीमान्नारायणो|Śrīman Nārāyaṇa; विष्णुर्|Viṣṇu; वासुदेवो|Vāsudeva; ऽभिरक्षतु|may (he) protect (us)",
  "வனமாலை, கதை, வில், சங்கு, சக்கரம், வாள் தாங்கிய ஸ்ரீமந் நாராயணனான விஷ்ணு, வாசுதேவன் நம்மைக் காக்கட்டும்.",
  {tip:"The closing prayer of the names, said twice in some homes. Her book then says <b>śrī vāsudevo 'bhirakṣatu om nama iti</b>."})
,F("f1", "1", UP, "Itīdam", "Thus the thousand divine names of the glorious Keśava have been told in full.", [
  "इतीदं|thus this|iti · idam; कीर्तनीयस्य|of him who is to be praised|kīrtanīya; केशवस्य|of Keśava|keśava; महात्मनः|the Great Soul|mahātman",
  "नाम्नां|of names|nāman; सहस्रं|the thousand|sahasra; दिव्यानामशेषेण|divine, in full|divya · aśeṣeṇa; प्रकीर्तितम्|has been told|prakīrtita"],
  "Thus the thousand divine names of the Great Soul Keśava, who is worthy of praise, have been told in full.",
  "இவ்வாறு போற்றத்தக்க மகாத்மாவான கேசவனின் தெய்வீக ஆயிரம் நாமங்கள் முழுமையாகச் சொல்லப்பட்டன."),
 F("f2", "2", UP, "Ya idam", "Whoever hears or chants it daily meets no harm, here or hereafter.", [
  "य|whoever|yaḥ; इदं|this|idam; शृणुयान्नित्यं|hears daily|śṛṇuyāt · nityam; यश्चापि|or who|yaḥ · ca · api; परिकीर्तयेत्|chants it|parikīrtayet",
  "नाशुभं|no harm|na · aśubham; प्राप्नुयात्|meets|prāpnuyāt; किञ्चित्|any|kiñcit; सोऽमुत्रेह|he, there or here|saḥ · amutra · iha; च|and|ca; मानवः|that person|mānava"],
  "Whoever hears this daily, or chants it, meets no harm at all, in this world or the next.",
  "இதைத் தினமும் கேட்பவரும், பாடுபவரும் இம்மையிலும் மறுமையிலும் எந்தத் தீங்கையும் அடைய மாட்டார்."),
 F("f3", "3", UP, "Vedāntagaḥ", "The scholar gains wisdom, the warrior victory, the merchant wealth, the worker happiness.", [
  "वेदान्तगो|master of Vedānta|vedānta · ga; ब्राह्मणः|a brāhmaṇa|brāhmaṇa; स्यात्|becomes|syāt; क्षत्रियो|a kṣatriya|kṣatriya; विजयी|victorious|vijayin; भवेत्|becomes|bhavet",
  "वैश्यो|a vaiśya|vaiśya; धनसमृद्धः|rich in wealth|dhana · samṛddha; स्याच्छूद्रः|becomes; a śūdra|syāt · śūdra; सुखमवाप्नुयात्|gains happiness|sukham · avāpnuyāt"],
  "A brāhmaṇa becomes a master of Vedānta, a kṣatriya victorious, a vaiśya rich, and a śūdra gains happiness.",
  "பிராமணன் வேதாந்த ஞானியாவான்; க்ஷத்திரியன் வெற்றியாளனாவான்; வைசியன் செல்வந்தனாவான்; சூத்திரன் இன்பம் அடைவான்."),
 F("f4", "4", UP, "Dharmārthī", "Whatever one seeks — dharma, wealth, wishes, children — one gains.", [
  "धर्मार्थी|seeker of dharma|dharma · arthin; प्राप्नुयाद्धर्मम्|gains dharma|prāpnuyāt · dharmam; अर्थार्थी|seeker of wealth|artha · arthin; चार्थमाप्नुयात्|gains wealth|ca · artham · āpnuyāt",
  "कामानवाप्नुयात्|gains his wishes|kāmān · avāpnuyāt; कामी|one with wishes|kāmin; प्रजार्थी|one who wants children|prajā · arthin; चाप्नुयात्प्रजाः|gains children|ca · āpnuyāt · prajāḥ"],
  "One who seeks dharma gains dharma; one who seeks wealth gains wealth; one with wishes gains them; one who wants children gains children.",
  "தர்மம் வேண்டுபவர் தர்மத்தையும், செல்வம் வேண்டுபவர் செல்வத்தையும், ஆசையுடையவர் ஆசைகளையும், மக்கட்பேறு வேண்டுபவர் மக்களையும் அடைவர்."),
 F("f5", "5", UP, "Bhaktimān", "Rising early, pure, with devotion and mind fixed on him, let one chant the thousand names —", [
  "भक्तिमान्|devoted|bhaktimat; यः|who|yaḥ; सदोत्थाय|always, having risen|sadā · utthāya; शुचिस्तद्गतमानसः|pure, with mind on him|śuciḥ · tat · gata · mānasa",
  "सहस्रं|the thousand|sahasra; वासुदेवस्य|of Vāsudeva|vāsudeva; नाम्नामेतत्|these names|nāmnām · etat; प्रकीर्तयेत्|chants|prakīrtayet"],
  "Whoever, devoted, rising early, pure, with mind fixed on him, chants these thousand names of Vāsudeva —",
  "பக்தியுடன், அதிகாலையில் எழுந்து, தூய்மையுடன், மனதை அவனிடம் வைத்து வாசுதேவனின் இந்த ஆயிரம் நாமங்களைப் பாடுபவர் —"),
 F("f6", "6", UP, "Yaśaḥ prāpnoti", "— gains great fame, a high place among kin, lasting wealth and the highest good.", [
  "यशः|fame|yaśas; प्राप्नोति|gains|prāpnoti; विपुलं|great|vipula; ज्ञातिप्राधान्यमेव|and first place among kin|jñāti · prādhānyam · eva; च|and|ca",
  "अचलां|unshakeable|acala; श्रियमाप्नोति|gains wealth|śriyam · āpnoti; श्रेयः|the good|śreyas; प्राप्नोत्यनुत्तमम्|gains, the highest|prāpnoti · anuttamam"],
  "— gains great fame and first place among his kin; he gains wealth that does not leave, and the highest good.",
  "— பெரும் புகழையும், உறவினரிடையே முதன்மையையும், நிலையான செல்வத்தையும், மேலான நலத்தையும் அடைவார்."),
 F("f7", "7", UP, "Na bhayam", "No fear anywhere; strength, light, health, radiance, beauty and virtue.", [
  "न|not|na; भयं|fear|bhaya; क्वचिदाप्नोति|anywhere meets|kvacit · āpnoti; वीर्यं|strength|vīrya; तेजश्च|and radiance|tejas · ca; विन्दति|finds|vindati",
  "भवत्यरोगो|becomes free of disease|bhavati · aroga; द्युतिमान्|bright|dyutimat; बलरूपगुणान्वितः|with strength, beauty and virtue|bala · rūpa · guṇa · anvita"],
  "He meets no fear anywhere; he finds strength and radiance; he becomes healthy, bright, and endowed with strength, beauty and virtue.",
  "எங்கும் அச்சம் இல்லை; வீரியமும் ஒளியும் பெறுவார்; நோயற்றவராய், ஒளியுடையவராய், வலிமை, அழகு, நற்குணம் நிறைந்தவராவார்."),
 F("f8", "8", UP, "Rogārtaḥ", "The sick are freed from illness, the bound from bonds, the frightened from fear, the troubled from trouble.", [
  "रोगार्तो|one suffering illness|roga · ārta; मुच्यते|is freed|mucyate; रोगाद्बद्धो|from illness; the bound|rogāt · baddha; मुच्येत|is freed|mucyeta; बन्धनात्|from bonds|bandhana",
  "भयान्मुच्येत|is freed from fear|bhayāt · mucyeta; भीतस्तु|the frightened|bhītaḥ · tu; मुच्येतापन्न|is freed, the one in trouble|mucyeta · āpannaḥ; आपदः|from trouble|āpad"],
  "The sick are freed from illness, the bound from bondage, the frightened from fear, and those in danger from danger.",
  "நோயுற்றவர் நோயிலிருந்தும், கட்டுண்டவர் கட்டிலிருந்தும், அஞ்சியவர் அச்சத்திலிருந்தும், ஆபத்தில் உள்ளவர் ஆபத்திலிருந்தும் விடுபடுவர்.",
  {tip:"Four <b>mucyate</b>: roga · bandhana · bhaya · āpad."}),
 F("f9", "9", UP, "Durgāṇi", "Praising Puruṣottama with the thousand names, with devotion, one quickly crosses all difficulties.", [
  "दुर्गाण्यतितरत्याशु|quickly crosses difficulties|durgāṇi · atitarati · āśu; पुरुषः|a person|puruṣa; पुरुषोत्तमम्|the Supreme Person|puruṣottama",
  "स्तुवन्नामसहस्रेण|praising with the thousand names|stuvan · nāma · sahasra; नित्यं|daily|nityam; भक्तिसमन्वितः|full of devotion|bhakti · samanvita"],
  "A person who praises Puruṣottama daily with the thousand names, full of devotion, quickly crosses all difficulties.",
  "தினமும் பக்தியுடன் ஆயிரம் நாமங்களால் புருஷோத்தமனைத் துதிப்பவர் எல்லா இன்னல்களையும் விரைவில் கடப்பார்."),
 F("f10", "10", UP, "Vāsudevāśrayaḥ", "One who rests in Vāsudeva, purified of all sin, reaches the eternal Brahman.", [
  "वासुदेवाश्रयो|who rests in Vāsudeva|vāsudeva · āśraya; मर्त्यो|a mortal|martya; वासुदेवपरायणः|devoted to Vāsudeva|vāsudeva · parāyaṇa",
  "सर्वपापविशुद्धात्मा|purified of all sin|sarva · pāpa · viśuddha · ātman; याति|goes to|yāti; ब्रह्म|Brahman|brahman; सनातनम्|the eternal|sanātana"],
  "A mortal who takes refuge in Vāsudeva and is devoted to Vāsudeva, purified of all sin, goes to the eternal Brahman.",
  "வாசுதேவனைச் சரணடைந்து, வாசுதேவனையே கதியாகக் கொண்ட மனிதர், எல்லாப் பாவங்களும் நீங்கி, நித்தியமான பிரம்மத்தை அடைவார்."),
 F("f11", "11", UP, "Na vāsudeva", "For Vāsudeva's devotees there is no misfortune, no fear of birth, death, age or illness.", [
  "न|not|na; वासुदेवभक्तानामशुभं|misfortune, for Vāsudeva's devotees|vāsudeva · bhakta · aśubha; विद्यते|is found|vidyate; क्वचित्|anywhere|kvacit",
  "जन्ममृत्युजराव्याधिभयं|fear of birth, death, age and illness|janma · mṛtyu · jarā · vyādhi · bhaya; नैवोपजायते|never arises|na · eva · upajāyate"],
  "For the devotees of Vāsudeva there is no misfortune anywhere; the fear of birth, death, old age and illness never arises.",
  "வாசுதேவ பக்தர்களுக்கு எங்கும் தீங்கு இல்லை; பிறப்பு, இறப்பு, மூப்பு, நோய் பற்றிய அச்சம் உண்டாவதே இல்லை."),
 F("f12", "12", UP, "Imaṃ stavam", "Chanting with faith, one gains joy of the self, patience, fortune, courage, memory and fame.", [
  "इमं|this|imam; स्तवमधीयानः|reciting the hymn|stavam · adhīyāna; श्रद्धाभक्तिसमन्वितः|with faith and devotion|śraddhā · bhakti · samanvita",
  "युज्येतात्मसुखक्षान्तिश्रीधृतिस्मृतिकीर्तिभिः|is joined with joy of self, patience, fortune, courage, memory and fame|yujyeta · ātma-sukha · kṣānti · śrī · dhṛti · smṛti · kīrti"],
  "One who recites this hymn with faith and devotion is blessed with joy of the self, patience, fortune, courage, memory and fame.",
  "சிரத்தையுடனும் பக்தியுடனும் இத்துதியை ஓதுபவர் ஆத்ம சுகம், பொறுமை, செல்வம், மன உறுதி, நினைவாற்றல், புகழ் ஆகியவற்றைப் பெறுவார்."),
 F("f13", "13", UP, "Na krodhaḥ", "No anger, jealousy, greed or bad thoughts arise in the devotees of Puruṣottama.", [
  "न|no|na; क्रोधो|anger|krodha; न|nor|na; च|and|ca; मात्सर्यं|jealousy|mātsarya; न|no|na; लोभो|greed|lobha; नाशुभा|no bad|na · aśubhā; मतिः|thought|mati",
  "भवन्ति|arise|bhavanti; कृतपुण्यानां|in the virtuous|kṛta · puṇya; भक्तानां|devotees|bhakta; पुरुषोत्तमे|of Puruṣottama|puruṣottama"],
  "No anger, no jealousy, no greed and no bad thought arise in the virtuous devotees of Puruṣottama.",
  "புருஷோத்தமனின் புண்ணியம் செய்த பக்தர்களிடம் கோபம், பொறாமை, பேராசை, தீய எண்ணம் எதுவும் உண்டாவதில்லை.",
  {tip:"Almost the same verse is in her Śrī Sūktam (verse 24) — there it ends <i>śrīsūktaṃ japet sadā</i>."}),
 F("f14", "14", UP, "Dyauḥ sacandrārka", "Heaven with moon, sun and stars, space, the quarters, earth and ocean — held up by Vāsudeva's power.", [
  "द्यौः|heaven|dyu; सचन्द्रार्कनक्षत्रा|with moon, sun and stars|sa · candra · arka · nakṣatra; खं|space|kha; दिशो|the directions|diś; भूर्महोदधिः|earth, the great ocean|bhūḥ · mahā · udadhi",
  "वासुदेवस्य|of Vāsudeva|vāsudeva; वीर्येण|by the power|vīrya; विधृतानि|are held up|vidhṛta; महात्मनः|the Great Soul|mahātman"],
  "Heaven with the moon, sun and stars, space, the directions, the earth and the great ocean are held up by the power of the Great Soul Vāsudeva.",
  "சந்திர சூரிய நட்சத்திரங்களுடன் கூடிய வானம், ஆகாயம், திசைகள், பூமி, பெருங்கடல் — இவை அனைத்தும் மகாத்மாவான வாசுதேவனின் வலிமையால் தாங்கப்படுகின்றன."),
 F("f15", "15", UP, "Sasurāsura", "The whole moving and unmoving world, gods, demons and all, stands under Kṛṣṇa's control.", [
  "ससुरासुरगन्धर्वं|with gods, demons and gandharvas|sa · sura · asura · gandharva; सयक्षोरगराक्षसम्|with yakṣas, serpents and rākṣasas|sa · yakṣa · uraga · rākṣasa",
  "जगद्वशे|the world, under control|jagat · vaśe; वर्ततेदं|this stands|vartate · idam; कृष्णस्य|of Kṛṣṇa|kṛṣṇa; सचराचरम्|with moving and unmoving|sa · cara · acara"],
  "This world, with gods, demons and gandharvas, yakṣas, serpents and rākṣasas, all that moves and does not move, stands under Kṛṣṇa's control.",
  "தேவர், அசுரர், கந்தர்வர், யக்ஷர், நாகர், ராக்ஷஸர், அசைவன, அசையாதன அனைத்தும் கொண்ட இவ்வுலகம் கிருஷ்ணனின் ஆட்சியில் இருக்கிறது."),
 F("f16", "16", UP, "Indriyāṇi", "Senses, mind, intellect, strength, courage — and the body and its knower — are all Vāsudeva.", [
  "इन्द्रियाणि|the senses|indriya; मनो|the mind|manas; बुद्धिः|intellect|buddhi; सत्त्वं|sattva|sattva; तेजो|radiance|tejas; बलं|strength|bala; धृतिः|courage|dhṛti",
  "वासुदेवात्मकान्याहुः|they say are of Vāsudeva's nature|vāsudeva · ātmaka · āhuḥ; क्षेत्रं|the field (body)|kṣetra; क्षेत्रज्ञ|its knower|kṣetrajña; एव|indeed|eva; च|and|ca"],
  "The senses, mind, intellect, sattva, radiance, strength and courage, the body and the knower of the body — all, they say, are of the nature of Vāsudeva.",
  "புலன்கள், மனம், புத்தி, சத்துவம், ஒளி, பலம், மன உறுதி, உடல், உடலை அறிபவன் — இவை அனைத்தும் வாசுதேவ மயமானவை என்பர்."),
 F("f17", "17", UP, "Sarvāgamānām", "Right conduct comes first in all scriptures; dharma rests on conduct, and the Lord of dharma is Acyuta.", [
  "सर्वागमानामाचारः|in all scriptures, conduct|sarva · āgama · ācāra; प्रथमं|first|prathama; परिकल्पितः|is set|parikalpita",
  "आचारप्रथमो|with conduct first|ācāra · prathama; धर्मो|is dharma|dharma; धर्मस्य|of dharma|dharma; प्रभुरच्युतः|the Lord is Acyuta|prabhuḥ · acyuta"],
  "In all scriptures right conduct is placed first; dharma begins with conduct, and the Lord of dharma is Acyuta.",
  "எல்லா ஆகமங்களிலும் ஒழுக்கமே முதலாக வகுக்கப்பட்டுள்ளது; ஒழுக்கமே தர்மத்தின் தொடக்கம்; தர்மத்தின் தலைவன் அச்யுதன்."),
 F("f18", "18", UP, "Ṛṣayaḥ", "Seers, ancestors, gods, the elements — the whole moving and unmoving world comes from Nārāyaṇa.", [
  "ऋषयः|the seers|ṛṣi; पितरो|ancestors|pitṛ; देवा|gods|deva; महाभूतानि|the great elements|mahā · bhūta; धातवः|the body's elements|dhātu",
  "जङ्गमाजङ्गमं|moving and unmoving|jaṅgama · ajaṅgama; चेदं|and this|ca · idam; जगन्नारायणोद्भवम्|the world, born of Nārāyaṇa|jagat · nārāyaṇa · udbhava"],
  "The seers, ancestors, gods, the great elements, the elements of the body, and this whole moving and unmoving world are born of Nārāyaṇa.",
  "ரிஷிகள், பித்ருக்கள், தேவர்கள், பஞ்சபூதங்கள், உடல் தாதுக்கள், அசைவதும் அசையாததுமான இவ்வுலகம் — எல்லாம் நாராயணனிடமிருந்து தோன்றியவை."),
 F("f19", "19", UP, "Yogajñānam", "Yoga, knowledge, Sāṅkhya, the arts and crafts, the Vedas and sciences — all come from Janārdana.", [
  "योगज्ञानं|yoga and knowledge|yoga · jñāna; तथा|and|tathā; साङ्ख्यं|Sāṅkhya|sāṅkhya; विद्याः|the learnings|vidyā; शिल्पादि|crafts and so on|śilpa · ādi; कर्म|work|karman; च|and|ca",
  "वेदाः|the Vedas|veda; शास्त्राणि|the śāstras|śāstra; विज्ञानमेतत्|knowledge, all this|vijñānam · etat; सर्वं|all|sarva; जनार्दनात्|from Janārdana|janārdana"],
  "Yoga and knowledge, Sāṅkhya, the learnings, crafts and works, the Vedas, the śāstras and all knowledge — all this comes from Janārdana.",
  "யோகம், ஞானம், சாங்கியம், கலைகள், சிற்பம் முதலிய தொழில்கள், வேதங்கள், சாஸ்திரங்கள், அறிவியல் — இவை எல்லாம் ஜனார்த்தனனிடமிருந்தே."),
 F("f20", "20", UP, "Eko viṣṇuḥ", "The one Viṣṇu, the great being, becomes many beings, pervades the three worlds and enjoys them.", [
  "एको|the one|eka; विष्णुर्महद्भूतं|Viṣṇu, the great being|viṣṇuḥ · mahat · bhūta; पृथग्भूतान्यनेकशः|many separate beings|pṛthak · bhūtāni · anekaśaḥ",
  "त्रींल्लोकान्व्याप्य|pervading the three worlds|trīn · lokān · vyāpya; भूतात्मा|the Self of beings|bhūta · ātman; भुङ्क्ते|enjoys|bhuṅkte; विश्वभुगव्ययः|enjoyer of all, imperishable|viśva · bhuk · avyaya"],
  "The one Viṣṇu, the great being, appears as many separate beings; pervading the three worlds, the Self of all beings, the imperishable enjoyer of all, enjoys them.",
  "ஒரே விஷ்ணுவே மகத்தான பூதம்; பல்வேறு உயிர்களாகத் தோன்றி, மூவுலகையும் வியாபித்து, உயிர்களின் ஆத்மாவாக, அழிவற்றவனாக எல்லாவற்றையும் அனுபவிக்கிறான்."),
 F("f21", "21", UP, "Imaṃ stavam", "Whoever wants the highest good and happiness should read this hymn of Viṣṇu, sung by Vyāsa.", [
  "इमं|this|imam; स्तवं|hymn|stava; भगवतो|of the Lord|bhagavat; विष्णोर्व्यासेन|of Viṣṇu, by Vyāsa|viṣṇoḥ · vyāsena; कीर्तितम्|sung|kīrtita",
  "पठेद्य|should read, whoever|paṭhet · yaḥ; इच्छेत्|wishes|icchet; पुरुषः|a person|puruṣa; श्रेयः|the highest good|śreyas; प्राप्तुं|to attain|prāptum; सुखानि|happiness|sukha; च|and|ca"],
  "Whoever wishes to attain the highest good and happiness should read this hymn of the Lord Viṣṇu, sung by Vyāsa.",
  "மேலான நலத்தையும் இன்பங்களையும் அடைய விரும்புபவர் வியாசர் பாடிய பகவான் விஷ்ணுவின் இந்தத் துதியைப் படிக்க வேண்டும்."),
 F("f22", "22", UP, "Viśveśvaram", "Those who worship the lotus-eyed Lord of the universe never meet defeat.", [
  "विश्वेश्वरमजं|Lord of the universe, the unborn|viśva · īśvaram · ajam; देवं|God|deva; जगतः|of the world|jagat; प्रभवाप्ययम्|its origin and end|prabhava · apyaya",
  "भजन्ति|worship|bhajanti; ये|who|ye; पुष्कराक्षं|the lotus-eyed|puṣkara · akṣa; न|not|na; ते|they|te; यान्ति|meet|yānti; पराभवम्|defeat|parābhava"],
  "Those who worship the lotus-eyed God, the unborn Lord of the universe, the origin and end of the world, never meet defeat.",
  "உலகின் ஈசனும், பிறப்பற்றவனும், உலகத்தின் தோற்றமும் ஒடுக்கமுமான தாமரைக் கண்ண தேவனை வழிபடுபவர்கள் ஒருபோதும் தோல்வி அடைய மாட்டார்கள்.",
