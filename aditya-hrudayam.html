<template id="overview">
      <div class="hero">
        <div>
          <p class="eyebrow">Vālmīki Rāmāyaṇa · Yuddha Kāṇḍa, sarga 105 · Sanskrit · dhyānam + 31 verses</p>
          <div class="ttl" id="heroTitle"></div>
          <h1>Aditya Hrudayam</h1>
          <p class="lead" style="margin-top:8px">“The heart of the Sun.” Rāma stands exhausted on the battlefield, Rāvaṇa in front of him. The sage Agastya appears and teaches him this hymn to the Sun. Rāma chants it three times, and goes on to win.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Taught by</span><b>Sage Agastya</b><span>to Śrī Rāma</span></div>
        <div class="fact"><span>Deity</span><b>Sūrya · Āditya</b><span>the Sun, son of Aditi</span></div>
        <div class="fact"><span>Metre</span><b>Anuṣṭubh</b><span>last verse: Puṣpitāgrā</span></div>
        <div class="fact"><span>Title</span><b>Āditya + hṛdaya</b><span>the Sun + heart</span></div>
        <div class="fact"><span>How often</span><b>Three times</b><span>“etat triguṇitaṃ japtvā” — verse 26</span></div>
        <div class="fact"><span>Best time</span><b>Facing the rising Sun</b><span>verse 6 · “samudyantam”</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The story in eight steps</h2><span class="muted" style="font-size:.85rem">Tap a step to open its verses</span></div>
        <p class="muted" style="margin-top:6px">Only the middle (verses 6–24) is the hymn itself. Around it is the story of how Rāma received it. Bar length = number of verses.</p>
        <div class="story" id="story" style="margin-top:14px"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>The salutation verses</h2>
          <p class="muted" style="margin:6px 0 12px">Verses 16–21 are a chain of <b>namaḥ</b> — “salutations to…”. Almost every name ends in <b>-āya</b> or <b>-e</b>, meaning “to the one who…”.</p>
          <div class="refrain" id="namah" style="font-family:var(--f-verse);font-size:1.25rem;color:var(--terra-ink);line-height:1.7"></div>
          <div class="tip" style="margin-top:12px"><b>Tip.</b> Learn 16–21 as one block. Clap on every <i>namo namaḥ</i>.</div>
        </div>
        <div class="card">
          <h2>All the gods are the Sun</h2>
          <p class="muted" style="margin:6px 0 12px">Verses 8–9 say the Sun <i>is</i> every god. Read them as a list:</p>
          <div class="benefits" id="gods"></div>
        </div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The Sun, as the hymn describes him</h2><span class="muted" style="font-size:.85rem">Tap one to see the word in its verse</span></div>
        <div class="icons" id="icons" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <h2>What Agastya promises</h2>
        <p class="muted" style="margin:6px 0 12px">Verses 4–5 and 25–26: whoever chants it, in any trouble, will not sink.</p>
        <div class="benefits" id="benefits"></div>
      </div>
