          <h1>Sudarshana Kavacham</h1>
          <p class="lead" style="margin-top:8px">“The armour of Sudarśana.” A sage asks Nārada for the sacred kavacam; Nārada teaches it. Each part of the body is placed under a name of Sudarśana — head, forehead, nose, eyes, down to the feet — and the last verses tell what this armour does: it drives away evil spirits, heals illness, and fulfils every wish.</p>
