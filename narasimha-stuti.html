      <div class="hero">

          <div class="ttl" id="heroTitle"></div>
          <h1>Narasimha Stuti</h1>
          <p class="lead" style="margin-top:8px">The hymn Śani — Saturn himself — sang to Lord Nṛsiṃha. Eight verses each end with the same prayer, <i>sa tvaṃ nṛsiṃha mayi dehi kṛpāvalokam</i>, “O Nṛsiṃha, turn your merciful glance on me.” Pleased, Nṛsiṃha gives a boon to everyone who recites it.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>

      <div class="facts">
        <div class="fact"><span>Composed by</span><b>Śani</b><span>Śanaiścara, the planet Saturn</span></div>
        <div class="fact"><span>Deity</span><b>Śrī Nṛsiṃha</b><span>the man-lion form of Viṣṇu</span></div>
        <div class="fact"><span>Metres</span><b>Three</b><span>anuṣṭubh · upajāti · vasantatilakā</span></div>
        <div class="fact"><span>Told by</span><b>Śrī Kṛṣṇa</b><span>in the closing verse</span></div>
        <div class="fact"><span>Best day</span><b>Saturday</b><span>Śani's own day — verse 13</span></div>
        <div class="fact"><span>On her plan</span><b>Tue · Thu</b><span>Narasimha days</span></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>The shape of the hymn</h2><span class="muted" style="font-size:.85rem">Tap a block to open it</span></div>
        <div class="gems" id="gems" style="margin-top:14px"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>One prayer, eight times</h2>
          <p class="muted" style="margin:6px 0 12px">Verses 3–10 all end with this line. Learn it first; then each verse has only three new lines.</p>
          <div class="refrain" id="refrain"></div>
          <p style="margin-top:6px">“O Nṛsiṃha, you who are all this — give me your merciful glance.”</p>
        </div>
        <div class="card">
          <h2>A conversation</h2>
          <p class="muted" style="margin:6px 0 12px">The hymn is a dialogue. Knowing who speaks makes the order easy:</p>
          <div class="ladder" id="speakers"></div>
        </div>
      </div>

      <div class="card">
        <h2>The boon about Śani</h2>
        <p class="muted" style="margin:6px 0 12px">In verse 16 Nṛsiṃha tells Śani: whoever recites or hears this hymn need not fear you when you stand in the 12th, 8th or 1st house of their birth chart — the times known in Tamil as:</p>
        <div class="houses">
          <div class="house"><b>12</b><span>dvādaśa</span><div class="ta">ஏழரைச் சனி</div><span>the start of “seven and a half years”</span></div>
          <div class="house"><b>8</b><span>aṣṭama</span><div class="ta">அஷ்டமச் சனி</div><span>Saturn in the 8th</span></div>
          <div class="house"><b>1</b><span>janma</span><div class="ta">ஜென்மச் சனி</div><span>Saturn over the birth moon</span></div>
        </div>
        <div class="benefits" id="benefits" style="margin-top:14px"></div>
