          <h1>Shodashayudha Stotram</h1>
          <p class="lead" style="margin-top:8px">“Hymn to the sixteen weapons.” Sudarśana, the Lord's discus, is shown with sixteen arms, each holding a weapon. Deśika gives one verse to each weapon — discus, axe, spear, rod, goad, fire, sword, śakti, conch, bow, noose, plough, thunderbolt, mace, pestle and trident — and asks each to protect us, often from an inner enemy.</p>
        </div>

  "By that plough, through which the Lord's play as the ploughman of the field of the universe is shown, may there be victory for you at the front of battle.",
  "எதனால் பகவான் உலகம் எனும் வயலை உழும் விவசாயியாக விளையாடுவது வெளிப்படுகிறதோ, அந்தக் கலப்பையால் உங்களுக்குப் போர் முன்னணியில் வெற்றி கிடைக்கட்டும்.",
  {tip:"A pun: <b>sīra</b> (plough) — <b>nāsīra</b> (vanguard of an army)."}),
 v(14, "The weapons", "The Thunderbolt — “among weapons I am the vajra” — not born of Dadhīci's bones — may it protect you.",
  "आयुधानामहं|among weapons I am|āyudhānām · aham; वज्रमित्यगीयत|the vajra — thus it was sung|vajram · iti · agīyata; यः|which; स|that; वः|you",
  "अव्याद्धेतीशवज्रोऽसौ|may this thunderbolt of the lord of weapons protect|avyāt · hetīśa · vajraḥ · asau; अदधीच्यस्थिसम्भवः|not born of Dadhīci's bones",
  "May this thunderbolt of the lord of weapons — of which (Kṛṣṇa) sang “Among weapons I am the vajra”, and which was not born of Dadhīci's bones (like Indra's) — protect you.",
  "‘ஆயுதங்களில் நான் வஜ்ரம்’ என்று (கீதையில்) பாடப்பட்ட, ததீசியின் எலும்பில் பிறவாத, ஆயுதேசனின் அந்த வஜ்ரம் உங்களைக் காக்கட்டும்.",
  {tip:"Quoting the Gītā 10.28: <b>āyudhānām ahaṃ vajram</b>."}),
 v(15, "The weapons", "The Mace, the power of dissolution, famed as intellect — may it calm your diseases.",

  "May that mace of Sudarśana — the power of dissolving the universe, famed as being in the form of intellect — be for you the calmer of disease.",
  "உலகை லயிக்கச் செய்யும் சக்தியும், புத்தி வடிவினதாகப் புகழ்பெற்றதுமான சுதர்சனனின் கதை உங்களுக்கு நோயைத் தணிப்பதாகட்டும்.",
  {tip:"A pun: <b>gadā</b> (mace) — <b>gada</b> (disease)."}),
 v(16, "The weapons", "The Pestle, by which even the pestle-weapon is ground to dust — may it shatter your pestle of delusion.",

  "By that pestle of the lord of weapons, by which even (an enemy's) pestle is ground to fine dust — may the pestle-like club of your delusion be quickly shattered.",
  "எதனால் (பகைவரின்) உலக்கையும் நுண்ணிய தூளாகிறதோ, ஆயுதேசனின் அந்த முசலத்தால் உங்கள் மோகம் எனும் உலக்கை விரைவில் உடைபடட்டும்."),
 v(17, "The weapons", "The Trident, by whose mantra seen by Śiva enemies are speared — may it free you from pain.",
