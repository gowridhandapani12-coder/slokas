          <h1>Laghu Rama Raksha</h1>
          <p class="lead" style="margin-top:8px">“The short armour of Rāma.” Śiva tells how to wrap yourself in Rāma's names: one name guards the heart, another the throat, another the eyes — head to foot. Then he says who taught it to whom, and what it gives.</p>
        </div>
