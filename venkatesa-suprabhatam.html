          <div class="ttl" id="heroTitle"></div>
          <h1>Venkatesa Suprabhatam</h1>
          <p class="lead" style="margin-top:8px">The dawn song of Tirumala. It begins with Viśvāmitra waking young Rāma — <i>kausalyā supraja rāma</i> — then wakes Lord Veṅkaṭeśa as sages, gods, birds and bees gather at dawn. The Stotram praises him; the Maṅgalāśāsanam wishes him every blessing.</p>

   SA],
  "As the women churn the fine curd in the cowherd homes, the loud churning pots seem to quarrel angrily with the directions, filling them with sound. Good morning to you, Lord of the Śeṣa hill.",
  "ஆயர் இல்லங்களில் பெண்கள் தயிர் கடைய, அந்தப் பானைகளின் உரத்த ஒலி திசைகளுடன் கோபித்துச் சண்டையிடுவது போல் எங்கும் நிறைகிறது. சேஷாத்ரி சிகரத்தின் இறைவா, உனக்குச் சுப்ரபாதம்.",
  {tip:"A sound picture: <b>yoṣā</b> · <b>ghoṣa</b> · <b>ghoṣāḥ</b> · <b>roṣāt</b> — the -oṣa rhyme is the churning."}),
 v("s12", "12", "Bees on the lotuses hum loudly as if beating drums to outshine the blue lily.", [
   [["पद्मेशमित्रशतपत्रगतालिवर्गाः","the bees on the hundred-petalled lotuses, friends of the sun","padmeśa = sun · mitra · śatapatra = lotus · gata · ali-varga = swarms of bees"]],
   [["हर्तुं","to steal","hartum"],["श्रियं","the beauty","śrī"],["कुवलयस्य","of the blue lily","kuvalaya"],["निजाङ्गलक्ष्म्या","with their own bodies' beauty","nija · aṅga · lakṣmī"]],
   [["भेरीनिनादमिव","like the sound of drums","bherī · nināda · iva"],["बिभ्रति","make","bibhrati"],["तीव्रनादं","a loud sound","tīvra · nāda"]],
   SA],
  "The swarms of bees on the lotuses, friends of the sun, hum loudly like beating drums, as if to steal the blue lily's beauty with the beauty of their own dark bodies. Good morning to you, Lord of the Śeṣa hill.",
  "சூரியனின் நண்பனான தாமரைகளில் இருக்கும் வண்டுக் கூட்டங்கள், தம் கரிய உடல் அழகால் நீலோத்பலத்தின் அழகைக் கவரப் போவது போல் பேரிகை முழக்கம் போல் உரத்து ரீங்காரம் செய்கின்றன. சேஷாத்ரி சிகரத்தின் இறைவா, உனக்குச் சுப்ரபாதம்."),
 v("s13", "13", "O Śrīnivāsa, granter of all wishes, friend of all worlds — good morning.", [
   [["श्रीमन्नभीष्टवरदाखिललोकबन्धो","O glorious one, granter of wishes, friend of all the worlds","śrīman · abhīṣṭa · varada · akhila · loka · bandhu"]],
   [["श्रीश्रीनिवास","O Śrī Śrīnivāsa","śrīnivāsa = abode of Śrī"],["जगदेकदयैकसिन्धो","O one ocean of compassion for the world","jagat · eka · dayā · sindhu"]],
   [["श्रीदेवतागृहभुजान्तरदिव्यमूर्ते","O divine one whose chest is Lakṣmī's home","śrī-devatā · gṛha · bhuja-antara = chest · divya · mūrti"]],
   VA],
  "O glorious one, granter of every wish, friend of all the worlds; O Śrīnivāsa, the one ocean of compassion for the world; O divine one, whose chest is Lakṣmī's home — O Lord of the Veṅkaṭa hill, good morning to you.",
  "விரும்பியதை அருள்பவனே, உலகனைத்தின் நண்பனே, ஸ்ரீநிவாசா, உலகின் ஒரே கருணைக் கடலே, லக்ஷ்மி வசிக்கும் மார்பை உடைய திவ்ய மூர்த்தியே — வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"From here to verse 24 (and 27–28) every verse ends <b>śrī-veṅkaṭācalapate tava suprabhātam</b>."}),
 v("s14", "14", "Śiva, Brahmā and Sanandana, purified in the temple tank, wait at your door.", [
   [["श्रीस्वामिपुष्करिणिकाप्लवनिर्मलाङ्गाः","their bodies pure from bathing in the Svāmi Puṣkariṇī","svāmi-puṣkariṇī = the temple tank · plava = bathing · nirmala · aṅga"]],
   [["श्रेयोऽर्थिनो","seeking the highest good","śreyas · arthin"],["हरविरिञ्चिसनन्दनाद्याः","Śiva, Brahmā, Sanandana and others","hara · viriñci · sanandana · ādya"]],
   [["द्वारे","at your door","dvāra"],["वसन्ति","wait","vasanti"],["वरवेत्रहतोत्तमाङ्गाः","their heads struck by the guards' fine canes","vara · vetra = cane · hata · uttamāṅga = head"]],
   VA],
  "Śiva, Brahmā, Sanandana and others, seeking the highest good, their bodies pure from bathing in the Svāmi Puṣkariṇī, wait at your door, their heads tapped by the door-keepers' canes. O Lord of the Veṅkaṭa hill, good morning to you.",
  "சுவாமி புஷ்கரிணியில் நீராடித் தூய்மையடைந்த சிவன், பிரம்மா, சனந்தனர் முதலியோர் நன்மையை நாடி உன் வாயிலில் காத்திருக்கின்றனர்; காவலர்களின் பிரம்புகளால் அவர்கள் தலைகள் தட்டப்படுகின்றன. வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்."),
 v("s15", "15", "People always speak the names of your hills — Śeṣa, Garuḍa, Veṅkaṭa, Nārāyaṇa, Vṛṣabha, Vṛṣa.", [
   [["श्रीशेषशैलगरुडाचलवेङ्कटाद्रि","Śeṣa hill, Garuḍa hill, Veṅkaṭa hill","śeṣa-śaila · garuḍa-acala · veṅkaṭa-adri"]],
   [["नारायणाद्रिवृषभाद्रिवृषाद्रिमुख्याम्","Nārāyaṇa hill, Vṛṣabha hill, Vṛṣa hill and the rest","nārāyaṇa · vṛṣabha · vṛṣa · adri · mukhya"]],
   [["आख्यां","the names","ākhyā"],["त्वदीयवसतेरनिशं","of your dwelling, always","tvadīya · vasati · aniśam"],["वदन्ति","they speak","vadanti"]],
   VA],
  "People always speak the names of your dwelling: Śeṣa hill, Garuḍa hill, Veṅkaṭa hill, Nārāyaṇa hill, Vṛṣabha hill, Vṛṣa hill and others. O Lord of the Veṅkaṭa hill, good morning to you.",
  "சேஷமலை, கருடமலை, வேங்கடமலை, நாராயணமலை, விருஷபமலை, விருஷமலை என்று உன் இருப்பிடத்தின் பெயர்களை மக்கள் எப்போதும் சொல்கிறார்கள். வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"The <b>Seven Hills</b> (six named here): Śeṣa · Garuḍa · Veṅkaṭa · Nārāyaṇa · Vṛṣabha · Vṛṣa."}),
 v("s16", "16", "Śiva, Indra, Agni, Yama, Nirṛti, Varuṇa, Vāyu, Kubera stand with folded hands.", [
   [["सेवापराः","eager to serve","sevā · para"],["शिवसुरेशकृशानुधर्म","Śiva, Indra, Agni, Yama","śiva · sura-īśa · kṛśānu = fire · dharma = Yama"]],
   [["रक्षोम्बुनाथपवमानधनाधिनाथाः","Nirṛti, Varuṇa, Vāyu and Kubera","rakṣas = Nirṛti · ambu-nātha = Varuṇa · pavamāna = Vāyu · dhana-adhinātha = Kubera"]],
   [["बद्धाञ्जलिप्रविलसन्निजशीर्षदेशाः","their folded hands shining above their heads","baddha · añjali · pravilasat · nija · śīrṣa-deśa"]],
   VA],
  "Eager to serve, Śiva, Indra, Agni, Yama, Nirṛti, Varuṇa, Vāyu and Kubera stand with folded hands raised above their heads. O Lord of the Veṅkaṭa hill, good morning to you.",
  "சேவை செய்ய ஆர்வமுடன் சிவன், இந்திரன், அக்னி, யமன், நிருதி, வருணன், வாயு, குபேரன் ஆகியோர் தலைக்கு மேல் கூப்பிய கைகளுடன் நிற்கின்றனர். வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"The <b>guardians of the eight directions</b> (with Śiva for the northeast)."}),
 v("s17", "17", "Garuḍa, the lion, Śeṣa, the elephant and the horse ask to carry you in procession.", [
   [["धाटीषु","in your processions","dhāṭī = procession"],["ते","your","te"],["विहगराजमृगाधिराज","the king of birds (Garuḍa), the king of beasts (lion)","vihaga-rāja · mṛga-adhirāja"]],
   [["नागाधिराजगजराजहयाधिराजाः","the king of serpents, of elephants and of horses","nāga · gaja · haya · adhirāja"]],
   [["स्वस्वाधिकारमहिमाधिकमर्थयन्ते","each asks for a greater share of the honour","sva-sva · adhikāra = duty · mahimā · adhikam · arthayante"]],
   VA],
  "Garuḍa, the lion, Śeṣa, the royal elephant and the royal horse — the vāhanas of your processions — each ask to be given a greater share of the honour. O Lord of the Veṅkaṭa hill, good morning to you.",
  "உன் ஊர்வலங்களில் உன்னைச் சுமக்கும் கருடன், சிங்கம், சேஷன், யானை, குதிரை ஆகிய வாகனங்கள் ஒவ்வொன்றும் தமக்குப் பெரிய பங்கை வேண்டுகின்றன. வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"The <b>vāhanas</b>: Garuḍa · Siṃha · Śeṣa · Gaja · Aśva — the ones you see at Brahmotsavam."}),
 v("s18", "18", "The nine planets are the servants of your servants' servants.", [
   [["सूर्येन्दुभौमबुधवाक्पतिकाव्यसौरि","the Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn","sūrya · indu · bhauma · budha · vākpati = Jupiter · kāvya = Venus · sauri = Saturn"]],
   [["स्वर्भानुकेतुदिविषत्परिषत्प्रधानाः","Rāhu and Ketu, chiefs of the heavenly assembly","svarbhānu = Rāhu · ketu · diviṣat = gods · pariṣat · pradhāna"]],
   [["त्वद्दासदासचरमावधिदासदासाः","the servants of the last of your servants' servants","tvat · dāsa · dāsa · carama-avadhi = the very last · dāsa · dāsa"]],
   VA],
  "The Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Rāhu and Ketu, chiefs of the heavenly assembly, are the servants of the very last of your servants' servants. O Lord of the Veṅkaṭa hill, good morning to you.",
  "சூரியன், சந்திரன், செவ்வாய், புதன், குரு, சுக்கிரன், சனி, ராகு, கேது ஆகிய நவகிரகங்கள் உன் அடியார்களின் அடியார்களுக்கும் கடைசியான அடியார்களின் அடியார்கள். வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"The <b>nine planets</b> in order: sūrya · indu · bhauma · budha · vākpati · kāvya · sauri · svarbhānu · ketu."}),
 v("s19", "19", "Those whose heads carry the dust of your feet want neither heaven nor liberation.", [
   [["त्वत्पादधूलिभरितस्फुरितोत्तमाङ्गाः","their heads shining, covered with the dust of your feet","tvat · pāda · dhūli · bharita · sphurita · uttamāṅga"]],
   [["स्वर्गापवर्गनिरपेक्षनिजान्तरङ्गाः","their hearts not wanting heaven or liberation","svarga · apavarga = liberation · nirapekṣa · nija · antaraṅga"]],
   [["कल्पागमाकलनयाकुलतां","worry at the thought of the aeon's end","kalpa · āgama · ākalana · ākulatā"],["लभन्ते","they feel","labhante"]],
   VA],
  "Those whose heads shine, covered in the dust of your feet, whose hearts want neither heaven nor liberation, feel anxious only at the thought of the end of the aeon (which would end their service). O Lord of the Veṅkaṭa hill, good morning to you.",
  "உன் பாதத் தூசியால் தலை ஒளிர்பவர்கள், சுவர்க்கத்தையோ மோக்ஷத்தையோ விரும்பாதவர்கள், கல்பத்தின் முடிவை நினைத்து மட்டுமே கவலைப்படுகிறார்கள். வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்."),
 v("s20", "20", "Seeing your temple tower, people long for heaven and freedom — and also to stay on earth.", [
   [["त्वद्गोपुराग्रशिखराणि","the tops of your temple towers","tvat · gopura · agra · śikhara"],["निरीक्षमाणाः","seeing","nirīkṣamāṇa"]],
   [["स्वर्गापवर्गपदवीं","the path of heaven and liberation","svarga · apavarga · padavī"],["परमां","supreme","parama"],["श्रयन्तः","seeking","śrayanta"]],
   [["मर्त्या","mortals","martya"],["मनुष्यभुवने","in the human world","manuṣya · bhuvana"],["मतिमाश्रयन्ते","set their minds","matim · āśrayante"]],
   VA],
  "Mortals who see the tops of your temple towers, though seeking the supreme path of heaven and liberation, set their minds on staying in the human world (to keep seeing you). O Lord of the Veṅkaṭa hill, good morning to you.",
  "உன் கோபுர சிகரங்களைக் காணும் மனிதர்கள், சுவர்க்கமும் மோக்ஷமும் நாடினாலும், (உன்னைக் காண) மனித உலகிலேயே இருக்க மனம் வைக்கிறார்கள். வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்."),
 v("s21", "21", "Lord of Śrī and Bhū, ocean of compassion, worshipped by Ananta and Garuḍa.", [
   [["श्रीभूमिनायक","O lord of Śrī and Bhū","śrī · bhūmi · nāyaka"],["दयादिगुणामृताब्धे","O nectar-ocean of compassion and every virtue","dayā · ādi · guṇa · amṛta · abdhi"]],
   [["देवाधिदेव","O god of gods","deva · adhideva"],["जगदेकशरण्यमूर्ते","O the one refuge of the world","jagat · eka · śaraṇya · mūrti"]],
   [["श्रीमन्ननन्तगरुडादिभिरर्चिताङ्घ्रे","O glorious one, whose feet are worshipped by Ananta, Garuḍa and others","śrīman · ananta · garuḍa · ādi · arcita · aṅghri"]],
   VA],
  "O lord of Śrī and Bhū, nectar-ocean of compassion and every virtue; O god of gods, the one refuge of the world; O glorious one, whose feet Ananta, Garuḍa and others worship — O Lord of the Veṅkaṭa hill, good morning to you.",
  "ஸ்ரீதேவி, பூதேவியின் நாயகனே, கருணை முதலிய குணங்களின் அமுதக் கடலே, தேவாதி தேவனே, உலகின் ஒரே புகலிடமே, ஆதிசேஷன், கருடன் முதலியோர் வணங்கும் பாதங்களை உடையவனே — வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்."),
 v("s22", "22", "Padmanābha, Puruṣottama, Vāsudeva, Vaikuṇṭha, Mādhava, Janārdana, Cakrapāṇi…", [
   [["श्रीपद्मनाभ","O Padmanābha","lotus-navelled"],["पुरुषोत्तम","O Puruṣottama","supreme person"],["वासुदेव","O Vāsudeva","son of Vasudeva"]],
   [["वैकुण्ठ","O Vaikuṇṭha","vaikuṇṭha"],["माधव","O Mādhava","consort of Mā"],["जनार्दन","O Janārdana","janārdana"],["चक्रपाणे","O discus-bearer","cakra · pāṇi"]],
   [["श्रीवत्सचिह्न","O you marked with Śrīvatsa","śrīvatsa · cihna"],["शरणागतपारिजात","O wish-tree to those who surrender","śaraṇāgata · pārijāta"]],
   VA],
  "O Padmanābha, Puruṣottama, Vāsudeva, Vaikuṇṭha, Mādhava, Janārdana, discus-bearer, marked with Śrīvatsa, wish-granting tree to all who surrender — O Lord of the Veṅkaṭa hill, good morning to you.",
  "பத்மநாபா, புருஷோத்தமா, வாசுதேவா, வைகுண்டா, மாதவா, ஜனார்த்தனா, சக்கரபாணியே, ஸ்ரீவத்ஸ அடையாளம் உடையவனே, சரணடைந்தவர்களுக்கு கற்பக மரமே — வேங்கடமலை நாதா, உனக்குச் சுப்ரபாதம்.",
  {tip:"A garland of <b>names</b>: Padmanābha · Puruṣottama · Vāsudeva · Vaikuṇṭha · Mādhava · Janārdana · Cakrapāṇi."}),
 v("s23", "23", "More beautiful than Kāma, eyes playing on Lakṣmī, a mine of pure virtues.", [
   [["कन्दर्पदर्पहरसुन्दरदिव्यमूर्ते","O divine form whose beauty humbles Kāma's pride","kandarpa = Kāma · darpa = pride · hara · sundara · divya · mūrti"]],
   [["कान्ताकुचाम्बुरुहकुड्मललोलदृष्टे","whose eyes play on his beloved's bud-like bosom","kāntā · kuca · amburuha-kuḍmala = lotus bud · lola · dṛṣṭi"]],
   [["कल्याणनिर्मलगुणाकरदिव्यकीर्ते","O mine of auspicious pure virtues, of divine fame","kalyāṇa · nirmala · guṇa · ākara · divya · kīrti"]],
   VA],
  "O divine one whose beauty humbles the pride of Kāma, whose eyes rest lovingly on his beloved, a mine of auspicious, pure virtues and of divine fame — O Lord of the Veṅkaṭa hill, good morning to you.",
