          <h1>Dhanalakshmi Stotram</h1>
          <p class="lead" style="margin-top:8px">“The hymn to the Lakṣmī of wealth” — also called <i>Dhaneśvarī Stotram</i>. Kubera tells how Pārvatī asked Śiva for a quick way to lift good, poor householders out of want. Śiva answers with this prayer to the goddess who gives <i>dharmic</i> wealth — riches earned rightly and used rightly.</p>
