          <h1>Jagannatha Ashtakam</h1>
          <p class="lead" style="margin-top:8px">Eight verses to Lord Jagannātha of Puri, who sits on the Blue Mountain by the great ocean with Balabhadra and Subhadrā. Every verse ends with one prayer: <i>jagannāthaḥ svāmī nayanapathagāmī bhavatu me</i> — “may Lord Jagannātha come within the path of my eyes.”</p>
