          <h1>Sri Suktam</h1>
          <p class="lead" style="margin-top:8px">The Vedic hymn to Śrī, the goddess of all good fortune. The singer asks Agni — <i>Jātavedas</i>, “who knows all that is born” — to bring Lakṣmī, golden, lotus-seated, who never leaves, and to drive away Alakṣmī: hunger, thirst and want.</p>
        </div>
        <div class="card ring" id="ringCard"></div>
      </div>
      <div class="facts">
        <div class="fact"><span>Source</span><b>Ṛg Veda khila</b><span>an appendix hymn to the 5th maṇḍala</span></div>

        <div class="fact"><span>Called on</span><b>Agni (Jātavedas)</b><span>to bring her — ṛks 1, 2, 13–15</span></div>
        <div class="fact"><span>Seers</span><b>Ānanda · Kardama · Ciklīta</b><span>Śrī's own sons — verse 17</span></div>

        <div class="fact"><span>On her plan</span><b>6 days a week</b><span>every day except Saturday</span></div>
      </div>

  lines:[[["श्री᳚र्मे","may Śrī, to me","śrīḥ · me"],["भ॒जतु","come","bhajatu = may she resort to"]],[["अल॒क्ष्मी᳚र्मे","may Alakṣmī, mine","alakṣmīḥ · me"],["न॒श्यतु","perish","naśyatu"]]],
  en:"May Śrī come to me. May my misfortune perish.", ta:"ஸ்ரீ என்னை அடையட்டும். என் தரித்திரம் அழியட்டும்."},
 r("r10", "10", "May we gain the mind's wish and true speech; may Śrī and fame dwell in me.", [
   [["मन॑सः॒","of the mind","manas"],["काम॒माकू॑तिम्","the wish and intention","kāma = desire · ākūti = intention"],["वा॒चः","of speech","vāc"],["स॒त्यम॑शीमहि","the truth, may we attain","satya = truth · aśīmahi = may we obtain"]],
   [["प॒शू॒नां","of cattle","paśu"],["रू॒पमन्न॑स्य॒","the beauty, of food","rūpa = form · anna = food"],["मयि॒","in me","mayi"],["श्रीः","Śrī","śrī"],["श्र॑यताम्॒","may (she) dwell","śrayatām"],["यशः॑","and fame","yaśas"]]],
  "May we attain the wish and intention of the mind and the truth of speech; may the beauty of cattle and of food, and Śrī with fame, dwell in me.",
  "மனதின் விருப்பமும் எண்ணமும், சொல்லின் உண்மையும் நமக்குக் கிட்டட்டும். பசுக்களின் அழகும், உணவின் வளமும், ஸ்ரீயும் புகழும் என்னிடம் தங்கட்டும்."),
 r("r11", "11", "O Kardama, through you she has a child — dwell in me, settle her in my family.", [
   [["क॒र्दमे॑न","through Kardama","kardama = Śrī's son, a seer"],["प्र॑जाभू॒ता॒","she has become a mother","prajā = offspring · bhūtā = become"],["म॒यि॒","in me","mayi"],["संभ॑व","be born, dwell","sambhava"],["क॒र्दम","O Kardama","kardama"]],
   [["श्रियम्॑","Śrī","śrī"],["वा॒सय॑","make (her) dwell","vāsaya"],["मे","my","me"],["कु॒ले॒","in (my) family","kula"],["मा॒तरम्॑","the mother","mātṛ"],["पद्म॒मालि॑नीम्","wearing the lotus garland","padma · mālinī = garlanded"]]],
  "Through Kardama, Śrī has offspring. O Kardama, dwell in me, and settle in my family Śrī, the mother, who wears the lotus garland.",
  "கர்தமனால் ஸ்ரீ மக்கட்பேறு பெற்றாள். கர்தமா, என்னிடம் வசிப்பாயாக; தாமரை மாலை அணிந்த தாயான ஸ்ரீயை என் குலத்தில் வசிக்கச் செய்வாயாக.",
  {tip:"Ṛks 11 and 12 call Śrī's sons: <b>Kardama</b> here, <b>Ciklīta</b> next. Both end with <b>vāsaya me kule</b>, “settle her in my family”."}),
 r("r12", "12", "May the waters bring loving things; O Ciklīta, live in my house.", [
   [["आपः॑","the waters","āpas"],["सृ॒जन्तु॑","may (they) create","sṛjantu"],["स्नि॒ग्धा॒नि॒","soft, loving things","snigdha = smooth, affectionate"],["चि॒क्ली॒त","O Ciklīta","ciklīta = Śrī's son"],["व॑स","dwell","vasa"],["मे॒","my","me"],["गृहे","in (my) house","gṛha"]],
   [["नि","and","ni = (with vāsaya) settle down"],["च॑","also","ca"],["दे॒वीम्","the goddess","devī"],["मा॒तरम्॒","the mother","mātṛ"],["श्रियम्॑","Śrī","śrī"],["वा॒सय॑","make (her) dwell","vāsaya"],["मे","my","me"],["कु॒ले","in (my) family","kula"]]],
  "May the waters bring forth gentle, loving things. O Ciklīta, dwell in my house, and settle the goddess, mother Śrī, in my family.",
  "நீர்கள் மென்மையான நலன்களைத் தரட்டும். சிக்லீதா, என் வீட்டில் வசிப்பாயாக; தேவியான தாய் ஸ்ரீயையும் என் குலத்தில் வசிக்கச் செய்வாயாக."),
 r("r13", "13", "Tender, like a lotus pond, nourishing, golden-tawny — O Agni, bring her.", [
   [["आ॒र्द्राम्","tender","ārdrā"],["पु॒ष्करि॑णीम्","like a lotus pond","puṣkariṇī"],["पु॒ष्टिम्॒","nourishment itself","puṣṭi"],["पिं॒ग॒ळाम्","golden-tawny","piṅgalā"],["प॑द्ममा॒लिनीम्","lotus-garlanded","padma-mālinī"]],
   R1],
  "O Jātavedas, bring to me Lakṣmī — tender, like a lotus pond, nourishment itself, golden-tawny, wearing a lotus garland, moon-like, made of gold.",
  "ஜாதவேதஸே, நெகிழ்ந்தவளும், தாமரைக் குளம் போன்றவளும், வளமே வடிவானவளும், பொன்னிறத்தவளும், தாமரை மாலை அணிந்தவளும், சந்திரன் போன்றவளும், பொன்மயமானவளுமான லக்ஷ்மியை என்னிடம் கொண்டு வருவாயாக."),
 r("r14", "14", "Tender, holding the staff, golden, garlanded with gold, bright as the sun — bring her.", [
   [["आ॒र्द्राम्","tender","ārdrā"],["यः॒","who","yaḥ"],["करि॑णीम्","acting, holding","kariṇī"],["य॒ष्टिम्॒","the staff (support)","yaṣṭi = staff, support"],["सु॒व॒र्णाम्","golden","suvarṇā"],["हे॑ममा॒लिनीम्","garlanded with gold","hema = gold · mālinī"]],
   [["सू॒र्याम्","bright as the sun","sūryā"],["हि॒रण्म॑यीम्","made of gold","hiraṇmayī"],["ल॒क्ष्मीम्॒","Lakṣmī","lakṣmī"],["जात॑वेदो","O Jātavedas","Agni"],["म॒माव॑ह","bring to me","mama · āvaha"]]],
  "O Jātavedas, bring to me Lakṣmī — tender, holding the staff of support, golden, garlanded with gold, bright as the sun, made of gold.",
  "ஜாதவேதஸே, நெகிழ்ந்தவளும், ஆதாரக் கோலைத் தாங்கியவளும், பொன்னிறத்தவளும், பொன் மாலை அணிந்தவளும், சூரியன் போல் ஒளிர்பவளும், பொன்மயமானவளுமான லக்ஷ்மியை என்னிடம் கொண்டு வருவாயாக.",
  {tip:"Ṛk 13 says <b>candrām</b> (moon-like), ṛk 14 <b>sūryām</b> (sun-like) — moon, then sun."}),
 r("r15", "15", "Bring me the Lakṣmī who never leaves — abundant gold, cows, maids, horses and people.", [
   R2,
   [["यस्याम्॒","by whose grace","yasyām"],["हिर॑ण्यम्॒","gold","hiraṇya"],["प्रभू॑तम्॒","in abundance","prabhūta"],["गावो॑","cows","go"],["दा॒स्योऽश्वा᳚न्","maids and horses","dāsī = maid · aśva = horse"],["विं॒देयम्॒","may I gain","vindeyam"],["पुरु॑षान॒हम्","and people, I","puruṣān · aham"]]],
  "O Jātavedas, bring to me that Lakṣmī who never goes away, by whose grace I may gain gold in abundance, cows, maids, horses and people.",
  "ஜாதவேதஸே, நீங்காத அந்த லக்ஷ்மியை என்னிடம் கொண்டு வருவாயாக; அவள் அருளால் ஏராளமான பொன், பசுக்கள், பணியாளர், குதிரைகள், மக்கள் ஆகியோரைப் பெறுவேனாக."),
 s("p16", "16", "Phala-śruti", "Whoever, pure, offers ghee daily and chants these fifteen verses gains Śrī.", [
   [["यश्शुचिः॑","whoever, pure","yaḥ = who · śuci = pure"],["प्रयतो","attentive","prayata"],["भू॒त्वा॒","becoming","bhūtvā"],["जु॒हुया॑दाज्य॒मन्व॑हम्","offers ghee daily","juhuyāt = should offer · ājya = ghee · anvaham = daily"]],
   [["श्रियः॑","of Śrī","śrī"],["प॒ञ्चद॑शर्चम्","the fifteen ṛks","pañcadaśa = fifteen · ṛc = verse"],["च","and","ca"],["श्री॒काम॑स्सत॒तम्॒","wishing for Śrī, always","śrī-kāma = desiring fortune · satatam = constantly"],["ज॑पेत्","should chant","japet"]]],
  "Whoever wishes for Śrī should, pure and attentive, offer ghee daily and constantly chant these fifteen ṛks of Śrī.",
  "ஸ்ரீயை விரும்புபவர் தூய்மையுடனும் கவனத்துடனும் தினமும் நெய்யால் ஹோமம் செய்து, ஸ்ரீயின் இந்தப் பதினைந்து ருக்குகளையும் எப்போதும் ஜபிக்க வேண்டும்.",
  {kind:"phala", short:"Phala 16", meter:"vedic", meterNote:VED}),
 s("p17", "17", "Phala-śruti", "The seers are her three sons — Ānanda, Kardama, Ciklīta; the deity is Śrī herself.", [
   [["आनन्दः","Ānanda","ānanda = bliss"],["कर्द॑मश्चै॒व","Kardama too","kardama · ca · eva"],["चिक्ली॒त","Ciklīta","ciklīta"],["इ॑ति","thus","iti"],["वि॒श्रुताः","renowned","viśruta = famous"]],
   [["ऋष॑य॒स्ते","those are the seers","ṛṣayaḥ = seers · te = they"],["त्र॑यः","three","traya"],["पुत्राः","sons","putra"],["स्व॒यम्॒","herself","svayam"],["श्रीरे॑व","Śrī alone","śrīḥ · eva"],["दे॒वता","is the deity","devatā"]]],
  "Ānanda, Kardama and Ciklīta are renowned as its seers — her three sons. The deity is Śrī herself.",
  "ஆனந்தர், கர்தமர், சிக்லீதர் என்று புகழ்பெற்ற அவளுடைய மூன்று புதல்வர்களே இதன் ரிஷிகள்; தேவதை ஸ்ரீயே.",
  {kind:"phala", short:"Phala 17", meter:"vedic", meterNote:VED}),
 s("u1", "18", "Lakṣmī ślokas", "Lotus-faced, lotus-eyed, lotus-born — love me, and let me find happiness.", [
   [["पद्मानने","O lotus-faced one","padma · ānana = face"],["पद्म","lotus","padma"],["ऊरू","-thighed","ūru = thigh (lotus-like)"],["पद्माक्षी","lotus-eyed","padma · akṣī = eye"],["पद्मसंभवे","O lotus-born","padma · sambhavā = born"]],
   [["त्वं","you","tvam"],["मां","me","mām"],["भजस्व","love, come to","bhajasva"],["पद्माक्षी","O lotus-eyed","padmākṣī"],["येन","by which","yena"],["सौख्यं","happiness","saukhya"],["लभाम्यहम्","I gain","labhāmi · aham"]]],
  "O lotus-faced one, with lotus-like thighs, lotus-eyed, born of the lotus — O lotus-eyed one, come to me, so that I may find happiness.",
  "தாமரை முகத்தவளே, தாமரைத் தொடையாளே, தாமரைக் கண்ணாளே, தாமரையில் பிறந்தவளே — நான் இன்பம் பெறும்படி என்னிடம் அருள் புரிவாயாக.",
  {meter:"anushtubh", tip:"The <b>padma</b> verse: padmānane · padma ūrū · padmākṣī · padmasambhave · padmākṣī — five lotuses."}),
 s("u2", "19", "Lakṣmī ślokas", "Giver of horses, cows and wealth — may she favour me with wealth for every aim.", [
   [["अ॒श्वदा॑यी","giver of horses","aśva · dāyin = giver"],["च","and","ca"],["गोदा॒यी॒","giver of cows","go · dāyin"],["ध॒नदा॑यी","giver of wealth","dhana · dāyin"],["म॒हाध॑ने","O great wealth","mahā · dhanā"]],
   [["धनम्॑","wealth","dhana"],["मे॒","to me","me"],["जुष॑ताम्","may (she) grant","juṣatām"],["दे॒वी","the goddess","devī"],["स॒र्वका॑मार्थ॒सिद्ध॑ये","to fulfil every wish and aim","sarva · kāma = wish · artha = aim · siddhi = fulfilment"]]],
  "O you who give horses, cows and wealth, O great wealth — may the goddess grant me wealth to fulfil every wish and aim.",
  "குதிரை, பசு, செல்வம் அருள்பவளே, பெருஞ்செல்வமே — எல்லா விருப்பங்களும் நிறைவேற தேவி எனக்குச் செல்வம் அருளட்டும்.", {meter:"anushtubh"}),
 s("u3", "20", "Lakṣmī ślokas", "Children, grandchildren, wealth, grain, elephants, horses — make me long-lived.", [
   [["पुत्रपौत्रधनं","sons, grandsons, wealth","putra · pautra = grandson · dhana"],["धान्यं","grain","dhānya"],["हस्त्यश्वाजाविगोरथम्","elephants, horses, goats, sheep, cows, chariots","hastin · aśva · aja = goat · avi = sheep · go · ratha"]],
   [["प्रजानां","of all creatures","prajā"],["भवसि","you are","bhavasi"],["माता","the mother","mātṛ"],["आयुष्मन्तं","long-lived","āyuṣmat"],["करोतु","may (she) make","karotu"],["मां","me","mām"]]],
  "Children and grandchildren, wealth, grain, elephants, horses, goats, sheep, cows and chariots — you are the mother of all creatures; may you make me long-lived.",
  "மக்கள், பேரன்கள், செல்வம், தானியம், யானை, குதிரை, ஆடு, செம்மறி, பசு, தேர் — எல்லா உயிர்களுக்கும் நீயே தாய்; என்னை நீண்ட ஆயுள் உடையவனாக்குவாயாக.", {meter:"anushtubh"}),
 s("u4", "21", "Lakṣmī ślokas", "Shining like the moon, the sun and fire — we worship Śrī Mahālakṣmī.", [
   [["चन्द्राभां","shining like the moon","candra · ābhā = lustre"],["लक्ष्मीमीशानां","Lakṣmī, the ruler","lakṣmīm · īśānā = ruling"],["सूर्याभां᳚","shining like the sun","sūrya · ābhā"],["श्रियमीश्वरीम्","Śrī, the sovereign","śriyam · īśvarī"]],
   [["चन्द्रसूर्याग्निसर्वाभां","shining like moon, sun and fire together","candra · sūrya · agni · sarva · ābhā"],["श्रीमहालक्ष्मीमुपास्महे","we worship Śrī Mahālakṣmī","śrī · mahālakṣmī · upāsmahe = we worship"]]],
  "We worship Śrī Mahālakṣmī — Lakṣmī the ruler, shining like the moon; Śrī the sovereign, shining like the sun; shining with the light of moon, sun and fire together.",
  "சந்திர ஒளியுடைய லக்ஷ்மியை, சூரிய ஒளியுடைய ஸ்ரீ ஈஸ்வரியை, சந்திர, சூரிய, அக்னி ஒளிகள் அனைத்தும் கொண்ட ஸ்ரீ மஹாலக்ஷ்மியை உபாசிக்கிறோம்.", {meter:"anushtubh", irreg:true}),
 s("u5", "22", "Lakṣmī ślokas", "Fire is wealth, wind is wealth, the sun is wealth…", [
   [["धनमग्निर्","wealth is fire","dhanam · agniḥ"],["धनं","wealth","dhana"],["वायुर्","is wind","vāyuḥ"],["धनं","wealth","dhana"],["सूर्यो॑","is the sun","sūryaḥ"],["धनं","wealth","dhana"],["वसुः","is Vasu","vasu"]],
   [["धनमिन्द्रो","wealth is Indra","dhanam · indraḥ"],["बृहस्पतिर्","Bṛhaspati","bṛhaspatiḥ"],["वरु॑णं","Varuṇa","varuṇa"],["धनम॑श्नुते","attains wealth","dhanam · aśnute = gains"]]],
  "Fire is wealth, wind is wealth, the sun is wealth, the Vasus are wealth; Indra, Bṛhaspati and Varuṇa are wealth — (through them) one attains wealth.",
  "அக்னியே செல்வம், வாயுவே செல்வம், சூரியனே செல்வம், வசுக்களே செல்வம்; இந்திரன், பிருஹஸ்பதி, வருணன் ஆகியோரே செல்வம் — (அவர்களால்) செல்வம் அடையப்படுகிறது.",
  {meter:"anushtubh", tip:"Count the <b>dhanam</b>s: six in two lines."}),
 s("u6", "23", "Lakṣmī ślokas", "O Garuḍa, drink the soma; may Indra drink; may the soma-giver give me wealth.", [
   [["वैनतेय","O Vainateya (Garuḍa)","vinatā's son"],["सोमं","the soma","soma"],["पिब","drink","piba"],["सोमं॑","the soma","soma"],["पिबतु","may (he) drink","pibatu"],["वृत्रहा","the slayer of Vṛtra (Indra)","vṛtra · han"]],
   [["सोमं॒","soma","soma"],["धनस्य","of wealth","dhana"],["सोमिनो॒","of the soma-offerer","somin"],["मह्यं॑","to me","mahyam"],["ददातु","may (she) give","dadātu"],["सोमिनी॑","she who has the soma","sominī"]]],
  "O Garuḍa, drink the soma; may Indra, slayer of Vṛtra, drink the soma. May she who holds the soma give me the soma of wealth.",
  "கருடா, சோமத்தைப் பருகுவாயாக; விருத்திரனைக் கொன்ற இந்திரனும் சோமத்தைப் பருகட்டும். சோமம் உடையவள் எனக்குச் செல்வச் சோமத்தைத் தரட்டும்.", {meter:"anushtubh"}),
 s("u7", "24", "Lakṣmī ślokas", "No anger, no jealousy, no greed, no bad thoughts — for those who always chant the Śrī Sūkta.", [

    document.getElementById("refrains").innerHTML = [["जात॑वेदो म॒माव॑ह","ṛks 1, 13, 14 — “O Agni, bring her to me”"],["ताम् म॒ आव॑ह॒ जात॑वेदो","ṛks 2, 15 — the hymn opens and closes with it"],["तामि॒होप॑ह्वये॒ श्रियम्","ṛks 4, 9 — “her I call here, Śrī”"],["श्रियम्॑ वा॒सय॑ मे कु॒ले","ṛks 11, 12 — “settle Śrī in my family”"]].map(([dv, en]) => `${R(dv)}<br><span class="muted" style="font-family:var(--f-body);font-size:.85rem">${en}</span>`).join("<br>");
  }
};
})();
