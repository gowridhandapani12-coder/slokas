          <h1>Gunaratna Kosham</h1>
          <p class="lead" style="margin-top:8px">“The treasure-chest of the jewels of her virtues.” Parāśara Bhaṭṭar, the brilliant son of Kūrattāḻvān, sings to Śrī Raṅganāyakī — the lamp of the Śrīraṅgam temple. He praises her glance, her equality with the Lord, her beauty, her avatāras as Sītā, and above all her forgiveness, and ends by asking for a hundred autumns at Śrīraṅgam in her service.</p>

   "क्षान्त्यौदार्यदयादयो|patience, generosity, mercy and the rest|kṣānti · audārya · dayā · ādayaḥ; भगवति|O Bhagavatī|bhagavatī; स्वां|their own|svā; प्रस्नुवीरन्|will pour out|prasnuvīran; प्रथाम्|fame|prathā"],
  "Poets say the true praiser is one who spreads out the virtues of the praised. So the burden of your praise rests on me alone — for by accepting my unbearable words, O Bhagavatī, your patience, generosity, mercy and other virtues will pour out their full fame.",
  "புகழப்படுபவரின் குணங்களை விரித்துக் காட்டுபவனே துதிப்பவன் என்று கவிகள் சொல்கிறார்கள். ஆகவே உன் துதியின் பாரம் என்மீதே தங்குகிறது — ஏனெனில், பகவதியே, என் தாங்க முடியாத சொற்களை நீ ஏற்பதால் உன் பொறுமை, வள்ளன்மை, கருணை முதலிய குணங்கள் தம் புகழைப் பொழியும்.",
  {tip:"A witty turn: a bad poet is the <b>best</b> praiser — forgiving him shows off her <b>kṣānti</b> (patience)."}),
 v(7, "vt", "Who can praise her?", "May Lakṣmī herself perfect our words with her sweet glances, so poets drink them eagerly.",
  ["सूक्तिं|our verse|sūkti; समग्रयतु|may (she) make complete|samagrayatu; नः|our|naḥ; स्वयमेव|herself|svayam · eva; लक्ष्मीः|Lakṣmī|lakṣmī",
   "श्रीरङ्गराजमहिषी|queen of Śrīraṅgarāja|śrīraṅgarāja · mahiṣī; मधुरैः|with sweet|madhura; कटाक्षैः|glances|kaṭākṣa",
   "वैदग्ध्यवर्णगुणगुम्भनगौरवैर्यां|which, for its skill, letters, qualities and weaving|vaidagdhya · varṇa · guṇa · gumbhana · gaurava · yām",
   "कण्डूलकर्णकुहराः|with itching (eager) ears|kaṇḍūla · karṇa · kuhara; कवयो|poets|kavi; धयन्ति|drink|dhayanti"],
  "May Lakṣmī herself, queen of Śrīraṅgarāja, perfect our verse with her sweet glances — so that poets, their ears itching to hear, drink it in for its skill, its letters, its qualities and its weaving.",
  "ஸ்ரீரங்கராஜ மகிஷியான லக்ஷ்மியே தன் இனிய கடைக்கண்களால் எங்கள் கவிதையை முழுமையாக்கட்டும் — அதன் திறமை, எழுத்து, குணம், தொடுப்பு ஆகியவற்றுக்காகக் கவிகள் ஆர்வமுள்ள காதுகளால் அதைப் பருகட்டும்."),
 v(8, "sk", "Who can praise her?", "Śrī, give me speech — faultless, rich in virtues, friendly yet deep, a feast for the ears.",
  ["अनाघ्रातावद्यं|untouched by fault|anāghrāta · avadya; बहुगुणपरीणाहि|rich in many qualities|bahu · guṇa · parīṇāhin; मनसो|for the mind|manas",
   "दुहानं|yielding|duhāna; सौहार्दं|friendliness|sauhārda; परिचितमिवाथापि|as if familiar, and yet|paricitam · iva · atha · api; गहनम्|deep|gahana",
   "पदानां|of the words|pada; सौभ्रात्रादनिमिषनिषेव्यं|to be enjoyed unblinking, for the brotherhood (of words)|saubhrātra · animiṣa · niṣevya; श्रवणयोः|for the ears|śravaṇa",
   "त्वमेव|you alone|tvam · eva; श्रीर्|O Śrī|śrī; मह्यं|for me|mahyam; बहुमुखय|make abundant|bahumukhaya; वाणीविलसितम्|the play of speech|vāṇī · vilasita"],
  "O Śrī, you alone make abundant for me the play of speech — untouched by fault, rich in qualities, yielding friendliness to the mind, familiar and yet deep, a feast for the ears for the harmony of its words.",
  "ஸ்ரீயே, குறையற்றதும், பல குணங்கள் நிறைந்ததும், மனத்துக்கு நட்பைத் தருவதும், பழக்கமானது போலிருந்தும் ஆழமானதும், சொற்களின் இணக்கத்தால் காதுகளுக்கு விருந்தானதுமான வாக்கின் விளையாட்டை நீயே எனக்குப் பெருக்குவாயாக."),
 v(9, "sk", "Who can praise her?", "O Raṅganātha, listen — we will praise your beloved even more than you; may your arms burst their armour with joy!",
  ["श्रियः|of Śrī|śrī; श्रीः|the glory|śrī; श्रीरङ्गेशय|O you who lie at Śrīraṅgam|śrīraṅga · īśaya; तव|your|tava; च|and|ca; हृद्यां|dear to the heart|hṛdyā; भगवतीं|the Goddess|bhagavatī",
   "श्रियं|Śrī|śrī; त्वत्तोऽप्युच्चैर्|even louder than you|tvattaḥ · api · uccaiḥ; वयमिह|we, here|vayam · iha; फणामः|shall praise|phaṇāmaḥ; शृणुतराम्|listen well|śṛṇutarām",
   "दृशौ|eyes|dṛś; ते|your|te; भूयास्तां|may they become|bhūyāstām; सुखतरलतारे|with pupils trembling with joy|sukha · tarala · tāra; श्रवणतः|from hearing|śravaṇa",
   "पुनर्हर्षोत्कर्षात्|again, from the height of joy|punaḥ · harṣa · utkarṣa; स्फुटतु|may (it) burst|sphuṭatu; भुजयोः|of your arms|bhuja; कञ्चुकशतम्|a hundred armours|kañcuka · śata"],
  "O Lord who lies at Śrīraṅgam, listen well: we shall praise Śrī — the glory of glory, your heart's beloved — even louder than you can. As you hear it, may your eyes tremble with joy, and may a hundred armours on your arms burst with delight!",
  "ஸ்ரீரங்கத்தில் சயனித்திருப்பவனே, நன்கு கேள்: செல்வத்தின் செல்வமும் உன் இதயத்துக்கு இனியவளுமான ஸ்ரீயை உன்னைவிட உரக்கத் துதிக்கப் போகிறோம். கேட்டு உன் கண்கள் மகிழ்ச்சியால் துடிக்கட்டும்; உன் தோள்களில் நூறு கவசங்களும் ஆனந்தத்தால் வெடிக்கட்டும்!",
  {tip:"Bhaṭṭar speaks to <b>Raṅganātha</b>: “listen to us praise your wife!” The image of arms swelling with joy is classic."}),
 v(10, "vt", "Who can praise her?", "The Veda is the treasury of your virtues; the Itihāsas and Purāṇas are the keys.",
  ["देवि|O Goddess|devī; श्रुतिं|the Veda|śruti; भगवतीं|holy|bhagavatī; प्रथमे|the first|prathama; पुमांसः|men (sages)|pumāṃs",
   "त्वत्सद्गुणौघमणिकोशगृहं|the treasure-house of the jewels of your virtues|tvat · sat · guṇa · ogha · maṇi · kośa · gṛha; गृणन्ति|declare|gṛṇanti",
   "तद्द्वारपाटनपटूनि|skilled at opening its doors|tat · dvāra · pāṭana · paṭu; च|and|ca; सेतिहास|with the Itihāsas|sa · itihāsa",
   "सन्तर्कणस्मृतिपुराणपुरस्सराणि|with sound reasoning, Smṛtis and Purāṇas foremost|santarkaṇa · smṛti · purāṇa · puraḥsara"],
  "O Goddess, the first sages call the holy Veda the treasure-house of the jewels of your virtues; and the Smṛtis, Purāṇas and Itihāsas, with sound reasoning, are skilled at opening its doors.",
  "தேவியே, புனித வேதத்தை உன் நற்குண ரத்தினங்களின் கருவூலம் என்று முன்னோர் சொல்கிறார்கள்; இதிகாசங்கள், ஸ்மிருதிகள், புராணங்கள், நல்ல தர்க்கம் ஆகியவை அதன் கதவுகளைத் திறக்க வல்லவை.",
  {tip:"The title of the hymn is here: <b>guṇa-maṇi-kośa</b> — the treasury of her virtue-jewels = <i>Guṇa-ratna-kośa</i>."}),
 v(11, "sg", "Who can praise her?", "Those who never glanced at you, golden creeper of Śrīraṅgam, fall into every wrong view.",
  ["आहुर्वेदानमानं|some call the Vedas no authority|āhuḥ · vedān · amānam; कतिचन|some|katicana; कतिचाराजकं|some, leaderless|kati · ca · arājaka; विश्वमेतत्|this world|viśvam · etat",
   "राजन्वत्केचिदीशं|some (say) it has a king — the Lord|rājanvat · kecit · īśam; गुणिनमपि|with qualities|guṇinam · api; गुणैस्|in qualities|guṇa; तं|him|tam; दरिद्राणमन्ये|others, poor|daridrāṇam · anye",
   "भिक्षावन्ये|others, a beggar|bhikṣāvat · anye; सुराजम्भवमिति|or that it has a good king|surājambhavam · iti; च|and|ca; जडास्|the dull|jaḍa; ते|they|te; तलातल्यकार्षुः|tossed this way and that|talātalya · akārṣuḥ",
   "ये|who|ye; ते|by you|te; श्रीरङ्गहर्म्याङ्गणकनकलते|O golden creeper of the Śrīraṅgam courtyard|śrīraṅga · harmya · aṅgaṇa · kanaka · late; न|not|na; क्षणं|for a moment|kṣaṇa; लक्ष्यमासन्|were seen|lakṣyam · āsan"],
  "Some say the Vedas are no authority; some that the world has no ruler; some that the Lord rules but is poor in qualities; some that he is a beggar — these dull ones are tossed about, because, O golden creeper in the courtyard of Śrīraṅgam, they were never glanced at by you for even a moment.",
  "சிலர் வேதங்கள் பிரமாணமல்ல என்கிறார்கள்; சிலர் உலகுக்குத் தலைவன் இல்லை என்கிறார்கள்; சிலர் ஈஸ்வரன் குணமற்றவன், ஏழை என்கிறார்கள் — ஸ்ரீரங்கக் கோயில் முற்றத்தின் பொற்கொடியே, நீ ஒரு கணமேனும் பார்க்காததால் இந்த மூடர்கள் அலைக்கழிகிறார்கள்.",
  {tip:"Without Śrī, God would be <b>daridra</b> — poor. Her glance is what makes people understand the Lord rightly."}),
 v(12, "ml", "Who can praise her?", "Those who see your glory hidden in the Upaniṣads, with the eye-salve of devotion, are born to divine wealth.",
  ["मनसि|in the mind|manas; विलसताऽक्ष्णा|with a shining eye|vilasatā · akṣṇā; भक्तिसिद्धाञ्जनेन|with the magic salve of devotion|bhakti · siddha · añjana",
   "श्रुतिशिरसि|in the crest of the Veda|śruti · śiras; निगूढं|hidden|nigūḍha; लक्ष्मि|O Lakṣmī|lakṣmī; ते|your|te; वीक्षमाणाः|seeing|vīkṣamāṇa",
   "निधिमिव|like a treasure|nidhim · iva; महिमानं|greatness|mahiman; भुञ्जते|enjoy|bhuñjate; येऽपि|those who|ye · api; धन्याः|the blessed|dhanya",
   "ननु|surely|nanu; भगवति|O Bhagavatī|bhagavatī; दैवीं|divine|daivī; सम्पदं|wealth|sampad; तेऽभिजाताः|they are born to|te · abhijātāḥ"],
  "O Lakṣmī, the blessed who, with an inner eye shining with the magic salve of devotion, see your greatness hidden in the crest of the Vedas and enjoy it like a treasure — surely, O Bhagavatī, they are born to divine wealth.",
  "லக்ஷ்மியே, பக்தி எனும் சித்த அஞ்சனத்தால் ஒளிரும் மனக்கண்ணால் உபநிஷத்துகளில் மறைந்த உன் பெருமையைக் கண்டு புதையல் போல் அனுபவிக்கும் பாக்கியசாலிகள், பகவதியே, நிச்சயமாக தெய்வச் செல்வத்துக்குரியவர்களாகப் பிறந்தவர்கள்.",
  {tip:"A <b>siddhāñjana</b> is a magic eye-salve that lets you see buried treasure. Devotion is that salve. <b>daivī sampad</b> — Gītā 16."}),
 v(13, "mk", "The proof", "Śrī Sūkta sings your wealth; the Puruṣa Sūkta's last section praises your Lord as yours.",
  ["अस्येशाना|ruler of this|asya · īśānā; जगत|world|jagat; इति|thus|iti; तेऽधीमहे|we study, of you|te · adhīmahe; यां|which|yām; समृद्धिं|abundance|samṛddhi",
   "श्रीः|O Śrī|śrī; श्रीसूक्तं|the Śrī Sūkta|śrī · sūkta; बहुमुखयते|spreads out|bahumukhayate; तां|it|tām; च|and|ca; शाखानुशाखम्|in branch after branch|śākhā · anuśākham",
   "ईष्टे|rules|īṣṭe; कश्चिज्जगत|someone, the world|kaścit · jagat; इति|thus|iti; यः|who|yaḥ; पौरुषे|in the Puruṣa|pauruṣa; सूक्त|Sūkta|sūkta; उक्तः|is spoken of|ukta",
   "तं|him|tam; च|and|ca; त्वत्कं|as yours|tvatka; पतिमधिजगावुत्तरश्चानुवाकः|the later section sang (him) as husband|patim · adhijagau · uttaraḥ · ca · anuvākaḥ"],
  "O Śrī, the abundance we learn in “asyeśānā jagataḥ — she is the ruler of this world”, the Śrī Sūkta spreads out in branch after branch. And the one spoken of in the Puruṣa Sūkta as ruling the world — the next section (the Uttara-anuvāka) sings of him as your husband.",
  "ஸ்ரீயே, ‘அஸ்யேசானா ஜகத:’ என்று நாம் கற்கும் உன் செல்வத்தை ஸ்ரீ ஸூக்தம் கிளைகிளையாக விரிக்கிறது. புருஷ ஸூக்தத்தில் உலகை ஆள்பவனாகச் சொல்லப்படுபவனை அதன் உத்தர அனுவாகம் உன் கணவனாகப் பாடுகிறது.",
  {tip:"The Uttara-anuvāka of the Puruṣa Sūkta says <i>hrīś ca te lakṣmīś ca patnyau</i> — “Hrī and Lakṣmī are your wives”."}),
 v(14, "mk", "The proof", "The Upaniṣad, the Rāmāyaṇa — your story — and the Purāṇas all prove your greatness.",
  ["उद्बाहुस्त्वामुपनिषदसावाह|that Upaniṣad, arms raised, declares you|ud-bāhuḥ · tvām · upaniṣat · asau · āha; नैका|not one alone|na · ekā; नियन्त्रीं|the ruler|niyantrī",
   "श्रीमद्रामायणमपि|the holy Rāmāyaṇa too|śrīmat · rāmāyaṇam · api; परं|greatly|param; प्राणिति|breathes|prāṇiti; त्वच्चरित्रे|in your story|tvat · caritra",
   "स्मर्तारोऽस्मज्जननि|the Smṛti writers, O our mother|smartāraḥ · asmat · jananī; यतमे|who strive|yatame; सेतिहासैः|with Itihāsas|sa · itihāsa; पुराणैः|and Purāṇas|purāṇa",
   "निन्युर्वेदानपि|brought the Vedas too|ninyuḥ · vedān · api; च|and|ca; ततमेत्वन्महिम्नि|spread out, in your greatness|tatame · tvat · mahimni; प्रमाणम्|as proof|pramāṇa"],
  "That Upaniṣad, with arms raised, declares you the ruler — and not just one. The holy Rāmāyaṇa breathes in your story (Sītā's). O our mother, the Smṛti writers, with Itihāsas and Purāṇas, brought even the Vedas to bear as proof of your greatness.",
  "அந்த உபநிஷத் கைகளை உயர்த்தி உன்னை நியமிப்பவள் என்று அறிவிக்கிறது. ஸ்ரீமத் ராமாயணம் உன் சரித்திரத்தில் (சீதையின்) உயிர் வாழ்கிறது. எங்கள் தாயே, ஸ்மிருதிகளை இயற்றியவர்கள் இதிகாச புராணங்களுடன் வேதங்களையும் உன் பெருமைக்குப் பிரமாணமாகக் காட்டினர்.",
  {tip:"The Rāmāyaṇa is called <i>sītāyāś caritaṃ mahat</i> — “the great story of Sītā”. Bhaṭṭar: the epic <b>breathes</b> in her."}),
 v(15, "sd", "The proof", "From the village headman up to the Lord of all — every lordship is only a few drops of your glance.",
  ["आकुग्रामनियामकादपि|from the headman of a small village|ā · ku-grāma · niyāmaka · api; विभो|of the Lord|vibhu; राब्रह्मनिर्वाहकात्|up to the sustainer of all|ā · sarva · nirvāhaka",
   "ऐश्वर्यं|lordship|aiśvarya; यदि|indeed|yadi; होत्तरोत्तरगुणं|growing step by step|ha · uttara-uttara · guṇa; श्रीरङ्गभर्तुः|of Śrīraṅga's Lord|śrīraṅga · bhartṛ; प्रिये|O beloved|priyā",
   "तुङ्गं|lofty|tuṅga; मङ्गलमुज्ज्वलं|auspicious, bright|maṅgalam · ujjvalam; गरिमवत्|weighty|garimavat; पुण्यं|holy|puṇya; पुनः|again|punaḥ; पावनम्|purifying|pāvana",
   "धन्यं|blessed|dhanya; यत्तददश्च|whatever that is|yat · tat · adaḥ · ca; वीक्षणभुवस्|born of your glance|vīkṣaṇa · bhuva; ते|your|te; पञ्चषा|five or six|pañca-ṣāḥ; विप्रुषः|drops|vipruṣ"],
  "O beloved of Śrīraṅga's Lord — all lordship, growing step by step from the headman of a little village up to the Lord who sustains all, all that is lofty, auspicious, bright, weighty, holy, purifying and blessed, is just five or six drops born of your glance.",
  "ஸ்ரீரங்கநாதனின் பிரியையே — சிறு கிராமத் தலைவன் முதல் எல்லாவற்றையும் நிர்வகிக்கும் பகவான் வரை படிப்படியாக உயரும் ஐஸ்வர்யமும், உயர்ந்ததும் மங்களமும் ஒளிர்வதும் கனமும் புனிதமும் தூய்மையாக்குவதும் பாக்கியமுமான எல்லாமும் உன் பார்வையிலிருந்து பிறந்த ஐந்தாறு துளிகளே.",
  {tip:"<b>pañcaṣāḥ vipruṣaḥ</b> — “five or six drops”. Even the Lord's own lordship comes from her glance!"}),
 v(16, "sg", "The proof", "One rides a proud elephant ignoring kings; another begs before him — that is just your eye lifted or lowered.",
  ["एको|one|ekaḥ; मुक्तातपत्रप्रचलमणिघणात्|with pearl umbrellas and jewels jingling|muktā · ātapatra · pracala · maṇi · ghaṇāt; कारिमौलिर्मनुष्यो|a man whose crown (rings)|kāri · mauliḥ · manuṣyaḥ",
   "दृप्यद्दन्तावलस्थो|on a proud elephant|dṛpyat · dantāvala · stha; न|does not|na; गणयति|count|gaṇayati; नतान्|bowing|nata; यत्क्षणं|for a moment|yat · kṣaṇam; क्षोणिपालान्|kings|kṣoṇi · pāla",
   "यत्तस्मै|that before him|yat · tasmai; तिष्ठतेऽन्यः|another stands|tiṣṭhate · anyaḥ; कृपणमशरणो|pitiful, without refuge|kṛpaṇam · aśaraṇaḥ; दर्शयन्|showing|darśayan; दन्तपङ्क्तीः|his teeth (begging)|danta · paṅkti",
   "तत्ते|that, from your|tat · te; श्रीरङ्गराजप्रणयिनि|O beloved of Śrīraṅgarāja|śrīraṅgarāja · praṇayinī; नयनोदञ्चितन्यञ्चिताभ्याम्|eyes raised and lowered|nayana · udañcita · nyañcita"],
  "One man, crowned, under pearl umbrellas with jewels jingling, rides a proud elephant and doesn't even notice kings bowing to him; another stands before him, pitiful and helpless, grinning to beg — O beloved of Śrīraṅgarāja, that is only your eyes lifted, or lowered.",
  "ஒருவன் முத்துக்குடை நிழலில் ஒலிக்கும் மணி மகுடத்துடன் மதயானை மீதமர்ந்து வணங்கும் அரசர்களையும் பொருட்படுத்தாமல் செல்கிறான்; இன்னொருவன் அவன் முன் ஏழையாய், புகலற்று இரந்து நிற்கிறான் — ஸ்ரீரங்கராஜ பிரியையே, அது உன் கண்கள் உயர்ந்ததும் தாழ்ந்ததுமே.",
  {tip:"Fortune and misfortune: just <b>udañcita</b> (eyes raised) and <b>nyañcita</b> (lowered)."}),
 v(17, "pr", "The proof", "Wherever your eyebrow moves, the rivers of Rati, Sarasvatī, Siddhi and Śrī race there.",
  ["रतिर्मतिसरस्वतीधृतिसमृद्धिसिद्धिश्रियः|Rati, Mati, Sarasvatī, Dhṛti, Samṛddhi, Siddhi and Śrī|rati · mati · sarasvatī · dhṛti · samṛddhi · siddhi · śrī",
   "सुधासखि|O sister of nectar|sudhā · sakhī; यतोमुखं|in whichever direction|yataḥ · mukham; विचिलिषेत्तव|may move, your|vicilīṣet · tava; भ्रूलता|creeper of an eyebrow|bhrū · latā",
   "ततोमुखमथेन्दिरे|in that direction then, O Indirā|tataḥ · mukham · atha · indire; बहुमुखीमहम्पूर्विकां|a many-sided race of “me first”|bahumukhīm · ahampūrvikām",
   "विगाह्य|entering|vigāhya; च|and|ca; वशंवदाः|obedient|vaśaṃvada; परिवहन्ति|flow|parivahanti; कूलङ्कषाः|overflowing their banks|kūlaṅkaṣa"],
  "O sister of nectar, in whichever direction the creeper of your eyebrow may move — in that direction, O Indirā, Rati, Mati, Sarasvatī, Dhṛti, Samṛddhi, Siddhi and Śrī rush in a many-sided race of “me first!”, obedient, overflowing their banks like rivers.",
  "அமுதத்தின் தோழியே, உன் புருவக் கொடி எந்தத் திசையில் அசைகிறதோ, இந்திரையே, அந்தத் திசையில் ரதி, மதி, சரஸ்வதி, த்ருதி, ஸம்ருத்தி, சித்தி, ஸ்ரீ ஆகியோர் ‘நான் முந்தி’ என்று கரை புரண்டோடும் நதிகள் போல் பணிந்து பாய்கின்றனர்.",
  {tip:"Compare Śrī Stuti 15: <b>aham-ahamikā</b> / <b>ahampūrvikā</b> — the “me first” race of blessings."}),
 v(18, "pr", "The proof", "Brahmā and the beggar, Bṛhaspati and the tree, high and low — all of it is the dance of your glance or neglect.",
  ["सह|together|saha; स्थिरपरित्रसव्रज|the hosts of still and moving beings|sthira · paritrasa · vraja; विरिञ्चनाकिञ्चनैः|with Brahmā and the destitute|viriñca · akiñcana",
   "अनोकहबृहस्पतिप्रबलविक्लबप्रक्रियम्|tree and Bṛhaspati, the strong and the feeble|anokaha · bṛhaspati · prabala · viklaba · prakriya",
   "इदं|this|idam; सदसदात्मना|as good and bad|sat · asat · ātmanā; निखिलमेव|all of it|nikhilam · eva; निम्नोन्नतम्|low and high|nimna · unnata",
   "कटाक्षतदुपेक्षयोस्तव|of your glance and its neglect|kaṭākṣa · tat · upekṣa; हि|indeed|hi; लक्ष्मि|O Lakṣmī|lakṣmī; तत्ताण्डवम्|that is the dance|tat · tāṇḍava"],
  "This whole world of high and low — still and moving beings, Brahmā and the destitute, a tree and Bṛhaspati, the strong and the feeble, good and bad — O Lakṣmī, it is all the dance of your glance and of its neglect.",
  "அசைவன அசையாதன, பிரம்மனும் ஏழையும், மரமும் பிருகஸ்பதியும், வலியவனும் பலவீனனும், நல்லதும் கெட்டதுமான இந்த உயர்வு தாழ்வு நிறைந்த உலகம் முழுவதும், லக்ஷ்மியே, உன் கடைக்கண்ணும் அதன் புறக்கணிப்பும் ஆடும் நடனமே.",
  {tip:"Pairs: <b>viriñca / akiñcana</b> (Brahmā / pauper), <b>anokaha / bṛhaspati</b> (tree / genius)."}),
 v(19, "sd", "Her play, her city", "When the time is right, your beloved creates a thousand universes — only for your play.",
  ["काले|at the right time|kāla; शंसति|indicates|śaṃsati; योग्यतां|fitness|yogyatā; चिदचितो|of souls and matter|cit · acit; रन्योन्यमालिङ्गतोः|embracing each other|anyonyam · āliṅgatoḥ",
   "भूताहङ्कृतिबुद्धिपञ्चकरणीस्वान्तप्रवृत्तीन्द्रियैः|with elements, ego, intellect, five senses, mind and organs of action|bhūta · ahaṅkṛti · buddhi · pañca · karaṇī · svānta · pravṛtti · indriya",
   "अण्डानावरणैस्सहस्रमकरोत्|made a thousand cosmic eggs with their sheaths|aṇḍān · āvaraṇaiḥ · sahasram · akarot; तान्|them|tān; भूर्भुवस्स्वर्वतः|with earth, sky and heaven|bhūḥ · bhuvaḥ · svar · vataḥ",
   "श्रीरङ्गेश्वरदेवि|O queen of Śrīraṅgeśvara|śrīraṅgeśvara · devī; ते|your|te; विहृतये|for (your) play|vihṛti; सङ्कल्पमानः|willing|saṅkalpamāna; प्रियः|your beloved|priya"],
  "When the time shows that souls and matter, embracing each other, are ready, your beloved — O queen of Śrīraṅgeśvara — wills and makes a thousand cosmic eggs with their sheaths, with elements, ego, intellect, senses, mind and organs, with earth, sky and heaven: all for your play.",
  "காலம் வந்து சேதன அசேதனங்கள் ஒன்றையொன்று தழுவத் தகுதியானபோது, ஸ்ரீரங்கேஸ்வரனின் தேவியே, உன் பிரியன் உன் விளையாட்டுக்காகவே சங்கல்பித்து, பூதங்கள், அகங்காரம், புத்தி, புலன்கள், மனம், கர்மேந்திரியங்கள், பூ-புவ-ஸுவர் லோகங்களுடன் ஆயிரம் அண்டங்களைப் படைக்கிறான்.",
  {tip:"All of creation is <b>for her vihṛti</b> — her play (līlā)."}),
 v(20, "sd", "Her play, her city", "He shows souls the sense-objects and makes them forget they are servants — to amuse you, Raṅganāyakī.",
  ["शब्दादीन्|sound and the rest|śabda · ādi; विषयान्|objects|viṣaya; प्रदर्श्य|showing|pradarśya; विभवं|wealth|vibhava; विस्मार्य|making (them) forget|vismārya; दास्यात्मकं|their nature as servants|dāsya · ātmaka",
   "वैष्णव्या|by Viṣṇu's|vaiṣṇavī; गुणमायया|māyā of the guṇas|guṇa · māyā; ऽऽत्मनिवहान्|the hosts of souls|ātma · nivaha; विप्लाव्य|tossing about|viplāvya; पूर्वः|the First|pūrva; पुमान्|Person|pumān",
   "पुंसा|by a man|puṃs; पण्यवधूविडम्बिवपुषा|with a body like a hired dancer|paṇya · vadhū · viḍambi · vapus; धूर्तानिवायासयन्|wearying them like rogues|dhūrtān · iva · āyāsayan",
   "श्रीरङ्गेश्वरि|O queen of Śrīraṅga|śrīraṅgeśvarī; कल्पते|becomes|kalpate; तव|your|tava; परीहासात्मने|full of laughter|parīhāsa · ātman; केलये|for sport|keli"],
  "Showing them sound and the other objects, making them forget their wealth — that they are servants — and tossing the hosts of souls about with Viṣṇu's māyā of the guṇas, the First Person wearies them as a showgirl wearies rogues. O queen of Śrīraṅga, all this becomes a laughing sport for you.",
  "சப்தம் முதலிய விஷயங்களைக் காட்டி, அடிமை என்ற தம் செல்வத்தை மறக்கச் செய்து, வைஷ்ணவ குணமாயையால் ஆத்மாக்களை அலைக்கழித்து, பரமபுருஷன் அவர்களைச் சோர்வடையச் செய்கிறான். ஸ்ரீரங்கேஸ்வரியே, இவையெல்லாம் உனக்குச் சிரிப்பூட்டும் விளையாட்டாகின்றன."),
 v(21, "sd", "Her play, her city", "Beyond mind, beyond darkness, wondrous, untouched by time — the Vedas say Viṣṇu's highest abode is for you.",
  ["यद्दूरे|which is far|yat · dūre; मनसो|from the mind|manas; यदेव|which|yat · eva; तमसः|darkness|tamas; पारे|beyond|pāre; यदत्यद्भुतं|which is most wondrous|yat · ati · adbhuta",
   "यत्कालादपचेलिमं|which time cannot ripen (decay)|yat · kālāt · apacelima; सुरपुरी|a city of the gods|sura · purī; यद्गच्छतो|to one who goes there|yat · gacchataḥ; दुर्गतिः|misfortune|durgati",
   "सायुज्यस्य|of union|sāyujya; यदेव|which|yat · eva; सूतिरथवा|the source, or|sūtiḥ · athavā; यद्दुर्ग्रहं|which is hard to grasp|yat · durgraha; मद्गिरां|for my words|mat · gir",
   "तद्विष्णोः|that, Viṣṇu's|tat · viṣṇoḥ; परमं|highest|parama; पदं|abode|pada; तव|your|tava; कृते|for the sake of|kṛte; मातस्समाम्नासिषुः|O mother, they have taught|mātaḥ · samāmnāsiṣuḥ"],
  "That which is far from the mind, beyond darkness, most wondrous; untouched by time; compared to which heaven itself is misfortune; the source of union with him; hard for my words to grasp — that highest abode of Viṣṇu, O mother, the Vedas teach exists for your sake.",
  "மனத்துக்கு எட்டாததும், இருளுக்கு அப்பாற்பட்டதும், மிக அற்புதமானதும், காலத்தால் அழியாததும், அங்கு செல்பவனுக்கு தேவலோகமே துர்க்கதியாகத் தோன்றுவதும், ஸாயுஜ்யத்தின் மூலமும், என் சொல்லுக்கு எட்டாததுமான விஷ்ணுவின் பரமபதம், தாயே, உனக்காகவே என்று வேதங்கள் சொல்கின்றன.",
  {tip:"Each line is a <b>yad…</b> (“that which…”); the last line answers: <b>tad viṣṇoḥ paramaṃ padam</b> — a Ṛg Veda phrase."}),
 v(22, "sd", "Her play, her city", "The world is your play; Vaikuṇṭha your enjoyment; the eternal ones your servants — and we, the objects of your pure mercy.",
  ["हेलायामखिलं|in play, all|helāyām · akhilam; चराचरमिदं|this moving and unmoving|cara · acaram · idam; भोगे|for enjoyment|bhoga; विभूतिः|the realm|vibhūti; परा|supreme|parā",
   "पुण्यास्ते|holy, they|puṇyāḥ · te; परिचारकर्मणि|in service|paricāra · karman; सदा|always|sadā; पश्यन्ति|see|paśyanti; ये|who|ye; सूरयः|the eternal ones|sūri",
   "श्रीरङ्गेश्वरदेवि|O queen of Śrīraṅgeśvara|śrīraṅgeśvara · devī; केवलकृपानिर्वाह्यवर्गे|in the group sustained by mercy alone|kevala · kṛpā · nirvāhya · varga; वयं|we|vayam",
   "शेषित्वे|as the master|śeṣitva; परमः|the Supreme|parama; पुमान्|Person|pumān; परिकराह्येते|these are attendants|parikarāḥ · hi · ete; तव|your|tava; स्फारणे|in your glory|sphāraṇa"],
  "This whole moving and unmoving world is for your play; the supreme realm for your enjoyment; the holy eternal ones who always see (the Lord) are for your service; we, O queen of Śrīraṅgeśvara, belong to the group sustained by your mercy alone; and as master, the Supreme Person — all these are attendants of your glory.",
  "அசைவன அசையாதனவான இந்த உலகம் உன் விளையாட்டுக்கு; பரமபதம் உன் அனுபவத்துக்கு; நித்யசூரிகள் உன் கைங்கர்யத்துக்கு; ஸ்ரீரங்கேஸ்வர தேவியே, நாங்கள் உன் கருணையால் மட்டுமே காக்கப்படும் கூட்டத்தில்; சேஷியாகப் பரமபுருஷன் — இவர்கள் யாவரும் உன் பெருமைக்குப் பரிவாரங்கள்.",
  {tip:"Four groups, four roles: world = <b>play</b>, Vaikuṇṭha = <b>enjoyment</b>, sūris = <b>service</b>, us = <b>mercy</b>."}),
 v(23, "sd", "Her play, her city", "Ayodhyā, Aparājitā — beyond heaven, overflowing with nectar — your royal capital.",
  ["आज्ञानुग्रहभीमकोमलपुरीपाला|whose city-guards are fearsome in command, gentle in grace|ājñā · anugraha · bhīma · komala · purī · pāla; फलं|the fruit|phala; भेजुषां|of those who attain|bhejuṣām",
   "याऽयोध्येत्यपराजितेति|which, as Ayodhyā, as Aparājitā|yā · ayodhyā · iti · aparājitā · iti; विदिता|known|viditā; नाकं|heaven|nāka; परेण|beyond|pareṇa; स्थिता|situated|sthitā",
   "भावैरद्भुतभोगभूमगहनैस्|with wondrous objects, deep with abundant joys|bhāva · adbhuta · bhoga · bhūma · gahana; सान्द्रा|thick|sāndrā; सुधास्यन्दिभिः|with nectar-streaming (things)|sudhā · syandin",
   "श्रीरङ्गेश्वरगेहलक्ष्मि|O Lakṣmī of Śrīraṅgeśvara's home|śrīraṅgeśvara · geha · lakṣmī; युवयोस्|of you two|yuvayoḥ; तां|it|tām; राजधानीं|the capital|rājadhānī; विदुः|they know|viduḥ"],
  "O Lakṣmī of Śrīraṅgeśvara's home — the city whose guards are fearsome in command and gentle in grace, the fruit of those who reach it, known as Ayodhyā and Aparājitā, beyond heaven, thick with wondrous, nectar-streaming joys — the wise know it as the capital of you two.",
  "ஸ்ரீரங்கேஸ்வரன் இல்லத்தின் லக்ஷ்மியே — ஆணையில் கடுமையும் அருளில் மென்மையும் கொண்ட காவலர்கள் உடையதும், அடைபவர்களின் பலனும், அயோத்யா, அபராஜிதா என்று அறியப்படுவதும், சுவர்க்கத்துக்கு அப்பாற்பட்டதும், அமுதம் பொழியும் அற்புத இன்பங்கள் நிறைந்ததுமான அதை உங்கள் இருவரின் தலைநகரம் என்று அறிவோர் அறிவர்.",
  {tip:"Vaikuṇṭha's names in the Upaniṣads: <b>Ayodhyā</b> (unconquerable) and <b>Aparājitā</b> (never defeated)."}),
 v(24, "sg", "Her play, her city", "In that city is your royal hall — a single ocean of bliss, full of servants, guarded by the divine weapons.",
  ["तस्यां|in it|tasyām; च|and|ca; त्वत्कृपावन्निरवधिजनताविश्रमार्हावकाशं|with room for countless people to rest, like your mercy|tvat · kṛpā · vat · niravadhi · janatā · viśrama · arha · avakāśa",
   "सङ्कीर्णं|crowded|saṅkīrṇa; दास्यतृष्णाकलितपरिकरैः|with attendants thirsting to serve|dāsya · tṛṣṇā · kalita · parikara; पुम्भिरानन्दनिघ्नैः|by souls lost in bliss|pumbhiḥ · ānanda · nighna",
   "स्नेहादस्थानरक्षाव्यसनिभिरभयं|safe — by those who protect even needlessly out of love|snehāt · asthāna · rakṣā · vyasanin · abhaya; शार्ङ्गचक्रासिमुख्यैः|the bow, discus, sword and others|śārṅga · cakra · asi · mukhya",
   "आनन्दैकार्णवं|a single ocean of bliss|ānanda · eka · arṇava; श्रीः|O Śrī|śrī; भगवति|O Bhagavatī|bhagavatī; युवयो|of you two|yuvayoḥ; राहुरास्थानरत्नम्|they call the jewel of royal halls|āhuḥ · āsthāna · ratna"],
  "And in it, O Śrī, O Bhagavatī, they speak of your royal hall — a single ocean of bliss — with room enough for countless people to rest, like your mercy; crowded with souls lost in bliss and thirsting to serve; kept safe by the bow, discus, sword and other weapons, who guard it even needlessly out of love.",
  "அந்நகரில், ஸ்ரீயே, பகவதியே, உங்கள் இருவரின் ஆஸ்தான மண்டபம் ஒரே ஆனந்தக் கடல் என்கிறார்கள் — உன் கருணை போல் எண்ணற்றோர் ஓய்வெடுக்க இடமுள்ளது; கைங்கர்ய ஆர்வமுடைய ஆனந்தத்தில் மூழ்கிய ஆத்மாக்களால் நிறைந்தது; அன்பால் தேவையின்றியும் காக்கும் சார்ங்கம், சக்கரம், வாள் முதலியவற்றால் பாதுகாக்கப்பட்டது.",
  {tip:"<b>asthāna-rakṣā</b> — “protecting where no danger is”: the weapons guard Vaikuṇṭha out of pure love (like Periyāḻvār's Pallāṇḍu)."}),
 v(25, "sg", "Her play, her city", "There, on Ananta under his jewelled hoods, the Lord who rules the universe shares endless joys with you.",
  ["तत्र|there|tatra; स्रक्स्पर्शगन्धस्फुरदुपरिफणारत्नरोचिर्वितानं|garland, touch and fragrance, a canopy of light from the jewels on his hoods|srak · sparśa · gandha · sphurat · upari · phaṇā · ratna · rociḥ · vitāna",
   "विस्तीर्यानन्तभोगं|spreading Ananta's coils|vistīrya · ananta · bhoga; तदुपरि|on it|tat · upari; नयता|leading|nayatā; विश्वमेकातपत्रम्|the universe under one umbrella|viśvam · eka · ātapatra",
   "तैस्तैः|with those|taiḥ taiḥ; कान्तेन|by your beloved|kānta; शान्तोदितगुणविभवै|with glories of qualities hidden and shown|śānta · udita · guṇa · vibhava; रर्हता|worthy|arhatā; त्वामसङ्ख्यैः|you, countless|tvām · asaṅkhya",
   "अन्योन्याद्वैतनिष्ठाघनरसगहनान्|deep with the flavour of oneness with each other|anyonya · advaita · niṣṭhā · ghana · rasa · gahana; देवि|O Goddess|devī; बध्नासि|you weave|badhnāsi; भोगान्|joys|bhoga"],
  "There, spreading Ananta's coils — fragrant, soft, under a canopy of light from the jewels on his hoods — your beloved, who rules the universe under one umbrella, sits on them with you; and with him, worthy of you with his countless glories hidden and shown, O Goddess, you weave joys deep with the flavour of oneness with each other.",
  "அங்கே, மாலையின் மணமும் மென்மையும் கொண்டு, படங்களின் ரத்தின ஒளிப் பந்தலின் கீழ் அனந்தனின் சுருள்களை விரித்து, அதன் மேல் உலகை ஒரே குடையின் கீழ் ஆளும் உன் காந்தனுடன், தேவியே, ஒருவருக்கொருவர் ஒன்றான ஆழ்ந்த ரசமுடைய இன்பங்களை நீ நெய்கிறாய்."),
 v(26, "sd", "Her play, her city", "Bhūdevī, Nīlādevī and thousands more are like your own arms, breasts and eyes — through them you delight him.",
  ["भोग्या|enjoyable|bhogyā; वामपि|for you two, too|vām · api; नान्तरीयकतया|as inseparable|nāntarīyaka · tayā; पुष्पाङ्गरागैस्समं|along with flowers and perfumes|puṣpa · aṅgarāga · samam",
   "निर्वृत्तप्रणयातिवाहनविधौ|in carrying out the work of love|nirvṛtta · praṇaya · ativāhana · vidhi; नीताः|brought|nītāḥ; परीवाहताम्|to the state of overflow|parīvāhatā",
   "देवि|O Goddess|devī; त्वामनु|following you|tvām · anu; नीलया|with Nīlā|nīlā; सह|together|saha; महीदेव्यस्|Bhūdevī|mahī · devī; सहस्रं|a thousand|sahasra; तथा|and so|tathā",
   "याभिस्त्वं|through whom you|yābhiḥ · tvam; स्तनबाहुदृष्टिभिरिव|as if with your breasts, arms and eyes|stana · bāhu · dṛṣṭi · iva; स्वाभिः|your own|sva; प्रियं|your beloved|priya; श्लाघसे|delight|ślāghase"],
  "O Goddess, Bhūdevī with Nīlā, and thousands more, follow you — enjoyable to you both, inseparable like flowers and perfumes, the overflow of your love. Through them, as if through your own breasts, arms and eyes, you delight your beloved.",
  "தேவியே, நீளையுடன் பூதேவியும் இன்னும் ஆயிரம் தேவியரும் உன்னைப் பின்தொடர்கின்றனர் — மலர்களும் நறுமணமும் போல் பிரிக்க முடியாதவர்கள், உன் அன்பின் பெருக்கு. அவர்கள் மூலம், உன் சொந்த ஸ்தனங்கள், கைகள், கண்கள் போல, உன் பிரியனை மகிழ்விக்கிறாய்.",
  {tip:"The Śrīvaiṣṇava view: Bhū and Nīlā are not rivals but extensions of Śrī herself."}),
 v(27, "sg", "Her play, her city", "The eternal ones, equal to you in form and joy, still long only to serve your feet — melted with love.",
  ["ते|they|te; साध्यास्सन्ति|are the Sādhyas|sādhyāḥ · santi; देवा|gods|deva; जननि|O mother|jananī; गुणवपुर्वेषवृत्तस्वरूपैः|in qualities, body, dress, conduct and nature|guṇa · vapus · veṣa · vṛtta · svarūpa",
   "भोगैर्वा|or in joys|bhoga · vā; निर्विशेषाः|not different (from you)|nirviśeṣa; सवयस|of the same age|savayas; इव|as if|iva; ये|who|ye; नित्यनिर्दोषगन्धाः|eternally without a trace of fault|nitya · nirdoṣa · gandha",
   "हे|O|he; श्रीः|Śrī|śrī; श्रीरङ्गभर्तुस्तव|of Śrīraṅga's Lord and your|śrīraṅga · bhartṛ · tava; च|and|ca; पदपरीचारवृत्त्यै|for serving the feet|pada · parīcāra · vṛtti; सदाऽपि|always|sadā · api",
   "प्रेमप्रद्राणभावाविलहृदयहठात्कारकैङ्कर्यभोगाः|whose hearts, melted with love, are forced into the joy of service|prema · pradrāṇa · bhāva · āvila · hṛdaya · haṭhāt · kāra · kaiṅkarya · bhoga"],
  "O mother, those gods, the Sādhyas — the eternal ones, never touched by fault, the same as you in qualities, body, dress, conduct, nature and joys, as if of your own age — O Śrī, their hearts melted with love, are always driven, as if by force, to the joy of serving the feet of Śrīraṅga's Lord and yours.",
  "தாயே, குணம், உடல், வேடம், நடத்தை, இயல்பு, இன்பம் ஆகியவற்றில் உங்களுக்குச் சமமான, என்றும் குறையற்ற நித்யசூரிகள் — ஸ்ரீயே, அன்பால் உருகிய இதயத்துடன் ஸ்ரீரங்கநாதனுடையதும் உன்னுடையதுமான திருவடிகளுக்குக் கைங்கர்யம் செய்யும் இன்பத்தால் எப்போதும் இழுக்கப்படுகிறார்கள்.",
  {tip:"<b>sādhyāḥ santi devāḥ</b> — from the Puruṣa Sūkta: “where the ancient Sādhyas, the gods, dwell”."}),
 v(28, "sk", "Equal to the Lord", "The Lord's very nature and freedom shine because you embrace him — the Veda never names him apart from you.",
  ["स्वरूपं|nature|svarūpa; स्वातन्त्र्यं|freedom|svātantrya; भगवत|of the Lord|bhagavat; इदं|this|idam; चन्द्रवदने|O moon-faced one|candra · vadanā",
   "त्वदाश्लेषोत्कर्षाद्भवति|comes from the height of your embrace|tvat · āśleṣa · utkarṣāt · bhavati; खलु|indeed|khalu; निष्कर्षसमये|when examined closely|niṣkarṣa · samaya",
   "त्वमासीर्मातः|you were, O mother|tvam · āsīḥ · mātaḥ; श्रीः|Śrī|śrī; कमितुरिदमित्थं|of your lover, this, thus|kamituḥ · idam · ittham; त्वविभवः|but without (you) no glory|tu · avibhavaḥ",
   "तदन्तर्भावात्त्वां|because you are included in it|tat · antarbhāvāt · tvām; न|not|na; पृथगभिधत्ते|names separately|pṛthak · abhidhatte; श्रुतिरपि|even the Veda|śrutiḥ · api"],
  "O moon-faced one, the Lord's very nature and freedom, examined closely, come from the height of your embrace. You, O mother, were Śrī; without you his state would be no glory. Since you are included in him, even the Veda does not name you separately.",
  "சந்திர முகத்தவளே, ஆராய்ந்து பார்த்தால் பகவானின் ஸ்வரூபமும் ஸ்வாதந்த்ரியமும் உன் தழுவலின் சிறப்பாலேயே உண்டாகின்றன. தாயே, நீயே ஸ்ரீ; நீயின்றி அவனுக்கு மகிமையில்லை. நீ அவனுள் அடங்கியிருப்பதால் வேதமும் உன்னைத் தனியாகச் சொல்வதில்லை.",
  {tip:"Śrīvaiṣṇava teaching: wherever the Veda names Nārāyaṇa, Śrī is <b>included</b> — they are never apart."}),
 v(29, "sk", "Equal to the Lord", "Your touch makes the Lord auspicious — just as fragrance makes a flower; no poet says you take your glory from him.",
  ["तव|your|tava; स्पर्शादीशं|from touching, the Lord|sparśāt · īśam; स्पृशति|touches|spṛśati; कमले|O Kamalā|kamalā; मङ्गलपदं|the word “auspicious”|maṅgala · pada",
   "तवेदं|this of yours|tava · idam; नोपाधेरुपनिपतितं|not come from any outside cause|na · upādheḥ · upanipatitam; श्रीरसि|you are Śrī|śrīḥ · asi; यतः|since|yataḥ",
   "प्रसूनं|a flower|prasūna; पुष्यन्तीमपि|even though it nourishes|puṣyantīm · api; परिमलर्द्धिं|the wealth of fragrance|parimala · ṛddhi; जिगदिषुः|wishing to describe|jigadiṣuḥ",
   "न|not|na; चैवं|and thus|ca · evam; त्वा|you|tvā; देवं|the Lord|deva; स्वदत|delights|svadate; इति|thus|iti; कश्चित्कवयते|any poet says|kaścit · kavayate"],
  "O Kamalā, the word “auspicious” touches the Lord only from your touch; yours is not borrowed from any outside cause, for you are Śrī herself. A poet describing a flower's wealth of fragrance says the fragrance adorns the flower — no poet says the Lord adorns you.",
  "கமலையே, உன் ஸ்பரிசத்தாலேயே ‘மங்களம்’ என்ற சொல் பகவானைத் தொடுகிறது; உனது மங்களம் வெளிக்காரணத்தால் வந்ததல்ல, ஏனெனில் நீயே ஸ்ரீ. மணம் மலரை அழகுபடுத்துகிறது என்று கவிகள் சொல்வர்; பகவான் உன்னை அழகுபடுத்துகிறான் என்று எந்தக் கவியும் சொல்வதில்லை."),
 v(30, "sk", "Equal to the Lord", "Where your many glances fall is Brahman; where two or three fall is Indra — so the Veda praises you and him together.",
  ["अपाङ्गा|side-glances|apāṅga; भूयांसो|many|bhūyas; यदुपरि|on whom|yat · upari; परं|the supreme|para; ब्रह्म|Brahman|brahman; तदभूत्|that became|tat · abhūt",
   "अमी|these|amī; यत्र|where|yatra; द्वित्रास्स|two or three, he|dvitrāḥ · saḥ; च|and|ca; शतमखादिस्तदधरात्|Indra and the rest, lower than that|śatamakha · ādiḥ · tat · adharāt",
   "अतः|hence|ataḥ; श्रीराम्नायस्तदुभयमुशंस्त्वां|O Śrī, the Veda, wishing both, you|śrīḥ · āmnāyaḥ · tat · ubhayam · uśan · tvām; प्रणिजगौ|sang|praṇijagau",
   "प्रशस्तिस्सा|that praise|praśastiḥ · sā; राज्ञो|of a king|rājan; यदपि|though|yat · api; च|and|ca; पुरीकोशकथनम्|telling of his city and treasury|purī · kośa · kathana"],
  "He on whom your many glances fell became the Supreme Brahman; where two or three fell, there are Indra and the lesser gods. So, O Śrī, the Veda, wishing to praise both, sang of you — just as praising a king's city and treasury is praise of the king.",
  "உன் பல கடைக்கண்கள் யார்மீது விழுந்தனவோ அவன் பரப்பிரம்மம் ஆனான்; இரண்டு மூன்று விழுந்த இடத்தில் இந்திரன் முதலியோர். ஆகவே, ஸ்ரீயே, இருவரையும் புகழ விரும்பிய வேதம் உன்னைப் பாடியது — அரசனின் நகரையும் கருவூலத்தையும் புகழ்வது அரசனைப் புகழ்வதே போல."),
 v(31, "sk", "Equal to the Lord", "You are Viṣṇu's own Śrī — his wealth depends on you, yet he loses no freedom, as a gem loses nothing by its own light.",
  ["स्वतश्श्रीस्त्वं|by nature you are Śrī|svataḥ · śrīḥ · tvam; विष्णोस्स्वमसि|you are Viṣṇu's own|viṣṇoḥ · svam · asi; तत|therefore|tataḥ; एवैष|so this|eva · eṣaḥ; भगवान्|Lord|bhagavān",
   "त्वदायत्तर्द्धित्वेऽप्यभवदपराधीनविभवः|though his wealth rests on you, his glory depends on no other|tvat · āyatta · ṛddhitve · api · abhavat · aparādhīna · vibhavaḥ",
   "स्वया|by its own|svā; दीप्त्या|light|dīpti; रत्नं|a gem|ratna; भवदपि|being|bhavat · api; महार्घं|precious|mahārgha; न|not|na; विगुणं|faulty|viguṇa",
   "न|not|na; कुण्ठस्वातन्त्र्यं|lacking freedom|kuṇṭha · svātantrya; भवति|becomes|bhavati; च|and|ca; न|not|na; चान्याहितगुणम्|with qualities given by another|ca · anya · āhita · guṇa"],
  "By nature you are Śrī, and you are Viṣṇu's own; so this Lord, though his wealth rests on you, has a glory dependent on no one else. A gem, precious by its own light, is not faulty, not lacking freedom, and not adorned by qualities from outside.",
  "இயல்பாகவே நீ ஸ்ரீ, நீ விஷ்ணுவுக்கே உரியவள்; ஆகவே பகவானின் செல்வம் உன்னைச் சார்ந்திருந்தாலும் அவன் மகிமை வேறு எவரையும் சார்ந்ததல்ல. தன் ஒளியால் விலைமதிப்பற்ற ரத்தினம் குறையுடையதுமல்ல, சுதந்திரம் இழந்ததுமல்ல, பிறர் தந்த குணமுடையதுமல்ல.",
  {tip:"The <b>gem and its light</b> — the classic Śrīvaiṣṇava image (prabhā–prabhāvat) for Śrī and Viṣṇu."}),
 v(32, "hr", "Equal to the Lord", "Power, strength, light, knowledge, lordship, valour, love of devotees, fragrance, beauty — these virtues you share with him.",
  ["प्रशकनबलज्योतिर्ज्ञानैश्वरीविजयप्रथा|power, strength, light, knowledge, lordship, victory, fame|praśakana · bala · jyotis · jñāna · aiśvarī · vijaya · prathā",
   "प्रणतवरणप्रेमक्षेमङ्करत्वपुरस्सराः|choosing those who bow, love, bringing their welfare and more|praṇata · varaṇa · prema · kṣemaṅkaratva · puraḥsara",
   "अपि|also|api; परिमलः|fragrance|parimala; कान्तिर्लावण्यमर्चिरितीन्दिरे|radiance, beauty, brilliance — thus, O Indirā|kāntiḥ · lāvaṇyam · arciḥ · iti · indire",
   "तव|yours|tava; भगवतश्चैते|and the Lord's, these|bhagavataḥ · ca · ete; साधारणा|shared|sādhāraṇa; गुणराशयः|heaps of virtues|guṇa · rāśi"],
  "Power, strength, light, knowledge, lordship, victory and fame; choosing those who bow, love, care for their welfare; fragrance, radiance, beauty and brilliance — O Indirā, these heaps of virtues are shared by you and the Lord.",
  "சக்தி, பலம், தேஜஸ், ஞானம், ஐஸ்வர்யம், வெற்றி, புகழ்; வணங்குபவர்களை ஏற்பது, அன்பு, நலம் செய்வது; மணம், ஒளி, அழகு, காந்தி — இந்திரையே, இந்தக் குணக் குவியல்கள் உனக்கும் பகவானுக்கும் பொதுவானவை."),
 v(33, "vt", "Equal to the Lord", "Youth and other qualities, equal in you both, reflect in each other like two facing mirrors.",
  ["अन्येऽपि|others too|anye · api; यौवनमुखा|youth and the rest|yauvana · mukha; युवयोस्समानाः|equal in you two|yuvayoḥ · samānāḥ",
   "श्रीरङ्गमङ्गलविजृम्भणवैजयन्ति|O banner of victory, unfolding Śrīraṅgam's auspiciousness|śrīraṅga · maṅgala · vijṛmbhaṇa · vaijayantī",
   "तस्मिंस्तव|yours in him|tasmin · tava; त्वयि|in you|tvayi; च|and|ca; तस्य|his|tasya; परस्परेण|with each other|paraspara",
   "संस्तीर्य|spreading|saṃstīrya; दर्पण|in a mirror|darpaṇa; इव|as if|iva; प्रचुरं|abundantly|pracuram; स्वदन्ते|taste sweet|svadante"],
  "O victory banner who unfolds Śrīraṅgam's auspiciousness — youth and the other qualities are equal in you both: yours in him and his in you spread out to each other, as if in mirrors, and are enjoyed abundantly.",
  "ஸ்ரீரங்கத்தின் மங்களத்தை மலரச் செய்யும் வைஜயந்தியே, இளமை முதலிய குணங்கள் உங்கள் இருவரிடமும் சமம்; அவனிடம் உன்னுடையவையும் உன்னிடம் அவனுடையவையும் கண்ணாடிகளில் போல் ஒன்றில் ஒன்று பிரதிபலித்து நிறைவாக இனிக்கின்றன."),
 v(34, "sk", "Equal to the Lord", "Though alike, you divide the virtues — his manly firmness and power, your womanly softness, dependence and mercy.",
  ["युवत्वादौ|in youth and the like|yuvatva · ādi; तुल्येऽप्यपरवशताशत्रुशमन|though equal — independence, destroying enemies|tulye · api · aparavaśatā · śatru · śamana",
   "स्थिरत्वादीन्|firmness and the rest|sthiratva · ādi; कृत्वा|taking|kṛtvā; भगवति|O Bhagavatī|bhagavatī; गुणान्|qualities|guṇa; पुंस्त्वसुलभान्|natural to a man|puṃstva · sulabha",
   "त्वयि|in you|tvayi; स्त्रीत्वैकान्तान्|belonging only to womanhood|strītva · ekānta; म्रदिमपतिपारार्थ्यकरुणा|softness, devotion to the husband, mercy|mradiman · pati · pārārthya · karuṇā",
   "क्षमादीन्वा|patience and the rest|kṣamā · ādi · vā; भोक्तुं|to enjoy|bhoktum; भवति|there is|bhavati; युवयोरात्मनि|in your two selves|yuvayoḥ · ātmani; भिदा|a division|bhidā"],
  "Though you are equal in youth and so on, O Bhagavatī, a division arises between your two selves for the sake of enjoyment: he takes the qualities natural to a man — independence, destroying enemies, firmness — and in you are those that belong to womanhood: softness, devotion to your husband, mercy and patience.",
  "பகவதியே, இளமை முதலியவற்றில் சமமாக இருந்தாலும், அனுபவத்துக்காக உங்களுக்குள் ஒரு பிரிவு உண்டு: சுதந்திரம், பகைவரை அழித்தல், உறுதி போன்ற ஆண்மைக் குணங்கள் அவனிடம்; மென்மை, பதிபக்தி, கருணை, பொறுமை போன்ற பெண்மைக் குணங்கள் உன்னிடம்."),
 v(35, "nk", "Equal to the Lord", "Golden-bright, you share youth and innocence with Hari, dividing even the ornaments between you.",
  ["घनकनकद्युती|with the light of solid gold|ghana · kanaka · dyuti; युवदशामपि|the state of youth too|yuva · daśām · api; मुग्धदशां|the state of innocence|mugdha · daśā",
   "युवतरुणत्वयोरुचितमाभरणादि|ornaments fit for youth and young womanhood|yuva · taruṇatva · ucitam · ābharaṇa · ādi; परम्|supreme|param",
   "ध्रुवमसमानदेशविनिवेशि|placed in different places|dhruvam · asamāna · deśa · viniveśi; विभज्य|dividing|vibhajya; हरौ|in Hari|hari",
   "त्वयि|in you|tvayi; च|and|ca; कुशेशयोदरविहारिणि|O you who play inside the lotus|kuśeśaya · udara · vihāriṇī; निर्विशसि|you enjoy|nirviśasi"],
  "O you who play within the lotus, golden-bright — dividing between Hari and you the state of youth and the state of innocence, and the ornaments suited to a young man and a young woman, placed in different spots, you enjoy them.",
  "தாமரையின் உள்ளே விளையாடுபவளே, பொன்னொளியுடையவளே — இளமையையும் அப்பாவித்தனத்தையும், இளைஞனுக்கும் இளம்பெண்ணுக்கும் ஏற்ற ஆபரணங்களையும் ஹரிக்கும் உனக்கும் பகிர்ந்து அனுபவிக்கிறாய்."),
 v(36, "sd", "Her form", "Moon, wish-creeper, nectar — they were only dregs left after churning your body's virtues; no comparison fits you.",
  ["अङ्गं|limb, body|aṅga; ते|your|te; मृदुशीतमुग्धमधुरोदारैर्गुणैर्गुम्भतः|from weaving your body of soft, cool, innocent, sweet, generous qualities|mṛdu · śīta · mugdha · madhura · udāra · guṇa · gumbhataḥ",
   "क्षीराब्धेः|of the milk ocean|kṣīra · abdhi; किमृजीषतामुपगता|became leftover dregs|kim · ṛjīṣatām · upagatāḥ; मन्ये|I think|manye; महार्घास्ततः|so (they were thought) precious|mahārghāḥ · tataḥ",
   "इन्दुः|the moon|indu; कल्पलता|the wish-creeper|kalpa · latā; सुधा|nectar|sudhā; मधुमुखा|honey and the rest|madhu · mukha; इत्याविलां|thus, muddied|iti · āvilām; वर्णनां|description|varṇanā",
   "श्रीरङ्गेश्वरि|O queen of Śrīraṅga|śrīraṅgeśvarī; शान्तकृत्रिमकथं|free of anything artificial|śānta · kṛtrima · katha; दिव्यं|divine|divya; वपुर्नार्हति|body does not deserve|vapuḥ · na · arhati"],
  "I think the moon, the wish-creeper, nectar, honey and the rest became the leftover dregs of the milk ocean after it was churned to weave your body of soft, cool, innocent, sweet and generous qualities — so they are thought precious. O queen of Śrīraṅga, your divine body, free of anything artificial, does not deserve such muddied comparisons.",
  "உன் உடலை மென்மை, குளிர்ச்சி, அப்பாவித்தனம், இனிமை, வள்ளன்மை ஆகிய குணங்களால் நெய்த பிறகு பாற்கடலில் மிஞ்சிய சக்கைகளே சந்திரன், கற்பகக்கொடி, அமுதம், தேன் முதலியவை என்று நினைக்கிறேன். ஸ்ரீரங்கேஸ்வரியே, செயற்கையற்ற உன் திவ்ய திருமேனிக்கு இந்தக் கலங்கிய உவமைகள் தகாது.",
  {tip:"A famous conceit: the moon and nectar that rose from the ocean were only the <b>ṛjīṣa</b> — the dregs left after her body was made."}),
 v(37, "ml", "Her form", "Bending forward to obey, leaning sideways in love — like a golden campaka garland — your form is beyond words.",
  ["प्रणमदनुविधित्सावासनानम्रमग्रे|bent in front, from the wish to obey those who bow|praṇamat · anuvidhitsā · vāsanā · namram · agre",
   "प्रणयिपरिचिचीषाकुञ्चितं|curved from the wish to tend her lover|praṇayi · paricicīṣā · kuñcita; पार्श्वकेन|at the side|pārśvaka",
   "कनकनिकषचञ्चच्चम्पकस्रक्समान|like a campaka garland gleaming like gold on a touchstone|kanaka · nikaṣa · cañcat · campaka · srak · samāna",
   "प्रवरमिदमुदारं|this noble, generous|pravaram · idam · udāram; वर्ष्म|form|varṣman; वाचामभूमिः|beyond the reach of words|vācām · abhūmiḥ"],
  "Bent forward from the longing to follow those who bow to you, curved at the side from the longing to tend your beloved, like a campaka garland gleaming like gold on a touchstone — this noble, generous form of yours is beyond the reach of words.",
  "வணங்குபவர்களுக்கு இணங்கும் ஆவலால் முன்பக்கம் சற்றுக் குனிந்து, பிரியனுக்குப் பணிவிடை செய்யும் ஆவலால் பக்கவாட்டில் வளைந்து, உரைகல்லில் ஒளிரும் பொன் போன்ற சம்பக மாலை போல் விளங்கும் உன் உயர்ந்த திருமேனி சொல்லுக்கு எட்டாதது."),
 v(38, "sd", "Her form", "One foot lowered for us to bow to, one folded, hand in abhaya — may we see you seated so, mother, smiling.",
  ["एकं|one|eka; न्यञ्च्य|lowering|nyañcya; नतिक्षमं|fit for bowing to|nati · kṣama; मम|for me|mama; परं|the other|para; चाकुञ्च्य|and folding|ca · ākuñcya; पादाम्बुजं|lotus foot|pāda · ambuja",
   "मध्ये|in the middle|madhye; विष्टरपुण्डरीकमभयं|of the lotus seat, (showing) fearlessness|viṣṭara · puṇḍarīkam · abhaya; विन्यस्य|placing|vinyasya; हस्ताम्बुजम्|lotus hand|hasta · ambuja",
   "त्वां|you|tvām; पश्येम|may we see|paśyema; निषेदुषीं|seated|niṣeduṣī; प्रतिकलं|every moment|pratikalam; कारुण्यकूलङ्कष|overflowing with mercy|kāruṇya · kūlaṅkaṣa",
   "स्फारापाङ्गतरङ्गमम्ब|with waves of wide side-glances, O mother|sphāra · apāṅga · taraṅgam · amba; मधुरं|sweet|madhura; मुग्धं|innocent|mugdha; मुखं|face|mukha; बिभ्रतीम्|bearing|bibhratī"],
  "One lotus foot lowered so that I can bow to it, the other folded; your lotus hand placed in the middle of the lotus seat, giving fearlessness — O mother, may we see you every moment, seated so, with a sweet, innocent face and waves of wide glances overflowing with mercy.",
  "வணங்க ஏதுவாக ஒரு திருவடித் தாமரையைத் தாழ்த்தி, மற்றொன்றை மடக்கி, தாமரை ஆசனத்தின் நடுவில் அபயக் கையை வைத்து, கருணை கரைபுரளும் கடைக்கண் அலைகளுடன் இனிய அப்பாவி முகத்துடன் அமர்ந்திருக்கும் உன்னை, தாயே, ஒவ்வொரு கணமும் காண்போமாக.",
  {tip:"The <b>dhyāna</b> of Raṅganāyakī as she sits in her sannidhi — one foot down, one folded, hand in <b>abhaya</b>."}),
 v(39, "ml", "Her form", "I bow to your lotus feet, fragrant with the Upaniṣads — their press keeps the Vaijayantī garland on his chest ever fresh.",
  ["सुरभितनिगमान्तं|which make the Upaniṣads fragrant|surabhita · nigamānta; वन्दिषीयेन्दिरायाः|may I bow, of Indirā|vandiṣīya · indirāyāḥ",
   "तव|your|tava; कमलपलाशप्रक्रियं|like lotus petals|kamala · palāśa · prakriya; पादयुग्मम्|pair of feet|pāda · yugma",
   "वहति|bears|vahati; यदुपमर्दैर्वैजयन्ती|by whose pressing, the Vaijayantī|yat · upamardaiḥ · vaijayantī; हिमाम्भः|cool water|hima · ambhas",
   "प्लुतिभिरिव|as if by sprinklings|pluti · iva; नवत्वं|freshness|navatva; कान्तबाहान्तराले|on her lover's chest|kānta · bāhu · antarāla"],
  "May I bow to your pair of feet, O Indirā, soft as lotus petals, which make the Upaniṣads fragrant — pressed by which (in embrace) the Vaijayantī garland on your lover's chest stays fresh, as if sprinkled with cool water.",
  "இந்திரையே, உபநிஷத்துகளுக்கு மணம் தருவதும் தாமரை இதழ் போன்றதுமான உன் திருவடியிணையை வணங்குவேனாக — அவை அழுத்துவதால் உன் காந்தனின் மார்பிலுள்ள வைஜயந்தி மாலை குளிர்நீர் தெளித்தது போல் புதுமை பெறுகிறது."),
 v(40, "sd", "Her form", "Kings' eyes are proud with a drop of your favour; the Veda knew the Lord as lotus-eyed only from your glance on him.",
  ["त्वत्स्वीकारकलावलेपकलुषा|clouded by pride at a fraction of your favour|tvat · svīkāra · kalā · avalepa · kaluṣa; राज्ञां|of kings|rājan; दृशो|eyes|dṛś; दुर्वचाः|indescribable|durvaca",
   "नित्यं|always|nityam; त्वन्मधुपानमत्तमधुप|bees drunk on your honey|tvat · madhu · pāna · matta · madhupa; श्रीनिर्भराभ्यां|full of glory|śrī · nirbhara; पतिम्|the Lord|pati",
   "दृग्भ्यामेव|by the eyes alone|dṛgbhyām · eva; हि|indeed|hi; पुण्डरीकनयनं|lotus-eyed|puṇḍarīka · nayana; वेदो|the Veda|veda; विदामासते|came to know|vidām · āsate",
   "साक्षाल्लक्ष्मि|directly, O Lakṣmī|sākṣāt · lakṣmī; तवावलोकविभवः|the glory of your glance|tava · avaloka · vibhava; काक्वा|with what tone|kāku; कया|by what|kā; वर्ण्यते|can be described|varṇyate"],
  "Kings' eyes, clouded with pride at a fraction of your favour, are beyond description. The Veda knew the Lord as “lotus-eyed” only by his eyes, always full of glory like bees drunk on your honey. So, O Lakṣmī, with what words can the glory of your direct glance be described?",
  "உன் அருளின் சிறு பகுதிக்கே அரசர்களின் கண்கள் கர்வத்தால் கலங்குகின்றன. உன் தேனைப் பருகிய வண்டுகள் போல் என்றும் ஒளிரும் கண்களாலேயே வேதம் பகவானைப் ‘புண்டரீகாக்ஷன்’ என்று அறிந்தது. லக்ஷ்மியே, உன் நேரடிப் பார்வையின் பெருமையை எந்தச் சொல்லால் வர்ணிப்பது?"),
 v(41, "sd", "Her form", "Protect me, who have no refuge, with your glances — blissful, wet with love, overflowing with mercy.",
  ["आनन्दात्मभिरीशमज्जनमदक्षीबालसैरागल|blissful, languid as if drunk from bathing in the Lord|ānanda · ātman · īśa · majjana · mada · kṣība · alasa · āgala",
   "प्रेमार्द्रैरपि|wet with love too|prema · ārdra · api; कूलमुद्वहकृपासम्प्लावितास्मादृशैः|overflowing with mercy, flooding people like us|kūlam · udvaha · kṛpā · samplāvita · asmādṛśa",
   "पद्मे|O Padmā|padmā; ते|your|te; प्रतिबिन्दुबद्धकलिकब्रह्मादिविष्कम्भकैः|each drop of which holds Brahmā and the gods like buds|prati · bindu · baddha · kalika · brahma · ādi · viṣkambhaka",
   "ऐश्वर्योद्गमगद्गदैरशरणं|choked with the rising of lordship, me without refuge|aiśvarya · udgama · gadgadaiḥ · aśaraṇam; मां|me|mām; पालयालोकितैः|protect with your glances|pālaya · ālokitaiḥ"],
  "O Padmā, protect me, who have no refuge, with your glances — blissful, languid as if from bathing in the Lord, wet with love to the brim, overflowing their banks with mercy and flooding people like me, each drop of which holds Brahmā and the gods like buds, choked with the lordship rising from them.",
  "பத்மையே, புகலற்ற என்னை உன் பார்வைகளால் காப்பாயாக — ஆனந்தமயமானவை, பகவானில் நீராடியது போல் மயங்கியவை, அன்பால் நனைந்தவை, கருணை கரைபுரண்டு என் போன்றோரை மூழ்கடிப்பவை, ஒவ்வொரு துளியிலும் பிரம்மன் முதலியோரை மொட்டுகளாகக் கொண்டவை."),
 v(42, "sd", "Her form", "Even lotus pollen hurts your feet, a play-lotus tires your hand — what words can touch such a tender body?",
  ["पादारुन्तुदमेव|piercing your feet indeed|pāda · aruntudam · eva; पङ्कजरजश्|lotus pollen|paṅkaja · rajas; चेटीभृशालोकितैः|(and) the maids' intense looks|ceṭī · bhṛśa · ālokita",
   "अङ्गम्लानिरथाम्ब|then, mother, your body wilts|aṅga · mlāniḥ · atha · amba; साहसविधौ|a daring act|sāhasa · vidhi; लीलारविन्दग्रहः|holding a play-lotus|līlā · aravinda · graha",
   "डोला|a swing|ḍolā; ते|for you|te; वनमालया|by the forest garland|vana · mālā; हरिभुजे|on Hari's arm|hari · bhuja; हा|alas|hā; कष्टशब्दास्पदं|a cause to cry “how hard!”|kaṣṭa · śabda · āspada",
   "केन|by what|kena; श्रीरतिकोमला|O Śrī, so very tender|śrīḥ · ati · komalā; तनुरियं|this body|tanuḥ · iyam; वाचां|of words|vāc; विमर्दक्षमा|able to bear the rubbing|vimarda · kṣamā"],
  "Lotus pollen hurts your feet; the maids' long looks make your body wilt; holding a play-lotus is a daring feat, mother; being swung by the forest garland on Hari's arm — alas! — makes one cry “how hard!” O Śrī, how can this so-tender body bear the rubbing of words?",
  "தாமரைத் தூளும் உன் பாதங்களை நோகச் செய்கிறது; தோழியரின் கூர்ந்த பார்வையாலும் உடல் வாடுகிறது; விளையாட்டுத் தாமரையைப் பிடிப்பதும் பெரும் சாகசம்; ஹரியின் தோளில் வனமாலையால் ஊஞ்சலாடுவதும் ‘ஐயோ’ என்று சொல்ல வைக்கிறது. ஸ்ரீயே, இவ்வளவு மென்மையான உடல் சொற்களின் உராய்வை எப்படித் தாங்கும்?",
  {tip:"A playful verse about her <b>sukumāratva</b> — tenderness: even pollen and a glance are too rough for her."}),
 v(43, "sd", "Her form", "Childhood and youth meet in your limbs; your fragrance can be fathomed only with your beloved's hand to guide.",
  ["आमर्यादमकण्टकं|to the limit, untroubled|ā · maryādam · akaṇṭakam; स्तनयुगं|the pair of breasts|stana · yuga; नाद्यापि|not even yet|na · adya · api; नालोकित|unseen|na · ālokita",
   "भ्रूभेदस्मितविभ्रमा|the play of frowns and smiles|bhrū · bheda · smita · vibhrama; जहति|abandon|jahati; वा|or|vā; नैसर्गिकत्वायशः|the infamy of being natural|naisargikatva · ayaśas",
   "सूते|gives birth|sūte; शैशवयौवनव्यतिकरो|the meeting of childhood and youth|śaiśava · yauvana · vyatikara; गात्रेषु|in the limbs|gātra; ते|your|te; सौरभं|fragrance|saurabha",
   "भोगस्रोतसि|in the stream of joy|bhoga · srotas; कान्तदेशिककरग्राहेण|with the beloved as guide holding your hand|kānta · deśika · kara · grāha; गाहक्षमः|able to be entered|gāha · kṣama"],
  "The meeting of childhood and youth in your limbs gives birth to a fragrance; frowns and smiles have not yet quite shed their naturalness; and that stream of joy can be entered only with your beloved as guide holding your hand.",
  "உன் அங்கங்களில் குழந்தைப் பருவமும் இளமையும் சந்திக்கும் இடம் நறுமணத்தைப் பிறப்பிக்கிறது; புருவ நெரிப்பும் புன்னகையும் இன்னும் இயல்பு மாறவில்லை; அந்த இன்ப வெள்ளத்தில் உன் காந்தனே வழிகாட்டியாகக் கைபிடித்தால்தான் இறங்க முடியும்."),
 v(44, "sd", "Her form", "Your tender body, a garland of flowers strung on beauty, deserves only the Lord's chest — shame on me for rushing in.",
  ["आमोदाद्भुतशालि|wondrous with fragrance|āmoda · adbhuta · śālin; यौवनदशाव्याकोचमम्लानिमत्|blooming in youth, never fading|yauvana · daśā · vyākocam · amlānimat",
   "सौन्दर्यामृतसेकशीतलमिदं|cool with sprinklings of the nectar of beauty|saundarya · amṛta · seka · śītalam · idam; लावण्यसूत्रार्पितम्|strung on the thread of grace|lāvaṇya · sūtra · arpita",
   "श्रीरङ्गेश्वरि|O queen of Śrīraṅga|śrīraṅgeśvarī; कोमलाङ्गसुमनस्सन्दर्भणं|this garland of the flowers of your tender limbs|komala · aṅga · sumanas · sandarbhaṇa; देवि|O Goddess|devī; ते|your|te",
   "कान्तोरःप्रतियत्नमर्हति|deserves the adornment of the beloved's chest|kānta · uraḥ · pratiyatnam · arhati; कविं|a poet|kavi; धिङ्मामकाण्डाकुलम्|shame on me, flustered without cause|dhik · mām · akāṇḍa · ākula"],
  "O queen of Śrīraṅga, O Goddess, this garland of the flowers of your tender limbs — wondrously fragrant, blooming in youth and never fading, cool with the nectar of beauty, strung on the thread of grace — deserves to adorn only your lover's chest. Shame on me, a poet flustered for no reason!",
  "ஸ்ரீரங்கேஸ்வரியே, தேவியே, மணம் கமழும், இளமையில் மலர்ந்து வாடாத, அழகமுதம் தெளித்துக் குளிர்ந்த, லாவண்ய நூலில் தொடுத்த உன் மென்மையான அங்கங்கள் எனும் மலர் மாலை உன் காந்தனின் மார்பை அலங்கரிக்கவே தகுந்தது. காரணமின்றிக் கலங்கும் கவியான என்னைச் சீ!"),
 v(45, "vt", "Her form", "Like a garland enjoyed by a bee, you ever delight Mukunda.",
  ["मर्मस्पृशो|touching the heart|marma · spṛś; रससिराव्यतिविध्यवृत्तैः|piercing the veins of feeling|rasa · sirā · vyatividdhya · vṛtta",
   "कान्तोपभोगललितैर्लुलिताङ्गयष्टिः|her slender body softened by her lover's playful enjoyment|kānta · upabhoga · lalita · lulita · aṅga · yaṣṭi",
   "पुष्पावलीव|like a garland of flowers|puṣpa · āvalī · iva; रसिकभ्रमरोपभुक्ता|enjoyed by a connoisseur bee|rasika · bhramara · upabhuktā",
   "त्वं|you|tvam; देवि|O Goddess|devī; नित्यमभिनन्दयसे|always delight|nityam · abhinandayase; मुकुन्दम्|Mukunda|mukunda"],
  "O Goddess, like a garland of flowers enjoyed by a connoisseur bee, your slender body softened by your lover's playful, heart-touching enjoyment — you ever delight Mukunda.",
  "தேவியே, ரசிக்கும் வண்டு அனுபவிக்கும் மலர் மாலை போல, உன் காந்தனின் இதயம் தொடும் விளையாட்டால் மென்மையான திருமேனியுடன் நீ முகுந்தனை என்றும் மகிழ்விக்கிறாய்."),
 v(46, "hr", "Her form", "Golden girdle, pearl earrings, necklace and anklets only reveal your naturally sweet body — like a creeper's flowers.",
  ["कनकरशनामुक्ताताटङ्कहारललाटिका|golden girdle, pearl earrings, necklace, forehead jewel|kanaka · raśanā · muktā · tāṭaṅka · hāra · lalāṭikā",
   "मणिसरतुलाकोटिप्रायैर्जनार्दनजीविके|gem strings, anklets and the rest — O life of Janārdana|maṇi · sara · tulākoṭi · prāyaiḥ · janārdana · jīvikā",
   "प्रकृतिमधुरं|naturally sweet|prakṛti · madhura; गात्रं|body|gātra; जागर्ति|shines out|jāgarti; मुग्धविभूषणैः|with innocent ornaments|mugdha · vibhūṣaṇa",
   "वलयशकलैर्दुग्धं|milk with pieces of (conch) bangles|valaya · śakala · dugdha; पुष्पैश्च|and with flowers|puṣpa · ca; कल्पलता|the wish-creeper|kalpa · latā; यथा|as|yathā"],
  "O life of Janārdana, your naturally sweet body shines out through your simple ornaments — golden girdle, pearl earrings, necklace, forehead jewel, strings of gems, anklets — as milk does through bits of bangle, or the wish-creeper through its flowers.",
  "ஜனார்த்தனனின் உயிரே, பொன் ஒட்டியாணம், முத்துத் தோடுகள், மாலை, நெற்றிச்சுட்டி, மணிச்சரங்கள், சிலம்புகள் ஆகிய எளிய ஆபரணங்கள் வழியே இயல்பாக இனிய உன் திருமேனி ஒளிர்கிறது — வளையல் துண்டுகளால் பால் போல, மலர்களால் கற்பகக்கொடி போல."),
 v(47, "vt", "Her form", "The Lord wears Kaustubha, Vaijayantī and the weapons himself — as if to spare you the weight.",
  ["सामान्यभोग्यमपि|though shared for enjoyment|sāmānya · bhogyam · api; कौस्तुभवैजयन्ती|Kaustubha and Vaijayantī|kaustubha · vaijayantī",
   "पञ्चायुधादिरमणः|your lover, with the five weapons and the rest|pañca · āyudha · ādi · ramaṇa; स्वयमेव|himself|svayam · eva; बिभ्रत्|wearing|bibhrat",
   "तद्भारखेदमिव|as if the strain of their weight|tat · bhāra · khedam · iva; ते|your|te; परिहर्तुकामः|wishing to remove|parihartu · kāma",
   "श्रीरङ्गधाममणिमञ्जरि|O jewel-cluster of Śrīraṅgam|śrīraṅga · dhāma · maṇi · mañjarī; गाहते|plunges into|gāhate; त्वाम्|you|tvām"],
  "O jewel-cluster of Śrīraṅgam, your lover wears himself the Kaustubha, Vaijayantī, the five weapons and the rest, though they belong to you both — as if wishing to spare you the strain of their weight; and so he plunges into you.",
  "ஸ்ரீரங்கத்தின் மணிக்கொத்தே, கௌஸ்துபம், வைஜயந்தி, ஐந்து ஆயுதங்கள் முதலியவை உங்கள் இருவருக்கும் பொதுவானவையாயினும், அவற்றின் பாரத்தால் உனக்குச் சோர்வு வரக்கூடாது என்பது போல் உன் ரமணனே அவற்றைத் தாங்கி உன்னில் மூழ்குகிறான்."),
 v(48, "ml", "Her avatāras", "If you had not taken birth alongside him in each avatāra, his play would have had no flavour.",
  ["यदि|if|yadi; मनुजतिरश्चां|of men and animals|manuja · tiraśc; लीलया|in play|līlā; तुल्यवृत्तेः|of him who acts like them|tulya · vṛtti",
   "अनुजनुरनुरूपा|in birth after birth, matching|anu · januḥ · anurūpā; देवि|O Goddess|devī; नावातरिष्यः|you had not descended|na · avātariṣyaḥ",
   "असरसमभविष्यन्नर्म|the play would have been flavourless|asarasam · abhaviṣyat · narma; नाथस्य|of the Lord|nātha; मातः|O mother|mātṛ",
   "दरदलदरविन्दोदन्तकान्तायताक्षि|O you with long lovely eyes like a half-open lotus|dara · dalat · aravinda · udanta · kānta · āyata · akṣī"],
  "O mother with long, lovely eyes like a half-opened lotus — if you had not descended in matching form in each of his births, when he plays as man and animal, the Lord's play would have had no flavour.",
  "பாதி மலர்ந்த தாமரை போன்ற நீண்ட அழகிய கண்களுடைய தாயே, மனிதனாகவும் விலங்காகவும் விளையாடும் பகவானின் ஒவ்வொரு பிறவியிலும் நீ ஏற்ற வடிவில் அவதரிக்காவிட்டால் அவன் லீலை சுவையற்றதாகியிருக்கும்."),
 v(49, "ml", "Her avatāras", "When Murāri tired from churning the ocean, you rose from the waves like moonlight, cooling him with your smile.",
  ["स्खलितकटकमाल्यैर्दोर्भिरब्धिं|the ocean, with arms whose bracelets and garlands slipped|skhalita · kaṭaka · mālya · dorbhiḥ · abdhim; मुरारेः|of Murāri|murāri",
   "भगवति|O Bhagavatī|bhagavatī; दधिमाथं|like churning curd|dadhi · mātham; मथ्नतः|churning|mathnataḥ; श्रान्तिशान्त्यै|to soothe his fatigue|śrānti · śānti",
   "भ्रमदमृततरङ्गावर्ततः|from the whirl of swirling nectar waves|bhramat · amṛta · taraṅga · āvarta; प्रादुरासीः|you appeared|prāduḥ · āsīḥ",
   "स्मितनयनसुधाभिस्सिञ्चती|sprinkling him with the nectar of smiling eyes|smita · nayana · sudhā · siñcatī; चन्द्रिकेव|like moonlight|candrikā · iva"],
  "O Bhagavatī, as Murāri churned the ocean like curd with arms whose bracelets and garlands had slipped, you appeared from the whirl of swirling nectar waves to soothe his fatigue, sprinkling him like moonlight with the nectar of your smiling eyes.",
  "பகவதியே, காப்பும் மாலையும் நழுவிய கைகளால் முராரி தயிர் கடைவது போல் கடலைக் கடைந்தபோது, அவன் களைப்பைப் போக்க, சுழலும் அமுத அலைகளின் சுழியிலிருந்து நிலவொளி போல் தோன்றி, புன்னகைக் கண்களின் அமுதத்தால் அவனை நனைத்தாய்.",
  {tip:"The churning — told tenderly: her first act on rising is to <b>cool his tiredness</b>."}),
 v(50, "sd", "Her avatāras", "Mother Maithilī, you saved the rākṣasīs from Hanumān — your forgiveness is greater than Rāma's.",
  ["मातर्मैथिलि|O Mother Maithilī|mātaḥ · maithilī; राक्षसीस्त्वयि|the rākṣasīs, against you|rākṣasīḥ · tvayi; तदैवार्द्रापराधास्त्वया|their offence still fresh, by you|tadā · eva · ārdra · aparādhāḥ · tvayā",
   "रक्षन्त्या|protecting|rakṣantī; पवनात्मजाल्लघुतरा|from the Wind's son (Hanumān), smaller|pavana · ātmajāt · laghutarā; रामस्य|Rāma's|rāma; गोष्ठी|assembly|goṣṭhī; कृता|was made|kṛtā",
   "काकं|the crow|kāka; तं|that|tam; च|and|ca; विभीषणं|Vibhīṣaṇa|vibhīṣaṇa; शरणमित्युक्तिक्षमौ|forgiving only when “refuge!” was said|śaraṇam · iti · ukti · kṣamau; रक्षतः|of (Rāma) who protected|rakṣataḥ",
   "सा|may that|sā; नस्सान्द्रमहागसस्सुखयतु|bless us with our heavy sins|naḥ · sāndra · mahāgasaḥ · sukhayatu; क्षान्तिस्तवाऽऽकस्मिकी|your causeless forgiveness|kṣāntiḥ · tava · ākasmikī"],
  "Mother Maithilī, by protecting from Hanumān the rākṣasīs whose offence against you was still fresh, you made Rāma's assembly look small — for he protected the crow and Vibhīṣaṇa only when they said “refuge!”. May that causeless forgiveness of yours bless us, whose sins are heavy.",
  "தாயே மைதிலி, உன்னிடம் செய்த குற்றம் இன்னும் ஈரமாக இருந்த ராக்ஷஸிகளை அனுமனிடமிருந்து காத்ததால் ராமனின் சபையை நீ சிறியதாக்கினாய் — அவனோ காகத்தையும் விபீஷணனையும் ‘சரணம்’ என்று சொன்ன பிறகே காத்தான். காரணமற்ற உன் அந்தப் பொறுமை பெரும் பாவிகளான எங்களுக்கு இன்பம் தரட்டும்.",
  {tip:"<b>The most loved verse.</b> Rāma saved those who asked; Sītā saved those who never asked — <b>ākasmikī kṣānti</b>, causeless forgiveness."}),
 v(51, "sd", "Her avatāras", "As Mithilā's people saw Rāma as their son-in-law, may we see Hari as your husband — and serve you both with joy.",
  ["मातर्लक्ष्मि|O Mother Lakṣmī|mātaḥ · lakṣmī; यथैव|just as|yathā · eva; मैथिलजनस्|the people of Mithilā|maithila · jana; तेनाध्वना|by that path|tena · adhvanā; ते|your|te; वयं|we|vayam",
   "त्वद्दास्यैकरसाभिमानसुभगैर्|lovely with the one joy of being your servants|tvat · dāsya · eka · rasa · abhimāna · subhaga; भावैरिहामुत्र|with feelings, here and hereafter|bhāvaiḥ · iha · amutra; च|and|ca",
   "जामाता|son-in-law|jāmātṛ; दयितस्तवेति|your beloved — thus|dayitaḥ · tava · iti; भवतीसम्बन्धदृष्ट्या|seeing him through his tie to you|bhavatī · sambandha · dṛṣṭi; हरिं|Hari|hari",
   "पश्येम|may we see|paśyema; प्रतियाम|may we go to|pratiyāma; याम|may we approach|yāma; च|and|ca; परीचारान्|services|parīcāra; प्रहृष्येम|may we rejoice|prahṛṣyema; च|and|ca"],
  "O Mother Lakṣmī, just as the people of Mithilā (saw Rāma), may we too, by that path — with feelings lovely with the one joy of being your servants, here and hereafter — see Hari as your beloved, our son-in-law, through his tie to you; may we approach him, and rejoice in serving.",
  "தாயே லக்ஷ்மி, மிதிலை மக்கள் (ராமனைக் கண்டது) போலவே, உனக்கு அடிமையாக இருப்பதே ஒரே சுவை என்ற உணர்வுடன், இம்மையிலும் மறுமையிலும், உன்னுடன் உள்ள உறவின் வழியே ஹரியை ‘எங்கள் மருமகன், உன் பிரியன்’ என்று காண்போமாக; அவனை அணுகி, கைங்கர்யத்தில் மகிழ்வோமாக.",
  {tip:"A sweet idea: we belong to <b>her</b> family, so the Lord is our <b>jāmātā</b> (son-in-law) — like Janaka's people saw Rāma."}),
 v(52, "sk", "Her mercy", "Like a father, the Lord sometimes grows angry at sinners; like a mother you make him forget — so you are our mother.",
  ["पितेव|like a father|pitā · iva; त्वत्प्रेयान्|your beloved|tvat · preyas; जननि|O mother|jananī; परिपूर्णागसि|full of sins|paripūrṇa · āgas; जने|toward a person|jana",
   "हितस्रोतोवृत्त्या|out of the flow of his care|hita · srotas · vṛtti; भवति|becomes|bhavati; च|and|ca; कदाचित्|at times|kadācit; कलुषधीः|angry-minded|kaluṣa · dhī",
   "किमेतन्निर्दोषः|“what is this? who is faultless|kim · etat · nirdoṣaḥ; क|who|kaḥ; इह|here|iha; जगतीति|in the world?” — thus|jagati · iti; त्वमुचितैः|you, with fitting|tvam · ucitaiḥ",
   "उपायैर्विस्मार्य|means, making him forget|upāyaiḥ · vismārya; स्वजनयसि|you make (us) his own|svajanayasi; माता|mother|mātā; तदसि|so you are|tat · asi; नः|our|naḥ"],
  "O mother, like a father, your beloved, out of his care for us, sometimes grows angry with a person full of sins. You, saying “What is this? Who in this world is faultless?”, make him forget with fitting means, and make us his own again — so you are our mother.",
  "தாயே, தந்தை போல உன் பிரியன் நம் நலனுக்காகவே பாவம் நிறைந்தவனிடம் சில சமயம் கோபம் கொள்கிறான். நீயோ ‘இது என்ன? உலகில் குற்றமற்றவர் யார்?’ என்று தகுந்த உபாயங்களால் அவனை மறக்கச் செய்து, எங்களை மீண்டும் அவனுடையவர்களாக்குகிறாய் — ஆகவே நீ எங்கள் தாய்.",
  {tip:"<b>ka iha jagati nirdoṣaḥ?</b> — “Who in this world is faultless?” — her plea to the Lord, the puruṣakāra."}),
 v(53, "sd", "Her mercy", "You came down to save us, and suffered — soft feet on stones, living in the forest. Shame on mercy, shame on your freedom!",
  ["नेतुर्नित्यसहायिनी|ever the Lord's companion|netṛ · nitya · sahāyinī; जननि|O mother|jananī; नस्|us|naḥ; त्रातुं|to save|trātum; त्वमत्रागता|you came here|tvam · atra · āgatā",
   "लोके|in a world|loka; त्वन्महिमावबोधबधिरे|deaf to knowing your greatness|tvat · mahima · avabodha · badhira; प्राप्ता|you met|prāptā; विमर्दं|hardship|vimarda; बहु|much|bahu",
   "क्लिष्टं|hurt|kliṣṭa; ग्रावसु|on stones|grāvan; मालतीमृदुपदं|feet soft as jasmine|mālatī · mṛdu · pada; विश्लिष्य|separated|viśliṣya; वासो|living|vāsa; वने|in the forest|vana",
   "जातो|happened|jāta; धिक्करुणां|shame on mercy|dhik · karuṇām; धिगस्तु|shame be|dhik · astu; युवयोः|of you two|yuvayoḥ; स्वातन्त्र्यमत्यङ्कुशम्|unchecked freedom|svātantryam · ati · aṅkuśam"],
  "Ever the Lord's companion, O mother, you came down here to save us, and in a world deaf to your greatness you met much hardship: your feet, soft as jasmine, were hurt on stones; separated (from him), you lived in the forest. Shame on mercy! Shame on your unchecked freedom, you two!",
  "நாதனின் நித்ய துணைவியான தாயே, எங்களைக் காக்க இங்கு வந்தாய்; உன் பெருமையை அறியாத உலகில் பல துன்பங்களை அடைந்தாய்: மல்லிகை போன்ற மென்மையான பாதங்கள் கற்களில் நொந்தன; பிரிந்து காட்டில் வசித்தாய். கருணையே சீ! உங்கள் இருவரின் கட்டற்ற சுதந்திரமே சீ!",
  {tip:"A loving scolding: Bhaṭṭar is so upset at Sītā's suffering that he cries <b>dhik karuṇām</b> — “shame on mercy!”"}),
 v(54, "hr", "Her avatāras", "For you he lay on the ocean, churned it, bridged it, broke Śiva's bow, cut Rāvaṇa's heads — what wouldn't he do?",
  ["अधिशयितवानब्धिं|lay on the ocean|adhiśayitavān · abdhim; नाथो|the Lord|nātha; ममन्थ|churned|mamantha; बबन्ध|bridged|babandha; तं|it|tam",
   "हरधनुरसौ|Śiva's bow, he|hara · dhanuḥ · asau; वल्लीभञ्जं|like snapping a creeper|vallī · bhañjam; बभञ्ज|broke|babhañja; च|and|ca; मैथिलि|O Maithilī|maithilī",
   "अपि|even|api; दशमुखीं|the ten heads|daśa · mukhī; लूत्वा|cutting|lūtvā; रक्षः|the demon|rakṣas; कबन्धमनर्तयत्|made a headless trunk dance|kabandham · anartayat",
   "किमिव|what|kim · iva; न|not|na; पतिः|your husband|pati; कर्ता|would do|kartṛ; त्वच्चाटुचुञ्चुमनोरथः|eager to please you|tvat · cāṭu · cuñcu · manoratha"],
  "O Maithilī, for you the Lord lay on the ocean, churned it and bridged it; he snapped Śiva's bow like a creeper; he cut the demon's ten heads and made his headless trunk dance. What would your husband not do, eager to please you?",
  "மைதிலியே, உனக்காக நாதன் கடலில் சயனித்தான், அதைக் கடைந்தான், அதில் அணை கட்டினான்; சிவனின் வில்லைக் கொடி போல் முறித்தான்; அரக்கனின் பத்துத் தலைகளையும் அறுத்து முண்டத்தை ஆட வைத்தான். உன்னை மகிழ்விக்கத் துடிக்கும் உன் கணவன் செய்யாதது என்ன?",
  {tip:"Three things he did to the ocean: <b>adhiśayitavān · mamantha · babandha</b> — lay on, churned, bridged."}),
 v(55, "nk", "Her avatāras", "With his thousand-armed cosmic form and his avatāras, the Lord delights you — and is lost in the whirl of your play.",
  ["दशशतपाणिपादवदनाक्षिमुखैरखिलैः|with all his thousand hands, feet, faces and eyes|daśa · śata · pāṇi · pāda · vadana · akṣi · mukhaiḥ · akhilaiḥ",
   "अपि|also|api; निजवैश्वरूप्यविभवैरनुरूपगुणैः|with the glories of his cosmic form, fit qualities|nija · vaiśvarūpya · vibhava · anurūpa · guṇa",
   "अवतरणैरतैश्च|and with the incarnations he took|avataraṇaiḥ · ataiḥ · ca; रसयन्|delighting (you)|rasayan; कमिता|your lover|kamitṛ; कमले|O Kamalā|kamalā",
   "क्वचन|somewhere|kvacana; हि|indeed|hi; विभ्रमभ्रमिमुखे|in the whirlpool of your play|vibhrama · bhrami · mukha; विनिमज्जति|sinks deep|vinimajjati; ते|your|te"],
  "O Kamalā, your lover, delighting you with his cosmic form of a thousand hands, feet, faces and eyes, with its glories and fitting qualities, and with the incarnations he took — sinks somewhere deep into the whirlpool of your playful grace.",
  "கமலையே, ஆயிரம் கைகள், கால்கள், முகங்கள், கண்கள் கொண்ட விஸ்வரூபத்தாலும், அதன் மகிமைகளாலும், தான் எடுத்த அவதாரங்களாலும் உன்னை மகிழ்விக்கும் உன் காந்தன், உன் விளையாட்டுச் சுழலில் எங்கோ ஆழ்ந்து மூழ்குகிறான்.",
  {tip:"Her copy reads <i>avataraṇair ataiś ca</i>; the meaning “and with the incarnations he took” is a best guess."}),
 v(56, "hr", "Her mercy", "You love the milk ocean, your birthplace, and Vaikuṇṭha, his — but you delight most in Śrīraṅgam, where you can save people like me.",
  ["जननभवनप्रीत्या|from love of your birthplace|janana · bhavana · prīti; दुग्धार्णवं|the milk ocean|dugdha · arṇava; बहुमन्यसे|you value highly|bahu · manyase",
   "जननि|O mother|jananī; दयितप्रेम्णा|out of love for your beloved|dayita · preman; पुष्णासि|you cherish|puṣṇāsi; तत्परमं|that highest|tat · paramam; पदम्|abode|pada",
   "उदधिपरमव्योम्नोर्विस्मृत्य|forgetting the ocean and the highest heaven|udadhi · parama · vyomnoḥ · vismṛtya; मादृशरक्षण|protecting people like me|mādṛśa · rakṣaṇa",
   "क्षममिति|“(this place) is fit” — thus|kṣamam · iti; धिया|thinking|dhiyā; भूयः|more|bhūyaḥ; श्रीरङ्गधामनि|in Śrīraṅgam|śrīraṅga · dhāman; मोदसे|you rejoice|modase"],
  "O mother, from love of your birthplace you value the milk ocean; from love of your beloved you cherish that highest abode. But forgetting both ocean and heaven, thinking “this place is fit for protecting people like him”, you rejoice even more in Śrīraṅgam.",
  "தாயே, பிறந்த வீட்டின் மீதுள்ள பாசத்தால் பாற்கடலை மதிக்கிறாய்; பிரியன் மீதுள்ள அன்பால் பரமபதத்தைப் போற்றுகிறாய். ஆனால் இரண்டையும் மறந்து, ‘என் போன்றோரைக் காக்க இதுவே தகுந்த இடம்’ என்று எண்ணி ஸ்ரீரங்கத்தில் இன்னும் அதிகமாக மகிழ்கிறாய்.",
  {tip:"Śrīraṅgam is dearer to her than Vaikuṇṭha — because <b>we</b> are here to be saved."}),
 v(57, "vt", "Her mercy", "Generosity, mercy, love for those who come — all surpass themselves here at Śrīraṅgam; Sītā's avatāra was only a sample.",
  ["औदार्यकारुणिकताश्रितवत्सलत्व|generosity, mercy, love for those who take refuge|audārya · kāruṇikatā · āśrita · vatsalatva",
   "पूर्वेषु|in these and the rest|pūrva; सर्वमतिशायितमत्र|all of it surpassed here|sarvam · atiśāyitam · atra; मातः|O mother|mātṛ",
   "श्रीरङ्गधाम्नि|in Śrīraṅgam|śrīraṅga · dhāman; यदुतान्यदुदाहरन्ति|whatever else they cite as examples|yat · uta · anyat · udāharanti",
   "सीतावतारमुखमेतदमुष्य|Sītā's avatāra and the rest — of this|sītā · avatāra · mukham · etat · amuṣya; योग्या|a fitting (sample)|yogyā"],
  "O mother, in generosity, mercy, love for those who take refuge and the rest, everything is surpassed here at Śrīraṅgam. Whatever else people cite — Sītā's avatāra and the like — is only a fitting sample of this.",
  "தாயே, வள்ளன்மை, கருணை, அடைக்கலம் புகுந்தவர்களிடம் வாத்ஸல்யம் முதலியவற்றில் எல்லாமும் இங்கு ஸ்ரீரங்கத்தில் மிஞ்சப்படுகின்றன. சீதாவதாரம் முதலிய உதாரணங்கள் இதன் ஒரு மாதிரியே."),
 v(58, "vt", "Her mercy", "You give lordship or liberation to one who merely folds his hands — and then feel ashamed you gave too little!",
  ["ऐश्वर्यमक्षरगतिं|lordship, the state of the imperishable self|aiśvaryam · akṣara · gati; परमं|the highest|parama; पदं|abode|pada; वा|or|vā",
   "कस्मैचिदञ्जलिभरं|to someone, the burden of folded hands|kasmaicit · añjali · bhara; वहते|who carries|vahate; वितीर्य|having given|vitīrya",
   "अस्मै|to him|asmai; न|not|na; किञ्चिदुचितं|anything fitting|kiñcit · ucitam; कृतमित्यथाम्ब|has been done — thus, then, mother|kṛtam · iti · atha · amba",
   "त्वं|you|tvam; लज्जसे|feel ashamed|lajjase; कथय|tell (me)|kathaya; कोऽयमुदारभावः|what generosity is this?|kaḥ · ayam · udāra · bhāvaḥ"],
  "Having given lordship, the bliss of the self, or even the highest abode to someone who merely carries the “burden” of folded hands, you then feel ashamed, thinking “I have done nothing fitting for him”! Tell me, mother — what kind of generosity is this?",
  "கூப்பிய கைகள் எனும் ‘பாரத்தை’ மட்டும் சுமக்கும் ஒருவனுக்கு ஐஸ்வர்யம், கைவல்யம், பரமபதம் கூட அளித்த பின்பும், ‘அவனுக்குத் தகுந்ததை எதுவும் செய்யவில்லையே’ என்று நீ வெட்கப்படுகிறாய்! சொல், தாயே — இது என்ன வள்ளன்மை?",
  {tip:"The three fruits: <b>aiśvarya</b> (wealth), <b>akṣara-gati</b> (kaivalya) and <b>paramaṃ padam</b> (Vaikuṇṭha) — for just an añjali."}),
 v(59, "vt", "Her mercy", "I have no knowledge, deeds or devotion; I keep sinning against you both — a fool, I am too heavy a burden for you.",
  ["ज्ञानक्रियाभजनसम्पदकिञ्चनोऽहम्|I am poor in the wealth of knowledge, action and devotion|jñāna · kriyā · bhajana · sampad · akiñcanaḥ · aham",
   "इच्छाधिकारशकनानुशयानभिज्ञः|not knowing desire, eligibility, ability or remorse|icchā · adhikāra · śakana · anuśaya · anabhijñaḥ",
   "आगांसि|sins|āgas; देवि|O Goddess|devī; युवयोरपि|even against you two|yuvayoḥ · api; दुःसहानि|unbearable|duḥsaha",
   "बध्नामि|I pile up|badhnāmi; मूर्खचरितस्तव|a fool in conduct, for you|mūrkha · caritaḥ · tava; दुर्भरोऽस्मि|I am hard to bear|durbharaḥ · asmi"],
  "I am poor in the wealth of knowledge, action and devotion; I know nothing of desire for you, fitness, ability or even remorse; O Goddess, I keep piling up unbearable sins even against you two. Foolish in conduct, I am a heavy burden for you.",
  "ஞானம், கர்மம், பக்தி எனும் செல்வமற்றவன் நான்; விருப்பம், தகுதி, ஆற்றல், வருத்தம் எதையும் அறியாதவன்; தேவியே, உங்கள் இருவருக்கும் எதிராகவே தாங்க முடியாத பாவங்களைச் சேர்க்கிறேன். மூட நடத்தையுடைய நான் உனக்குப் பெரும் பாரம்.",
  {tip:"The classic confession of <b>ākiñcanya</b> — having nothing — that precedes śaraṇāgati."}),
