          <h1>Kanakadhara Stotram</h1>
          <p class="lead" style="margin-top:8px">“The hymn of the golden shower.” As a boy, Śaṅkara begged at a poor woman's door; she had nothing but one dry amla fruit, and gave it. Moved, he sang these verses to Lakṣmī — and golden amla fruits rained on the house.</p>
