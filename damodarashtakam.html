          <div class="ttl" id="heroTitle"></div>
          <h1>Damodarashtakam</h1>
          <p class="lead" style="margin-top:8px">Baby Kṛṣṇa has broken the butter pot; Yaśodā chases him and ties him to a mortar with a rope (<i>dāma</i>) around his belly (<i>udara</i>) — so he is Dāmodara. The poet asks for no liberation, only that this little form of Kṛṣṇa always shine in his heart.</p>
